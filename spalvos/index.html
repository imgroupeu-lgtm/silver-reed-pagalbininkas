/* ---------- SPALVŲ MATEMATIKA (sRGB D65, CIELAB, CIEDE2000, WCAG) ---------- */
const s2l=c=>{c/=255; return c<=0.04045? c/12.92 : Math.pow((c+0.055)/1.055,2.4);};
const l2s=c=>{ c=c<=0.0031308? 12.92*c : 1.055*Math.pow(c,1/2.4)-0.055; return Math.round(Math.min(1,Math.max(0,c))*255); };
function lin2lab(r,g,b){
  const X=(0.4124564*r+0.3575761*g+0.1804375*b)/0.95047, Y=(0.2126729*r+0.7151522*g+0.0721750*b), Z=(0.0193339*r+0.1191920*g+0.9503041*b)/1.08883;
  const f=t=> t>216/24389 ? Math.cbrt(t) : (24389/27*t+16)/116;
  const fx=f(X), fy=f(Y), fz=f(Z); return [116*fy-16, 500*(fx-fy), 200*(fy-fz)];
}
function lab2lin(L,a,b){
  const fy=(L+16)/116, fx=fy+a/500, fz=fy-b/200;
  const inv=t=>{ const t3=t*t*t; return t3>216/24389 ? t3 : (116*t-16)/(24389/27); };
  const X=inv(fx)*0.95047, Y=inv(fy), Z=inv(fz)*1.08883;
  return [3.2404542*X-1.5371385*Y-0.4985314*Z, -0.9692660*X+1.8760108*Y+0.0415560*Z, 0.0556434*X-0.2040259*Y+1.0572252*Z];
}
const rgb2lab=(R,G,B)=>lin2lab(s2l(R),s2l(G),s2l(B));
function lab2rgb(L,a,b){ const [r,g,bb]=lab2lin(L,a,b); const oog=[r,g,bb].some(v=>v<-0.02||v>1.02); return {rgb:[l2s(r),l2s(g),l2s(bb)], oog}; }
const hex=rgb=>'#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('');
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lch=lab=>{ const C=Math.hypot(lab[1],lab[2]); let h=Math.atan2(lab[2],lab[1])*180/Math.PI; if(h<0) h+=360; return [lab[0],C,h]; };
const fromLch=(L,C,h)=>[L, C*Math.cos(h*Math.PI/180), C*Math.sin(h*Math.PI/180)];
function de2000(l1,l2){
  const [L1,a1,b1]=l1,[L2,a2,b2]=l2, rad=Math.PI/180;
  const C1=Math.hypot(a1,b1), C2=Math.hypot(a2,b2), Cb=(C1+C2)/2, G=0.5*(1-Math.sqrt(Math.pow(Cb,7)/(Math.pow(Cb,7)+Math.pow(25,7))));
  const a1p=(1+G)*a1, a2p=(1+G)*a2, C1p=Math.hypot(a1p,b1), C2p=Math.hypot(a2p,b2);
  const h=(b,a)=>{ if(a===0&&b===0) return 0; let x=Math.atan2(b,a)/rad; return x<0?x+360:x; };
  const h1p=h(b1,a1p), h2p=h(b2,a2p), dLp=L2-L1, dCp=C2p-C1p;
  let dhp=0; if(C1p*C2p!==0){ dhp=h2p-h1p; if(dhp>180) dhp-=360; else if(dhp<-180) dhp+=360; }
  const dHp=2*Math.sqrt(C1p*C2p)*Math.sin(dhp*rad/2), Lbp=(L1+L2)/2, Cbp=(C1p+C2p)/2;
  let hbp=h1p+h2p; if(C1p*C2p!==0){ if(Math.abs(h1p-h2p)>180) hbp=(h1p+h2p+(h1p+h2p<360?360:-360))/2; else hbp=(h1p+h2p)/2; }
  const T=1-0.17*Math.cos((hbp-30)*rad)+0.24*Math.cos(2*hbp*rad)+0.32*Math.cos((3*hbp+6)*rad)-0.20*Math.cos((4*hbp-63)*rad);
  const dTh=30*Math.exp(-Math.pow((hbp-275)/25,2)), Rc=2*Math.sqrt(Math.pow(Cbp,7)/(Math.pow(Cbp,7)+Math.pow(25,7)));
  const Sl=1+0.015*Math.pow(Lbp-50,2)/Math.sqrt(20+Math.pow(Lbp-50,2)), Sc=1+0.045*Cbp, Sh=1+0.015*Cbp*T, Rt=-Math.sin(2*dTh*rad)*Rc;
  return Math.sqrt(Math.pow(dLp/Sl,2)+Math.pow(dCp/Sc,2)+Math.pow(dHp/Sh,2)+Rt*(dCp/Sc)*(dHp/Sh));
}
const relLum=rgb=>0.2126*s2l(rgb[0])+0.7152*s2l(rgb[1])+0.0722*s2l(rgb[2]);
const wcag=(a,b)=>{ const x=relLum(a), y=relLum(b); return (Math.max(x,y)+0.05)/(Math.min(x,y)+0.05); };
const clamp=(x,a=-1,b=1)=>Math.min(b,Math.max(a,x));

/* ---------- SPALVŲ TEMPERATŪRA, ŠVIESUMAS, RYŠKUMAS (programos interpretacija) ---------- */
function colorAxes(lab){ const [L,C,h]=lch(lab); return {t: Math.cos((h-70)*Math.PI/180)*Math.min(1,C/25), v: clamp((L-55)/25), c: clamp((C-35)/20)}; }
/* 12 tipų: pagrindinė + antroji savybė (Sterling Style Academy). Tikslinės reikšmės – programos interpretacija:
   t – šiltumas (+) / šaltumas (−), v – šviesumas (+) / tamsumas (−), c – ryškumas (+) / prislopinimas (−). */
const SEASONS=[
 {id:'LSp',n:'Šviesus pavasaris',d:['Šviesus','Šiltas'],t:.5,v:1,c:.3},
 {id:'WSp',n:'Šiltas pavasaris',d:['Šiltas','Ryškus'],t:1,v:.3,c:.6},
 {id:'BSp',n:'Ryškus pavasaris',d:['Ryškus','Šiltas'],t:.5,v:.2,c:1},
 {id:'LSu',n:'Šviesi vasara',d:['Šviesus','Šaltas'],t:-.5,v:1,c:-.3},
 {id:'CSu',n:'Šalta vasara',d:['Šaltas','Prislopintas'],t:-1,v:0,c:-.5},
 {id:'SSu',n:'Prislopinta vasara',d:['Prislopintas','Šaltas'],t:-.5,v:0,c:-1},
 {id:'SAu',n:'Prislopintas ruduo',d:['Prislopintas','Šiltas'],t:.5,v:0,c:-1},
 {id:'WAu',n:'Šiltas ruduo',d:['Šiltas','Prislopintas'],t:1,v:-.3,c:-.4},
 {id:'DAu',n:'Tamsus ruduo',d:['Tamsus','Šiltas'],t:.5,v:-1,c:-.1},
 {id:'DWi',n:'Tamsi žiema',d:['Tamsus','Šaltas'],t:-.5,v:-1,c:.3},
 {id:'CWi',n:'Šalta žiema',d:['Šaltas','Ryškus'],t:-1,v:-.3,c:.6},
 {id:'BWi',n:'Ryški žiema',d:['Ryškus','Šaltas'],t:-.5,v:0,c:1}
];
const dist=(a,s)=>Math.hypot(a.t-s.t,a.v-s.v,a.c-s.c);
function rankSeasons(ax){ return SEASONS.map(s=>({s, d:dist(ax,s)})).sort((a,b)=>a.d-b.d); }
function yarnFit(lab, s){ const d=dist(colorAxes(lab), s); return d<0.9?'ok':(d<1.4?'mid':'bad'); }
function seasonPalette(s){
  const out=[]; const L=55+25*s.v, C=Math.max(8,35+20*s.c);
  for(let h=0;h<360;h+=20){ const tc=Math.cos((h-70)*Math.PI/180); if(Math.sign(tc)!==Math.sign(s.t) && Math.abs(tc)>0.35) continue;
    let cc=C, r; for(let k=0;k<6;k++){ r=lab2rgb(...fromLch(L,cc,h)); if(!r.oog) break; cc*=0.82; } out.push(hex(r.rgb)); }
  const nh = s.t>0 ? 70 : 250; [L-25, L, L+20].forEach(l=>{ out.push(hex(lab2rgb(...fromLch(clamp(l,8,96),6,nh)).rgb)); });
  return out;
}

const KEY='srp-spalvos';

let S; try{ S=Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY)||'{}')); if(!Array.isArray(S.palette)) S.palette=[]; if(!S.person||typeof S.person!=='object') S.person=fresh().person; }catch(e){ S=fresh(); }

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(x,d=1)=>{ const v=Math.round(x*Math.pow(10,d))/Math.pow(10,d); return (v===0?0:v).toLocaleString('lt-LT'); };
let IMG={siulai:null, tipas:null};   // nuotraukos lieka tik atmintyje

/* ---------- NUOTRAUKA ---------- */
function loadImage(file, slot, cb){
  const fr=new FileReader();
  fr.onload=()=>{ const im=new Image(); im.onload=()=>{ IMG[slot]=im; cb(); }; im.src=fr.result; };
  fr.readAsDataURL(file);
}
function drawStage(slot, canvasId, wb){
  const cv=$(canvasId); if(!cv||!IMG[slot]) return;
  const im=IMG[slot], max=900, sc=Math.min(1, max/Math.max(im.width,im.height));
  cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
  const ctx=cv.getContext('2d'); ctx.drawImage(im,0,0,cv.width,cv.height);
  if(wb){ const d=ctx.getImageData(0,0,cv.width,cv.height), p=d.data;
    for(let i=0;i<p.length;i+=4){ p[i]=l2s(s2l(p[i])*wb[0]); p[i+1]=l2s(s2l(p[i+1])*wb[1]); p[i+2]=l2s(s2l(p[i+2])*wb[2]); }
    ctx.putImageData(d,0,0); }
}
function sampleAt(cv, ev){
  const r=cv.getBoundingClientRect(), x=Math.round((ev.clientX-r.left)/r.width*cv.width), y=Math.round((ev.clientY-r.top)/r.height*cv.height);
  const R=4, ctx=cv.getContext('2d'), d=ctx.getImageData(Math.max(0,x-R),Math.max(0,y-R),2*R+1,2*R+1).data;
  let lr=0,lg=0,lb=0,n=0; for(let i=0;i<d.length;i+=4){ lr+=s2l(d[i]); lg+=s2l(d[i+1]); lb+=s2l(d[i+2]); n++; }
  return [lr/n, lg/n, lb/n];   // linijinis RGB (jau su baltos pataisa, nes piešiama pataisyta)
}
function wbFrom(lin){ const m=(lin[0]+lin[1]+lin[2])/3; return lin.map(v=> v>0.001 ? m/v : 1); }
function rawSample(slot, cv, ev){ // be baltos pataisos – baltam lapui
  const im=IMG[slot], tmp=document.createElement('canvas'); tmp.width=cv.width; tmp.height=cv.height; tmp.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
  return sampleAt(tmp, ev);
}

/* ---------- K-VIDURKIAI ---------- */
function kmeans(slot, k, wb){
  const im=IMG[slot], max=110, sc=Math.min(1,max/Math.max(im.width,im.height));
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(im.width*sc)); c.height=Math.max(1,Math.round(im.height*sc));
  const ctx=c.getContext('2d'); ctx.drawImage(im,0,0,c.width,c.height); const p=ctx.getImageData(0,0,c.width,c.height).data;
  const pts=[]; for(let i=0;i<p.length;i+=4){ let r=s2l(p[i]),g=s2l(p[i+1]),b=s2l(p[i+2]); if(wb){ r*=wb[0]; g*=wb[1]; b*=wb[2]; } pts.push(lin2lab(Math.min(1,r),Math.min(1,g),Math.min(1,b))); }
  const d2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;
  const cents=[pts[Math.floor(pts.length/2)]];
  while(cents.length<k){ let best=null,bd=-1; for(const q of pts){ const m=Math.min(...cents.map(c=>d2(q,c))); if(m>bd){bd=m;best=q;} } cents.push(best); }
  let asg=new Array(pts.length).fill(0);
  for(let it=0;it<15;it++){
    pts.forEach((q,i)=>{ let bi=0,bd=Infinity; cents.forEach((c,j)=>{ const d=d2(q,c); if(d<bd){bd=d;bi=j;} }); asg[i]=bi; });
    const sum=cents.map(()=>[0,0,0,0]); pts.forEach((q,i)=>{ const s=sum[asg[i]]; s[0]+=q[0]; s[1]+=q[1]; s[2]+=q[2]; s[3]++; });
    sum.forEach((s,j)=>{ if(s[3]) cents[j]=[s[0]/s[3],s[1]/s[3],s[2]/s[3]]; });
  }
  const cnt=cents.map((_,j)=>asg.filter(a=>a===j).length);
  return cents.map((c,j)=>({lab:c, share:cnt[j]/pts.length})).filter(x=>x.share>=0.03).sort((a,b)=>b.share-a.share);
}

function swatchRow(c,i){

function addColorLab(lab, name){ const r=lab2rgb(...lab).rgb; S.palette.push({lab, hex:hex(r), rgb:r, name:name||''}); }

     <div class="row" style="margin-top:8px">${IMG.siulai?`<label class="f" style="flex-direction:row;align-items:center;gap:6px">Spalvų <select id="kSel">${[3,4,5,6,7,8].map(n=>`<option ${S.k===n?'selected':''}>${n}</option>`).join('')}</select></label><button class="btn" id="auto">Rasti spalvas automatiškai</button>`:''}
       <label class="btn file">+ Spalva rankiniu būdu<input id="manual" type="color" value="#7a3e6b"></label></div>

   </section>

  if(P.length>1){ const A=P[S.pairA]||P[0], B=P[S.pairB]||P[1]; drawFairIsle('#fiC',A.hex,B.hex,false); drawFairIsle('#fiG',A,B,true);
    $('#pA').onchange=e=>{ S.pairA=+e.target.value; save(); viewYarn(); }; $('#pB').onchange=e=>{ S.pairB=+e.target.value; save(); viewYarn(); }; }

function drawFairIsle(id, A, B, gray){
  const cv=$(id); if(!cv) return; const ctx=cv.getContext('2d'); if(!ctx) return; const cs=10;
  const g=c=>{ const L=c.lab[0]; const v=hex(lab2rgb(L,0,0).rgb); return v; };
  const ca=gray?g(A):A, cb=gray?g(B):B;
  const motif=['000100010001000100010001','001110111011101110111011','011111111111111111111111','001110111011101110111011','000100010001000100010001','000000000000000000000000','010101010101010101010101','101010101010101010101010','000000000000000000000000','000100010001000100010001','001110111011101110111011','000100010001000100010001'];
  motif.forEach((row,y)=>[...row].forEach((ch,x)=>{ ctx.fillStyle= ch==='1'?cb:ca; ctx.fillRect(x*cs,y*cs,cs,cs); }));
}

/* ---------- SPALVINIS TIPAS ---------- */
function personAxes(){
  const p=S.person, sm=p.samples, notes=[];
  let tParts=[];
  if(sm.oda){ const [L,C,h]=lch(sm.oda); tParts.push(clamp((h-55)/15)); notes.push(`odos atspalvio kampas ${fmt(h,0)}°`); }
  const A=p.answers; if(A.venos) tParts.push({zalsvos:1,melsvos:-1,abejos:0}[A.venos]); if(A.papuosalai) tParts.push({auksas:1,sidabras:-1,abu:0}[A.papuosalai]); if(A.saule) tParts.push({idega:1,nudega:-1,abu:0}[A.saule]);
  const t = tParts.length ? tParts.reduce((a,b)=>a+b,0)/tParts.length : 0;
  const Ls=['oda','plaukai','akys'].filter(k=>sm[k]).map(k=>sm[k][0]);
  const v = Ls.length ? clamp((Ls.reduce((a,b)=>a+b,0)/Ls.length-50)/25) : 0;
  let cParts=[]; if(sm.akys) cParts.push(clamp((lch(sm.akys)[1]-15)/15)); if(sm.plaukai&&sm.oda) cParts.push(clamp((Math.abs(sm.plaukai[0]-sm.oda[0])-35)/25));
  const c = cParts.length ? cParts.reduce((a,b)=>a+b,0)/cParts.length : 0;
  const ax = p.manual || {t,v,c};
  return {ax, auto:{t,v,c}, enough: !!(sm.oda && (sm.plaukai||sm.akys)) || tParts.length>=2};
}
function viewPerson(){

const I18N_MISS=new Set();
function i18nKey(s){ return s.replace(/\s+/g,' ').trim().replace(NUM_RE,'#'); }
// Vertimas: (1) visas tekstas kaip raktas; (2) jei nerasta – tekstas skaidomas skyrybos ženklais
// („; “, „: “, „, “, „ · “, „ – “) ir verčiama kiekviena dalis atskirai (programos generuojamiems sąrašams).
// Spalvų kodai (#0595dc) apsaugomi, kad jų skaitmenys nebūtų laikomi skaičiais.
const I18N_HEX=/#[0-9a-fA-F]{3,8}\b/g;
const I18N_LET=/[A-Za-zĄČĘĖĮŠŲŪŽąčęėįšųūžЀ-ӿ]/;
function i18nOne(core, D, lang, record){
  const conv=n=> (lang==='en') ? n.replace(',','.') : n.replace('.',',');

  if(t==null){ if(record) I18N_MISS.add(key); return null; }

  t=t.replace(/#/g,()=> i<nums.length ? conv(nums[i++]) : '#').replace(/\{hex\}/g,()=> h<hex.length ? hex[h++] : '');
  return t;
}
const I18N_SPLIT=/(\s*;\s+|:\s+|,\s+|\s+·\s+|\s+–\s+|\s+—\s+|\s*\(\s*|\s*\)\s*)/;

function i18nTr(s, lang){
  lang=lang||S.lang; if(!lang||lang==='lt') return s;

  const list=[]; while(w.nextNode()) list.push(w.currentNode);
  list.forEach(n=>{ if(n.__tr===n.nodeValue) return; const v=i18nTr(n.nodeValue); if(v!==n.nodeValue){ n.nodeValue=v; } n.__tr=n.nodeValue; });
  const els=root.querySelectorAll ? root.querySelectorAll('[placeholder],[title],[aria-label],optgroup[label]') : [];
  els.forEach(el=>['placeholder','title','aria-label','label'].forEach(a=>{ if(a==='label'&&el.nodeName!=='OPTGROUP') return; const v=el.getAttribute(a); if(v){ const t=i18nTr(v); if(t!==v) el.setAttribute(a,t); } }));

const I18N_PENDING={}; let i18nWant=null;

  if(I18N_PENDING[k]) return I18N_PENDING[k];
  return I18N_PENDING[k]=new Promise(res=>{
    const sc=document.createElement('script'), G='I18N_'+k.toUpperCase();
    const end=ok=>{ delete I18N_PENDING[k]; try{ sc.remove(); }catch(e){} res(ok); };
    sc.src='i18n/'+k+'.js'+(typeof I18N_VER!=='undefined'?'?v='+I18N_VER:''); sc.async=true;

function i18nMsg(kind,k){

function i18nSet(k){
  if(i18nReady(k)){ i18nWant=null; i18nMsg(); S.lang=k; i18nSave(); render(); try{ document.documentElement.lang=k||'lt'; }catch(e){} return; }
  i18nWant=k; i18nMsg('load',k);
  i18nLoad(k).then(ok=>{ if(i18nWant!==k) return; i18nWant=null;
    if(ok){ i18nMsg(); S.lang=k; i18nSave(); render(); try{ document.documentElement.lang=k; }catch(e){} }
    else { render(); i18nMsg('fail',k); } });

// Paleidimas lengvajame režime: jei išsaugota kalba dar neįkelta – pirmiausia ją įkeliame (iki 3 s), tada piešiame.
function i18nBoot(){
  const k=S.lang;
  if(i18nReady(k)){ render(); i18nStart(); return; }
  let drawn=false; i18nWant=k; S.lang='lt';
  const draw=()=>{ if(drawn) return; drawn=true; render(); i18nStart(); };
  const tm=setTimeout(()=>{ draw(); if(i18nWant===k) i18nMsg('load',k); },3000);
  i18nLoad(k).then(ok=>{ clearTimeout(tm); if(i18nWant!==k){ draw(); return; } i18nWant=null;
    if(ok){ i18nMsg(); S.lang=k; if(drawn) render(); draw(); try{ document.documentElement.lang=k; }catch(e){} }
    else { draw(); i18nMsg('fail',k); } });
