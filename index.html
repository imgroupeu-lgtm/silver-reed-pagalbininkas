function drawOnPiece(cv,p){
  const ctx=cv.getContext&&cv.getContext('2d'); if(!ctx) return null;
  const gk=S.garment, pcs=GARMENTS[gk].pieces.filter(x=>PIECE_KINDS.includes(x.kind));
  if(!pcs.length) return null;
  const pid=pcs.find(x=>x.id===p.piece)?p.piece:pcs[0].id; let r; try{ r=computePiece(gk,pid); }catch(e){ return null; }
  const sim=r.sim, rows=[]; let minL=Infinity,maxR=-Infinity,maxY=0;
  sim.parts.forEach(pt=>pt.rows.forEach(w=>{ if(w.yr==null||!(w.R>w.L)) return; rows.push(w); minL=Math.min(minL,w.L); maxR=Math.max(maxR,w.R); maxY=Math.max(maxY,w.yr); }));
  if(!rows.length) return null;
  const g=S.gauges[S.machine], Wn=maxR-minL, avail=Math.max(220,((cv.parentNode&&cv.parentNode.clientWidth)||420)-10);
  let sx=avail/Wn, sy=sx*g.sts/g.rows; const maxH=520; if(maxY*sy>maxH){ sy=maxH/maxY; sx=sy*g.rows/g.sts; }
  cv.width=Math.ceil(Wn*sx)+2; cv.height=Math.ceil(maxY*sy)+2; ctx.clearRect(0,0,cv.width,cv.height);
  const off=Math.floor(p.W/2), y0=Math.max(1,p.startRow), y1=p.bandRows>0?y0+p.bandRows-1:Infinity, PL=patPlaceOn(p)?patPlaceBox(p):null;
  let inCells=0;
  rows.forEach(w=>{ const Y=cv.height-1-w.yr*sy;
    for(let n=w.L;n<w.R;n++){ let col;
      if(PL){ const bg=isTX(p)?'#eef1f3':p.colors[0]; if(w.yr>=PL.row0&&w.yr<=PL.row1&&n>=PL.nx0&&n<=PL.nx1){ const v=patGet(p,n-PL.nx0,w.yr-PL.row0); inCells++; col=isTX(p)?(v?'#7f97a6':'#eef1f3'):p.colors[v]; } else col=bg; }
      else if(w.yr>=y0 && w.yr<=y1){ const xx=((n+off)%p.W+p.W)%p.W, yy=(w.yr-y0)%p.H; { const v=patGet(p,xx,yy); col=isTX(p)?(v?'#7f97a6':'#eef1f3'):p.colors[v]; } } else col=isTX(p)?'#eef1f3':p.colors[0];
      ctx.fillStyle=col; ctx.fillRect(1+(n-minL)*sx,Y,Math.ceil(sx),Math.ceil(sy)); } });
  if(PL){ ctx.save(); ctx.strokeStyle='#e33'; ctx.setLineDash([4,3]); ctx.lineWidth=1.5; ctx.strokeRect(1+(PL.nx0-minL)*sx+.5, cv.height-1-PL.row1*sy+.5, p.W*sx, p.H*sy); ctx.restore(); }
  return {pid, name:pieceDef(gk,pid).name, castOn:sim.castOn.n, maxW:Wn, rows:maxY, reps:Wn/p.W, pcs, place:PL?Object.assign({},PL,{out:p.W*p.H-inCells}):null};
}

async function imgToJpeg(img,max){ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',0.85); }
async function aiAnalyze(){
  const c=aiCfg(); if(!patImg) throw new Error('Pirmiausia įkelkite nuotrauką.');
  if(c.prov!=='ollama' && !c.key) throw new Error('Įveskite AI raktą skiltyje „AI nustatymai“.');
  const url=await imgToJpeg(patImg,1024), b64=url.split(',')[1], model=c.model||AI_DEF_MODEL[c.prov], prompt=AI_PROMPT();
  let txt='';
  if(c.prov==='gemini'){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':c.key},
      body:JSON.stringify({contents:[{parts:[{text:prompt},{inline_data:{mime_type:'image/jpeg',data:b64}}]}],generationConfig:{responseMimeType:'application/json',temperature:0.2}})});
    const j=await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||('Klaida '+r.status));
    txt=(((j.candidates||[])[0]||{}).content||{parts:[]}).parts.map(x=>x.text||'').join('');
  } else if(c.prov==='openrouter'){
    const r=await fetch('https://openrouter.ai/api/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+c.key},
      body:JSON.stringify({model,temperature:0.2,messages:[{role:'user',content:[{type:'text',text:prompt},{type:'image_url',image_url:{url}}]}]})});
    const j=await r.json(); if(!r.ok) throw new Error((j.error&&j.error.message)||('Klaida '+r.status));
    txt=((j.choices||[])[0]||{message:{}}).message.content||''; if(Array.isArray(txt)) txt=txt.map(x=>x.text||'').join('');
    if(j.model) c.lastModel=j.model;
  } else {
    const r=await fetch(c.host.replace(/\/$/,'')+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,stream:false,format:'json',messages:[{role:'user',content:prompt,images:[b64]}]})});
    const j=await r.json(); if(!r.ok) throw new Error(j.error||('Klaida '+r.status)); txt=(j.message||{}).content||'';
  }
  const m=txt.replace(/```json|```/g,'').match(/\{[\s\S]*\}/); if(!m) throw new Error('AI atsakymas nesuprantamas: '+txt.slice(0,200));
  const res=JSON.parse(m[0]); res._model=c.lastModel||model; return res;
}

/* --- techninių raštų informacija --- */
function txInfoHtml(p,g){
  const T=TECHS[p.tech], rows=[];
  for(let y=0;y<p.H;y++){ const by={}; for(let x=0;x<p.W;x++){ const v=patGet(p,x,y); if(v>0) (by[v]=by[v]||[]).push(p.W-x); }
    const parts=Object.keys(by).map(v=>`${T.states[v][0].toLowerCase()}: ${by[v].sort((a,b)=>a-b).join(', ')}`); rows.push(parts.length?parts.join('; '):'visos akys mezgamos'); }
  const groups=[]; rows.forEach((t,i)=>{ const L=groups[groups.length-1]; if(L&&L.t===t) L.to=i+1; else groups.push({t,from:i+1,to:i+1}); });
  let vmax=0; for(let x=0;x<p.W;x++){ let run=0; for(let i=0;i<p.H*2;i++){ if(patGet(p,x,i%p.H)>0){ run++; if(run<=p.H) vmax=Math.max(vmax,run); } else run=0; } }
  const extra = T.desc ? T.desc : p.tech==='azuras' ? 'Perkelkite akį perkėlimo įrankiu ant gretimos adatos nurodyta kryptimi; tuščią adatą palikite darbo padėtyje – susidarys skylutė. Akių skaičius nesikeičia.'
    : p.tech==='patiesinimas' ? 'Patiesinama akis tą eilę nemezgama – siūlas užsikabina ant adatos ir sumezgamas kitoje eilėje. Kelios patiesinimo eilės iš eilės toje pačioje adatoje sukuria didesnį reljefą.'
    : 'Praleidžiama akis tą eilę nemezgama, siūlas eina už jos. Kelios praleidimo eilės iš eilės ištempia akį.';
  if(T.noStat) return `<p class="note">${extra}</p><h3>Kas daroma kiekvienoje eilėje</h3><p class="note" style="margin-top:0">Skaičiai – kartotės akys, skaičiuojant iš dešinės.</p><table style="width:100%;border-collapse:collapse;font-size:.88rem">${groups.slice(0,120).map(gr=>`<tr style="border-top:1px solid var(--line)"><td style="padding:4px 6px;font-family:var(--f-mono);white-space:nowrap">${gr.from===gr.to?gr.from:gr.from+'–'+gr.to}</td><td style="padding:4px 6px">${esc(gr.t)}</td></tr>`).join('')}</table>`;
  return `<div class="stats" style="margin-top:10px"><div class="stat"><b>${vmax}</b><span>daugiausia eilių iš eilės toje pačioje adatoje (${T.states[1][0].toLowerCase()})</span></div></div>
    <p class="note">${extra} Kiek eilių iš eilės galima ${p.tech==='patiesinimas'?'patiesinti':p.tech==='praleidimas'?'praleisti':'perkelti'} jūsų siūlais, patikrinkite instrukcijoje ir mėginiu.</p>
    <h3>Kas daroma kiekvienoje eilėje</h3>
    <p class="note" style="margin-top:0">Skaičiai – kartotės akys, skaičiuojant iš dešinės.</p>
    <table style="width:100%;border-collapse:collapse;font-size:.88rem">${groups.slice(0,80).map(gr=>`<tr style="border-top:1px solid var(--line)"><td style="padding:4px 6px;font-family:var(--f-mono);white-space:nowrap">${gr.from===gr.to?gr.from:gr.from+'–'+gr.to}</td><td style="padding:4px 6px">${esc(gr.t)}</td></tr>`).join('')}</table>`;
}

/* --- dvigubas žakardas (SK280 + SRP60N): priekis – spalvota schema, nugarėlė – antra lova ---
   Svirčių ir karietėlės nustatymų neišgalvojame: visur nurodoma SRP60N instrukcija. */
const JQ_SET='Nustatymai: žr. SRP60N instrukciją (jacquard / double bed colour skyrius)';
const JQ_BACKS=[['dryzuota','Dryžuota','Kiekviename pase antroje lovoje mezga visos adatos – nugarėlė dryžuota'],['paukscio','Paukščio akis','Kiekviename pase antroje lovoje mezga kas antra adata (kai spalvų daugiau – kas k-oji), kitame pase – likusios; nugarėlė smulkiai marga'],['lygi','Lygi','Antroje lovoje mezgama tik pagrindinės spalvos (A) pase, kitų spalvų pasuose antra lova nemezga']];
function jqColors(p){ const cnt={}; for(const ch of p.cells){ const v=ch.charCodeAt(0)-48; cnt[v]=(cnt[v]||0)+1; }
  let cs=Object.keys(cnt).map(Number).sort((a,b)=>cnt[b]-cnt[a]||a-b); if(cs.length<2) cs=[0,1].filter(v=>v<p.colors.length).concat(cs.filter(v=>v>1)).slice(0,Math.max(2,cs.length));
  return {cs, cnt}; }
function jqBack(p){ return JQ_BACKS.some(b=>b[0]===p.jqBack)?p.jqBack:'paukscio'; }
// nugarėlė: vienas įrašas kiekvienam pasui (rašto eilė y, pasas j): ląstelės – spalva arba -1 (antros lovos adata tą pasą nemezga)
function jqBackRows(p){ const {cs}=jqColors(p), k=cs.length, b=jqBack(p), out=[];
  for(let y=0;y<p.H;y++) for(let j=0;j<k;j++){ const c=cs[j], cells=[];

      if(v>=0){ ctx.fillStyle=p.colors[v]||'#ccc'; ctx.fillRect(X,Y,cw,ch); } else { ctx.fillStyle='#f3f3f3'; ctx.fillRect(X,Y,cw,ch); ctx.fillStyle='#bbb'; ctx.fillRect(X+cw/2-1,Y+ch/2-1,2,2); } }
    if(r.j===opt.k-1 || opt.k===1){ ctx.fillStyle='#333'; ctx.font='10px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle'; if(r.y===0||(r.y+1)%Math.max(1,opt.step)===0) ctx.fillText(String(r.y+1),mL+W*cw+4,Y+ch/2); } });

  if(row){ if(isTX(pp)){ const by=[]; for(let x=0;x<pp.W;x++){ const v=patGet(pp,x,row-1); if(v) by.push(`${pp.W-x}${TECHS[pp.tech].states[v][1]}`); } info=by.length?`Akys (iš dešinės): ${by.join(', ')}`:'Visos akys mezgamos.'; }

    else { const r=patRows(pp)[row-1]; info=`A: spalva ${r.A+1}${r.B!=null?` · B: spalva ${r.B+1}`:''}`; }
    if(PA) info=`Motyvas – adatos ${patNeedleTxt(PA.nx0)} … ${patNeedleTxt(PA.nx1)} (nuo vidurio). `+info; }
  return `<div class="mcard" style="margin-top:10px">
    <div class="row" style="justify-content:space-between"><b>Raštas</b><label class="note"><input type="checkbox" id="mpOn" checked> rodyti</label></div>

    ${row?`<div class="rcbig" style="font-size:1.6rem">Rašto eilė ${row} iš ${pp.H}</div>
      <div style="overflow:auto;white-space:nowrap;margin:6px 0">${cells(row)}</div>

      :PA?`<div class="meta">${PA.before?`Motyvas prasidės nuo RC ${PA.row0}.`:`Motyvas baigtas (RC ${PA.row1}).`}</div>`:`<div class="meta">Raštas prasidės nuo RC ${mp.start}.</div>`}
  </div>`; }
function bindPatRow(){ const mp=S.mPat; const on=$('#mpOn'); if(!on) return;
  on.onchange=()=>{ mp.on=on.checked; save(); viewMasina(); };
  if($('#mpStart')){ $('#mpStart').onchange=e=>{ mp.start=Math.max(1,parseInt(e.target.value)||1); save(); viewMasina(); }; } }

/* --- papildoma spalvotų raštų biblioteka: tradiciniai norvegiški motyvai, bordiūrai, smulkūs raštai ---
   Visi motyvai nupiešti originaliai (taškai '#'=kontrastinė spalva, '.'=fonas). Eilutės rows – nuo apačios. */
(function(){
/* ---------- pagalbinės ---------- */
function mirRow(s,odd){ return s+s.split('').reverse().join('').slice(odd?1:0); }
function quad(q,oddW,oddH){ // q – viršutinis kairysis ketvirtis (su centrine eilute/stulpeliu)
  const top=q.map(r=>mirRow(r,oddW)); const bot=top.slice(0,oddH?-1:undefined).reverse(); return top.concat(bot); }
function padArt(art,W,H,ox,oy){ // art viršus-pirma, dedam į WxH drobę nuo (ox,oy) (iš viršaus kairės)
  const out=[]; for(let y=0;y<H;y++){ let s=''; for(let x=0;x<W;x++){ const ay=y-oy, ax=x-ox; s+=(ay>=0&&ay<art.length&&ax>=0&&ax<art[ay].length)?art[ay][ax]:'.'; } out.push(s); } return out; }
function tile(W,H,stamps){ // stamps: [art,x,y] (viršus-pirma), kartojasi su apvijimu
  const g=[]; for(let y=0;y<H;y++) g.push(new Array(W).fill('.'));
  stamps.forEach(([a,x0,y0])=>{ for(let j=0;j<a.length;j++) for(let i=0;i<a[j].length;i++){ const c=a[j][i]; if(c!=='.') g[(y0+j)%H][(x0+i)%W]=c; } });
  return g.map(r=>r.join('')); }
function fromTop(art){ return art.slice().reverse().map(r=>r.replace(/[^.]/g,c=>c==='2'?'2':'1').replace(/\./g,'0')); }
function A(art){ const H=art.length, W=art[0].length; art.forEach(r=>{ if(r.length!==W) throw new Error('art width '+r.length+' != '+W+' : '+r); }); return {W,H,rows:fromTop(art)}; }
function F(W,H,f){ const art=[]; for(let y=H-1;y>=0;y--){ let s=''; for(let x=0;x<W;x++) s+=f(x,y)?'#':'.'; art.push(s); } return art; } // f su y=0 apačioje
function flipX(a){ return a.map(r=>r.split('').reverse().join('')); }
// 8-krypčių simetrija: f(a,b), a=max(|dx|,|dy|), b=min(|dx|,|dy|) nuo centro
function sym8(n,f){ const c=(n-1)/2; return F(n,n,(x,y)=>{ const dx=Math.abs(x-c), dy=Math.abs(y-c); return f(Math.max(dx,dy),Math.min(dx,dy)); }); }
const PD=(a,b,cx)=>Math.abs(a-cx)+b; // atstumas iki žiedlapio centro (cx, 0)
function waveArt(W,H,amp,phases,thick){ // sujungta sinusoidė
  const mid=(H-1)/2, c=(x,ph)=>Math.round(mid+amp*Math.sin(2*Math.PI*(x+0.5)/W+ph));
  return F(W,H,(x,y)=>phases.some(ph=>{ const yc=c(x,ph), yl=Math.round((c((x+W-1)%W,ph)+yc)/2), yr=Math.round((c((x+1)%W,ph)+yc)/2); return y>=Math.min(yl,yr,yc)&&y<=Math.max(yl,yr,yc); })); }

const R15=(a,b)=>{ if(a<=1&&b===0) return 1; if(PD(a,b,5)<=2) return 1; return a===b&&(a===4||a===5); };

const ROSE15=sym8(15,R15);

const ROSE23=sym8(23,(a,b)=>{ if(a<=5) return R11(a,b); if(PD(a,b,9)<=2) return 1; return a===b&&a>=5&&a<=8; });
const ROSE31=sym8(31,(a,b)=>{ if(a<=7) return R15(a,b); if(PD(a,b,12)<=3) return 1; return a===b&&a>=7&&a<=10; });

   Visos schemos nupieštos originaliai. Langelio reikšmė = būsenos indeksas:

(function(){

const CH={'.':0,'-':1,'L':2,'R':3,'u':4,'n':5};
function art(a){ const W=a[0].length; a.forEach(r=>{ if(r.length!==W) throw new Error('reljefas: eilutės ilgis '+r.length+' != '+W+': '+r); });
  return {W,H:a.length,rows:a.slice().reverse().map(r=>r.split('').map(c=>{ if(!(c in CH)) throw new Error('reljefas: ženklas '+c); return CH[c]; }).join(''))}; }

function cable(n,dir,H){ // n akių kosa su 2 išvirkščiomis akimis abiejose pusėse; kryžius eilėje y=H-2 (nelyginė, veidinė)
  const c=dir==='L'?2:3, W=n+4;
  return fn(W,H,(x,y)=>x<2||x>=W-2?1:(y===H-2?c:0)); }

function texMachTxt(s){ try{ const m=MACHINES[S.machine]; if(!s||!m||m.id==='SK280'||!m.ribber) return s; const rib=m.ribberModel;
  return s.replace(/\(SK280 – SRP60N, jos nustatymai – instrukcijoje\)/g, rib?`(${m.name} – ${rib}, jos nustatymai – instrukcijoje)`:'(jos nustatymai – antros lovos instrukcijoje)')
    .replace(/\(SK280 – SRP60N\)/g, rib?`(${m.name} – ${rib})`:'(žr. antros lovos instrukciją)')
    .replace(/iš SK280 \/ SRP60N instrukcijos/g, rib?`iš ${m.name} / ${rib} instrukcijos`:'iš mašinos ir antros lovos instrukcijų')
    .replace(/SRP60N svirčių/g, rib?`${rib} svirčių`:'antros lovos svirčių'); }catch(e){ return s; } }

/* ================= AŽŪRAS SKAROMS: užmetimai ir mažinimai (technika azuras2) =================
   Visos schemos nupieštos originaliai šiai programai (tradiciniai motyvų TIPAI – vėduoklės, rombai, eglutės,
   „musytės“, „žirneliai“ ir kt. – yra bendras paveldas; publikuotos schemos nekopijuotos).
   Langelio reikšmė (būsena):
   0 dešinė akis · 1 užmetimas ○ · 2 dvi kartu į dešinę / · 3 dvi kartu į kairę \ · 4 trys kartu ▲ · 5 išvirkščia – · 6 akies nėra ▪
   Eilutės rows – nuo apačios, eilutėje kairė → dešinė (kaip schemoje; veidinės eilės skaitomos iš dešinės).
   Balansas: kiekvienoje eilėje užmetimų = mažinimų (▲ = 2). Išimtis – šonu megzti dantyti kraštai (edge:true):
   jų akių skaičius kinta tyčia, uždarymas nurodomas bo:[[eilė, akių]] ir note. */
(function(){
if(typeof TECHS==='undefined') return;
while(TXCOL.length<7) TXCOL.push(['#ffffff','#c9d6de','#e6d2b5','#d3e4c4','#f3dede','#e0dbf0','#bdbdbd'][TXCOL.length]);

const CH={'.':0,'o':1,'/':2,'\\':3,'^':4,'-':5,'x':6};
const K_SM='Smulkūs ažūrai', K_RO='Rombai ir žvaigždės', K_LA='Lapeliai ir eglutės', K_BA='Bangos ir vėduoklės', K_KR='Kraštai (dantyti)', K_OR='Orenburgo tipo motyvai';

/* B – eilutės nuo apačios simboliais */
function B(rows){ const W=rows[0].length; rows.forEach(r=>{ if(r.length!==W) throw new Error('azuras2: eilutės ilgis '+r.length+' != '+W+': '+r); });
  return {W,H:rows.length,rows:rows.map(r=>r.split('').map(c=>{ if(!(c in CH)) throw new Error('azuras2: ženklas '+c); return CH[c]; }).join(''))}; }
/* U – pagrindas (st – lygus: visos eilės dešine veidinėje pusėje; gt – keliaraštis: lyginės eilės „–“) + skylučių vienetai.
   Vienetas [eilė(1..H), x, tipas]: L = „/○“ (mažinimas kairėje), R = „○\“, C = „○▲○“, D = „/○○\“ (dvigubas užmetimas). x – užmetimo vieta. Apvijama per kartotės kraštą. */
function U(W,H,base,units,strict){
  const g=[]; for(let y=0;y<H;y++) g.push(new Array(W).fill(base==='gt'&&y%2===1?'-':'.'));
  const free=(y,x)=>{ const c=g[y][((x%W)+W)%W]; return c==='.'||c==='-'; };
  const put=(y,x,c)=>{ g[y][((x%W)+W)%W]=c; };
  units.forEach(([r,x,t])=>{ const y=r-1; if(y<0||y>=H) throw new Error('azuras2: eilė '+r);
    const cells = t==='L'?[[x-1,'/'],[x,'o']] : t==='R'?[[x,'o'],[x+1,'\\']] : t==='C'?[[x-1,'o'],[x,'^'],[x+1,'o']] : t==='D'?[[x-1,'/'],[x,'o'],[x+1,'o'],[x+2,'\\']] : null;
    if(!cells) throw new Error('azuras2: vienetas '+t);
    if(cells.some(([xx])=>!free(y,xx))){ if(strict!==false) throw new Error(`azuras2: persidengia ${r}/${x}/${t}`); return; }
    cells.forEach(([xx,c])=>put(y,xx,c)); });
  return B(g.map(r=>r.join(''))); }
/* rombo kontūras: centras cx, spindulys r, pirmoji (apatinė) eilė r0; grąžina vienetus */
function dia(cx,r,r0){ const u=[]; for(let i=0;i<=2*r;i++){ const d=r-Math.abs(i-r), row=r0+2*i; if(d===0) u.push([row,cx,'L']); else { u.push([row,cx-d,'L']); u.push([row,cx+d,'R']); } } return u; }
/* lapelis: centras c, apatinė eilė r0, mažinimų atstumai nuo centro ds; viršūnė – ○▲○ */
function leaf(c,r0,ds){ const out=[]; ds.forEach((d,i)=>out.push({row:r0+2*i,c,d})); out.push({row:r0+2*ds.length,c,top:true}); return out; }
function leafRows(W,H,leaves){ const g=[]; for(let y=0;y<H;y++) g.push(new Array(W).fill('.'));
  const put=(y,x,ch)=>{ const xx=((x%W)+W)%W; if(g[y][xx]!=='.') throw new Error('azuras2: lapelis persidengia'); g[y][xx]=ch; };
  leaves.forEach(L=>L.forEach(s=>{ const y=s.row-1; if(s.top){ put(y,s.c-1,'o'); put(y,s.c,'^'); put(y,s.c+1,'o'); } else { put(y,s.c-s.d,'/'); put(y,s.c-1,'o'); put(y,s.c+1,'o'); put(y,s.c+s.d,'\\'); } }));
  return B(g.map(r=>r.join(''))); }
/* šonu megztas kraštas: seqs – veidinių eilių veiksmai iš dešinės į kairę (pradžia – prisiuvamas kraštas), WS eilės – keliaraštis; paskutinėje eilėje uždaroma */
function edging(seqs,W){ const rows=[]; const cnt=(q,c)=>q.filter(v=>v===c).length;
  const s0=seqs[0], base=s0.length-cnt(s0,'o')+cnt(s0,'/')+cnt(s0,'\\')+2*cnt(s0,'^');
  seqs.forEach((seq,i)=>{ const out=seq.length; rows.push('x'.repeat(W-out)+seq.slice().reverse().join(''));
    const ws = i===seqs.length-1 ? base : out; rows.push('x'.repeat(W-ws)+'-'.repeat(ws)); });
  return rows; }

const NM='Mašina: akį perkelkite perkėlimo įrankiu ant gretimos adatos (mažinimas), tuščią adatą palikite darbo padėtyje (užmetimas). Kiekvieną eilę su ženklais perkelkite, tada numegzkite 2 eil.';
const NH='Tik rankiniam mezgimui: užmetimai nutolę nuo mažinimų (mašina tektų perstumti akių grupes), arba yra keliaraštis / išvirkščios akys.';
const NG='Orenburgo tipo motyvai megzami keliaraščiu: visos eilės – dešine (išvirkščioje pusėje taip pat dešine, todėl schemoje lyginės eilės „–“). Skylutės – tik veidinėse eilėse.';

/* mašinos tinkamumas: lygus pagrindas, be išvirkščių akių, be „akies nėra“, kiekvienas užmetimas greta savo mažinimo, nėra dvigubų užmetimų */
function machineOk(it){ for(const r of it.rows){ if(/[56]/.test(r)) return false; const a=r.split('').map(Number), W=a.length;
    for(let x=0;x<W;x++){ const v=a[x], L=a[(x-1+W)%W], R=a[(x+1)%W];
      if(v===1){ if(L===1||R===1) return false; if(!([2,3,4].includes(L)||[2,3,4].includes(R))) return false; }
      if(v===2||v===3){ if(L!==1&&R!==1) return false; }
      if(v===4){ if(L!==1||R!==1) return false; } } }
  return true; }

const IT=[]; // {id,name,cat,data,note,edge,bo,hand,machine}
function add(id,name,cat,data,o){ o=o||{}; const it=Object.assign({id,name,cat},data,{note:o.note||'',edge:!!o.edge,bo:o.bo||null});
  it.machine = o.machine!=null ? o.machine : machineOk(it); it.hand=true;
  it.noteHand=o.note||'';
  if(!it.note) it.note = it.machine ? NM : NH; else it.note += ' '+(it.machine?NM:NH);
  IT.push(it); }

function laceCheck(it){ const e=[]; if(!it||!Array.isArray(it.rows)) return ['nėra eilučių'];
  if(it.rows.length!==it.H) e.push(`eilučių ${it.rows.length} != H ${it.H}`);
  const out=[], inp=[]; const bo={}; (it.bo||[]).forEach(([r,n])=>bo[r]=n);
  it.rows.forEach((r,y)=>{ if(r.length!==it.W) e.push(`${y+1} eil. plotis ${r.length} != ${it.W}`); if(!/^[0-6]+$/.test(r)) e.push(`${y+1} eil. netinkami ženklai`);
    const c=k=>r.split('').filter(ch=>ch===String(k)).length; const o=it.W-c(6), yo=c(1), dec=c(2)+c(3)+2*c(4);
    out.push(o); inp.push(o-yo+dec+(bo[y+1]||0));
    if(!it.edge && yo!==dec) e.push(`${y+1} eil.: užmetimų ${yo}, mažinimų ${dec}`); });
  if(it.edge){ if(!it.note) e.push('kraštas be paaiškinimo (note)');
    for(let y=0;y<it.H;y++){ const prev=out[(y-1+it.H)%it.H]; if(inp[y]!==prev) e.push(`${y+1} eil.: reikia ${inp[y]} ak., o yra ${prev}`); } }
  return e; }

   Visos schemos nupieštos originaliai (tradicinio stiliaus, ne iš knygų). Ženklų sistema – pagal JIS L 0201
   („Letter symbols for knitting stitch“, 1995) ir JIS L 0200 tradiciją: schema rodo mezginį iš VEIDINĖS pusės, visos eilės.

    7 'R' kryžius ╱ (左上交差, laikyti UŽ darbo)                    8 'L' kryžius ╲ (右上交差, laikyti PRIEŠ darbą)

   14 'Y' 2/1 kryžius ╱ (1 akis už darbo)   15 'Z' 2/1 kryžius ╲ (2 akys prieš darbą)   – grupės po 3 langelius

   18 'N' nupp (estiškas gumbelis: 5 iš 1, kitoje eilėje 5 kartu išvirkščiai)
   Kryžiai: ištisinė vienodų R/L langelių grupė eilėje = vienas kryžius (pusė akių per pusę); r/l – visada po 2 langelius.
   Akių balansas: kiekvienoje eilėje suvartojama tiek akių, kiek langelių (○ = 0, 2 kartu = 2, 3 kartu = 3, kiti = 1).
   machine:true – tik kur tai praktiška SK280/SK155 su rankiniais įrankiais; machine:false – rodoma tik „Laisvas motyvas“ (rankiniam).

/* ---------- patikra (naudojama ir testuose) ---------- */
function runs(row){ const out=[]; for(let x=0;x<row.length;){ const v=row.charCodeAt(x)-48; let e=x; while(e+1<row.length && row.charCodeAt(e+1)-48===v) e++; out.push({v,a:x,b:e}); x=e+1; } return out; }
function validate(it){ const err=[]; const W=it.W, H=it.H;
  if(!Array.isArray(it.rows)||it.rows.length!==H) err.push('eilučių '+(it.rows&&it.rows.length)+' != H '+H);
  (it.rows||[]).forEach((r,y)=>{ if(r.length!==W) err.push(`eil. ${y+1}: plotis ${r.length} != ${W}`);
    let use=0; for(let x=0;x<r.length;x++){ const v=r.charCodeAt(x)-48; if(!(v>=0&&v<STATES.length)) err.push(`eil. ${y+1}: bloga būsena ${r[x]}`); else use+=USE[v]; }
    if(use!==W && !it.unbalanced) err.push(`eil. ${y+1}: suvartojama ${use} ak., o langelių ${W}`);
    runs(r).forEach(g=>{ const n=g.b-g.a+1;
      if(GROUP[g.v]==='x' && n%2) err.push(`eil. ${y+1}: kryžiaus grupė ${n} ak. (turi būti lyginė)`);
      if(GROUP[g.v]==='t' && n!==2) err.push(`eil. ${y+1}: keliaujanti akis – grupė ${n} (turi būti 2)`);
      if(GROUP[g.v]==='y' && n%3) err.push(`eil. ${y+1}: 2/1 kryžiaus grupė ${n} ak. (turi dalytis iš 3)`);
      if(it.machine && GROUP[g.v]==='x' && n>6) err.push(`eil. ${y+1}: kryžius ${n/2}/${n/2} mašinai per platus`); });
    if(it.machine){ // ažūras: kiekvienas ○ šalia savo sumažinimo (ratu), kiti mašinai netinkami ženklai draudžiami
      for(let x=0;x<W;x++){ const v=r.charCodeAt(x)-48; if([6,9,10,11,12,13,16,17,18].includes(v)) err.push(`eil. ${y+1}: ženklas ${STATES[v][0]} pažymėtas mašinai`); }
      const need=[]; for(let x=0;x<W;x++){ const v=r.charCodeAt(x)-48; need[x]=v===3||v===4?1:v===5?2:0; }
      for(let x=0;x<W;x++){ if(r.charCodeAt(x)-48!==2) continue; const L=(x+W-1)%W, R=(x+1)%W;
        const pick=need[L]>0?L:need[R]>0?R:-1; if(pick<0) err.push(`eil. ${y+1}: užmetimas ${W-x} ak. (iš dešinės) ne šalia sumažinimo`); else need[pick]--; }
      if(need.some(n=>n>0)) err.push(`eil. ${y+1}: sumažinimas be gretimo užmetimo`); } });
  // išvirkščių akių stulpeliai mašinai turi būti pastovūs
  if(it.machine && it.rows){ for(let x=0;x<W;x++){ const col=it.rows.map(r=>r.charCodeAt(x)-48); if(col.includes(1) && !col.every(v=>v===1)) err.push(`stulpelis ${W-x}: išvirkščios akys ne visame stulpelyje (mašinai)`); } }
  return err; }

/* ---------- pynių organizatorius: kelių langelių štampai (eilės nuo apačios; 1-oji – kryžiaus eilė) ----------
   n/n kryžiai – ištisinė R/L (japonai) arba ╱/╲ (reljefas) grupė; 1/1 ir 2/1 „per išvirkščią“ – r/l, y/z; mašinai – iki 3/3 (kaip jpValidate). */
function stampCross(tech,a,b,dir,pc,bg,H){ // a – akys, kurios eina viršuje; b – apačioje; dir 'R' ╱ (laikyti už darbo) / 'L' ╲ (prieš darbą)
  const J=tech===KEY, K=0, P=1, n=a+b, side=bg?2:0, W=n+2*side, rows=[];
  let cross;
  if(a===b && !pc) cross=new Array(n).fill(J?(dir==='R'?7:8):(dir==='R'?3:2));
  else if(a===1&&b===1&&pc) cross=new Array(2).fill(dir==='R'?9:10);
  else if(a===2&&b===1) cross=new Array(3).fill(pc?(dir==='R'?16:17):(dir==='R'?14:15));
  else return null;
  // eilės virš kryžiaus: per išvirkščią – išvirkščia akis atsiduria toje pusėje, iš kurios atėjo dešinės akys
  const above=[]; for(let i=0;i<n;i++) above.push(pc ? ((dir==='R') ? (i<b?P:K) : (i>=a?P:K)) : K);
  const pad=r=>{ const o=[]; for(let i=0;i<side;i++) o.push(P); o.push(...r); for(let i=0;i<side;i++) o.push(P); return o; };
  rows.push(pad(cross)); for(let y=1;y<H;y++) rows.push(pad(above));
  return {w:W,h:H,d:rows}; }
window.patStamps=function(p){ const t=p&&p.tech; if(t!==KEY && t!=='reljefas') return [];
  const J=t===KEY, bg=!!(window.PED&&PED.stBg!==false), out=[];
  const add=(id,name,cat,hand,st,note)=>{ if(st) out.push(Object.assign({id,name,cat,hand,note:note||''},st)); };
  [[1,1,2],[2,1,4],[2,2,4],[3,3,6],[4,4,8]].forEach(([a,b,H])=>['R','L'].forEach(dir=>{ if(!J&&a!==b) return;
    const nm=`${a}/${b} ${dir==='R'?'╱ dešinėn (laikyti už darbo)':'╲ kairėn (laikyti prieš darbą)'}`;
    add(`c${a}${b}${dir}`,nm,'Kryžiai',a>3,stampCross(t,a,b,dir,false,bg,H),a>3?'Platesnis nei 3/3 – mašinai per platus, tik rankomis.':''); }));
  if(J){ [['R','⟋ dešinėn'],['L','⟍ kairėn']].forEach(([dir,l])=>add(`p11${dir}`,`1/1 per išvirkščią ${l}`,'Per išvirkščią foną',true,stampCross(t,1,1,dir,true,bg,2),'Tik rankomis – mašinai nepraktiška.'));

/* ---------- tinklelio pagalbinės (vizualios koordinatės: vy=0 – viršus) ---------- */
function toVis(p){ const g=[]; for(let vy=0;vy<p.H;vy++){ const y=p.H-1-vy; g.push(p.cells.slice(y*p.W,(y+1)*p.W).split('')); } return g; }
function fromVis(p,g){ const H=g.length, W=H?g[0].length:0; const rows=[]; for(let y=0;y<H;y++) rows.push(g[H-1-y].join('')); p.W=W; p.H=H; p.cells=rows.join(''); }
function setCell(a,p,x,y,ch){ if(x<0||y<0||x>=p.W||y>=p.H) return; a[y*p.W+x]=ch; }
const C=v=>String.fromCharCode(48+v);
function selRect(p){ const s=ED.sel; if(!s) return {x0:0,y0:0,x1:p.W-1,y1:p.H-1,all:true};
  return {x0:Math.max(0,Math.min(s.x0,s.x1)),x1:Math.min(p.W-1,Math.max(s.x0,s.x1)),y0:Math.max(0,Math.min(s.y0,s.y1)),y1:Math.min(p.H-1,Math.max(s.y0,s.y1)),all:false}; }
function lineCells(x0,y0,x1,y1){ const out=[]; let dx=Math.abs(x1-x0), sx=x0<x1?1:-1, dy=-Math.abs(y1-y0), sy=y0<y1?1:-1, err=dx+dy;
  for(let n=0;n<4000;n++){ out.push([x0,y0]); if(x0===x1&&y0===y1) break; const e2=2*err; if(e2>=dy){ err+=dy; x0+=sx; } if(e2<=dx){ err+=dx; y0+=sy; } } return out; }
function rectCells(x0,y0,x1,y1,fill){ const out=[], a=Math.min(x0,x1), b=Math.max(x0,x1), c=Math.min(y0,y1), d=Math.max(y0,y1);
  for(let y=c;y<=d;y++) for(let x=a;x<=b;x++) if(fill||x===a||x===b||y===c||y===d) out.push([x,y]); return out; }
function flood(p,x,y,v){ const a=p.cells.split(''), W=p.W, H=p.H, from=a[y*W+x], to=C(v); if(from===to) return null;
  const st=[[x,y]]; while(st.length){ const [cx,cy]=st.pop(); if(cx<0||cy<0||cx>=W||cy>=H||a[cy*W+cx]!==from) continue; a[cy*W+cx]=to; st.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]); }
  return a.join(''); }

/* ---------- operacijos (grąžina true, jei pakeista) ---------- */
const OPS={
  copy(p){ const r=selRect(p), d=[]; for(let y=r.y0;y<=r.y1;y++){ const row=[]; for(let x=r.x0;x<=r.x1;x++) row.push(patGet(p,x,y)); d.push(row); }
    ED.clip={w:r.x1-r.x0+1,h:r.y1-r.y0+1,d}; ED.msg=`Nukopijuota ${ED.clip.w} × ${ED.clip.h}. Pasirinkite „Įklijuoti“ ir bakstelėkite vietą.`; return false; },
  cut(p){ OPS.copy(p); OPS.del(p); ED.msg=`Iškirpta ${ED.clip.w} × ${ED.clip.h}.`; return true; },
  del(p){ const r=selRect(p), a=p.cells.split(''); for(let y=r.y0;y<=r.y1;y++) for(let x=r.x0;x<=r.x1;x++) a[y*p.W+x]='0'; p.cells=a.join(''); return true; },
  stamp(p,gx,gy){ const c=ED.stamp; if(!c||!c.w) return false; const a=p.cells.split(''), n=nVals(p); let cut=0;
    for(let j=0;j<c.h;j++) for(let i=0;i<c.w;i++){ const v=c.d[j][i]; if(v<0) continue; const x=gx+i, y=gy-(c.h-1)+j; if(x<0||y<0||x>=p.W||y>=p.H){ cut++; continue; } a[y*p.W+x]=C(v<n?v:0); }
    p.cells=a.join(''); if(cut) ED.msg=`Dalis (${cut} langel.) netilpo į schemą – nukirpta.`; return true; },
  paste(p,gx,gy){ const c=ED.clip; if(!c) return false; const a=p.cells.split(''), n=nVals(p);
    for(let j=0;j<c.h;j++) for(let i=0;i<c.w;i++){ const v=c.d[j][i]; setCell(a,p,gx+i,gy-(c.h-1)+j,C(v<n?v:0)); } p.cells=a.join(''); return true; },
  mirH(p){ const r=selRect(p), a=p.cells.split(''); for(let y=r.y0;y<=r.y1;y++) for(let x=r.x0;x<=r.x1;x++){ const sx=r.x1-(x-r.x0); a[y*p.W+x]=C(mirV(p,patGet(p,sx,y))); } p.cells=a.join(''); return true; },
  mirV(p){ const r=selRect(p), a=p.cells.split(''); for(let y=r.y0;y<=r.y1;y++) for(let x=r.x0;x<=r.x1;x++){ const sy=r.y1-(y-r.y0); a[y*p.W+x]=p.cells[sy*p.W+x]; } p.cells=a.join(''); return true; },
  rot(p){ const r=selRect(p);
    if(!r.all){ const w=r.x1-r.x0+1, h=r.y1-r.y0+1; if(w!==h){ ED.msg='Pažymėta sritis turi būti kvadratinė (arba nuimkite žymėjimą – bus pasukta visa schema).'; return false; }
      const a=p.cells.split(''); // pagal laikrodžio rodyklę (vizualiai): nauja (i,j) nuo viršaus-kairės = sena (j, n-1-i)
      for(let vj=0;vj<h;vj++) for(let vi=0;vi<w;vi++){ const sy=r.y1-(w-1-vi), sx=r.x0+vj; const ty=r.y1-vj, tx=r.x0+vi; a[ty*p.W+tx]=p.cells[sy*p.W+sx]; }
      p.cells=a.join(''); return true; }
    if(!okSize(p,p.H,p.W)) return false; const g=toVis(p), H=p.H, W=p.W, n=[];
    for(let vy=0;vy<W;vy++){ const row=[]; for(let vx=0;vx<H;vx++) row.push(g[H-1-vx][vy]); n.push(row); } fromVis(p,n); ED.sel=null; return true; },
  swap(p,a,b){ if(a===b) return false; const A=C(a),B=C(b); p.cells=p.cells.split('').map(ch=>ch===A?B:ch===B?A:ch).join(''); return true; },
  repl(p,a,b){ if(a===b) return false; const r=selRect(p), A=C(a), B=C(b), arr=p.cells.split(''); for(let y=r.y0;y<=r.y1;y++) for(let x=r.x0;x<=r.x1;x++) if(arr[y*p.W+x]===A) arr[y*p.W+x]=B; p.cells=arr.join(''); return true; },
  insRow(p,row){ if(!okSize(p,p.W,p.H+1)) return false; const y=Math.max(0,Math.min(p.H,row)); p.cells=p.cells.slice(0,y*p.W)+'0'.repeat(p.W)+p.cells.slice(y*p.W); p.H++; return true; }, // row – įterpiamos eilės indeksas (0 – apačioje)
  delRow(p,y){ if(p.H<=1||y<0||y>=p.H){ ED.msg='Šios eilės pašalinti negalima.'; return false; } if(!okSize(p,p.W,p.H-1)) return false; p.cells=p.cells.slice(0,y*p.W)+p.cells.slice((y+1)*p.W); p.H--; return true; },
  insCol(p,x){ if(!okSize(p,p.W+1,p.H)) return false; x=Math.max(0,Math.min(p.W,x)); const rows=[]; for(let y=0;y<p.H;y++){ const r=p.cells.slice(y*p.W,(y+1)*p.W); rows.push(r.slice(0,x)+'0'+r.slice(x)); } p.W++; p.cells=rows.join(''); return true; },
  delCol(p,x){ if(p.W<=1||x<0||x>=p.W){ ED.msg='Šio stulpelio pašalinti negalima.'; return false; } if(!okSize(p,p.W-1,p.H)) return false; const rows=[]; for(let y=0;y<p.H;y++){ const r=p.cells.slice(y*p.W,(y+1)*p.W); rows.push(r.slice(0,x)+r.slice(x+1)); } p.W--; p.cells=rows.join(''); return true; },
  resize(p,W,H,ax,ay){ if(!okSize(p,W,H)) return false; const g=toVis(p), ox=ax===0?0:ax===1?Math.floor((W-p.W)/2):W-p.W, oy=ay===0?0:ay===1?Math.floor((H-p.H)/2):H-p.H, n=[];
    for(let vy=0;vy<H;vy++){ const row=[]; for(let vx=0;vx<W;vx++){ const sx=vx-ox, sy=vy-oy; row.push(sy>=0&&sy<p.H&&sx>=0&&sx<p.W?g[sy][sx]:'0'); } n.push(row); } fromVis(p,n); ED.sel=null; return true; }
};
function run(name,...args){ const p=patState(), before=snap(p); ED.msg=''; let ch=false; try{ ch=OPS[name](p,...args); }catch(e){ ED.msg='Klaida: '+(e&&e.message||e); }
  if(ch && !same(before,snap(p))){ ED.hist.push(before); if(ED.hist.length>ED_MAX) ED.hist.shift(); ED.fut=[]; p.autoH=false; p.libNote=''; }
  commit(); }
window.patEdOp=run; // testams

window.patEdSize=function(p,base){ const z=ZOOMS.includes(+p.zoom)?+p.zoom:1; if(z===1) return base; const cw=Math.max(3,Math.round(base.cw*z)); return {cw, ch:Math.max(2,base.ch*cw/base.cw)}; };

function txtStamp(p){ if(typeof patTextBitmap!=='function') return null; const b=patTextBitmap(ED.txt.s,{font:ED.txt.font,sp:ED.txt.sp,mirror:ED.txt.mir}); if(!b.w) return {w:0,h:0,d:[],missing:b.missing};

/* ---------- piešimas ir perdanga ---------- */
function geomCell(ev){ const cv=ED.cv, G=ED.opt&&ED.opt.geom, p=patState(); if(!cv||!G) return null; const r=cv.getBoundingClientRect(), sx=cv.width/r.width, sy=cv.height/r.height;

  method:[['plokscia','Plokščiai (detalės susiuvamos)'],['apvaliai','Apvaliai (kur įmanoma)']],
  rib:[['1x1','1×1 (1 veid., 1 išv.)'],['2x2','2×2 (2 veid., 2 išv.)'],['keliar','Keliaraištis']],
  shoulder:[['wt','Trumposios eilės su apvyniojimu (w&t)'],['vokiskos','Vokiškos trumposios eilės'],['laiptai','Laiptuotas uždarymas']],
  thumb:[['pleistas','Nykščio pleištas'],['veliau','Įmegztas vėliau (pagalbinis siūlas)']],
  sock:[['virsus','Nuo viršaus apvaliai – kulnas su sienele ir pleištais'],['pirstai','Nuo pirštų apvaliai – kulnas trumposiomis eilėmis'],['plokscia','Plokščiai su siūle']]
};
const HK_M='_RANKA';
try{ if(!MACHINES[HK_M]) Object.defineProperty(MACHINES,HK_M,{value:{id:HK_M,name:'Rankomis',full:'Rankinis mezgimas',needles:1e6,pitch:0,kind:'',ribber:false,card:0},enumerable:false,configurable:true}); }catch(e){}

function hkState(){
  let h=S.hand; if(!h||typeof h!=='object') h=S.hand={};
  Object.keys(HK_DEF).forEach(k=>{ if(h[k]==null||h[k]==='') h[k]=HK_DEF[k]; });
  ['sts','rows','ribRows'].forEach(k=>{ const v=+h[k]; h[k]=(v>0&&isFinite(v))?Math.min(v,80):HK_DEF[k]; });
  Object.keys(HK_OPT).forEach(k=>{ if(!HK_OPT[k].some(o=>o[0]===h[k])) h[k]=HK_DEF[k]; });
  return h;
}
try{ hkState(); }catch(e){}
function hkG(){ const h=hkState(); return {sts:h.sts, rows:h.rows, ribRows:h.ribRows, spc:h.sts/10, rpc:h.rows/10, rrpc:h.ribRows/10}; }
// Apskaičiuoja detalę su rankinio mezgimo mėginiu. Karietėlės pusė fiksuojama 'D', kad eilių lyginumas sutaptų su rankinio mezgimo puse.
function hkCompute(gk,pid){
  const H=hkState(), gauge={name:'', sts:H.sts, rows:H.rows, ribRows:H.ribRows, ribType:'ne'};
  const car=S.carriage; S.carriage='D';
  try{ return computePiece(gk,pid,{gauge, machine:HK_M}); } finally{ S.carriage=car; }
}

/* ---------- tekstas ---------- */
function hkForm(n,f1,f2,f3){ n=Math.abs(n)%100; const d=n%10; if(n>10&&n<20) return f3; if(d===1) return f1; if(d>=2) return f2; return f3; }
const hkKart=n=>`${n} ${hkForm(n,'kartą','kartus','kartų')}`;
const hkRat=n=>`${n} ${hkForm(n,'ratą','ratus','ratų')}`;
const hkEil=n=>`${n} ${hkForm(n,'eilę','eiles','eilių')}`;
const hkDot=t=> /[.!?]$/.test(t)?t:t+'.';
const hkEdge=e=> e==='R'?'dešiniajame':'kairiajame';
const hkStartE=r=> r%2 ? 'R' : 'L';           // plokščiai: nelyginė (veidinė) eilė prasideda dešiniajame krašte
const hkSide=r=> r%2 ? 'veid.' : 'išv.';
function hkRibName(){ const r=hkState().rib; return r==='2x2'?'2×2 (2 veid., 2 išv.)':r==='keliar'?'keliaraiščiu':'1×1 (1 veid., 1 išv.)'; }
// Juostos akių skaičius: apvaliai 1×1 – lyginis, 2×2 – kartotinis 4; plokščiai 2×2 – 4k+2 (simetriškai).
function hkRibFix(n, round){
  const r=hkState().rib; let k=n;
  if(r==='1x1' && round) k=2*Math.max(2,Math.round(n/2));
  if(r==='2x2') k= round ? 4*Math.max(1,Math.round(n/4)) : 4*Math.max(1,Math.round((n-2)/4))+2;
  return {n:k, d:n-k};
}
function hkAdjText(d){ return d>0 ? `Po juostos pirmoje eilėje tolygiai pridėkite ${d} ak.` : d<0 ? `Po juostos pirmoje eilėje tolygiai sumažinkite ${-d} ak.` : ''; }
// Pradžia: užmetimas + juosta
function hkStart(n, ribCm, round, o){
  o=o||{}; const g=hkG(), H=hkState(), items=[];
  const unit = round?'ratų':'eil.';
  let ribR = ribCm>0 ? Math.max(1,srnd(ribCm*g.rrpc)) : 0;
  if(ribR && !round && ribR%2) ribR++;
  const rf = ribR ? hkRibFix(n, round) : {n, d:0};
  const where = round ? `ant apskrito virbalo${o.small?' arba kojinių virbalų':''} ir sujunkite į ratą nepersukdami` : 'ant virbalų';
  items.push({text:`Užmeskite ${rf.n} ak. ${where} (pvz., ilguoju kryžminiu būdu).${round&&o.markers?' '+o.markers:''}`, sts:rf.n});
  if(ribR){
    items.push({text:`Juosta ${hkRibName()}: ${fmt(ribR/g.rrpc)} cm = ${ribR} ${unit}${H.ribNeedle?`, virbalai ${H.ribNeedle}`:''}.${!round?' Lyginis eilių skaičius – pagrindas prasidės veidine eile.':''}`, sts:rf.n});
    const adj=hkAdjText(rf.d); if(adj) items.push({text:adj, sts:n});
  }
  items.push({text:`Pereikite prie ${H.needle||'pagrindinių'} virbalų. Toliau – lygiu mezginiu${round?' (visi ratai – veidinės akys)':' (veidinėje pusėje – veidinės, išvirkščioje – išvirkščios akys)'}${round?'':'; 1-oji eilė – veidinė pusė'}.`});
  return {items, ribR, ribCmReal: ribR? ribR/g.rrpc : 0};
}

/* ---------- eilių duomenys → įvykiai ---------- */
function hkYofRow(row, rpc){ const k=row.yr-1; return (k-(k%2)+1)/rpc; }
function hkRaw(part, o){
  const out=[]; let prev={L:part.sL, R:part.sR}, blk=null;
  const flush=()=>{ if(!blk) return; if(blk.steps.length) out.push({type:'sr', r:blk.from, to:blk.to, steps:blk.steps}); prev=blk.pre; blk=null; };
  part.rows.forEach(row=>{
    const r=row.rc;
    if(row.yr==null){
      if(!blk) blk={from:r, to:r, pre:{L:prev.L, R:prev.R}, steps:[], hL:0, hR:0};
      blk.to=r;
      const hR=blk.pre.R-row.R, hL=row.L-blk.pre.L;
      if(hR>blk.hR){ blk.steps.push({r, edge:'R', n:hR-blk.hR, cum:hR}); blk.hR=hR; }
      if(hL>blk.hL){ blk.steps.push({r, edge:'L', n:hL-blk.hL, cum:hL}); blk.hL=hL; }
      return;
    }
    flush();
    const dR=prev.R-row.R, dL=row.L-prev.L;
    const sh = o.ss!=null && hkYofRow(row,o.rpc)>o.ss+1e-9;
    if(dR) out.push({r, edge:'R', d:dR, sh: sh && o.shEdges.includes('R')});
    if(dL) out.push({r, edge:'L', d:dL, sh: sh && o.shEdges.includes('L')});
    prev={L:row.L, R:row.R};
  });
  flush();
  const last=part.rows.length?part.rows[part.rows.length-1].rc:0;
  return {ev:out, lastW:Math.max(0,prev.R-prev.L), lastRow:last};
}
function hkConvert(raw, round){
  const ev=[];
  raw.forEach(e=>{
    if(e.type==='sr'){ ev.push(e); return; }
    if(e.sh && e.d>0){ ev.push({type:'sh', r:e.r, edge:e.edge, n:e.d}); return; }
    const a=Math.abs(e.d);
    if(a===1) ev.push({type:e.d>0?'dec':'inc', r:e.r, edge:e.edge, n:1});
    else ev.push({type:e.d>0?'bo':'co', r:(round||hkStartE(e.r)===e.edge)?e.r:e.r+1, edge:e.edge, n:a});
  });
  ev.sort((a,b)=>a.r-b.r);
  const used=new Set(), out=[];
  ev.forEach((e,i)=>{
    if(used.has(i)) return; used.add(i);
    if(e.type==='dec'||e.type==='inc'){
      const j=ev.findIndex((f,k)=>!used.has(k) && f.type===e.type && f.edge!==e.edge && Math.abs(f.r-e.r)<=1);
      if(j>=0){ used.add(j); const f=ev[j]; const r=round?Math.min(e.r,f.r):(e.r%2?e.r:(f.r%2?f.r:e.r)); out.push({type:e.type+'2', r, n:1, rEnd:Math.max(e.r,f.r)}); return; }
    }
    if(e.type==='bo'||e.type==='co'){
      const j=ev.findIndex((f,k)=>!used.has(k) && f.type===e.type && f.edge!==e.edge && f.n===e.n && f.r===e.r+1);
      if(j>=0){ used.add(j); out.push({type:e.type+'2', r:e.r, n:e.n, rEnd:e.r+1}); return; }
    }
    out.push(e);
  });
  return out.sort((a,b)=>a.r-b.r);
}
// Pasikartojantys veiksmai (tas pats tipas, kraštas, akių skaičius, pastovus žingsnis) – sutraukiami.
function hkGroup(arr){
  const key=e=>e.type+'|'+(e.edge||'')+'|'+e.n, out=[]; let i=0;
  while(i<arr.length){ let j=i+1, step=null;
    while(j<arr.length && key(arr[j])===key(arr[i])){ const d=arr[j].r-arr[j-1].r; if(step===null) step=d; else if(d!==step) break; j++; }
    const cnt=j-i;
    if(cnt>=3){ out.push({...arr[i], grp:{count:cnt, step, last:arr[j-1].r, lastEnd:arr[j-1].rEnd||arr[j-1].r}}); i=j; }
    else { out.push(arr[i]); i++; }
  }
  return out;
}
function hkActText(e, round, ctx){
  const pos = round ? '' : (e.edge===hkStartE(e.r) ? 'eilės pradžioje' : 'eilės pabaigoje');
  const mk = ctx && ctx.markers===2 ? 'abipus abiejų šoninių žymeklių' : 'abipus žymeklio';
  const per = ctx && ctx.markers===2 ? 4 : 2;
  switch(e.type){
    case 'dec2': return round ? `${mk} sumažinkite po 1 ak. (−${per} ak. per ratą)` : 'abiejuose kraštuose sumažinkite po 1 ak.';
    case 'inc2': return round ? `${mk} pridėkite po 1 ak. (+${per} ak. per ratą)` : 'abiejuose kraštuose pridėkite po 1 ak.';
    case 'dec': return round ? `ties žymekliu sumažinkite 1 ak.` : `${pos} (${hkEdge(e.edge)} krašte) sumažinkite 1 ak.`;
    case 'inc': return round ? `ties žymekliu pridėkite 1 ak.` : `${pos} (${hkEdge(e.edge)} krašte) pridėkite 1 ak.`;
    case 'bo': return round ? `uždarykite ${e.n} ak.` : `eilės pradžioje (${hkEdge(e.edge)} krašte) uždarykite ${e.n} ak.`;
    case 'bo2': return `šios eilės pradžioje uždarykite ${e.n} ak., kitos eilės pradžioje – ${e.n} ak.`;
    case 'co': return `eilės pradžioje (${hkEdge(e.edge)} krašte) užmeskite ${e.n} ak.`;
    case 'co2': return `šios eilės pradžioje užmeskite ${e.n} ak., kitos eilės pradžioje – ${e.n} ak.`;
  }
  return '';
}
const HK_TECHTYPE={dec2:'dec',dec:'dec',inc2:'inc',inc:'inc',bo:'bo',bo2:'bo',co:'co',co2:'co'};
function hkWidthMap(part){ const m=new Map(); part.rows.forEach(r=>m.set(r.rc, Math.max(0,r.R-r.L))); return r=>{ if(m.has(r)) return m.get(r); let best=null; m.forEach((v,k)=>{ if(k<=r) best=v; }); return best==null?Math.max(0,part.sR-part.sL):best; }; }
function hkSub(r, o){ const g=hkG(); const rr=r-(o.off||0); const cm=(o.ribCm||0)+rr/g.rpc; return `${o.round?'ratas':hkSide(rr)} · ${fmt(cm)} cm`; }
function hkItemsFromEvents(evs, part, o, tech){
  const W=hkWidthMap(part), items=[]; let maxLast=-1;
  hkGroup(evs).forEach(e=>{
    const off=o.off||0, round=o.round;
    const act=hkActText(e, round, o);
    if(tech) tech.add(HK_TECHTYPE[e.type]);
    const pre = '';
    if(e.grp){
      const unit=round?'ratų':'eil.';
      const end = e.grp.lastEnd;
      items.push({r:e.r, a:e.r-off, b:e.grp.last-off, sub:`kas ${e.grp.step} ${round?'r.':'eil.'}`,
        text:`${pre}${cap1(`nuo ${e.r-off} ${round?'rato':'eil.'} kas ${e.grp.step} ${unit} ${act} – iš viso ${hkKart(e.grp.count)}`)}.`, sts:W(end), re:end});
      maxLast=Math.max(maxLast,e.grp.last);
    } else {
      const end = e.rEnd||e.r;
      items.push({r:e.r, a:e.r-off, b:(e.type==='bo2'||e.type==='co2')?end-off:null, sub:hkSub(e.r,o), text:hkDot(`${pre}${cap1(act)}`), sts:W(end), re:end});
    }
  });
  return items;
}
function hkSrItem(e, o, tech, label){
  const H=hkState(), wt=H.shoulder!=='vokiskos', off=o.off||0;
  tech.add(wt?'wt':'gsr');
  const st=e.steps.map(s=>`${s.r-off} eil. – ${hkEdge(s.edge)} krašte palikite ${s.cum} ak.`).join('; ');
  return {r:e.r, re:e.to, sr:true, a:e.r-off, b:e.to-off, sub:'trumposios eil.',
    text:`${label||'Trumposios eilės'}: ${hkDot(st)} „Palikite“ – eilės gale tiek akių nemegzkite, ${wt?'apvyniokite kitą akį ir apsukite darbą (w&t)':'apsukite darbą ir padarykite vokišką trumpąją eilę (dviguba akis)'}. Po ${e.to-off} eil. numegzkite eilę per visas akis, ${wt?'apvyniojimus sumegzdami kartu su akimis':'dvigubas akis megzdami kaip vieną'}.`};
}
function hkShoulderItems(steps, edge, o, lastRow, lastW, tot, tech){
  const H=hkState(), off=o.off||0, items=[];
  // žingsnis kaklo padalijimo eilėje prieštarautų tos eilės nurodymui – sujungiamas su kitu žingsniu
  if(o.splitRow!=null && steps.length){ const nr=s=> H.shoulder==='laiptai' ? (hkStartE(s.r)===edge?s.r:s.r+1) : (hkStartE(s.r)===edge?s.r-1:s.r);
    if(nr(steps[0])<=o.splitRow){ steps=steps.slice(); if(steps.length>1){ steps[1]={...steps[1], n:steps[1].n+steps[0].n}; steps.shift(); } else steps[0]={...steps[0], r:steps[0].r+2}; } }
  const sum=steps.reduce((a,s)=>a+s.n,0);
  const extra = tot!=null ? Math.max(0, sum+lastW-tot) : 0;
  const shTot = tot!=null ? tot : sum+lastW;
  if(H.shoulder==='laiptai'){
    tech.add('bo');
    const rr=steps.map(s=>({r:hkStartE(s.r)===edge?s.r:s.r+1, n:s.n}));
    items.push({r:rr[0].r, re:rr[rr.length-1].r, sh:true, a:rr[0].r-off, b:rr[rr.length-1].r-off, sub:'petys',
      text:`Peties nuolydis laipteliais (${hkEdge(edge)} krašte): ${hkDot(rr.map(x=>`${x.r-off} eil. – ${x.n} ak.`).join('; '))} Kiekvieną kartą eilės pradžioje peties pusėje uždarykite nurodytą akių skaičių.${lastW-extra<=0&&tot!=null?` Peties akių iš viso ${shTot}; pečius vėliau susiūkite.`:''}`, sts:null});
    let c=Math.max(lastRow, rr[rr.length-1].r+2); while(hkStartE(c)!==edge) c++;
    if(extra>0) items.push({r:c-1, sh:true, a:c-1-off, sub:hkSub(c-1,o), text:`Eilės pradžioje (kaklo krašte) uždarykite dar ${extra} ak.`, sts:null});
    if(lastW-extra>0 || tot==null) items.push({r:c, sh:true, close:true, a:c-off, sub:hkSub(c,o), text: tot!=null ? `Eilės pradžioje uždarykite likusias ${lastW-extra} ak. (peties akių iš viso ${shTot}). Pečius vėliau susiūkite.` : `Eilės pradžioje uždarykite likusias akis. Pečius vėliau susiūkite.`, sts:tot!=null?0:null});
  } else {
    const wt=H.shoulder==='wt'; tech.add(wt?'wt':'gsr'); tech.add('3n');
    let cum=0; const list=steps.map(s=>{ cum+=s.n; return {r:hkStartE(s.r)===edge?s.r-1:s.r, cum}; });
    if(list.length>1 && lastW<=0) list.pop();   // paskutinis žingsnis paliktų visas akis – jo nereikia
    items.push({r:list[0].r, re:list[list.length-1].r, sh:true, a:list[0].r-off, b:list[list.length-1].r-off, sub:'petys',
      text:`Peties nuolydis trumposiomis eilėmis (${wt?'w&t':'vokiškos'}), ${hkEdge(edge)} krašte: ${hkDot(list.map(x=>`${x.r-off} eil. – nemegzkite paskutinių ${x.cum} ak.`).join('; '))} Kiekvieną kartą ${wt?'apvyniokite kitą akį ir apsukite darbą':'apsukite darbą ir padarykite dvigubą akį'}, grįžkite iki kaklo krašto.`, sts:null});
    let c=Math.max(lastRow, list[list.length-1].r+2); while(hkStartE(c)===edge) c++;
    items.push({r:c, sh:true, close:true, a:c-off, sub:hkSub(c,o), text:`${extra>0?`Eilės pradžioje (kaklo krašte) uždarykite dar ${extra} ak., tada n`:'N'}umegzkite eilę iki peties krašto per visas ${tot!=null?shTot+' ':''}ak., ${wt?'apvyniojimus sumegzdami kartu su akimis':'dvigubas akis megzdami kaip vieną'}. Akis palikite ant pagalbinio siūlo – pečius sujunkite trimis virbalais (arba uždarykite ir susiūkite).`, sts:tot!=null?shTot:null});
  }
  return items;
}
function hkConcurrent(items){
  let end=-1;
  items.forEach(it=>{ if(it.a==null) return; if(it.r<=end && !/^Tuo pačiu metu/.test(it.text) && !(it.sh && !it.re)) it.text='Tuo pačiu metu: '+it.text.charAt(0).toLowerCase()+it.text.slice(1); if(it.re!=null && it.re>it.r) end=Math.max(end,it.re); });
}
function hkFinishItem(R, w, r, o, tech){
  const g=hkG(), geom=R.geom, off=o.off||0, round=o.round;
  const base={r, a:r-off, sub:o.round?'ratas':hkSide(r-off)};
  if(geom.finish==='neck') return {...base, text:`Likusias ${w} ak. nuimkite ant pagalbinio siūlo apykaklei (arba uždarykite).`, sts:w};
  if(geom.waistband){ const wr=srnd(geom.waistband*g.rrpc); return {...base, text:`Juosmens juosta: ${round?'ratais':''} numegzkite ${wr} ${round?'ratų':'eil.'} (${fmt(geom.waistband)} cm), sulenkite į vidų ir prisiūkite, palikdami angą gumai. Arba tiesiog laisvai uždarykite.`, sts:w}; }
  if(R.pc.kind==='thumb') return {...base, text:`Likusių ${w} ak. neuždarykite: nukirpkite siūlą (~30 cm), perverkite per akis ir sutraukite. Susiūkite šoną.`, sts:w};
  if(geom.finish==='shoulder') return {...base, text:`${w} ak. uždarykite arba nuimkite ant pagalbinio siūlo (pečiai jungiami trimis virbalais).`, sts:w};
  tech.add('bo');
  return {...base, text:`Likusias ${w} ak. laisvai uždarykite.`, sts:0};
}
// Viena dalis (part) plokščiai: įvykiai nuo eilės o.from (išskirtinai)
function hkPartSection(R, idx, o, tech){
  const sim=R.sim, geom=R.geom, part=sim.parts[idx];
  const neckEdge = idx===1?'L':idx===2?'R':null;
  const shEdges=(geom.shoulderSides||['L','R']).filter(e=>e!==neckEdge);
  const rpc=hkG().rpc;
  const raw=hkRaw(part,{rpc, ss:geom.ss, shEdges});
  const ev=raw.ev.filter(e=>e.r>(o.from||0) && !(o.skip&&o.skip(e)));
  const conv=hkConvert(ev, o.round);
  const sh=conv.filter(e=>e.type==='sh'), sr=conv.filter(e=>e.type==='sr'), oth=conv.filter(e=>e.type!=='sh'&&e.type!=='sr');
  const done = sim.rc0!=null && idx===0;  // pagrindinė dalis baigiasi ties iškirpte
  const early={L:0,R:0};
  if(done){ sh.forEach(e=>{ early[e.edge]+=e.n; oth.push({type:e.n>1?'bo':'dec', r:hkStartE(e.r)===e.edge?e.r:e.r+1, edge:e.edge, n:e.n}); }); oth.sort((a,b)=>a.r-b.r); sh.length=0; }
  let items=hkItemsFromEvents(oth, part, o, tech);
  sr.forEach(e=>items.push(hkSrItem(e,o,tech, geom.dart?'Krūtinės įsiuvė trumposiomis eilėmis':(geom.wedge?'Nugaros pakėlimas trumposiomis eilėmis':null))));
  if(!done){
    let tot = geom.finish==='shoulder' && sim.shoulders.length ? (sim.shoulders[idx===2?1:0]) : null;
    if(tot!=null && o.early && shEdges.length===1) tot-=o.early[shEdges[0]]||0;
    if(sh.length){
      ['R','L'].forEach(edge=>{ const st=sh.filter(e=>e.edge===edge); if(st.length) items.push(...hkShoulderItems(st, edge, o, raw.lastRow, raw.lastW, shEdges.length===1?tot:null, tech)); });
    } else {
      items.push(hkFinishItem(R, raw.lastW, raw.lastRow+1, o, tech));
    }
  }
  items.sort((a,b)=>a.r-b.r);
  if(sh.length){ const lap=hkState().shoulder==='laiptai';
    items.forEach(it=>{ if(it.sh||it.sts==null) return; const r=it.re||it.r;
      const held=sh.filter(e=>e.r<=r).reduce((x,e)=>x+e.n,0);
      const rem=lap? sh.filter(e=>(hkStartE(e.r)===e.edge?e.r:e.r+1)<=r).reduce((x,e)=>x+e.n,0) : 0;
      it.sts+=held-rem; }); }
  items.filter(it=>it.close).forEach(cl=>{ const same=items.filter(it=>it!==cl && !it.sh && it.a!=null && it.r===cl.r && it.b==null);
    if(!same.length) return; const pre=same.map(it=>hkDot(it.text.replace(/^Tuo pačiu metu: /,''))).join(' ');
    cl.text=cap1(pre)+' Tada '+cl.text.charAt(0).toLowerCase()+cl.text.slice(1);
    same.forEach(it=>items.splice(items.indexOf(it),1)); });
  hkConcurrent(items);
  return {items, raw, early};
}

/* ---------- plokščia detalė ---------- */
function hkFlat(R, gk, o, tech){
  o=o||{}; const g=hkG(), sim=R.sim, geom=R.geom, pc=R.pc, P=S.params[gk];
  const st=hkStart(sim.castOn.n, geom.ribCm||0, false);
  const so={round:false, ribCm:st.ribCmReal, off:0};

  if(gk==='tunika' && (pc.kind==='body'||pc.kind==='front') && P.nugara && P.nugara.slitCm>0)
    secs[0].items.push({text:`Šonų skeltukai: apatinių ${fmt(P.nugara.slitCm)} cm (${srnd(P.nugara.slitCm*g.rpc)} eil.) šonų nesiuvami. Gražesniam kraštui pirmas ir paskutines 2–3 ak. megzkite keliaraiščiu.`});
  if(o.extraStart) secs[0].items.push(...o.extraStart);
  const main=hkPartSection(R, 0, so, tech);
  if(o.extraMain) main.items.push(...o.extraMain), main.items.sort((a,b)=>(a.r||0)-(b.r||0));
  secs.push({title: sim.rc0!=null?'Iki kaklo iškirptės':'Mezgimas', items:main.items});
  if(sim.rc0!=null) secs.push(...hkNeckSplit(R, {...so, early:main.early}, tech));
  return {secs, rows:sim.N, ribR:st.ribR};
}
function hkNeckSplit(R, so, tech){
  const sim=R.sim, rc0=sim.rc0, r1=rc0+1;
  const pR=sim.parts[1], pL=sim.parts[2];
  const rowR=pR.rows.find(x=>x.rc===r1)||{L:pR.sL,R:pR.sR}, rowL=pL.rows.find(x=>x.rc===r1)||{L:pL.sL,R:pL.sR};
  const rpc=hkG().rpc, geom=R.geom;
  const rawR=hkRaw(pR,{rpc, ss:geom.ss, shEdges:['R']}).ev.find(e=>e.r===r1 && e.edge==='R');
  const fold = rawR && !rawR.sh;
  const a=Math.max(0,(fold?rowR.R:pR.sR)-rowR.L), b=Math.max(0,rowL.R-pL.sL), c=Math.max(0,rowR.L-rowL.R);
  const pre=[]; const dArm=fold?pR.sR-rowR.R:0;
  if(dArm>0){ tech.add(dArm>1?'bo':'dec'); pre.push(dArm>1?`eilės pradžioje uždarykite ${dArm} ak.,`:'eilės pradžioje sumažinkite 1 ak.,'); }
  tech.add('bo');
  const off=so.off||0;
  const split=[{r:r1, a:r1-off, sub:hkSub(r1,so), text:`${cap1(pre.join(' '))}${pre.length?' ':''}${pre.length?'numegzkite':'Numegzkite'} ${a} ak., vidurines ${c} ak. uždarykite (arba nuimkite ant pagalbinio siūlo), numegzkite likusias ${b} ak. Toliau kiekvieną pusę mezgame atskirai: pirmiausia kairę (ką tik numegztos ${b} ak.), dešinės pusės ${a} ak. palikite ant virbalo.`, sts:a+b}];
  const left=hkPartSection(R, 2, {...so, splitRow:r1, from:r1-1, skip:e=>e.r===r1 && e.edge==='R'}, tech);
  const right=hkPartSection(R, 1, {...so, splitRow:r1, from:r1-1, skip:e=>e.r===r1 && e.edge==='R' && fold}, tech);
  right.items.unshift({r:r1+1, a:null, text:`Grįžkite prie dešinės pusės ${a} ak.: prijunkite siūlą kaklo krašte išvirkščioje pusėje ir tęskite nuo ${r1+1-off} eil.`});
  return [{title:'Kaklo iškirptė', items:split},{title:'Kairė pusė (žiūrint į veidinę pusę)', items:left.items},{title:'Dešinė pusė', items:right.items}];
}

/* ---------- apvaliai: vamzdis iki pažastų / rankovės viršaus ---------- */
function hkTubeEnd(R, thr){
  const rpc=hkG().rpc, rows=R.sim.parts[0].rows;
  const q=rows.find(r=>r.yr!=null && hkYofRow(r,rpc)>thr+1e-9);
  if(!q) return rows.length?rows[rows.length-1].rc:0;
  let T=q.rc-1; if(T%2) T--; return Math.max(0,T);
}
function hkTube(list, o, tech){
  // list: [{R, name, T}] – pirmoji detalė nusako formavimą (kitos tokios pat)
  const g=hkG(), first=list[0], markers=list.length;
  const N=list.reduce((a,x)=>a+x.R.sim.castOn.n,0);
  const mk = markers===2 ? `Rato pradžioje (kairysis šonas) užkabinkite žymeklį, po ${list[0].R.sim.castOn.n} ak. – antrą žymeklį (dešinysis šonas).` : 'Rato pradžioje (apačioje, siūlės vietoje) užkabinkite žymeklį.';
  const st=hkStart(N, first.R.geom.ribCm||0, true, {markers:mk, small:o.small});
  const so={round:true, ribCm:st.ribCmReal, off:0, markers};
  const part=first.R.sim.parts[0];
  const raw=hkRaw(part,{rpc:g.rpc, ss:null, shEdges:[]});
  const ev=hkConvert(raw.ev.filter(e=>e.r<=first.T && e.type!=='sr'), true);
  // akių skaičius rate = visų detalių suma
  const Ws=list.map(x=>hkWidthMap(x.R.sim.parts[0]));
  const sumW=r=>list.reduce((a,x,i)=>a+Ws[i](r+(x.T-first.T)),0);
  const items=hkItemsFromEvents(ev, part, so, tech).map(it=>({...it, sts:sumW(it.re||it.r)}));
  // įsiuvė (tik priekyje)
  list.forEach(x=>{ if(x===first) return; const rr=hkRaw(x.R.sim.parts[0],{rpc:g.rpc, ss:null, shEdges:[]}); rr.ev.filter(e=>e.type==='sr' && e.r<=x.T).forEach(e=>{ const it=hkSrItem(e,{off:0},tech,`Krūtinės įsiuvė – tik ${x.name.toLowerCase()} akyse (pirmyn ir atgal)`); it.text+=' Ratų skaičius nesikeičia – šios eilės papildomos.'; items.push(it); }); });
  items.sort((a,b)=>a.r-b.r);
  return {start:st.items, items, so, N, ribR:st.ribR};
}

/* ---------- gaminių tvarkyklės ---------- */
function hkBodyRound(gk, tech){
  const G=GARMENTS[gk];
  const bp=G.pieces.find(p=>p.kind==='body'), fp=G.pieces.find(p=>p.kind==='front');
  const Rb=hkCompute(gk,bp.id), Rf=hkCompute(gk,fp.id);
  const Tb=hkTubeEnd(Rb, Rb.geom.Hu), Tf=hkTubeEnd(Rf, Rf.geom.Hu);
  if(Rf.sim.rc0!=null && Rf.sim.rc0<Tf) return null;
  if(Rb.sim.rc0!=null && Rb.sim.rc0<Tb) return null;
  const P=S.params[gk], g=hkG();
  const tb=hkTube([{R:Rb,name:bp.name,T:Tb},{R:Rf,name:fp.name,T:Tf}], {}, tech);
  const secs=[{title:'Pradžia (liemuo ratu)', items:tb.start}];
  if(gk==='tunika' && P.nugara.slitCm>0) secs[0].items.push({text:`Šonų skeltukai (${fmt(P.nugara.slitCm)} cm = ${srnd(P.nugara.slitCm*g.rpc)} eil.): priekį ir nugarą iki šio aukščio megzkite atskirai plokščiai (kraštuose po 2–3 ak. keliaraiščiu), tada sujunkite į ratą.`});
  const wb=hkWidthMap(Rb.sim.parts[0])(Tb), wf=hkWidthMap(Rf.sim.parts[0])(Tf);
  tb.items.push({r:Tb, a:Tb, sub:hkSub(Tb,tb.so), text:`Numegzkite iki ${Tb}-ojo rato. Padalinkite ties žymekliais: nugara ${wb} ak., priekis ${wf} ak. Priekio akis palikite ant pagalbinio siūlo ar virbalo. Toliau mezgame plokščiai, pradedant veidine eile.`, sts:wb+wf});
  secs.push({title:'Liemuo ratu iki pažastų', items:tb.items});
  const so={round:false, ribCm:tb.so.ribCm, off:0};
  // nugara
  const bMain=hkPartSection(Rb,0,{...so, from:Tb},tech);
  secs.push({title:`${bp.name} (nuo ${Tb+1} eil., plokščiai)`, items:bMain.items});
  if(Rb.sim.rc0!=null) secs.push(...hkNeckSplit(Rb,{...so, early:bMain.early},tech).map(s=>({...s, title:bp.name+': '+s.title})));
  const off=Tf-Tb;
  const fo={...so, off};
  const fMain=hkPartSection(Rf,0,{...fo, from:Tf},tech);
  fMain.items.unshift({r:Tf, a:null, text:`Grąžinkite priekio ${wf} ak. ant virbalo, prijunkite siūlą veidinėje pusėje. Eilės numeruojamos taip pat kaip nugaroje.`});
  secs.push({title:`${fp.name} (nuo ${Tb+1} eil., plokščiai)`, items:fMain.items});
  if(Rf.sim.rc0!=null) secs.push(...hkNeckSplit(Rf,{...fo, early:fMain.early},tech).map(s=>({...s, title:fp.name+': '+s.title})));
  return {title:'Liemuo apvaliai (nugara + priekis)', secs, stats:[[tb.N,'užmesti akių (ratas)'],[Tb,'ratų iki pažastų'],[Rb.sim.N,'eilių iš viso (nugara)']], warns:[...Rb.sim.warnings,...Rf.sim.warnings], round:true, chartN:tb.N};
}
function hkSleeveRound(gk, pid, tech){

function hkSkirtRound(gk, tech){

function hkDecPlan(D, R){
  if(D<=0) return {x:0,y:0,step:2,sparse:false};
  if(R>=2*D) return {sparse:true, step:Math.max(2,Math.floor(R/D)), x:D, y:0};
  if(R<=D) return {x:0, y:D, sparse:false};
  return {x:R-D, y:2*D-R, step:2, sparse:false};
}
function hkPlanText(pl, round, verb){

  if(pl.sparse) return `kas ${pl.step}-ą ${u} ${verb} – ${hkKart(pl.x)}`;
  const a=[]; if(pl.x) a.push(`${hkKart(pl.x)} kas 2-ą ${u}`); if(pl.y) a.push(`${hkKart(pl.y)} kiekviename ${uu}`);

}
function hkHat(gk, tech){
  const H=hkState(), round=H.method==='apvaliai', g=hkG(), p=S.params[gk].kepure, R=hkCompute(gk,'kepure');
  const n0=R.sim.castOn.n, wedge=p.crown==='pleistai';

  if(round) st.items[0].text=st.items[0].text.replace('ant apskrito virbalo','ant apskrito virbalo (40 cm)');
  if(p.brimDouble==='taip') st.items.splice(1,0,{text:'Dvigubas kraštas: juosta numezgama dvigubai aukštesnė ir sulenkiama per pusę į vidų.'});

  const secs=[{title:'Pradžia', items:st.items},{title:'Kepurės aukštis', items}];

    rest=k; tech.add('dec');

      {r:body+2, a:body+1, b:body+(pl.sparse?pl.step*pl.x:2*pl.x+pl.y), sub:round?'ratai':'eil.', text:`Mažinimo ${round?'ratas':'eilė'}: *megzkite iki 2 ak. prieš žymeklį, 2 kartu*${round?'':' (išvirkščioje eilėje – 2 kartu išvirkščiai)'} – kiekvieną kartą −${k} ak. ${cap1(hkPlanText(pl, round, 'mažinkite'))}.`, sts:k},

  }
  return {title:'Kepurė '+(round?'apvaliai':'plokščiai'), secs, stats:[[st.items[0].sts,'užmesti akių'],[body,(round?'ratų':'eilių')+' iki viršaus'],[fmt(p.height)+' cm','aukštis']], warns:R.sim.warnings, round, chartN:n};
}
function hkHandBase(P){

function hkThumbStart(B, tech){

    items.push({r:G, a:G, sub:'ratas', text:`${G}-ame rate: ${T} nykščio ak. nuimkite ant pagalbinio siūlo, virš angos užmeskite 1 ak. Akių vėl ${n}.`, sts:n});

}

      {a:1, b:F, sub:'eil.', text:`Megzkite pirmyn ir atgal ${F} eil. kulno raštu: veidinė eilė – *1 nukelkite, 1 veid.*; išvirkščia – 1 nukelkite, likusios išvirkščios. Prielaida: sienelė ≈ kvadratas – eilių tiek pat, kiek sienelės akių (nukeltos akys tankina eiles).`, sts:h}]});

/* ---------- pagrindinis skaičiavimas ---------- */
function hkBuild(gk, pid){
  const H=hkState(), round=H.method==='apvaliai', G=GARMENTS[gk], pc=pieceDef(gk,pid), tech=new Set();
  let res=null, note='';
  const pullover = G.pieces.some(p=>p.kind==='body') && G.pieces.some(p=>p.kind==='front');
  if(pc.kind==='shawl') res=hkShawl(gk,pid,tech);
  else if(pc.kind==='shawledge') res=hkShawlEdge(gk,tech);
  else if(pc.kind==='sock') res=hkSock(gk,tech);
  else if(pc.kind==='hat') res=hkHat(gk,tech);
  else if(round && ['mitten','thumb'].includes(pc.kind)) res=hkMittenRound(gk,tech);
  else if(round && ['glovehand','fingers'].includes(pc.kind)) res=hkGloveRound(gk,tech);
  else if(round && pullover && (pc.kind==='body'||pc.kind==='front')){ res=hkBodyRound(gk,tech); if(!res) note='Iškirptė prasideda žemiau pažastų – liemuo aprašytas plokščiai.'; }
  else if(round && pc.kind==='sleeve') res=hkSleeveRound(gk,pid,tech);
  else if(round && pc.kind==='skirt'){ res=hkSkirtRound(gk,tech); if(!res) note='Priekis ir nugara skiriasi – sijonas aprašytas plokščiai.'; }
  else if(round && pc.kind==='rect') res=hkRectRound(gk,pid,tech);
  if(!res) res=hkSpecial(gk,pc,tech);
  if(!res){
    const R=hkCompute(gk,pid);
    if(R.special){ res={title:pc.name, secs:[{title:pc.name, items:[{a:null, text:'Šiai detalei rankinio mezgimo aprašymo nėra.'}]}], stats:[], warns:[], round:false}; }
    else {
      const extra = (pc.kind==='mitten'||pc.kind==='glovehand') ? hkPalmExtra(gk,R,tech) : [];
      const fl=hkFlat(R, gk, {extraMain:extra}, tech);
      const g=hkG();
      if(pc.kind==='rect'){ const p=S.params[gk][pc.param||pid]||{}; if(p.ribCm>0) fl.secs[fl.secs.length-1].items.splice(-1,0,{a:null, text:`Kitame gale – tokia pati juosta: ${srnd(p.ribCm*g.rrpc)} eil.`});
        if(p.type==='kaklaskare') fl.secs.push({title:'Surinkimas', items:[{a:null, text:'Kaklaskarė: galus susiūkite arba sujunkite akis į akį (pradžią užmeskite pagalbiniu siūlu) – gausis žiedas.'}]});
        if(gk==='poncas') fl.secs.push({title:'Surinkimas', items:[{a:null, text:'Numegzkite 2 vienodus stačiakampius. Surinkimas – detalėje „Apykaklė“.'}]}); }
      if(round && !note) note = ['cfront','body','front'].includes(pc.kind) ? 'Gaminys su atviru priekiu – detalės megzamos plokščiai.' : 'Šią detalę megzkite plokščiai – apvaliai ji neformuojama.';
      res={title:pc.name+(pc.count>1?' ×'+pc.count:''), secs:fl.secs, stats:[[R.sim.castOn.n,'užmesti akių'],[R.sim.N,'eilių (be juostos, su trumposiomis)'],[fmt(R.geom.H+(R.geom.ribCm||0))+' cm','aukštis']], warns:R.sim.warnings, round:false, chartN:R.sim.castOn.n};
    }
  }
  res.note=note; res.tech=tech;
  // eilių suvestinė niekada nemažesnė už didžiausią tekste minimą eilės numerį
  let maxRow=0; res.secs.forEach(sc=>sc.items.forEach(it=>{ [it.a,it.b].forEach(v=>{ if(typeof v==='number'&&isFinite(v)) maxRow=Math.max(maxRow,v); }); }));
  res.stats=res.stats||[]; const si=res.stats.findIndex(([v,l])=>/eilių|ratų/.test(l) && !/iki/.test(l));
  if(si>=0){ const v=res.stats[si][0]; if(typeof v==='number' && v<maxRow) res.stats[si]=[maxRow, res.stats[si][1].replace(' (≈)','')+(/\(≈\)/.test(res.stats[si][1])?' (≈)':'')]; }
  else if(maxRow>0) res.stats.push([maxRow,'paskutinė eilė / ratas']);
  res.maxRow=maxRow;
  return res;
}

function hkChartHtml(res){
  const p=S.pat; if(!p||typeof p!=='object'||typeof p.cells!=='string'||!(p.W>0)||!(p.H>0)) return '';
  const TX=typeof isTX==='function' && isTX(p);
  if(!TX && !/[1-9]/.test(p.cells)) return '';
  const n=res.chartN||0, reps=n&&p.W ? Math.floor(n/p.W) : 0, rem=n&&p.W ? n%p.W : 0;
  const round=!!res.round;
  const notes=[round?'Apvaliai: kiekvieną ratą skaitykite iš dešinės į kairę, schemą – iš apačios į viršų (1-asis ratas apačioje).'
                    :'Plokščiai: veidinės (nelyginės) eilės skaitomos iš dešinės į kairę, išvirkščios (lyginės) – iš kairės į dešinę. Schema – iš apačios į viršų.'];
  if(n) notes.push(`Kartotė ${p.W} ak. × ${p.H} eil. Detalėje ${n} ak. = ${reps} kartotės${rem?` + ${rem} ak. (likutį padalinkite po lygiai abiem kraštams arba pakoreguokite akių skaičių)`:''}.${round&&rem?' Apvaliai patogiausia, kai rato akių skaičius dalijasi iš kartotės pločio.':''}`);
  if(!TX){ try{ const fl=patFloats(p); if(fl.n>5) notes.push(`Ilgiausias tempas – ${fl.n} ak. (${fl.row}-oje eilėje). Ilgesnius nei 5–7 ak. tempus kas 3–5 ak. prisukite (užfiksuokite) už darbo esančiu siūlu.`); }catch(e){}
    notes.push('Spalvotas raštas: abu siūlus laikykite rankose, nesukite; tempus palikite laisvus, kad audinys netrauktų.'); }
  else if(p.tech==='patiesinimas') notes.push('Patiesinimas rankomis: ∪ – akį nukelkite su užmetimu (siūlas priekyje), kitoje eilėje sumegzkite ją kartu su užmetimu.');
  else if(p.tech==='praleidimas') notes.push('Praleista akis: — – akį nukelkite nemegztą, siūlas darbo išvirkščioje pusėje.');
  else if(p.tech==='azuras2') notes.push('Ažūras rankomis: ○ – užmetimas, / – 2 kartu (k2tog), \\ – 2 kartu pasukant į kairę (ssk), ▲ – 3 kartu (centrinis), – – išvirkščia, ▪ – akies nėra (langelį praleiskite). Lyginėse eilėse akis megzkite priešingai, nei rodo langelis.');
  else if(p.tech==='japonai') notes.push('Japoniška schema rodo veidinę pusę; išvirkščiose eilėse akis megzkite priešingai (dešinę – išvirkščiai, išvirkščią – dešine).');
  else if(p.tech==='azuras') notes.push('Ažūras rankomis: ◁ – užmetimas ir šalia 2 kartu pasukant į kairę (ssk); ▷ – užmetimas ir 2 kartu (k2tog). Akių skaičius išlieka.');
  return `<section class="panel" style="margin-top:14px"><h2>Raštas rankiniam mezgimui</h2>
    <div style="overflow-x:auto;max-width:100%"><canvas id="hkChart" style="max-width:100%;height:auto;display:block"></canvas></div>
    <ul class="note" style="margin:8px 0 0;padding-left:18px">${notes.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></section>`;
}

/* ================= MANO SIŪLAI (likučių planuoklis) =================
   S.stash      – turimi siūlai [{id,name,color,haveG,haveM,m100,strands,gauge:{sts,rows,ribRows,swG,swW,swH}|null,photo}]

   S.stashPlan[gk].ombre – {'*'|pid:{yarns:[id…], method:'fade'|'marl'|'helix', zoneCm, unit, stages:'cm cm …'}}
   S.stashOpt   – {hand, reserve, scope, oscope}
   Kiekviena detalė skaičiuojama SU JOS SIŪLŲ MĖGINIU (computePiece opts.gauge) – centimetrai nesikeičia, keičiasi akys ir eilės. */
const STASH_TAB=['stash','Mano siūlai'];
const ST_MAIN='_main', ST_NONE='_none', ST_RIBKINDS=['collar','bands','armband','pcollar'];
const ST_PAL_KEY='srp-spalvos';
const ST_OM={fade:'Perėjimas dryželiais (fade)', marl:'Dvi gijos kartu (marled)', helix:'Pakaitomis po 1 eil. (spiralė)'};
let stUI={edit:null, draft:null, delArm:null, palArm:false, sel:{}, msg:''};

/* ---------- būsena ---------- */
const stNum=(v,min)=>{ const x=parseFloat(String(v==null?'':v).replace(',','.')); return isFinite(x)&&x>=(min||0)?x:0; };
const stHexOk=h=>/^#[0-9a-f]{6}$/i.test(String(h||''));
function stNormYarn(y){
  y.id=String(y.id||('y'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)));
  y.name=String(y.name||'Siūlai'); if(!stHexOk(y.color)) y.color='#b8a07a';
  ['haveG','haveM','m100'].forEach(k=>y[k]=stNum(y[k]));
  y.strands=Math.max(1,Math.min(6,Math.round(stNum(y.strands))||1));
  if(y.gauge&&typeof y.gauge==='object'){ const g=y.gauge; ['sts','rows','ribRows','swG','swW','swH'].forEach(k=>g[k]=stNum(g[k])); if(!(g.sts>0&&g.rows>0)) y.gauge=null; } else y.gauge=null;
  if(typeof y.photo!=='string'||!y.photo.startsWith('data:image/')) y.photo='';
  y.fiber=(typeof FIBERS!=='undefined'&&FIBERS.some(f=>f[0]===y.fiber))?y.fiber:''; y.spin=(typeof SPINS!=='undefined'&&SPINS.some(f=>f[0]===y.spin))?y.spin:'';
  y.micron=stNum(y.micron); if(!(y.micron>=5&&y.micron<=80)) y.micron=0;
  return y;
}
function stState(){
  if(!Array.isArray(S.stash)) S.stash=[];
  S.stash=S.stash.filter(y=>y&&typeof y==='object').map(stNormYarn);
  if(!S.stashPlan||typeof S.stashPlan!=='object') S.stashPlan={};
  if(!S.stashOpt||typeof S.stashOpt!=='object') S.stashOpt={};
  const o=S.stashOpt; o.hand=!!o.hand && typeof hkState==='function';
  if(!(o.reserve>=0)) o.reserve=null; if(typeof o.scope!=='string') o.scope='*'; if(typeof o.oscope!=='string') o.oscope='*';
  return o;
}
function stPlan(gk){
  let p=S.stashPlan[gk]; if(!p||typeof p!=='object') p=S.stashPlan[gk]={};
  if(typeof p.main!=='string') p.main=ST_MAIN; if(typeof p.rib!=='string') p.rib='';
  if(!p.pieces||typeof p.pieces!=='object') p.pieces={};
  if(!p.stripes||typeof p.stripes!=='object') p.stripes={};
  Object.keys(p.stripes).forEach(k=>{ if(!Array.isArray(p.stripes[k])) delete p.stripes[k]; else p.stripes[k]=p.stripes[k].filter(e=>e&&typeof e==='object').map(e=>({y:String(e.y||''), rows:Math.max(0,Math.round(stNum(e.rows)))})); });
  if(!p.ombre||typeof p.ombre!=='object') p.ombre={};
  Object.keys(p.ombre).forEach(k=>{ const o=p.ombre[k]; if(!o||typeof o!=='object'||!Array.isArray(o.yarns)){ delete p.ombre[k]; return; }
    o.yarns=o.yarns.map(String).slice(0,6); if(!ST_OM[o.method]) o.method='fade';
    o.zoneCm=o.zoneCm==null||o.zoneCm===''?8:stNum(o.zoneCm); o.unit=Math.max(1,Math.round(stNum(o.unit))||2); o.stages=String(o.stages||''); });
  if(!p.cw||typeof p.cw!=='object') p.cw={on:false};
  const c=p.cw; c.on=!!c.on; if(!Array.isArray(c.pieces)) c.pieces=[]; if(!c.map||typeof c.map!=='object') c.map={};
  ['swG','swW','swH'].forEach(k=>c[k]=stNum(c[k]));
  return p;
}

    const where=sc==='*'?'visame gaminyje':`detalėje „${esc((GARMENTS[gk].pieces.find(p=>p.id===sc)||{name:sc}).name)}“`; let best=null, bl=null;
    for(let z=1;z<=40;z++){ if(z===o.zoneCm) continue; const p2=clone(plan); p2.ombre[sc].zoneCm=z; const r2=stEval(gk,ctx,p2); if(ok(r2,ids)&&(best==null||Math.abs(z-o.zoneCm)<Math.abs(best-o.zoneCm))){ best=z; bl=stLeft(r2,yid); } }
    if(best!=null) out.push(`Ombrė ${where}: ${nm(Y)} užteks, jei perėjimo zona bus ${best} cm (dabar ${fmt(o.zoneCm)} cm) – liks ${q(bl)}.`);
    const p3=clone(plan); p3.ombre[sc].yarns=o.yarns.slice().reverse(); const r3=stEval(gk,ctx,p3);
    if(ok(r3,ids)) out.push(`Ombrė ${where}: apverskite eiliškumą (${p3.ombre[sc].yarns.map(id=>nm(ctx.byId[id]||{name:id})).join(' → ')}) – ${nm(Y)} liks ${q(stLeft(r3,yid))}.`); });
  const mm=n.bal.u==='g'&&Y.m100>0?` (${fmt(D*Y.m100/100,0)} m)`:'';
  out.push(`Arba dokupkite ${nm(Y)}: ≈ ${q(D)}${mm}.`);
  return out;
}

/* ---------- spalvų programa ---------- */
function stPalette(){ try{ const o=JSON.parse(localStorage.getItem(ST_PAL_KEY)||'{}'); return Array.isArray(o.palette)?o.palette.filter(c=>c&&stHexOk(c.hex)):[]; }catch(e){ return []; } }
function stRgb(h){ const n=parseInt(String(h).slice(1),16)||0; return [n>>16&255,n>>8&255,n&255]; }
function stLab(r,g,b){ const s=c=>{c/=255; return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);}; const R=s(r),G=s(g),B=s(b);
  let x=(0.4124564*R+0.3575761*G+0.1804375*B)/0.95047, y=(0.2126729*R+0.7151522*G+0.0721750*B), z=(0.0193339*R+0.1191920*G+0.9503041*B)/1.08883;
  const f=t=>t>216/24389?Math.cbrt(t):(24389/27*t+16)/116; x=f(x);y=f(y);z=f(z); return [116*y-16,500*(x-y),200*(y-z)]; }
function stHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function stSpalvosUrl(){ return (typeof standalone==='undefined'||standalone)?'spalvos/':'https://imgroupeu-lgtm.github.io/silver-reed-pagalbininkas/spalvos/'; }
function stExportPalette(list){
  let o={}; try{ o=JSON.parse(localStorage.getItem(ST_PAL_KEY)||'{}'); if(!o||typeof o!=='object'||Array.isArray(o)) o={}; }catch(e){ o={}; }
  o.palette=list.map(y=>{ const rgb=stRgb(y.color); return {hex:y.color.toLowerCase(), rgb, lab:stLab(...rgb), name:y.name}; });
  o.base=0; o.tab='siulai';
  try{ localStorage.setItem(ST_PAL_KEY, JSON.stringify(o)); return true; }catch(e){ return false; }
}
function stImportPalette(){ const pal=stPalette(); let n=0;
  pal.forEach((c,i)=>{ const hex=c.hex.toLowerCase(), name=String(c.name||'').trim()||('Spalva '+hex);
    if(S.stash.some(y=>y.color.toLowerCase()===hex&&y.name===name)) return;
    S.stash.push(stNormYarn({name, color:hex, gauge:null})); n++; });
  return {n, total:pal.length}; }

function stThumb(file, cb){
  const rd=new FileReader(); rd.onerror=()=>cb(null);
  rd.onload=()=>{ const im=new Image(); im.onerror=()=>cb(null);
    im.onload=()=>{ const sc=Math.min(1,240/Math.max(im.width,im.height)), w=Math.max(1,Math.round(im.width*sc)), h=Math.max(1,Math.round(im.height*sc));
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const cx=cv.getContext('2d'); cx.drawImage(im,0,0,w,h);
      let url=''; try{ url=cv.toDataURL('image/jpeg',0.7); }catch(e){}
      cb(url?{url, avg:stAvg(cx,w/2,h/2,Math.max(3,Math.round(Math.min(w,h)*0.15)),w,h)}:null); };
    im.src=rd.result; };
  rd.readAsDataURL(file); }
function stAvg(cx,x,y,r,w,h){ const x0=Math.max(0,Math.round(x-r)), y0=Math.max(0,Math.round(y-r)), x1=Math.min(w,Math.round(x+r)+1), y1=Math.min(h,Math.round(y+r)+1);
  const d=cx.getImageData(x0,y0,Math.max(1,x1-x0),Math.max(1,y1-y0)).data; let R=0,G=0,B=0,n=0;
  for(let i=0;i<d.length;i+=4){ R+=d[i];G+=d[i+1];B+=d[i+2];n++; } return n?stHex(R/n,G/n,B/n):null; }
function stSample(img, ev){
  const r=img.getBoundingClientRect(), w=img.naturalWidth, h=img.naturalHeight; if(!w||!h||!r.width) return null;
  const x=(ev.clientX-r.left)/r.width*w, y=(ev.clientY-r.top)/r.height*h;
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const cx=cv.getContext('2d'); cx.drawImage(img,0,0);
  try{ return stAvg(cx,x,y,3,w,h); }catch(e){ return null; } }

     :`${omNum('zoneCm','Perėjimo zona','cm',om.zoneCm,'Kiekvienam perėjimui')}${om.method==='fade'?omNum('unit','Dryželio aukštis','eil.',om.unit,'Mašinoje – lyginis'):''}`}

   ${omPieces.map(p=>{ const L=p.omb.ys.map((y,i)=>ST_LET[i]); return `<details class="out" ${omPieces.length===1?'open':''}><summary><b>${esc(p.pc.name)}</b> – ${p.omb.N} eil. (${fmt(p.g.rows)} eil./10 cm)</summary>

   ${plan.cw.on?`<h3>Detalės su raštu</h3><div class="st-chk">${res.pieces.filter(p=>p.R&&!p.R.special).map(p=>`<label><input type="checkbox" data-cwp="${p.pc.id}" ${plan.cw.pieces.includes(p.pc.id)?'checked':''}> ${esc(p.pc.name)}</label>`).join('')}</div>

  const sugg=rows.filter(n=>n.bal&&n.bal.left<0).map(n=>`<div class="out"><b>Trūksta „${esc(n.Y.name)}“ – ką galima daryti:</b><ul class="st-sugg">${stSuggest(gk,ctx,plan,res,n.Y.id).map(s=>`<li>${s}</li>`).join('')}</ul></div>`).join('');
  const totA=rows.reduce((s,n)=>s+n.area,0), allG=rows.every(n=>n.grams!=null), totG=rows.reduce((s,n)=>s+(n.grams||0),0);
  const pal=stPalette(), selN=S.stash.filter(y=>stUI.sel[y.id]).length;

  $('#view').innerHTML=`<div class="stv">

    ${S.stash.length?(stUI.palArm?`<button class="btn primary" data-act="palgo">Pakeisti spalvų programos paletę šiais siūlais (${selN||S.stash.length})? Taip</button><button class="btn" data-act="palno">Atšaukti</button>`:`<button class="btn" data-act="palexp">Derinti spalvas${selN?` (${selN})`:''}</button>`):''}</div>
   ${S.stash.length?'<p class="note">„Derinti spalvas“ perkelia pažymėtus (arba visus) siūlus į spalvų programos paletę.</p>':''}
  </section>
  ${stUI.draft?stForm():''}
  <section class="panel" style="margin-top:12px"><h2>${esc(G.name)}: siūlai detalėms</h2>
    ${typeof hkState==='function'?`<div class="pieces" role="group" aria-label="Mezgimo būdas"><button data-act="mode" data-v="m" aria-pressed="${!ctx.hand}">Mašina ${esc(MACHINES[S.machine].name)}</button><button data-act="mode" data-v="h" aria-pressed="${ctx.hand}">Rankomis</button></div>`:''}
    <div class="st-fields3">
     <label class="f" for="st-main">Pagrindiniai siūlai<span class="in"><select id="st-main" data-pl="main">${stYarnOpts(ctx,plan.main)}</select></span></label>
     <label class="f" for="st-rib">Juostos, apykaklė, rankogaliai<span class="in"><select id="st-rib" data-pl="rib">${stYarnOpts(ctx,plan.rib,[['','Tie patys kaip detalės']])}</select></span></label>
     <label class="f" for="st-res">Atsarga<span class="in"><input id="st-res" type="number" inputmode="decimal" min="0" step="1" value="${ctx.reserve}"><span class="u">%</span></span></label>
    </div>

    <table class="ins st-tab"><thead><tr><th>Detalė</th><th>Siūlai</th><th>Užmesti</th><th>Eilės</th></tr></thead><tbody>${pieceRows}</tbody></table>
  </section>
  <div class="st-two" style="margin-top:12px">${stripeHtml}${ombHtml}${cwHtml}</div>
  <section class="panel" style="margin-top:12px"><h2>Ar užteks siūlų?</h2>
   <div class="stats"><div class="stat"><b>${fmt(totA/10000,2)} m²</b><span>mezginio</span></div><div class="stat"><b>${allG&&rows.length?fmt(totG,0)+' g':'—'}</b><span>iš viso su ${fmt(ctx.reserve,0)} % atsarga</span></div></div>

   ${rows.some(n=>n.est)?'<p class="note">Kai kurių siūlų gramai įvertinti pagal kitų to paties metražo siūlų mėginį (perskaičiuota pagal akių tankį ir gijų skaičių).</p>':''}
   <table class="ins st-tab"><thead><tr><th>Siūlai</th><th>Reikia</th><th>Turiu</th><th>Liks / trūksta</th></tr></thead><tbody>${resRows||'<tr><td>—</td></tr>'}</tbody></table>
   ${anyMiss?sugg:''}
   <p class="note" style="margin-top:8px">Plotas – iš kiekvienos detalės eilių su jos siūlų mėginiu. Juostų dalis = užmestų akių plotis × juostos aukštis. Juostelės dalijamos pagal eilių dalį, raštas – pagal langelių dalį (apytiksliai).</p>
  </section></div>`;
