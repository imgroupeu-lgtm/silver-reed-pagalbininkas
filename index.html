const ARMTYPES = [['isiuta','Įsiūta rankovė'],['reglanasA','Anatominis reglanas'],['reglanas','Standartinis reglanas'],['nuleista','Nuleistas petys']];
const isRaglan = a=> a==='reglanas' || a==='reglanasA';
// Anatominis reglanas: po uždarymo – statesnė dalis (aukštis cur), toliau – švelnesnė tiesi dalis iki kaklo.
// rem – kiek nuimama statesnėje dalyje; 0 = automatiškai, kad ji būtų 1,5 karto statesnė.
function ragLine(x0, xTop, D, cur, rem){
  cur=Math.min(Math.max(0.1,cur), D*0.9); const S=x0-xTop;
  if(!(rem>0)) rem = 1.5*S*cur/((D-cur)+1.5*cur);
  rem=Math.min(rem, S);
  return t=>{ if(t<=cur) return x0 - rem*(t/cur); return lerp(x0-rem, xTop, (t-cur)/(D-cur)); };
}
const NECKS = [['apvali','Apvali'],['V','V formos']];
const COLLARS = [['juosta','Juosta aplink kaklą',2.5],['pusgolfis','Pusgolfis (pusiau aukštas kaklas)',8],['golfas','Golfas (aukštas kaklas)',18]];

function srnd(x){ return x<0 ? -Math.floor(-x+0.5) : Math.floor(x+0.5); }
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp01(t){ return Math.min(1,Math.max(0,t)); }
// Ketvirčio apskritimo kreivė: prasideda horizontaliai (uždarymas), baigiasi vertikaliai.
function jcurve(t){ t=clamp01(t); return Math.sqrt(1-(1-t)*(1-t)); }
// Rankovės viršaus vidurys ir viršūnė: lėtas vidurys, staigėjanti viršūnė (varpo forma).
function bell(t){ t=clamp01(t); return 0.55*t + 0.45*Math.pow(t,4); }
function curveLen(fx,y0,y1,n){ n=n||400; if(!(y1>y0)) return 0; let len=0,px=fx(y0),py=y0; for(let i=1;i<=n;i++){ const y=y0+(y1-y0)*i/n, x=fx(y); len+=Math.hypot(x-px,y-py); px=x; py=y; } return len; }

/* ---------- Liemens pagrindas (nugara/priekis) ---------- */
function bodyBase(b, garment){
  const dress = garment==='suknele' || b.hemToWaist>0;
  const h2w = dress ? Math.max(0,b.hemToWaist) : 0;
  const w2u = Math.max(0.1,b.waistToUnderarm);
  const Hu = h2w + w2u;
  const arm = b.armType||'isiuta';
  const rag = isRaglan(arm), anat = arm==='reglanasA', drop = arm==='nuleista';
  const flat = rag || b.method==='tiesus';
  const slope = flat ? 0 : Math.max(0,b.slope);
  const ss = Hu + Math.max(0.1,b.armDepth);
  const H = ss + slope;
  const bust = b.bustW/2;
  const side = y=>{
    if(dress && y<=h2w && h2w>0) return lerp(b.hemW/2, b.waistW/2, y/h2w);
    if(y<=Hu){ const from = dress ? b.waistW/2 : b.hemW/2; return lerp(from, bust, (y-h2w)/w2u); }
    if(anat) return ragLine(bust-b.armRemove, b.neckW/2, b.armDepth, b.armCurve, b.ragCurveRem)(y-Hu);
    if(rag) return lerp(bust-b.armRemove, b.neckW/2, (y-Hu)/b.armDepth);
    if(!drop && b.armRemove>0 && b.armCurve>0) return bust - b.armRemove*jcurve((y-Hu)/b.armCurve);
    if(!drop && b.armRemove>0) return bust - b.armRemove;
    return bust;
  };
  return {H, Hu, ss, slope, side, arm, rag, drop, flat, bust};
}
function neckShapeFn(shape, H, nd){
  const y0=H-nd;
  if(shape==='V') return y=> y<y0 ? 0 : clamp01((y-y0)/nd);
  return y=> y<y0 ? 0 : jcurve((y-y0)/nd);
}
function baseWarnings(b){
  const w=[];
  if(!isRaglan(b.armType) && b.bustW/2 - (b.armType==='nuleista'?0:b.armRemove) - b.neckW/2 <= 0) w.push('Pečiui nelieka pločio: sumažinkite iškirptės plotį arba iškarpos nuėmimą.');
  if(b.armType==='isiuta' && b.armCurve>b.armDepth) w.push('Iškarpos kreivė aukštesnė už iškarpos gylį.');
  if(isRaglan(b.armType) && b.bustW/2-b.armRemove <= b.neckW/2) w.push('Reglanui: plotis ties pažastimi turi būti didesnis už iškirptę.');
  return w;
}
// Nugara arba megztinio/suknelės priekis (simetriška detalė, iškirptė per vidurį)
function bodyGeom(b, front, garment){
  const B=bodyBase(b, garment);
  const w=baseWarnings(b);
  const nd = Math.max(0, front ? front.neckD : b.neckD);
  const shape = front ? front.neckShape : 'apvali';
  const sh = neckShapeFn(shape, B.H, nd);
  const neckHalf = (b.neckW>0 && nd>0) ? (y=> (b.neckW/2)*sh(y)) : null;
  if(nd>B.H) w.push('Iškirptės gylis didesnis už visą detalę.');
  const g = { H:B.H, L:y=>-B.side(y), R:y=>B.side(y), neckHalf, ss: B.flat?null:B.ss, Hu:B.Hu, armTop:B.ss,
    ribCm:b.ribCm, finish: B.rag?'neck':'shoulder', method: B.rag?'paprastas':b.method, warnings:w, base:B };
  g.neckLen = neckHalf ? 2*curveLen(neckHalf, B.H-nd, B.H) : b.neckW;
  if(front && front.dartCm>0 && front.dartDepth>0){
    g.dart={y: B.Hu - Math.max(0,front.dartPos), extraCm:front.dartCm, depthCm:Math.min(front.dartDepth, B.bust), sides:['L','R']};
    if(front.dartPos>B.Hu) w.push('Įsiuvė per žemai – mažinkite atstumą nuo pažasties.');
  }
  return g;
}
// Kardigano priekis. side 'L' – iškirptė dešinėje (šonas kairėje), 'R' – veidrodinis.
function cfrontGeom(b, f, side, garment){
  const B=bodyBase(b, garment);
  const w=baseWarnings(b);
  const bw=(f.bandW||0) - 2*Math.max(0,f.overlap||0);  // užlaida (švarkas) – priekis išsikiša už vidurio linijos
  const nd=Math.max(0,f.neckD);
  const sh=neckShapeFn(f.neckShape, B.H, nd);
  const red = Math.max(0, b.neckW/2 - bw/2);
  const Lf = y=> -B.side(y);
  const Rf = y=> -bw/2 - red*sh(y);
  let L = Lf, R = Rf;
  const topX=-(bw/2+red); // tiksli reikšmė (be apvalinimo paklaidos)
  let sides=['L'], top={L:topX};
  if(side==='R'){ const L0=L, R0=R; L=y=>-R0(y); R=y=>-L0(y); sides=['R']; top={R:-topX}; }
  if(bw>0 && b.neckW/2 < bw/2) w.push('Sagų juosta platesnė už iškirptę.');
  const g={ H:B.H, L, R, neckHalf:null, ss:B.flat?null:B.ss, Hu:B.Hu, armTop:B.ss, shoulderSides:sides, shoulderTop:top,
    ribCm:b.ribCm, finish:B.rag?'neck':'shoulder', method:B.rag?'paprastas':b.method, warnings:w, base:B };
  g.neckLen = curveLen(y=>red*sh(y), B.H-nd, B.H);
  g.edgeLen = (b.ribCm||0) + (B.H-nd);
  if(f.dartCm>0 && f.dartDepth>0) g.dart={y:B.Hu-Math.max(0,f.dartPos), extraCm:f.dartCm, depthCm:Math.min(f.dartDepth, B.bust-bw/2), sides:[side==='R'?'R':'L']};
  return g;
}
function sleeveGeom(p, b){
  const w=[];
  const arm=b.armType||'isiuta';
  const L1=Math.max(0.1,p.length);
  const up=p.upperW/2;
  let H, half, capH=0, top;
  const taper = y=> lerp(p.cuffW/2, up, y/L1);
  if(arm==='nuleista'){
    H=L1; top=up; half=y=>taper(Math.min(y,L1));
  } else if(isRaglan(arm)){
    capH=Math.max(0.1,b.armDepth); H=L1+capH; top=p.capTop/2;
    if(arm==='reglanasA'){
      const line=ragLine(up-b.armRemove, top, capH, b.armCurve, 0);
      half=y=> y<=L1 ? taper(y) : line(y-L1);
    } else half=y=> y<=L1 ? taper(y) : lerp(up-b.armRemove, top, (y-L1)/capH);
    if(top>up-b.armRemove) w.push('Rankovės viršus platesnis už rankovę po pažastimi.');
  } else {
    const rem=b.armRemove, cur=b.armCurve;
    capH=Math.max(0,p.capH); H=L1+capH; top=p.capTop/2;
    const mid=up-rem, span=Math.max(0,capH-cur);
    half=y=>{
      if(y<=L1) return taper(y);
      if(cur>0 && y<L1+cur) return up - rem*jcurve((y-L1)/cur);
      if(span<=0) return top;
      return mid - (mid-top)*bell((y-L1-cur)/span);
    };
    if(capH<cur) w.push('Rankovės viršus žemesnis už pažasties kreivę.');
    if(top>mid) w.push('Viršaus plotis per didelis.');
  }
  return { H, L:y=>-half(y), R:y=>half(y), neckHalf:null, ss:null, L1, capH, top, half, arm,
    ribCm:p.ribCm, finish: isRaglan(arm)?'neck':'bind', method:'paprastas', warnings:w };
}
function trouserGeom(p, back){
  const w=[];
  const ins=Math.max(1,p.inseam), kh=Math.min(Math.max(0.1,p.kneeH),ins-0.1);
  const rise=Math.max(1,p.rise);
  const H = ins + rise;
  const width = y=> y<=kh ? lerp(p.hemW,p.kneeW,y/kh) : lerp(p.kneeW,p.crotchW,(y-kh)/(ins-kh));
  const xin = -p.crotchW/2 + p.ext;
  const L = y=>{
    if(y<=ins) return -width(y)/2;
    if(p.curveH>0) return -p.crotchW/2 + p.ext*jcurve((y-ins)/p.curveH);
    return xin;
  };
  const hipH=Math.min(Math.max(0.1,p.hipH),rise-0.1);
  const R = y=>{
    if(y<=ins) return width(y)/2;
    if(y<=ins+hipH) return lerp(p.crotchW/2, xin+p.hipW, (y-ins)/hipH);
    return lerp(xin+p.hipW, xin+p.waistW, (y-ins-hipH)/(rise-hipH));
  };
  if(p.ext>=p.crotchW) w.push('Tarpkojo išsikišimas didesnis už plotį ties tarpkoju.');
  if(p.curveH>rise) w.push('Tarpkojo kreivė aukštesnė už sėdynės aukštį.');
  if(p.hipH>=rise) w.push('Klubų aukštis turi būti mažesnis už sėdynės aukštį.');
  const g={ H, L, R, neckHalf:null, ss:null, ribCm:p.ribCm, finish:'bind', method:'paprastas', warnings:w, waistband:p.waistband };
  if(back && p.raise>0) g.wedge={side:'R', extraCm:p.raise};
  return g;
}

function needleSpan(L,R){
  if(R<=L) return '—';
  const a = L<0 ? 'K'+(-L) : 'D'+(L+1);
  const b = R>0 ? 'D'+R : 'K'+(-R+1);
  return a+'–'+b;
}
function pad(n){ return String(n).padStart(3,'0'); }
function shortRowGroups(sts, pairs){
  if(!(sts>0)||!(pairs>0)) return [];
  const g=[]; let given=0;
  for(let i=1;i<=pairs;i++){ const t=Math.round(sts*i/pairs); g.push(t-given); given=t; }
  return g;
}

function simulate(geom, g, o){
  const spc=g.sts/10, rpc=g.rows/10;
  const shift = -Math.round((srnd(geom.L(0)*spc)+srnd(geom.R(0)*spc))/2);
  const stx=x=>srnd(x*spc)+shift;
  const base=Math.max(2, srnd(geom.H*rpc));
  const startSide=o.carriage==='K'?'K':'D';
  const cs=rc=> (rc%2===0) ? startSide : (startSide==='D'?'K':'D');
  const opp=s=> s==='D'?'K':'D';
  const method=geom.method||'paprastas';
  const japon = method==='japon';
  const ss=geom.ss;
  const nhTop = geom.neckHalf ? geom.neckHalf(geom.H) : 0;
  const shSides = geom.shoulderSides || ['L','R'];
  const shTop = geom.shoulderTop || {L:-nhTop, R:nhTop};
  const top = geom.H;
  // įsiuvė
  let dartRc=null, E=0, dartGroups=[], dartSides=[];
  if(geom.dart && geom.dart.extraCm>0 && geom.dart.depthCm>0){
    E = 2*Math.max(1, srnd(geom.dart.extraCm*rpc/2));
    dartRc = Math.max(2, 2*Math.floor(srnd(geom.dart.y*rpc)/2));
    dartGroups = shortRowGroups(stx(geom.dart.depthCm), E/2);
    dartSides = geom.dart.sides||['L','R'];
  }
  const N = base + E;
  const mapRow = r=> (dartRc==null || r<=dartRc) ? r : (r<=dartRc+E ? null : r-E);
  const yOf = rc=>{ let k=rc-(rc%2)+1; if(dartRc!=null && k>dartRc){ k = k<=dartRc+E ? dartRc-1 : k-E; } return Math.min(geom.H, Math.max(0,k)/rpc); };
  const effR = y=> (ss!=null && shSides.includes('R') && y>ss+1e-9) ? {x:lerp(geom.R(ss), shTop.R, (y-ss)/(top-ss)), sh:true} : {x:geom.R(y), sh:false};
  const effL = y=> (ss!=null && shSides.includes('L') && y>ss+1e-9) ? {x:lerp(geom.L(ss), shTop.L, (y-ss)/(top-ss)), sh:true} : {x:geom.L(y), sh:false};
  let minL=0,maxR=0, warnings=[...(geom.warnings||[])], narrow=false;
  const shoulders=[];
  function ev(rc, side, d, sh, span){
    let type;
    if(d>0) type = sh ? (japon?'hold':'bind') : (d>=2?'bind':'dec');
    else type = (-d===1)?'inc':'cast';
    return {rc, side, type, n:Math.abs(d), span, car:cs(rc)};
  }
  function runPart(stt, from, to, fL, fR, items, rows){
    for(let rc=from; rc<to; rc++){
      const c=cs(rc);
      if(dartRc!=null && rc>=dartRc && rc<dartRc+E){
        if(rc===dartRc){ stt.preL=stt.L; stt.preR=stt.R; items.push({note:`RC ${pad(rc)}: krūtinės įsiuvė daliniu mezgimu – ${E} eil.${dartSides.length>1?' abiejuose šonuose':''}. Russel svirteles nustatykite į I.`}); }
        const step=Math.floor((rc-dartRc)/2), hs=opp(c), key=hs==='D'?'R':'L';
        if(dartSides.includes(key) && step<dartGroups.length && dartGroups[step]>0){
          const n=dartGroups[step]; if(key==='R') stt.R-=n; else stt.L+=n;
          items.push({rc, side:hs, type:'hold', n, span:needleSpan(stt.L,stt.R), car:c, w:stt.R-stt.L});
        }
        rows.push({rc:rc+1, L:stt.L, R:stt.R, yr:null});
        if(rc===dartRc+E-1){ stt.L=stt.preL; stt.R=stt.preR; items.push({note:`RC ${pad(rc+1)}: laikomas adatas pusėje, priešingoje karietėlei, pastumkite į C padėtį ir numegzkite eilę; tą patį padarykite kitoje pusėje. Šono siūlė lieka tokio pat ilgio kaip nugaros.`}); }
        continue;
      }
      const y=yOf(rc);
      const r=fR(y); let tR=stx(r.x);
      const reqR=(r.sh && japon)?'K':'D';
      if(c===reqR && tR!==stt.R){ tR=Math.max(tR,stt.L); if(tR!==stt.R){ const d=stt.R-tR; stt.R=tR; if(r.sh&&d>0) stt.shR=(stt.shR||0)+d; items.push(Object.assign(ev(rc,'D',d,r.sh,needleSpan(stt.L,stt.R)),{w:stt.R-stt.L})); } }
      const l=fL(y); let tL=stx(l.x);
      const reqL=(l.sh && japon)?'D':'K';
      if(c===reqL && tL!==stt.L){ tL=Math.min(tL,stt.R); if(tL!==stt.L){ const d=tL-stt.L; stt.L=tL; if(l.sh&&d>0) stt.shL=(stt.shL||0)+d; items.push(Object.assign(ev(rc,'K',d,l.sh,needleSpan(stt.L,stt.R)),{w:stt.R-stt.L})); } }
      minL=Math.min(minL,stt.L); maxR=Math.max(maxR,stt.R);
      if(stt.R-stt.L<=0 && rc<to-1 && !(r.sh||l.sh) && geom.finish!=='neck') narrow=true;
      rows.push({rc:rc+1, L:stt.L, R:stt.R, yr:mapRow(rc+1)});
    }
  }
  const sections=[];
  const st0={L:stx(geom.L(0)), R:stx(geom.R(0))};
  const castOn={L:st0.L, R:st0.R, n:st0.R-st0.L};
  minL=st0.L; maxR=st0.R;
  const ribRpc=(g.ribRows||g.rows)/10;
  const ribRows = geom.ribCm>0 ? Math.max(1,srnd(geom.ribCm*ribRpc)) : 0;
  const start=[];
  start.push({note:`Užmeskite ${castOn.n} ak. ant adatų ${needleSpan(castOn.L,castOn.R)}.`});
  if(ribRows) start.push({note: o.ribber ? `Juosta: ${geom.ribCm} cm = ${ribRows} eil. su antra adatų lova. Tada perkelkite akis į pagrindinę lovą.` : `Juosta: ${geom.ribCm} cm = ${ribRows} eil. (pvz. dvigubas sulenktas kraštas).`});
  start.push({note:`Nustatykite eilių skaitiklį RC 000, karietėlė ${startSide==='D'?'dešinėje':'kairėje'}.`});
  sections.push({title:'Pradžia', items:start});
  let rc0=null;
  if(geom.neckHalf){ for(let rc=0; rc<N; rc+=2){ if(srnd(geom.neckHalf(yOf(rc))*spc)>=1){ rc0=rc; break; } } }
  const parts=[];
  const mainItems=[], mainRows=[];
  runPart(st0, 0, rc0==null?N:rc0, effL, effR, mainItems, mainRows);
  parts.push({rows:mainRows, sL:castOn.L, sR:castOn.R, fromRc:0, fromY:0});
  sections.push({title: rc0==null ? 'Mezgimas' : 'Šonai ir iškarpa (iki kaklo iškirptės)', items:mainItems});
  function shoulderTarget(key){
    const yy = ss!=null ? ss : geom.H;
    const o = key==='R' ? geom.R(yy) : geom.L(yy);
    return Math.abs(stx(o)-stx(shTop[key]));
  }
  function finishPart(stt, label, key){
    let w=Math.max(0,stt.R-stt.L);
    if(geom.finishText) return {note:`${label}: ${geom.finishText(w)}`};
    if(geom.finish==='shoulder'){
      const held = key==='R' ? (stt.shR||0) : key==='L' ? (stt.shL||0) : (stt.shR||0)+(stt.shL||0);
      const target = key ? shoulderTarget(key) : held+w;
      const extra = Math.max(0, held+w-target);
      const tot = held + w - extra;
      shoulders.push(tot);
      const pre = extra>0 ? `kaklo pusėje uždarykite dar ${extra} ak.; ` : '';
      w -= extra;
      if(ss==null) return {note:`${label}: ${pre}${tot} pečio ak. uždarykite arba nuimkite ant pagalbinio siūlo pečių sujungimui.`};
      if(japon) return {note:`${label}: ${pre}pečio akys – ${tot}. Russel svirteles nustatykite į II (laikomos adatos sumegs ir grįš į B), numegzkite kelias eiles pagalbiniu siūlu ir nuimkite. Pečius sujunkite ant mašinos akis į akį (instrukcijoje – „Seaming on the Machine“).`};
      return w>0 ? {note:`${label}: ${pre}uždarykite likusias ${w} ak. (pečio akių iš viso ${tot}); uždarymo eilę megzkite 3–4 tempimo numeriais laisviau. Pečius vėliau susiūkite.`} : {note:`${label}: ${pre}petys uždarytas (${tot} ak.). Pečius vėliau susiūkite.`};
    }
    if(geom.finish==='neck') return w>0 ? {note:`${label}: likusias ${w} ak. nuimkite ant pagalbinio siūlo apykaklei arba uždarykite.`} : {note:`${label}: detalė baigta.`};
    if(geom.waistband) return {note:`${label}: likusias ${w} ak. palikite juosmens juostai (${geom.waistband} cm = ${srnd(geom.waistband*ribRpc)} eil.) arba uždarykite.`};
    return {note:`${label}: likusias ${w} ak. uždarykite – uždarymo eilę megzkite 3–4 tempimo numeriais laisviau.`};
  }
  let extraRows=0;
  if(rc0!=null){
    const h=srnd(geom.neckHalf(yOf(rc0))*spc);
    const split=[];
    split.push({note:`RC ${pad(rc0)}: vidurines ${2*h} ak. (${needleSpan(-h,h)}) nuimkite ant pagalbinio siūlo arba uždarykite.`});
    split.push({note: japon ? `Kairės pusės akis ${needleSpan(st0.L,-h)} nuimkite ant pagalbinio siūlo (ne į HP – baigiant japonišką petį Russel svirtelės II padėtyje sumegztų ir laikomas adatas). Toliau mezgate tik dešinę pusę.` : `Kairės pusės adatas ${needleSpan(st0.L,-h)} perkelkite į laikymo padėtį (HP) arba nuimkite ant pagalbinio siūlo. Toliau mezgate tik dešinę pusę.`});
    sections.push({title:'Kaklo iškirptė', items:split});
    const sR=st0.R, sL=st0.L; // plotis ties iškirptės pradžia
    const right={L:h, R:sR, shR:st0.shR||0}, rItems=[], rRows=[];
    runPart(right, rc0, N, y=>({x:geom.neckHalf(y), sh:false}), effR, rItems, rRows);
    rItems.push(finishPart(right,'Dešinė pusė','R'));
    sections.push({title:'Dešinė pusė', items:rItems});
    const left={L:sL, R:-h, shL:st0.shL||0}, lItems=[], lRows=[];
    lItems.push({note:`${japon?'Kairės pusės akis nuo pagalbinio siūlo grąžinkite ant adatų':'Grąžinkite kairę pusę į darbą'}, nustatykite RC ${pad(rc0)}, karietėlė ${cs(rc0)==='D'?'dešinėje':'kairėje'}.`});
    runPart(left, rc0, N, effL, y=>({x:-geom.neckHalf(y), sh:false}), lItems, lRows);
    lItems.push(finishPart(left,'Kairė pusė','L'));
    sections.push({title:'Kairė pusė', items:lItems});
    const fy=(mapRow(rc0)==null?dartRc:mapRow(rc0))/rpc;
    parts.push({rows:rRows, sL:h, sR, fromRc:rc0, fromY:fy});
    parts.push({rows:lRows, sL, sR:-h, fromRc:rc0, fromY:fy});
  } else {
    const last=sections[sections.length-1].items;
    if(geom.wedge && geom.wedge.extraCm>0){
      const W2=2*Math.max(1,srnd(geom.wedge.extraCm*rpc/2));
      const grp=shortRowGroups(st0.R-st0.L, W2/2+1).slice(0,W2/2);
      const wItems=[{note:`RC ${pad(N)}: nugaros pakėlimas trumposiomis eilėmis – ${W2} eil. Adatas į HP traukite šono (dešinėje) pusėje, kai karietėlė kairėje; tarpkojo pusė mezgama visą laiką.`}];
      const pre={L:st0.L,R:st0.R};
      for(let j=0;j<W2;j++){
        const rc=N+j, c=cs(rc), hs=opp(c), step=Math.floor(j/2);
        if(hs===(geom.wedge.side==='R'?'D':'K') && step<grp.length && grp[step]>0){
          const n=grp[step]; if(geom.wedge.side==='R') st0.R-=n; else st0.L+=n;
          wItems.push({rc, side:hs, type:'hold', n, span:needleSpan(st0.L,st0.R), car:c, w:st0.R-st0.L});
        }
        mainRows.push({rc:rc+1, L:st0.L, R:st0.R, yr:null});
      }
      st0.L=pre.L; st0.R=pre.R;
      wItems.push({note:`RC ${pad(N+W2)}: laikomas adatas pastumkite į C padėtį ir numegzkite 1 eil. per visas akis.`});
      extraRows=W2;
      wItems.push(finishPart(st0,'Pabaiga'));
      sections.push({title:'Nugaros pakėlimas', items:wItems});
    } else {
      last.push(finishPart(st0,'Pabaiga', geom.shoulderSides?geom.shoulderSides[0]:null));
    }
  }
  sections.push({title:'Iš viso', items:[{note:`${N+extraRows} eil. pagrindinio mezgimo${ribRows?` + ${ribRows} eil. juostos`:''}.${E?` Iš jų ${E} eil. – įsiuvė.`:''}`}]});
  let stRows=0; parts.forEach(p=>p.rows.forEach(r=>stRows+=Math.max(0,r.R-r.L)));
  const area = stRows/spc/rpc + (ribRows? castOn.n/spc*ribRows/ribRpc : 0);
  const needed = 2*Math.max(-minL, maxR);
  if(o.needles && needed>o.needles) warnings.push(`Detalei reikia ${needed} adatų, o ${o.machineName} turi ${o.needles}. Sumažinkite plotį arba rinkitės kitą mašiną.`);
  if(narrow) warnings.push('Detalė kažkur tampa per siaura. Patikrinkite matmenis.');
  return {sections, parts, castOn, N:N+extraRows, ribRows, area, needed, warnings, rc0, spc, rpc, shoulders, dartRows:E};
}

function combine(items){
  const out=[];
  for(let i=0;i<items.length;i++){
    const a=items[i], b=items[i+1];
    if(a.type && b && b.type===a.type && b.n===a.n && b.side!==a.side && b.rc===a.rc+1){ out.push({...a, side:'abi', first:a.side, rc2:b.rc, span:b.span, w:b.w}); i++; }
    else out.push(a);
  }
  return out;
}
function group(items){
  const out=[]; let i=0;
  while(i<items.length){
    const a=items[i];
    if(!a.type){ out.push(a); i++; continue; }
    let j=i+1, step=null;
    while(j<items.length){
      const b=items[j];
      if(!b.type||b.type!==a.type||b.n!==a.n||b.side!==a.side) break;
      const d=b.rc-items[j-1].rc;
      if(step===null) step=d; else if(d!==step) break;
      j++;
    }
    const cnt=j-i;
    if(cnt>=3){ out.push({...a, grp:{count:cnt, step, last:items[j-1].rc}, span:items[j-1].span, w:items[j-1].w}); i=j; }
    else { out.push(a); i++; }
  }
  return out;
}
function akys(n){ n=Math.abs(n)%100; const d=n%10; if(n>10&&n<20) return 'akių'; if(d===1) return 'akį'; if(d>=2&&d<=9) return 'akis'; return 'akių'; }
function actText(e){
  switch(e.type){
    case 'bind': return `uždarykite ${e.n} ${akys(e.n)}`;
    case 'dec': return 'sumažinkite 1 akį';
    case 'inc': return 'pridėkite 1 akį';
    case 'cast': return `užmeskite ${e.n} ${akys(e.n)}`;
    case 'hold': return `${e.n} ${e.n===1?'adatą':'adatas'} pastumkite į laikymo padėtį D`;
  }
  return '';
}

};
function techText(t){ return TECH[t]||''; }
function sideText(e){
  if(e.side==='abi') return e.first==='D'?'abiejuose kraštuose: pirma dešiniajame, po eilės – kairiajame':'abiejuose kraštuose: pirma kairiajame, po eilės – dešiniajame';
  return e.side==='D'?'dešiniajame krašte':'kairiajame krašte';
}
function spread(rows, n, even){
  const unit=even?2:1, slots=Math.floor(rows/unit);
  if(!(n>0) || slots<=0) return null;
  const k=Math.ceil(n/slots), ev=Math.ceil(n/k), nk=n-(k-1)*ev;
  const a=Math.floor(slots/ev), extra=slots%ev;
  return {k, ev, nk, nk1:ev-nk, a:a*unit, b:(a+1)*unit, nb:extra, na:ev-extra};
}

/* --- geometrijos --- */
function rectGeom(p, opts){ opts=opts||{}; const H=Math.max(0.5,opts.H!=null?opts.H:p.len), w=Math.max(0.5,opts.w!=null?opts.w:p.w);
  return {H, L:()=>-w/2, R:()=>w/2, neckHalf:null, ss:null, ribCm:opts.ribCm!=null?opts.ribCm:(p.ribCm||0), finish:'bind', method:'paprastas', warnings:[], finishText:opts.finishText}; }
const GATHER = w=>`nukirpkite siūlą palikdami ~40 cm, adata perverkite per visas ${w} ak., nuimkite jas nuo mašinos ir stipriai sutraukite.`;
const EXTRA_GEOM = {
  skirt(P,pc){ const p=P[pc.id]; const H=Math.max(1,p.length), hipY=Math.max(0.1,Math.min(H-0.1,H-p.hipFromWaist));
    const half=y=> y<=hipY ? lerp(p.hemW/2,p.hipW/2,y/hipY) : lerp(p.hipW/2,p.waistW/2,(y-hipY)/(H-hipY));
    const w=[]; if(p.hipFromWaist>=p.length) w.push('Klubų atstumas didesnis už sijono ilgį.');
    return {H, L:y=>-half(y), R:y=>half(y), neckHalf:null, ss:null, ribCm:p.ribCm, finish:'bind', method:'paprastas', warnings:w, waistband:p.waistband}; },
  rect(P,pc){ const p=P[pc.id]; return rectGeom(p); },
  hat(P,pc){ const p=P.kepure; const circ=Math.max(10,p.headCirc+p.ease); const wedge=p.crown==='pleistai';
    const H=Math.max(1,p.height-(wedge?Math.max(0,p.crownH):0));
    const brim=p.brimDouble==='taip'?2*p.brimCm:p.brimCm;
    return rectGeom(p,{H, w:circ, ribCm:brim, finishText: wedge? (w=>`akių nenuimkite – toliau megzkite viršų pleištais (žr. žemiau).`) : GATHER}); },
  mitten(P,pc){ const p=P.plastaka; const w=(p.handCirc+p.ease)/2, H=Math.max(2,p.handLen), top=Math.min(H-0.5,Math.max(0.5,p.topCm));
    const half=y=> y<=H-top ? w/2 : Math.max(w*0.18, (w/2)*Math.sqrt(Math.max(0,1-Math.pow((y-(H-top))/top,2))));
    return {H, L:y=>-half(y), R:y=>half(y), neckHalf:null, ss:null, ribCm:p.cuffCm, finish:'bind', method:'paprastas', warnings:[]}; },
  thumb(P){ const p=P.plastaka; return rectGeom(p,{H:p.thumbLen, w:p.thumbCirc+0.5, ribCm:0, finishText:GATHER}); },
  glovehand(P){ const p=P.plastaka; return rectGeom(p,{H:p.palmLen, w:(p.handCirc+p.ease)/2, ribCm:p.cuffCm, finishText:w=>`likusias ${w} ak. uždarykite laisvai – prie šio krašto bus įsiuvami pirštai.`}); }

// Taškų sąrašo tikrinimas ir sutvarkymas geometrijai
function ffClean(list, label, w){
  const pts=(Array.isArray(list)?list:[]).filter(q=>Array.isArray(q)&&isFinite(+q[0])&&isFinite(+q[1])).map(q=>[+q[0],+q[1]]);
  if(pts.length<2){ w.push(`${label}: reikia bent 2 taškų – naudojamas stačiakampis.`); return [[0,25],[60,25]]; }
  for(let i=1;i<pts.length;i++) if(!(pts[i][0]>pts[i-1][0])){ w.push(`${label}: aukščiai turi didėti iš apačios į viršų (${i+1}-as taškas). Taškai surikiuoti.`); break; }
  pts.sort((a,b)=>a[0]-b[0]);
  if(pts[0][0]<0){ w.push(`${label}: aukštis negali būti neigiamas.`); }
  if(pts.some(q=>!(q[1]>0))) w.push(`${label}: plotis turi būti teigiamas – kur 0, megzama bent po ${fmt(FF_MIN)} cm nuo vidurio.`);
  return pts.map(q=>[Math.max(0,q[0]), Math.max(FF_MIN,q[1])]);
}
function ffInterp(pts){
  return y=>{
    if(y<=pts[0][0]) return pts[0][1];
    for(let i=1;i<pts.length;i++){ const a=pts[i-1], b=pts[i];
      if(y<=b[0]){ const d=b[0]-a[0]; return d>1e-9 ? lerp(a[1],b[1],(y-a[0])/d) : b[1]; } }
    return pts[pts.length-1][1];
  };
}

function ffCss(name, fb){ try{ const v=getComputedStyle(document.documentElement).getPropertyValue(name).trim(); return v||fb; }catch(e){ return fb; } }
function ffDraw(cv, p){
  const R=p.pts, L=p.sym==='ne'?p.ptsL:p.pts;
  if(!R||!L) return;
  const dpr=window.devicePixelRatio||1;
  const W=Math.max(200, Math.floor(cv.parentElement ? cv.parentElement.clientWidth : 320));
  const rib=Math.max(0,+p.ribCm||0);
  // mastelis fiksuojamas tempimo metu, kad piešinys nešokinėtų
  let V=FF.view;
  if(!V || V.W!==W || !FF.drag){
    if(!FF.drag || !V){
      const H=Math.max(R[R.length-1][0], L[L.length-1][0], 1);
      const xm=Math.max(...R.map(q=>q[1]), ...L.map(q=>q[1]), 5);
      const xr=xm*1.15+4, yr=H*1.12+6;
      const padL=34, padR=10, padT=12, padB=24;
      const maxH=Math.max(220, Math.min(460, (window.innerHeight||700)*0.55));
      const s=Math.min((W-padL-padR)/(2*xr), (maxH-padT-padB)/(yr+rib));
      const Hc=Math.ceil((yr+rib)*s+padT+padB);
      V={W, Hc, s, cx:padL+(W-padL-padR)/2, by:padT+yr*s, xr, yr, padL};
      FF.view=V;
    }
  }
  if(cv.width!==Math.round(V.W*dpr) || cv.height!==Math.round(V.Hc*dpr)){ cv.width=Math.round(V.W*dpr); cv.height=Math.round(V.Hc*dpr); }

  const accent=ffCss('--accent','#1d5c78'), line=ffCss('--line','#cdd5d3'), ink=ffCss('--ink','#1b2428'), muted=ffCss('--muted','#5a676d'), soft=ffCss('--accent-soft','#dbe8ee'), surf=ffCss('--surface','#fff');
  const X=x=>V.cx+x*V.s, Y=y=>V.by-y*V.s;
  // tinklelis kas 5 cm, ryškesnis kas 10 cm
  c.lineWidth=1; c.font='10px system-ui, sans-serif'; c.fillStyle=muted;
  const step=V.s<3?10:5;
  for(let y=0; y<=V.yr; y+=step){ c.strokeStyle=line; c.globalAlpha=y%10===0?0.9:0.45; c.beginPath(); c.moveTo(V.padL-4,Y(y)+.5); c.lineTo(V.W-6,Y(y)+.5); c.stroke(); c.globalAlpha=1; if(y%10===0){ c.textAlign='right'; c.textBaseline='middle'; c.fillText(String(y), V.padL-7, Y(y)); } }
  for(let x=0; x<=V.xr; x+=step){ [x,-x].forEach(xx=>{ if(X(xx)<V.padL-4||X(xx)>V.W-6) return; c.strokeStyle=line; c.globalAlpha=x%10===0?0.9:0.45; c.beginPath(); c.moveTo(X(xx)+.5,Y(V.yr)); c.lineTo(X(xx)+.5,Y(-rib)); c.stroke(); c.globalAlpha=1; }); }
  c.textAlign='center'; c.textBaseline='top'; c.fillStyle=muted;
  for(let x=10; x<=V.xr; x+=10){ [x,-x].forEach(xx=>{ const px=X(xx); if(px>V.padL+8&&px<V.W-12) c.fillText(String(x), px, Y(-rib)+5); }); }
  c.fillText('0', X(0), Y(-rib)+5);
  c.textAlign='left'; c.textBaseline='top'; c.fillText('cm', 2, 2);
  // juosta
  if(rib>0){ c.fillStyle=soft; c.strokeStyle=accent; c.lineWidth=1; c.globalAlpha=0.9; c.fillRect(X(-L[0][1]), Y(0), (L[0][1]+R[0][1])*V.s, rib*V.s); c.globalAlpha=1;
    c.save(); c.beginPath(); c.rect(X(-L[0][1]), Y(0), (L[0][1]+R[0][1])*V.s, rib*V.s); c.clip(); c.strokeStyle=accent; c.globalAlpha=0.35;
    for(let x=X(-L[0][1])-rib*V.s; x<X(R[0][1]); x+=6){ c.beginPath(); c.moveTo(x,Y(-rib)); c.lineTo(x+rib*V.s,Y(0)); c.stroke(); } c.restore(); c.globalAlpha=1; }
  // forma
  c.beginPath();
  R.forEach((q,i)=>{ if(i===0) c.moveTo(X(q[1]),Y(q[0])); else c.lineTo(X(q[1]),Y(q[0])); });
  const topR=R[R.length-1], topL=L[L.length-1];
  if(topR[0]<topL[0]) c.lineTo(X(topR[1]),Y(topL[0]));
  if(topL[0]<topR[0]) c.lineTo(X(-topL[1]),Y(topR[0]));

  // rankenėlės
  const handles=[]; const asym=p.sym==='ne';
  const put=(list,side)=>list.forEach((q,i)=>{ const px=side==='L'?X(-q[1]):X(q[1]), py=Y(q[0]); handles.push({side,i,px,py});
    const act=FF.drag&&FF.drag.side===side&&FF.drag.i===i, mine=!asym||FF.side===side;
    c.beginPath(); c.arc(px,py,act?9:7,0,Math.PI*2); c.fillStyle=mine?accent:surf; c.fill(); c.lineWidth=2; c.strokeStyle=accent; c.stroke();
    c.fillStyle=mine?surf:accent; c.font='600 9px system-ui, sans-serif'; c.textAlign='center'; c.textBaseline='middle'; c.fillText(String(i+1),px,py+.5); });
  put(R,'R'); if(asym) put(L,'L'); else { // simetriškai – kairėje tik blankūs atspindžiai
    c.globalAlpha=0.5; R.forEach(q=>{ c.beginPath(); c.arc(X(-q[1]),Y(q[0]),4,0,Math.PI*2); c.fillStyle=accent; c.fill(); }); c.globalAlpha=1; }
  // tempiamo taško reikšmės
  if(FF.drag){ const l=FF.drag.side==='L'?L:R, q=l[FF.drag.i]; if(q){ const px=FF.drag.side==='L'?X(-q[1]):X(q[1]), py=Y(q[0]);
    const t=`${fmt(q[0])} cm aukštyje · ${fmt(q[1])} cm nuo vidurio${asym?'':` (plotis ${fmt(2*q[1])})`}`;
    c.font='600 11px system-ui, sans-serif'; const tw=c.measureText(t).width+12; let bx=Math.min(Math.max(4,px-tw/2),V.W-tw-4), byy=py-30; if(byy<2) byy=py+14;
    c.fillStyle=ink; c.globalAlpha=0.88; c.fillRect(bx,byy,tw,18); c.globalAlpha=1; c.fillStyle=surf; c.textAlign='left'; c.textBaseline='middle'; c.fillText(t,bx+6,byy+9); } }
  V.handles=handles;
}

const KEY='srp-v2';

function ribAdvice(n, g, m){

function fieldHtml(f, p, ctx, prefix){
  if(f.g) return `<h3 class="full">${f.g}</h3>`;
  if(f.only && !f.only.includes(ctx.gk)) return '';
  if(f.backOnly && !ctx.pc.back) return '';
  if(f.hideIf && f.hideIf(p,ctx)) return '';
  const lab = typeof f.l==='function' ? f.l(p,ctx) : f.l;
  const id=`${prefix}-${f.k}`;
  if(f.type==='select') return `<label class="f ${f.full?'full':''}" for="${id}">${lab}<span class="in"><select id="${id}" data-k="${f.k}">${f.opts.map(([v,t])=>`<option value="${v}" ${p[f.k]===v?'selected':''}>${t}</option>`).join('')}</select></span>${f.hint?`<span class="hint">${typeof f.hint==='function'?f.hint(p,ctx):f.hint}</span>`:''}</label>`;
  return `<label class="f ${f.full?'full':''}" for="${id}">${lab}<span class="in"><input id="${id}" data-k="${f.k}" type="number" inputmode="decimal" step="0.5" min="0" value="${p[f.k]}"><span class="u">${f.u||''}</span></span>${f.hint?`<span class="hint">${typeof f.hint==='function'?f.hint(p,ctx):f.hint}</span>`:''}</label>`;

function groupedFields(list, p, ctx, prefix, key){

function cap1(t){ return t.charAt(0).toUpperCase()+t.slice(1); }
function rowHtml(e){
  if(e.note) return `<tr class="nt"><td></td><td colspan="2">${esc(e.note)}</td></tr>`;
  const car = e.car ? `<small>karietėlė ${e.car==='D'?'dešinėje':'kairėje'}</small>` : '';
  const when = e.grp ? `${pad(e.rc)} → ${pad(e.grp.last)}<small>kas ${e.grp.step} eil., ${e.grp.count} kartai</small>` : (e.rc2!=null?`${pad(e.rc)} ir ${pad(e.rc2)}${car}`:`${pad(e.rc)}${car}`);
  const what = `${e.grp?'Kiekvieną kartą ':''}${e.grp?sideText(e):cap1(sideText(e))}: ${actText(e)}.`;
  return `<tr><td class="rc">${when}</td><td><span class="tag t-${e.type}">${({bind:'uždaryti',dec:'mažinti',inc:'pridėti',cast:'užmesti',hold:'HP'})[e.type]}</span>${esc(what)}</td><td class="sp">${e.span}${e.w!=null?`<small style="display:block">${e.w} ak.</small>`:''}</td></tr>`;
}
function schemaSvg(geom, sim){
  const spc=sim.spc, rpc=sim.rpc, rib=geom.ribCm||0;
  const polys=[];
  function poly(p){
    const left=[[p.sL/spc, p.fromY]], right=[[p.sR/spc, p.fromY]];
    p.rows.forEach(r=>{ if(r.yr==null||!(r.R>r.L)) return; const y0=(r.yr-1)/rpc, y1=r.yr/rpc; left.push([r.L/spc,y0],[r.L/spc,y1]); right.push([r.R/spc,y0],[r.R/spc,y1]); });
    return left.concat(right.reverse());
  }
  sim.parts.forEach(p=>polys.push(poly(p)));
  let minX=Infinity,maxX=-Infinity; polys.forEach(pl=>pl.forEach(([x])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);}));
  const Hc=geom.H+rib, Wc=Math.max(1,maxX-minX);
  const W=240, pd=34, s=Math.min((W-2*pd)/Wc, 380/Hc);
  const Hpx=Hc*s+2*pd;
  const X=x=>pd+(x-minX)*s+((W-2*pd)-Wc*s)/2, Y=y=>Hpx-pd-(y+rib)*s;
  const pts=pl=>pl.map(([x,y])=>`${X(x).toFixed(1)},${Y(y).toFixed(1)}`).join(' ');
  const ribRect = rib>0 ? `<rect x="${X(sim.castOn.L/spc)}" y="${Y(0)}" width="${sim.castOn.n/spc*s}" height="${rib*s}" fill="url(#hatch)" stroke="var(--accent)" stroke-width="1"/>` : '';
  const mid=(Y(geom.H)+Y(-rib))/2;
  return `<svg viewBox="0 0 ${W} ${Hpx.toFixed(0)}" role="img" aria-label="Detalės schema">
    <defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(90)"><line x1="0" y1="0" x2="0" y2="5" stroke="var(--accent)" stroke-width="1.2" opacity=".5"/></pattern></defs>
    ${ribRect}
    ${polys.map(pl=>`<polygon points="${pts(pl)}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" stroke-linejoin="round"/>`).join('')}
    <text x="${W/2}" y="${Hpx-10}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--f-body)">${fmt(sim.castOn.n/spc)} cm · ${sim.castOn.n} ak.</text>
    <text x="10" y="${mid}" font-size="11" fill="var(--muted)" font-family="var(--f-body)" transform="rotate(-90 10 ${mid})" text-anchor="middle">${fmt(Hc)} cm</text>
  </svg>`;
}

function viewMasina(){

  const [gk,pid]=S.mPiece.split('/');
  const {sim}=computePiece(gk,pid);
  const steps=[]; sim.sections.forEach(s=>combine(s.items).forEach(e=>steps.push({...e, sec:s.title})));

  const patBox = (typeof patRowBox==='function') ? patRowBox() : '';

  $('#view').innerHTML=`<div class="mach">
    <div class="row">
      <label class="f" for="m-p" style="min-width:240px;flex:1">Detalė (${esc(G0.name)})<span class="in"><select id="m-p">${opts.map(([v,t])=>`<option value="${v}" ${S.mPiece===v?'selected':''}>${t}</option>`).join('')}</select></span></label>
      <button class="btn" id="wk">${wake?'Ekranas neužges':'Neleisti ekranui užgesti'}</button>
    </div>
    ${rcBox}
    <div class="mcard" aria-live="polite">${card}<div class="meta">Žingsnis ${S.mStep+1} iš ${steps.length}</div></div>
    <div class="mnav"><button class="btn" id="mPrev">◀ Atgal</button><button class="btn primary" id="mNext">Atlikta ▶</button></div>
    ${patBox}
    <div class="mlist">${steps.map((e,i)=>`<div data-i="${i}" class="${i===S.mStep?'cur':(i<S.mStep?'done':'')}">${e.note?esc(e.note):`RC ${pad(e.rc)} · ${esc(cap1(sideText(e)))}: ${esc(actText(e))}`}</div>`).join('')}</div>
  </div>`;
  $('#m-p').onchange=e=>{S.mPiece=e.target.value; S.mStep=0; S.mRC=0; save(); viewMasina();};
  $('#mPrev').onclick=()=>{S.mStep=Math.max(0,S.mStep-1); save(); viewMasina();};
  $('#mNext').onclick=()=>{ if(cur.rc!=null) S.mRC=Math.max(S.mRC,cur.rc2!=null?cur.rc2:cur.rc); S.mStep=Math.min(steps.length-1,S.mStep+1); save(); viewMasina();};
  const syncStep=()=>{ const i=steps.findIndex(e=>e.rc!=null && e.rc>=S.mRC); if(i>=0){ let j=i; while(j>0 && steps[j-1].rc==null && steps[j-1].sec===steps[i].sec) j--; if(j>S.mStep||i<S.mStep) S.mStep=j; } };
  $('#rcPlus').onclick=()=>{ S.mRC++; syncStep(); save(); viewMasina(); try{ if(navigator.vibrate && steps.some(e=>e.rc===S.mRC)) navigator.vibrate(120); }catch(e){} };
  $('#rcMinus').onclick=()=>{ S.mRC=Math.max(0,S.mRC-1); syncStep(); save(); viewMasina(); };
  document.querySelectorAll('.mlist [data-i]').forEach(d=>d.onclick=()=>{S.mStep=+d.dataset.i; save(); viewMasina();});
  if(typeof bindPatRow==='function') bindPatRow();
  const cd=document.querySelector('.mlist .cur'); if(cd && cd.scrollIntoView) cd.scrollIntoView({block:'nearest'});
  $('#wk').onclick=async()=>{ try{ if(!wake){ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{wake=null;}); } else { await wake.release(); wake=null; } }catch(e){ wake=null; } viewMasina(); };
}

    'Prielaidos: priekinė klešnė – 47 %, galinė – 53 % pusės klubų apimties; tarpkojo išsikišimas priekyje 4 %, nugaroje 8 % klubų; kelias – 45 % kojos ilgio; apačia – 60 % pločio ties tarpkoju, jei neįrašėte savo.'];
  const bs=cfgBody(cfg, i, T, opt&&opt.noOwn).src;
  const rows=[
    ['Liemuo', body.waist, bs.waist, `${fmt((P.priekis.waistW+P.nugara.waistW)*2)} (priekis ${fmt(P.priekis.waistW)}, nugara ${fmt(P.nugara.waistW)})`],

function buildAcc(cfg, gk, sid, kid, man, opt){
  const kind=ACC_KIND[gk], row=ACC_TABLE[kind][sid], own=(!opt.noOwn && cfg.own)||{}, P=clone(DEF[gk]);

    const G=cfg.glove||{}, cr=hc/20, glove=gk==='pirstines', lr=hl/(glove?18:19), ex=[];

function fitCapP(P){
  const sp=P.rankove, body=P.nugara;
  const b=bodyGeom(body,null,'megztinis'); const target=2*curveLen(b.base.side,b.Hu,b.armTop);
  const f=h=>{ const s=sleeveGeom(Object.assign({},sp,{capH:h}),body); return 2*curveLen(s.half,s.L1,s.H)+sp.capTop; };
  let lo=Math.max(body.armCurve,0.5)+0.01, hi=45;
  if(f(lo)>target || f(hi)<target) return null;
  for(let k=0;k<50;k++){ const m=(lo+hi)/2; if(f(m)<target) lo=m; else hi=m; }
  return Math.round(hi*10)/10;
}

const PSYM=['','×','●','○','▲','◆','+','/','■','◇'];
function patFresh(){ return {mode:'kartote', W:24, H:24, autoH:true, k:2, usePal:false, max2:true, cells:'0'.repeat(24*24),
  colors:['#f4efe6','#1d5c78'], paint:1, sym:true, crop:[0,0,100,100], holesB:true, mirror:false, cardRows:0,
  piece:'', startRow:1, bandRows:0, tech:'spalvos'}; }
function patState(){
  let p=S.pat; if(!p||typeof p!=='object') p=S.pat=patFresh();
  const f=patFresh(); Object.keys(f).forEach(k=>{ if(p[k]==null) p[k]=f[k]; });
  if(typeof p.cells!=='string'||p.cells.length!==p.W*p.H) p.cells='0'.repeat(p.W*p.H);
  if(!Array.isArray(p.colors)||!p.colors.length) p.colors=f.colors.slice();
  return p;
}
let patImg=null, patImgUrl='';
const TECHS={
  spalvos:{name:'Spalvotas (žakardas)'},
  patiesinimas:{name:'Patiesinimas (tuck)', states:[['Mezgama akis','·'],['Patiesinama akis','∪']], hole:'patiesinama akis', card:true},
  praleidimas:{name:'Praleistos akys (slip)', states:[['Mezgama akis','·'],['Praleidžiama akis','—']], hole:'praleidžiama akis', card:true},
  azuras:{name:'Ažūras (perkėlimas ranka)', noCard:'Ažūrui korta nenaudojama – akys perkeliamos perkėlimo įrankiu pagal lentelę „Kas daroma kiekvienoje eilėje“.', states:[['Mezgama akis','·'],['Akį perkelti į kairę','◁'],['Akį perkelti į dešinę','▷']]}
};
const isTX=p=>p.tech&&p.tech!=='spalvos';
const TXCOL=['#ffffff','#c9d6de','#e6d2b5'];
/* --- spalvų matematika (sRGB → CIELAB, D65) --- */
const pS2l=c=>{c/=255; return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);};
function pRgb2lab(r,g,b){ const R=pS2l(r),G=pS2l(g),B=pS2l(b);
  let x=(0.4124564*R+0.3575761*G+0.1804375*B)/0.95047, y=(0.2126729*R+0.7151522*G+0.0721750*B), z=(0.0193339*R+0.1191920*G+0.9503041*B)/1.08883;
  const f=t=>t>216/24389?Math.cbrt(t):(24389/27*t+16)/116; x=f(x);y=f(y);z=f(z); return [116*y-16,500*(x-y),200*(y-z)]; }
function pHex2rgb(h){ h=String(h).replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16)||0; return [n>>16&255,n>>8&255,n&255]; }
const pHex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const pD=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;
function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function pKmeans(pts,k){ const rnd=mulberry(7); const C=[pts[Math.floor(rnd()*pts.length)].lab.slice()];
  while(C.length<k){ const d=pts.map(p=>Math.min(...C.map(c=>pD(p.lab,c)))); const s=d.reduce((a,b)=>a+b,0); if(s===0) break; let r=rnd()*s,i=0; for(;i<d.length-1&&r>d[i];i++) r-=d[i]; C.push(pts[i].lab.slice()); }
  for(let it=0;it<15;it++){ const acc=C.map(()=>[0,0,0,0,0,0,0]);
    pts.forEach(p=>{ let bi=0,bd=Infinity; C.forEach((c,j)=>{ const d=pD(p.lab,c); if(d<bd){bd=d;bi=j;} }); p.k=bi; const a=acc[bi]; a[0]+=p.lab[0];a[1]+=p.lab[1];a[2]+=p.lab[2];a[3]+=p.rgb[0];a[4]+=p.rgb[1];a[5]+=p.rgb[2];a[6]++; });
    acc.forEach((a,j)=>{ if(a[6]) { C[j]=[a[0]/a[6],a[1]/a[6],a[2]/a[6]]; C[j].rgb=[a[3]/a[6],a[4]/a[6],a[5]/a[6]]; C[j].n=a[6]; } }); }
  return C; }
function yarnPalette(){ try{ const s=JSON.parse(localStorage.getItem('srp-spalvos')||'{}'); return Array.isArray(s.palette)?s.palette.filter(c=>c&&c.hex):[]; }catch(e){ return []; } }

/* --- nuotrauka → tinklelis --- */
function patHeightAuto(p){ const g=S.gauges[S.machine]; if(!patImg) return p.H;
  const c=p.crop, w=patImg.width*(c[2]-c[0])/100, h=patImg.height*(c[3]-c[1])/100;
  return Math.max(1,Math.min(400,Math.round(p.W*(h/w)*(g.rows/g.sts)))); }
function patConvert(){
  const p=patState(); if(!patImg) return 'Pirmiausia įkelkite nuotrauką.';
  const W=p.W, H=p.autoH?patHeightAuto(p):p.H; const sc=4, cw=W*sc, ch=H*sc;
  const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch; const ctx=cv.getContext('2d'); if(!ctx) return 'Naršyklė nepalaiko piešimo.';
  const c=p.crop, sx=patImg.width*c[0]/100, sy=patImg.height*c[1]/100, sw=patImg.width*(c[2]-c[0])/100, sh=patImg.height*(c[3]-c[1])/100;
  if(sw<2||sh<2) return 'Per mažas apkarpymas.';
  ctx.imageSmoothingQuality='high'; ctx.drawImage(patImg,sx,sy,sw,sh,0,0,cw,ch);
  const d=ctx.getImageData(0,0,cw,ch).data, all=[];
  for(let o=0;o<d.length;o+=4){ const rgb=[d[o],d[o+1],d[o+2]]; all.push({rgb, lab:pRgb2lab(...rgb)}); }
  // apmokome grupes ant atrankos, tada kiekvienam langeliui imame dažniausią jo taškų spalvą (ne vidurkį – kad spalvos nesusimaišytų)
  const step=Math.max(1,Math.floor(all.length/20000)), train=all.filter((_,i)=>i%step===0);

  let C=pKmeans(train,p.k); const lab2k=all.map(pt=>nearest(pt.lab,C));
  const acc=C.map(()=>[0,0,0,0]); all.forEach((pt,i)=>{ const a=acc[lab2k[i]]; a[0]+=pt.rgb[0];a[1]+=pt.rgb[1];a[2]+=pt.rgb[2];a[3]++; });
  const cellK=new Array(W*H);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const cnt=new Array(C.length).fill(0); for(let j=0;j<sc;j++) for(let i=0;i<sc;i++) cnt[lab2k[(y*sc+j)*cw+x*sc+i]]++; let bi=0; cnt.forEach((v,q)=>{ if(v>cnt[bi]) bi=q; }); cellK[y*W+x]=bi; }
  const used=C.map(()=>0); cellK.forEach(k=>used[k]++);
  let order=C.map((c,j)=>j).filter(j=>used[j]>0).sort((a,b)=>used[b]-used[a]);
  let colors, names=null; const re=[];

function drawCard(cv,p,rowsInfo){

  ctx.fillStyle='#fffdf6'; ctx.fillRect(0,0,cv.width,cv.height); ctx.strokeStyle='#bba'; ctx.strokeRect(mL-6.5,mT-4.5,CW*s+12,Hc*s+8);

  // įvykiai
  const rer=()=>{ save(); viewRastai(); };
  $('#pFile').onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ const im=new Image(); im.onload=()=>{ patImg=im; patImgUrl=rd.result; aiResult=null; aiErr=''; p.crop=[0,0,100,100]; rer(); }; im.src=rd.result; }; rd.readAsDataURL(f); };
  $('#pEmpty').onclick=()=>{ p.autoH=false; p.cells='0'.repeat(p.W*p.H); p.colors=p.colors.slice(0,Math.max(2,p.colors.length)); rer(); };
  document.querySelectorAll('[data-crop]').forEach(i=>i.onchange=()=>{ const k=+i.dataset.crop, v=+i.value; const c=p.crop.slice(); c[k]=v; if(c[2]-c[0]<2||c[3]-c[1]<2) return viewRastai(); p.crop=c; rer(); });

    const x=Math.floor(((ev.clientX-r.left)*sx-G.mL)/G.cw), yy=Math.floor(((ev.clientY-r.top)*sy-G.top)/G.ch); if(x<0||x>=p.W||yy<0||yy>=p.H) return;

  cv.onpointerdown=ev=>{ painting=true; try{cv.setPointerCapture(ev.pointerId);}catch(e){} paintAt(ev); };

  const go=$('#aiGo'); if(go) go.onclick=async()=>{ if(aiBusy) return; aiBusy=true; aiErr=''; viewRastai();
    try{ aiResult=await aiAnalyze(); }catch(e){ aiErr='AI nepavyko: '+(e&&e.message||e)+(aiCfg().prov==='ollama'?' (ar Ollama paleista ir leidžia šią svetainę?)':''); }
    aiBusy=false; if(S.tab==='rastai') viewRastai(); };
  const use=$('#aiUse'); if(use) use.onclick=()=>{ p.k=Math.min(8,Math.max(2,+aiResult.spalvu_skaicius||2)); const msg=patConvert(); if(msg) aiErr=msg; viewRastai(); };

/* --- techninių raštų informacija --- */
function txInfoHtml(p,g){
  const T=TECHS[p.tech], rows=[];
  for(let y=0;y<p.H;y++){ const by={}; for(let x=0;x<p.W;x++){ const v=patGet(p,x,y); if(v>0) (by[v]=by[v]||[]).push(p.W-x); }
    const parts=Object.keys(by).map(v=>`${T.states[v][0].toLowerCase()}: ${by[v].sort((a,b)=>a-b).join(', ')}`); rows.push(parts.length?parts.join('; '):'visos akys mezgamos'); }
  const groups=[]; rows.forEach((t,i)=>{ const L=groups[groups.length-1]; if(L&&L.t===t) L.to=i+1; else groups.push({t,from:i+1,to:i+1}); });
  let vmax=0; for(let x=0;x<p.W;x++){ let run=0; for(let i=0;i<p.H*2;i++){ if(patGet(p,x,i%p.H)>0){ run++; if(run<=p.H) vmax=Math.max(vmax,run); } else run=0; } }
  const extra = T.desc ? T.desc : p.tech==='azuras' ? 'Perkelkite akį perkėlimo įrankiu ant gretimos adatos nurodyta kryptimi; tuščią adatą palikite darbo padėtyje – susidarys skylutė. Akių skaičius nesikeičia.'
    : p.tech==='patiesinimas' ? 'Patiesinama akis tą eilę nemezgama – siūlas užsikabina ant adatos ir sumezgamas kitoje eilėje. Kelios patiesinimo eilės iš eilės toje pačioje adatoje sukuria didesnį reljefą.'
    : 'Praleidžiama akis tą eilę nemezgama, siūlas eina už jos. Kelios praleidimo eilės iš eilės ištempia akį.';
  if(T.noStat) return `<p class="note">${extra}</p><h3>Kas daroma kiekvienoje eilėje</h3><p class="note" style="margin-top:0">Skaičiai – kartotės akys, skaičiuojant iš dešinės.</p><table style="width:100%;border-collapse:collapse;font-size:.88rem">${groups.slice(0,120).map(gr=>`<tr style="border-top:1px solid var(--line)"><td style="padding:4px 6px;font-family:var(--f-mono);white-space:nowrap">${gr.from===gr.to?gr.from:gr.from+'–'+gr.to}</td><td style="padding:4px 6px">${esc(gr.t)}</td></tr>`).join('')}</table>`;
  return `<div class="stats" style="margin-top:10px"><div class="stat"><b>${vmax}</b><span>daugiausia eilių iš eilės toje pačioje adatoje (${T.states[1][0].toLowerCase()})</span></div></div>
    <p class="note">${extra} Kiek eilių iš eilės galima ${p.tech==='patiesinimas'?'patiesinti':p.tech==='praleidimas'?'praleisti':'perkelti'} jūsų siūlais, patikrinkite instrukcijoje ir mėginiu.</p>
    <h3>Kas daroma kiekvienoje eilėje</h3>
    <p class="note" style="margin-top:0">Skaičiai – kartotės akys, skaičiuojant iš dešinės.</p>
    <table style="width:100%;border-collapse:collapse;font-size:.88rem">${groups.slice(0,80).map(gr=>`<tr style="border-top:1px solid var(--line)"><td style="padding:4px 6px;font-family:var(--f-mono);white-space:nowrap">${gr.from===gr.to?gr.from:gr.from+'–'+gr.to}</td><td style="padding:4px 6px">${esc(gr.t)}</td></tr>`).join('')}</table>`;
}

/* --- standartinių raštų biblioteka (originalūs geometriniai motyvai) --- */
function gridFrom(W,H,f){ const rows=[]; for(let y=0;y<H;y++){ let s=''; for(let x=0;x<W;x++) s+=String(f(x,y)|0); rows.push(s); } return rows; } // y=0 – apačia
function artGrid(W,H,art){ // art – eilutės iš viršaus, '#'=1, '<'=1, '>'=2; centruojama
  const ah=art.length, aw=Math.max(...art.map(r=>r.length)), ox=Math.floor((W-aw)/2), oy=Math.floor((H-ah)/2);
  return gridFrom(W,H,(x,y)=>{ const ay=ah-1-(y-oy), ax=x-ox; if(ay<0||ay>=ah||ax<0||ax>=aw) return 0; const c=art[ay][ax]; return c==='#'||c==='<'?1:c==='>'?2:0; }); }
function starF(c,a,b,ai,bi){ return (x,y)=>{ const dx=Math.abs(x-c), dy=Math.abs(y-c); const o=(dx<=a&&dy<=a)||(dx+dy<=b); const i=(dx<=ai&&dy<=ai)||(dx+dy<=bi); return o&&!i; }; }
const LIB_COLOR=[
  {id:'sach',name:'Šachmatai',gen:CW=>{ const b=CW===24?4:3; return {W:2*b,H:2*b,rows:gridFrom(2*b,2*b,(x,y)=>((Math.floor(x/b)+Math.floor(y/b))%2))}; }},
  {id:'akis',name:'Paukščio akis',gen:()=>({W:2,H:2,rows:gridFrom(2,2,(x,y)=>(x+y)%2)})},
  {id:'task',name:'Taškeliai',gen:()=>({W:4,H:4,rows:gridFrom(4,4,(x,y)=>(x===0&&y===0)||(x===2&&y===2))})},
  {id:'hdry',name:'Dryžiai',gen:()=>({W:2,H:4,rows:gridFrom(2,4,(x,y)=>y>=2)})},
  {id:'vdry',name:'Vertikalūs dryžiai',gen:()=>({W:4,H:2,rows:gridFrom(4,2,x=>x<2)})},
  {id:'istr',name:'Įstrižainės',gen:()=>({W:4,H:4,rows:gridFrom(4,4,(x,y)=>((x-y+8)%4)<2)})},
  {id:'zig',name:'Zigzagas',gen:CW=>{ const P=CW===24?8:6, h=P/2; return {W:P,H:h+2,rows:gridFrom(P,h+2,(x,y)=>{ const t=x%P, yy=t<h?t:P-1-t; return y===yy||y===yy+1; })}; }},
  {id:'bang',name:'Bangos',gen:()=>({W:12,H:7,rows:gridFrom(12,7,(x,y)=>{ const c=Math.round(2.5+2.5*Math.sin(2*Math.PI*x/12)); return y===c||y===c+1; })})},
  {id:'romb',name:'Rombai',gen:()=>({W:12,H:12,rows:gridFrom(12,12,(x,y)=>{ const d=Math.abs(x-5.5)+Math.abs(y-5.5); return (d>=4&&d<5.5)||d<1.5; })})},

    return libCache[key]=c.toDataURL(); }catch(e){ return ''; } }

/* --- papildoma spalvotų raštų biblioteka: tradiciniai norvegiški motyvai, bordiūrai, smulkūs raštai ---
   Visi motyvai nupiešti originaliai (taškai '#'=kontrastinė spalva, '.'=fonas). Eilutės rows – nuo apačios. */
(function(){
/* ---------- pagalbinės ---------- */
function mirRow(s,odd){ return s+s.split('').reverse().join('').slice(odd?1:0); }
function quad(q,oddW,oddH){ // q – viršutinis kairysis ketvirtis (su centrine eilute/stulpeliu)
  const top=q.map(r=>mirRow(r,oddW)); const bot=top.slice(0,oddH?-1:undefined).reverse(); return top.concat(bot); }
function padArt(art,W,H,ox,oy){ // art viršus-pirma, dedam į WxH drobę nuo (ox,oy) (iš viršaus kairės)
  const out=[]; for(let y=0;y<H;y++){ let s=''; for(let x=0;x<W;x++){ const ay=y-oy, ax=x-ox; s+=(ay>=0&&ay<art.length&&ax>=0&&ax<art[ay].length)?art[ay][ax]:'.'; } out.push(s); } return out; }
function tile(W,H,stamps){ // stamps: [art,x,y] (viršus-pirma), kartojasi su apvijimu
  const g=[]; for(let y=0;y<H;y++) g.push(new Array(W).fill('.'));
  stamps.forEach(([a,x0,y0])=>{ for(let j=0;j<a.length;j++) for(let i=0;i<a[j].length;i++){ const c=a[j][i]; if(c!=='.') g[(y0+j)%H][(x0+i)%W]=c; } });
  return g.map(r=>r.join('')); }
function fromTop(art){ return art.slice().reverse().map(r=>r.replace(/[^.]/g,c=>c==='2'?'2':'1').replace(/\./g,'0')); }
function A(art){ const H=art.length, W=art[0].length; art.forEach(r=>{ if(r.length!==W) throw new Error('art width '+r.length+' != '+W+' : '+r); }); return {W,H,rows:fromTop(art)}; }
function F(W,H,f){ const art=[]; for(let y=H-1;y>=0;y--){ let s=''; for(let x=0;x<W;x++) s+=f(x,y)?'#':'.'; art.push(s); } return art; } // f su y=0 apačioje
function flipX(a){ return a.map(r=>r.split('').reverse().join('')); }
// 8-krypčių simetrija: f(a,b), a=max(|dx|,|dy|), b=min(|dx|,|dy|) nuo centro
function sym8(n,f){ const c=(n-1)/2; return F(n,n,(x,y)=>{ const dx=Math.abs(x-c), dy=Math.abs(y-c); return f(Math.max(dx,dy),Math.min(dx,dy)); }); }
const PD=(a,b,cx)=>Math.abs(a-cx)+b; // atstumas iki žiedlapio centro (cx, 0)
function waveArt(W,H,amp,phases,thick){ // sujungta sinusoidė
  const mid=(H-1)/2, c=(x,ph)=>Math.round(mid+amp*Math.sin(2*Math.PI*(x+0.5)/W+ph));
  return F(W,H,(x,y)=>phases.some(ph=>{ const yc=c(x,ph), yl=Math.round((c((x+W-1)%W,ph)+yc)/2), yr=Math.round((c((x+1)%W,ph)+yc)/2); return y>=Math.min(yl,yr,yc)&&y<=Math.max(yl,yr,yc); })); }

/* ---------- Selbu tipo aštuonlapės rožės (žiedlapiai + įstrižos šakos, D8 simetrija) ---------- */
const R11=(a,b)=>{ if(a===0) return 1; if(PD(a,b,4)<=1) return 1; return a===b&&a>=2&&a<=3; };
const R15=(a,b)=>{ if(a<=1&&b===0) return 1; if(PD(a,b,5)<=2) return 1; return a===b&&(a===4||a===5); };
const ROSE11=sym8(11,R11);
const ROSE15=sym8(15,R15);
const ROSE17=sym8(17,(a,b)=>{ if(a<=1&&b===0) return 1; if(PD(a,b,6)<=2) return 1; return a===b&&a>=3&&a<=6; });
const ROSE19=sym8(19,(a,b)=>{ if(a<=1&&b===0) return 1; if(PD(a,b,7)<=2) return 1; return a===b&&a>=3&&a<=7&&(a%2===1||a===4); });
const ROSE23=sym8(23,(a,b)=>{ if(a<=5) return R11(a,b); if(PD(a,b,9)<=2) return 1; return a===b&&a>=5&&a<=8; });
const ROSE31=sym8(31,(a,b)=>{ if(a<=7) return R15(a,b); if(PD(a,b,12)<=3) return 1; return a===b&&a>=7&&a<=10; });
const ROSE7=sym8(7,(a,b)=>{ if(a===0) return 1; if(a===3&&b===0) return 1; if(a===b&&a>=1&&a<=2) return 1; return a===2&&b===0||a===3&&b===1&&0; });

/* ---------- snaigės ---------- */
const SNF5=['..#..','#.#.#','.###.','#.#.#','..#..'];
const SNF7=['#..#..#','.#.#.#.','..###..','#######','..###..','.#.#.#.','#..#..#'];
const SNF11=sym8(11,(a,b)=>{ if(b===0) return a<=5; if(a===b) return a<=5; return (a===4&&b===1)||(a===3&&b===1)&&0; });
const SNF15=sym8(15,(a,b)=>{ if(b===0) return a<=7; if(a===b) return a<=7; return (a===5&&b===1)||(a===6&&b===2)&&0||(a===4&&b===1)&&0||(a===6&&b===1); });

const REN_BIG_OLD=['..............#.#..','...............#...','.........#....###..','..........#..#####.','..........#.#####..','..........#########','.##......#########.','.##...###########..','..###############..','...##############..','....#############..','....###.......###..','....###.......###..','....###.......###..'].map(r=>r.slice(0,19));

const HRT11=['..###.###..','.#...#...#.','#.........#','#.........#','.#.......#.','..#.....#..','...#...#...','....#.#....','.....#.....'];
const HRT15=['..####...####..','.#....#.#....#.','#......#......#','#.............#','#.............#','.#...........#.','..#.........#..','...#.......#...','....#.....#....','.....#...#.....','......#.#......','.......#.......'];

/* ---------- bordiūrai ---------- */
function peaks(W,H,list){ return F(W,H,(x,y)=>{ if(y===0) return 1; let h=0; list.forEach(([cx,hp])=>{ [-W,0,W].forEach(o=>{ h=Math.max(h,hp-Math.abs(x-cx-o)); }); }); return y<h; }); }

const KORS_X=tile(4,4,[[['#.#','.#.','#.#'],0,0]]);

const KORS_OUT=['....###....','....#.#....','....#.#....','....#.#....','#####.#####','#.........#','#####.#####','....#.#....','....#.#....','....#.#....','....###....'];

  const cx=Math.min(Math.abs(x-6),12-Math.abs(x-6)), cy=Math.min(y,12-y); // plius rombų centruose (6,0) ir (0,6)
  const d1=Math.abs(x-6)+Math.min(y,12-y), d2=Math.min(x,12-x)+Math.abs(y-6); return d1<=1||d2<=1; });

const YOKE12=(()=>{ const full='############', lice1='#.#.#.#.#.#.', lice2='.#.#.#.#.#.#', gap='............';

/* ================= RANKINIS MEZGIMAS =================
   Rankinio mezgimo instrukcijos iš tų pačių eilių duomenų (simulate → parts[].rows), apskaičiuotų su rankinio mezgimo mėginiu.
   Geometrija neperskaičiuojama: imami akių skaičiai kiekvienoje eilėje ir paverčiami rankinio mezgimo veiksmais.
   Kryptys: kairė/dešinė – žiūrint į veidinę pusę (kaip schemoje). Nelyginės eilės – veidinė pusė (mezgama iš dešinės į kairę). */
const HK_DEF={sts:22, rows:30, ribRows:32, needle:'4 mm', ribNeedle:'3,5 mm', method:'plokscia', rib:'1x1', shoulder:'wt', thumb:'pleistas', sock:'virsus'};
const HK_OPT={
  method:[['plokscia','Plokščiai (detalės susiuvamos)'],['apvaliai','Apvaliai (kur įmanoma)']],
  rib:[['1x1','1×1 (1 veid., 1 išv.)'],['2x2','2×2 (2 veid., 2 išv.)'],['keliar','Keliaraištis']],
  shoulder:[['wt','Trumposios eilės su apvyniojimu (w&t)'],['vokiskos','Vokiškos trumposios eilės'],['laiptai','Laiptuotas uždarymas']],
  thumb:[['pleistas','Nykščio pleištas'],['veliau','Įmegztas vėliau (pagalbinis siūlas)']],
  sock:[['virsus','Nuo viršaus apvaliai – kulnas su sienele ir pleištais'],['pirstai','Nuo pirštų apvaliai – kulnas trumposiomis eilėmis'],['plokscia','Plokščiai su siūle']]
};
const HK_M='_RANKA';
try{ if(!MACHINES[HK_M]) Object.defineProperty(MACHINES,HK_M,{value:{id:HK_M,name:'Rankomis',full:'Rankinis mezgimas',needles:1e6,pitch:0,kind:'',ribber:false,card:0},enumerable:false,configurable:true}); }catch(e){}

function hkState(){
  let h=S.hand; if(!h||typeof h!=='object') h=S.hand={};
  Object.keys(HK_DEF).forEach(k=>{ if(h[k]==null||h[k]==='') h[k]=HK_DEF[k]; });
  ['sts','rows','ribRows'].forEach(k=>{ const v=+h[k]; h[k]=(v>0&&isFinite(v))?Math.min(v,80):HK_DEF[k]; });
  Object.keys(HK_OPT).forEach(k=>{ if(!HK_OPT[k].some(o=>o[0]===h[k])) h[k]=HK_DEF[k]; });
  return h;
}
try{ hkState(); }catch(e){}
function hkG(){ const h=hkState(); return {sts:h.sts, rows:h.rows, ribRows:h.ribRows, spc:h.sts/10, rpc:h.rows/10, rrpc:h.ribRows/10}; }
// Apskaičiuoja detalę su rankinio mezgimo mėginiu. Karietėlės pusė fiksuojama 'D', kad eilių lyginumas sutaptų su rankinio mezgimo puse.
function hkCompute(gk,pid){
  const H=hkState(), gauge={name:'', sts:H.sts, rows:H.rows, ribRows:H.ribRows, ribType:'ne'};
  const car=S.carriage; S.carriage='D';
  try{ return computePiece(gk,pid,{gauge, machine:HK_M}); } finally{ S.carriage=car; }
}

/* ---------- tekstas ---------- */
function hkForm(n,f1,f2,f3){ n=Math.abs(n)%100; const d=n%10; if(n>10&&n<20) return f3; if(d===1) return f1; if(d>=2) return f2; return f3; }
const hkKart=n=>`${n} ${hkForm(n,'kartą','kartus','kartų')}`;
const hkRat=n=>`${n} ${hkForm(n,'ratą','ratus','ratų')}`;
const hkEil=n=>`${n} ${hkForm(n,'eilę','eiles','eilių')}`;
const hkDot=t=> /[.!?]$/.test(t)?t:t+'.';
const hkEdge=e=> e==='R'?'dešiniajame':'kairiajame';
const hkStartE=r=> r%2 ? 'R' : 'L';           // plokščiai: nelyginė (veidinė) eilė prasideda dešiniajame krašte
const hkSide=r=> r%2 ? 'veid.' : 'išv.';
function hkRibName(){ const r=hkState().rib; return r==='2x2'?'2×2 (2 veid., 2 išv.)':r==='keliar'?'keliaraiščiu':'1×1 (1 veid., 1 išv.)'; }
// Juostos akių skaičius: apvaliai 1×1 – lyginis, 2×2 – kartotinis 4; plokščiai 2×2 – 4k+2 (simetriškai).
function hkRibFix(n, round){
  const r=hkState().rib; let k=n;
  if(r==='1x1' && round) k=2*Math.max(2,Math.round(n/2));
  if(r==='2x2') k= round ? 4*Math.max(1,Math.round(n/4)) : 4*Math.max(1,Math.round((n-2)/4))+2;
  return {n:k, d:n-k};
}
function hkAdjText(d){ return d>0 ? `Po juostos pirmoje eilėje tolygiai pridėkite ${d} ak.` : d<0 ? `Po juostos pirmoje eilėje tolygiai sumažinkite ${-d} ak.` : ''; }
// Pradžia: užmetimas + juosta
function hkStart(n, ribCm, round, o){
  o=o||{}; const g=hkG(), H=hkState(), items=[];

    case 'inc': return round ? `ties žymekliu pridėkite 1 ak.` : `${pos} (${hkEdge(e.edge)} krašte) pridėkite 1 ak.`;

const HK_TECHTYPE={dec2:'dec',dec:'dec',inc2:'inc',inc:'inc',bo:'bo',bo2:'bo',co:'co',co2:'co'};
function hkWidthMap(part){ const m=new Map(); part.rows.forEach(r=>m.set(r.rc, Math.max(0,r.R-r.L))); return r=>{ if(m.has(r)) return m.get(r); let best=null; m.forEach((v,k)=>{ if(k<=r) best=v; }); return best==null?Math.max(0,part.sR-part.sL):best; }; }

      text:`Peties nuolydis trumposiomis eilėmis (${wt?'w&t':'vokiškos'}), ${hkEdge(edge)} krašte: ${hkDot(list.map(x=>`${x.r-off} eil. – nemegzkite paskutinių ${x.cum} ak.`).join('; '))} Kiekvieną kartą ${wt?'apvyniokite kitą akį ir apsukite darbą':'apsukite darbą ir padarykite dvigubą akį'}, grįžkite iki kaklo krašto.`, sts:null});

// Viena dalis (part) plokščiai: įvykiai nuo eilės o.from (išskirtinai)
function hkPartSection(R, idx, o, tech){
  const sim=R.sim, geom=R.geom, part=sim.parts[idx];

  const shEdges=(geom.shoulderSides||['L','R']).filter(e=>e!==neckEdge);
  const rpc=hkG().rpc;
  const raw=hkRaw(part,{rpc, ss:geom.ss, shEdges});
  const ev=raw.ev.filter(e=>e.r>(o.from||0) && !(o.skip&&o.skip(e)));
  const conv=hkConvert(ev, o.round);
  const sh=conv.filter(e=>e.type==='sh'), sr=conv.filter(e=>e.type==='sr'), oth=conv.filter(e=>e.type!=='sh'&&e.type!=='sr');
  const done = sim.rc0!=null && idx===0;  // pagrindinė dalis baigiasi ties iškirpte
  const early={L:0,R:0};
  if(done){ sh.forEach(e=>{ early[e.edge]+=e.n; oth.push({type:e.n>1?'bo':'dec', r:hkStartE(e.r)===e.edge?e.r:e.r+1, edge:e.edge, n:e.n}); }); oth.sort((a,b)=>a.r-b.r); sh.length=0; }
  let items=hkItemsFromEvents(oth, part, o, tech);

  if(!done){
    let tot = geom.finish==='shoulder' && sim.shoulders.length ? (sim.shoulders[idx===2?1:0]) : null;
    if(tot!=null && o.early && shEdges.length===1) tot-=o.early[shEdges[0]]||0;
    if(sh.length){
      ['R','L'].forEach(edge=>{ const st=sh.filter(e=>e.edge===edge); if(st.length) items.push(...hkShoulderItems(st, edge, o, raw.lastRow, raw.lastW, shEdges.length===1?tot:null, tech)); });
    } else {

    same.forEach(it=>items.splice(items.indexOf(it),1)); });

}

function hkNeckSplit(R, so, tech){
  const sim=R.sim, rc0=sim.rc0, r1=rc0+1;

  const split=[{r:r1, a:r1-off, sub:hkSub(r1,so), text:`${cap1(pre.join(' '))}${pre.length?' ':''}${pre.length?'numegzkite':'Numegzkite'} ${a} ak., vidurines ${c} ak. uždarykite (arba nuimkite ant pagalbinio siūlo), numegzkite likusias ${b} ak. Toliau kiekvieną pusę mezgame atskirai: pirmiausia kairę (ką tik numegztos ${b} ak.), dešinės pusės ${a} ak. palikite ant virbalo.`, sts:a+b}];
  const left=hkPartSection(R, 2, {...so, splitRow:r1, from:r1-1, skip:e=>e.r===r1 && e.edge==='R'}, tech);

/* ---------- apvaliai: vamzdis iki pažastų / rankovės viršaus ---------- */
function hkTubeEnd(R, thr){
  const rpc=hkG().rpc, rows=R.sim.parts[0].rows;
  const q=rows.find(r=>r.yr!=null && hkYofRow(r,rpc)>thr+1e-9);
  if(!q) return rows.length?rows[rows.length-1].rc:0;
  let T=q.rc-1; if(T%2) T--; return Math.max(0,T);
}
function hkTube(list, o, tech){
  // list: [{R, name, T}] – pirmoji detalė nusako formavimą (kitos tokios pat)
  const g=hkG(), first=list[0], markers=list.length;
  const N=list.reduce((a,x)=>a+x.R.sim.castOn.n,0);
  const mk = markers===2 ? `Rato pradžioje (kairysis šonas) užkabinkite žymeklį, po ${list[0].R.sim.castOn.n} ak. – antrą žymeklį (dešinysis šonas).` : 'Rato pradžioje (apačioje, siūlės vietoje) užkabinkite žymeklį.';
  const st=hkStart(N, first.R.geom.ribCm||0, true, {markers:mk, small:o.small});
  const so={round:true, ribCm:st.ribCmReal, off:0, markers};
  const part=first.R.sim.parts[0];
  const raw=hkRaw(part,{rpc:g.rpc, ss:null, shEdges:[]});
  const ev=hkConvert(raw.ev.filter(e=>e.r<=first.T && e.type!=='sr'), true);
  // akių skaičius rate = visų detalių suma
  const Ws=list.map(x=>hkWidthMap(x.R.sim.parts[0]));
  const sumW=r=>list.reduce((a,x,i)=>a+Ws[i](r+(x.T-first.T)),0);
  const items=hkItemsFromEvents(ev, part, so, tech).map(it=>({...it, sts:sumW(it.re||it.r)}));
  // įsiuvė (tik priekyje)
  list.forEach(x=>{ if(x===first) return; const rr=hkRaw(x.R.sim.parts[0],{rpc:g.rpc, ss:null, shEdges:[]}); rr.ev.filter(e=>e.type==='sr' && e.r<=x.T).forEach(e=>{ const it=hkSrItem(e,{off:0},tech,`Krūtinės įsiuvė – tik ${x.name.toLowerCase()} akyse (pirmyn ir atgal)`); it.text+=' Ratų skaičius nesikeičia – šios eilės papildomos.'; items.push(it); }); });
  items.sort((a,b)=>a.r-b.r);
  return {start:st.items, items, so, N, ribR:st.ribR};
}

    let pk=F/2+1, pk2=pk; if((mid+pk+pk2-h)%2) pk2++;
