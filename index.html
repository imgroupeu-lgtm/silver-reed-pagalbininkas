     <h3>Apkarpymas (kurią nuotraukos dalį imti)</h3>
     <div class="fields">${[['Kairė',0],['Viršus',1],['Dešinė',2],['Apačia',3]].map(([l,i])=>`<label class="f">${l} <span class="in"><input type="range" min="0" max="100" step="1" data-crop="${i}" value="${crop[i]}" style="width:100%"></span></label>`).join('')}</div>
     <div class="row" style="margin-top:10px"><button class="btn" id="aiGo">${aiBusy?'AI galvoja…':'🤖 AI: atpažinti raštą'}</button></div>`:''}
     ${aiErr?`<div class="warn" style="margin-top:8px">${esc(aiErr)}</div>`:''}
     ${aiResult?`<div class="panel" style="margin-top:10px;background:var(--sunk)"><b>AI pasiūlymas – patikrinkite mėginiu</b>
       <p style="margin:6px 0"><b>${esc(aiResult.tipas||'?')}</b> · tikrumas: ${esc(aiResult.tikrumas||'?')}${aiResult.spalvu_skaicius?` · spalvų: ${esc(aiResult.spalvu_skaicius)}`:''}${aiResult.daugiausia_spalvu_eileje?` · eilėje iki ${esc(aiResult.daugiausia_spalvu_eileje)}`:''}</p>
       <p class="note" style="margin:4px 0">${esc(aiResult.aprasymas||'')}</p>
       ${aiResult.kaip_megzti?`<p style="margin:4px 0;font-size:.9rem"><b>Kaip megzti:</b> ${esc(aiResult.kaip_megzti)}</p>`:''}
       ${(aiResult.pastabos||[]).length?`<ul class="note" style="margin:4px 0;padding-left:18px">${aiResult.pastabos.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}
       <p class="note" style="margin:4px 0">Modelis: ${esc(aiResult._model||'')}</p>
       ${aiResult.galima_paversti_schema?`<button class="btn primary" id="aiUse">Paversti schema (${Math.min(8,Math.max(2,+aiResult.spalvu_skaicius||2))} spalv.)</button>`:''}</div>`:''}
     <details class="grp" ${S.open.ai?'open':''} data-id="ai"><summary>AI nustatymai</summary><div class="fields">
       <label class="f full">Teikėjas<span class="in"><select id="aiProv">${[['gemini','Google Gemini (nemokamas planas)'],['openrouter','OpenRouter (nemokami modeliai, pvz. Qwen)'],['ollama','Ollama savo kompiuteryje']].map(([v,l])=>`<option value="${v}" ${ai.prov===v?'selected':''}>${l}</option>`).join('')}</select></span></label>
       ${ai.prov!=='ollama'?`<label class="f full">API raktas<span class="in"><input id="aiKey" type="password" autocomplete="off" value="${esc(ai.key)}" placeholder="${ai.prov==='gemini'?'iš aistudio.google.com':'iš openrouter.ai/keys'}"></span><span class="hint">Raktas saugomas tik šiame įrenginyje. Siunčiama tik nuotrauka ir užklausa.</span></label>`
         :`<label class="f full">Ollama adresas<span class="in"><input id="aiHost" value="${esc(ai.host)}"></span><span class="hint">Ollama turi leisti šią svetainę: nustatykite OLLAMA_ORIGINS=https://imgroupeu-lgtm.github.io ir paleiskite Ollama iš naujo.</span></label>`}
       <label class="f full">Modelis<span class="in"><input id="aiModel" value="${esc(ai.model)}" placeholder="${AI_DEF_MODEL[ai.prov]}"></span><span class="hint">Palikite tuščią – bus naudojamas ${AI_DEF_MODEL[ai.prov]}.</span></label>
       <p class="note full" style="margin:0">${ai.prov==='gemini'?'Nemokamo Gemini plano užklausas Google gali naudoti savo produktams tobulinti. Dienos ribos – jūsų AI Studio paskyroje.':ai.prov==='openrouter'?'„openrouter/free“ kaskart parenka atsitiktinį nemokamą modelį – kokybė gali svyruoti.':'Veikia tik kai kompiuteris įjungtas ir Ollama paleista.'}</p>
     </div></details>

     <h2 style="margin-top:16px">2. Schemos nustatymai</h2>
     <div class="seg" role="group" style="margin-bottom:10px">${[['kartote',`Kartotė (korta ${CW} ak.)`],['laisvas','Laisvas motyvas']].map(([v,l])=>`<button data-pmode="${v}" aria-pressed="${p.mode===v}">${l}</button>`).join('')}</div>
     <div class="fields">
       ${p.mode==='kartote'?`<label class="f">Plotis<span class="in"><select id="pW">${divisors(CW).filter(v=>v>=2).map(v=>`<option ${p.W===v?'selected':''}>${v}</option>`).join('')}</select><span class="u">ak.</span></span><span class="hint">Turi dalytis iš ${CW}.</span></label>`
        :`<label class="f">Plotis<span class="in"><input id="pW" type="number" inputmode="numeric" min="2" max="${m.needles}" value="${p.W}"><span class="u">ak.</span></span></label>`}
       <label class="f">Aukštis<span class="in"><input id="pH" type="number" inputmode="numeric" min="1" max="400" value="${p.autoH&&patImg?patHeightAuto(p):p.H}" ${p.autoH&&patImg?'disabled':''}><span class="u">eil.</span></span>
         <span class="hint"><label><input type="checkbox" id="pAutoH" ${p.autoH?'checked':''}> pagal nuotrauką ir mėginį</label></span></label>
       <label class="f">Spalvų skaičius<span class="in"><input id="pK" type="number" inputmode="numeric" min="2" max="8" value="${p.k}"></span></label>
       <label class="f">Spalvos<span class="in"><select id="pPal"><option value="0">pagal nuotrauką</option><option value="1" ${p.usePal?'selected':''} ${yp.length<2?'disabled':''}>mano siūlų paletė (${yp.length})</option></select></span>${yp.length<2?'<span class="hint">Paletę sudarykite „Spalvų pagalbininke“.</span>':''}</label>
       <label class="f full"><span><input type="checkbox" id="pMax2" ${p.max2?'checked':''}> Ne daugiau kaip 2 spalvos eilutėje (būtina mezgant korta)</span></label>
     </div>
     <div class="row" style="margin-top:12px"><button class="btn primary" id="pConv" ${patImg?'':'disabled'}>Paversti schema →</button><span class="note" id="pMsg"></span></div>
     <p class="note">Vienas langelis = viena akis. Langelio aukštis pagal mėginį (${g.sts} ak. × ${g.rows} eil. / 10 cm), todėl schema atrodo taip, kaip bus numegzta. Raštas: ${fmt(p.W*10/g.sts)} × ${fmt(p.H*10/g.rows)} cm.</p>
   </section>

   <section class="panel" id="pRes">
     <div class="row" style="justify-content:space-between"><h2 style="margin:0">3. Schema ${p.W} ak. × ${p.H} eil.</h2>
       <div class="row noprint"><button class="btn" id="pPrint">Spausdinti</button><a class="btn" id="pPng" download="rastas.png" href="#">PNG</a></div></div>
     <p class="note">Skaitykite iš apačios: 1-oji eilė apačioje, akys numeruojamos iš dešinės. Bakstelėkite langelį – jis nusidažys pasirinkta spalva.</p>
     <div class="row noprint" style="margin-bottom:8px">${p.colors.map((c,i)=>`<button class="btn" data-paint="${i}" aria-pressed="${p.paint===i}" style="${p.paint===i?'outline:3px solid var(--accent);':''}display:inline-flex;gap:6px;align-items:center">${sw(i)} ${PSYM[i]||''} ${cname(i)}</button><input type="color" data-recol="${i}" value="${p.colors[i]}" aria-label="Keisti spalvą ${i+1}" style="width:34px;height:34px;border:0;background:none">`).join('')}
       ${p.colors.length<8?'<button class="btn" id="pAddC">+ spalva</button>':''}
       <label class="note"><input type="checkbox" id="pSym" ${p.sym?'checked':''}> simboliai</label></div>
     <div id="pChartBox" style="overflow:auto;max-width:100%"><canvas id="pChart" style="touch-action:none;display:block"></canvas></div>
     <div class="stats" style="margin-top:10px">
       <div class="stat"><b>${p.colors.length}</b><span>spalvų</span></div>
       <div class="stat"><b>${fl.n}</b><span>ilgiausias tempas, ak. (${fmt(fl.n*10/g.sts)} cm, ${fl.row}-oji eil.)</span></div>
       <div class="stat"><b>${over2.length}</b><span>eilių su >2 spalvom</span></div>
     </div>
     ${over2.length?`<div class="warn">Eilėse ${over2.slice(0,15).join(', ')}${over2.length>15?'…':''} yra daugiau nei 2 spalvos – korta tokių eilių numegzti negalima. Įjunkite „Ne daugiau kaip 2 spalvos eilutėje“ arba pataisykite rankiniu būdu.</div>`:''}
     <p class="note">Tempas – kiek akių iš eilės siūlas eina išvirkščioje pusėje nemezgamas. Ar jis ne per ilgas jūsų siūlams, patikrinkite mėginiu.</p>
     <h3>Spalvos pagal eiles</h3>
     <table style="width:100%;border-collapse:collapse;font-size:.88rem">${groups.slice(0,60).map(gr=>`<tr style="border-top:1px solid var(--line)"><td style="padding:4px 6px;font-family:var(--f-mono)">${gr.from===gr.to?gr.from:gr.from+'–'+gr.to}</td><td style="padding:4px 6px">${sw(gr.A)} A: ${cname(gr.A)}</td><td style="padding:4px 6px">${gr.B!=null?sw(gr.B)+' B: '+cname(gr.B):'tik viena spalva'}</td></tr>`).join('')}</table>
     <p class="note">A – pagrindinė (dažniausia) eilės spalva, B – antroji.</p>

     <h2 style="margin-top:18px">4. Perforuota korta</h2>
     ${p.mode!=='kartote'?`<p class="note">Laisvas motyvas kortai netinka – kortos plotis ${CW} ak. Naudokite schemą (rankinis adatų atrinkimas arba intarsija), arba perjunkite į „Kartotė“.</p>`
      : !cardOk?`<div class="warn">Kortai reikia: plotis, kuris dalijasi iš ${CW}, ir ne daugiau 2 spalvų eilutėje.</div>`
      :`<div class="row noprint" style="margin-bottom:6px">
         <label class="note"><input type="checkbox" id="pHoles" ${p.holesB?'checked':''}> skylė = spalva B</label>
         <label class="note"><input type="checkbox" id="pMirror" ${p.mirror?'checked':''}> veidrodžiu</label>
         <label class="f" style="flex-direction:row;align-items:center;gap:6px">Kortos eilių <span class="in" style="width:90px"><input id="pCardR" type="number" min="${p.H}" step="${p.H}" value="${cardLen(p)}"></span></label></div>
       <div style="overflow:auto"><canvas id="pCard"></canvas></div>
       <p class="note" id="pCardInfo"></p>
       <p class="note">Ar skylė mezga A ar B spalvą ir kaip korta sulygiuojama su adatomis, priklauso nuo mašinos nustatymo – patikrinkite ${m.name} instrukcijos Fair Isle skyriuje ir prieš pradurdami korta numegzkite mėginį. Mezgama išvirkščia puse į save, todėl nesimetriškas raštas gali išeiti veidrodžiu – tam yra „veidrodžiu“. Mažiausią kortos ilgį sujungimui žiedu patikrinkite instrukcijoje.</p>`}

     <h2 style="margin-top:18px">5. Raštas ant detalės</h2>
     <div class="fields">
       <label class="f">Detalė (${esc(GARMENTS[S.garment].name)})<span class="in"><select id="pPiece">${GARMENTS[S.garment].pieces.filter(x=>['body','front','cfront','sleeve','trousers'].includes(x.kind)).map(x=>`<option value="${x.id}" ${p.piece===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select></span></label>
       <label class="f">Pradėti nuo eilės<span class="in"><input id="pStart" type="number" inputmode="numeric" min="1" value="${p.startRow}"></span><span class="hint">po juosta</span></label>
       <label class="f">Rašto juosta<span class="in"><input id="pBand" type="number" inputmode="numeric" min="0" value="${p.bandRows}"><span class="u">eil.</span></span><span class="hint">0 = iki galo</span></label>
     </div>
     <div style="margin-top:10px;overflow:hidden"><canvas id="pPieceCv" style="display:block;margin:0 auto;max-width:100%"></canvas></div>
     <p class="note" id="pPieceInfo"></p>
   </section>
  </div>`;
  // schema
  const cv=$('#pChart'), box=$('#pChartBox'), opt={size:cellSize(p,box)}; drawChart(cv,p,opt);
  try{ $('#pPng').href=cv.toDataURL('image/png'); }catch(e){}
  if(cardOk){ const info=drawCard($('#pCard'),p,rowsInfo); if(info) $('#pCardInfo').textContent=`Korta ${CW} ak. × ${info.Hc} eil.: kartotė ${p.W} ak. telpa ${info.reps} kart. per plotį, ${info.Hc/p.H} kart. per ilgį. Skylių: ${info.holes}.`; }
  const pi=drawOnPiece($('#pPieceCv'),p);
  if(pi) $('#pPieceInfo').textContent=`${pi.name}: plačiausioje vietoje ${pi.maxW} ak. ≈ ${fmt(pi.reps)} kartotės. Kartotės vidurys sutampa su adatų lovos viduriu (0), todėl raštas abiejuose šonuose vienodas. Detalės matmenys – iš skirtuko „3. Detalės“.`;
  // įvykiai
  const rer=()=>{ save(); viewRastai(); };
  $('#pFile').onchange=e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ const im=new Image(); im.onload=()=>{ patImg=im; patImgUrl=rd.result; aiResult=null; aiErr=''; p.crop=[0,0,100,100]; rer(); }; im.src=rd.result; }; rd.readAsDataURL(f); };
  $('#pEmpty').onclick=()=>{ p.autoH=false; p.cells='0'.repeat(p.W*p.H); p.colors=p.colors.slice(0,Math.max(2,p.colors.length)); rer(); };
  document.querySelectorAll('[data-crop]').forEach(i=>i.onchange=()=>{ const k=+i.dataset.crop, v=+i.value; const c=p.crop.slice(); c[k]=v; if(c[2]-c[0]<2||c[3]-c[1]<2) return viewRastai(); p.crop=c; rer(); });
  document.querySelectorAll('[data-pmode]').forEach(b=>b.onclick=()=>{ p.mode=b.dataset.pmode; if(p.mode==='kartote' && CW%p.W!==0){ patResize(p,CW,p.H); } rer(); });
  const pW=$('#pW'); pW.onchange=()=>{ let v=Math.max(2,Math.min(m.needles,parseInt(pW.value)||p.W)); if(p.autoH&&patImg){ p.W=v; patConvert(); } else patResize(p,v,p.H); rer(); };
  const pH=$('#pH'); pH.onchange=()=>{ const v=Math.max(1,Math.min(400,parseInt(pH.value)||p.H)); patResize(p,p.W,v); rer(); };
  $('#pAutoH').onchange=e=>{ p.autoH=e.target.checked; rer(); };
  $('#pK').onchange=e=>{ p.k=Math.max(2,Math.min(8,parseInt(e.target.value)||2)); save(); };
  $('#pPal').onchange=e=>{ p.usePal=e.target.value==='1'; save(); };
  $('#pMax2').onchange=e=>{ p.max2=e.target.checked; if(p.max2) patLimit2(p); rer(); };
  $('#pConv').onclick=()=>{ const msg=patConvert(); if(msg) $('#pMsg').textContent=msg; else viewRastai(); };
  document.querySelectorAll('[data-paint]').forEach(b=>b.onclick=()=>{ p.paint=+b.dataset.paint; rer(); });
  document.querySelectorAll('[data-recol]').forEach(i=>i.onchange=()=>{ p.colors[+i.dataset.recol]=i.value; if(p.colorNames) p.colorNames[+i.dataset.recol]=null; rer(); });
  const add=$('#pAddC'); if(add) add.onclick=()=>{ p.colors.push('#c0392b'); p.paint=p.colors.length-1; rer(); };
  $('#pSym').onchange=e=>{ p.sym=e.target.checked; rer(); };
  $('#pPrint').onclick=()=>{ try{ window.print(); }catch(e){} };
  let painting=false; const paintAt=ev=>{ const G=opt.geom; if(!G) return; const r=cv.getBoundingClientRect(), sx=cv.width/r.width, sy=cv.height/r.height;
    const x=Math.floor(((ev.clientX-r.left)*sx-G.mL)/G.cw), yy=Math.floor(((ev.clientY-r.top)*sy-G.top)/G.ch); if(x<0||x>=p.W||yy<0||yy>=p.H) return;
    const y=p.H-1-yy, i=y*p.W+x, ch=String.fromCharCode(48+p.paint); if(p.cells[i]===ch) return; p.cells=p.cells.slice(0,i)+ch+p.cells.slice(i+1); drawChart(cv,p,opt); };
  cv.onpointerdown=ev=>{ painting=true; try{cv.setPointerCapture(ev.pointerId);}catch(e){} paintAt(ev); };
  cv.onpointermove=ev=>{ if(painting) paintAt(ev); };
  cv.onpointerup=cv.onpointercancel=()=>{ if(painting){ painting=false; rer(); } };
  if($('#pHoles')){ $('#pHoles').onchange=e=>{ p.holesB=e.target.checked; rer(); }; $('#pMirror').onchange=e=>{ p.mirror=e.target.checked; rer(); };
    $('#pCardR').onchange=e=>{ let v=parseInt(e.target.value)||0; v=Math.max(p.H,Math.round(v/p.H)*p.H); p.cardRows=v; rer(); }; }
  $('#pPiece').onchange=e=>{ p.piece=e.target.value; rer(); };
  $('#pStart').onchange=e=>{ p.startRow=Math.max(1,parseInt(e.target.value)||1); rer(); };
  $('#pBand').onchange=e=>{ p.bandRows=Math.max(0,parseInt(e.target.value)||0); rer(); };
  // AI
  const det=document.querySelector('details[data-id="ai"]'); det.ontoggle=()=>{ S.open.ai=det.open; save(); };
  $('#aiProv').onchange=e=>{ const c=aiCfg(); c.prov=e.target.value; c.model=''; c.key=''; aiSave(c); viewRastai(); };
  const k=$('#aiKey'); if(k) k.onchange=()=>{ const c=aiCfg(); c.key=k.value.trim(); aiSave(c); };
  const h=$('#aiHost'); if(h) h.onchange=()=>{ const c=aiCfg(); c.host=h.value.trim(); aiSave(c); };
  $('#aiModel').onchange=e=>{ const c=aiCfg(); c.model=e.target.value.trim(); aiSave(c); };
  const go=$('#aiGo'); if(go) go.onclick=async()=>{ if(aiBusy) return; aiBusy=true; aiErr=''; viewRastai();
    try{ aiResult=await aiAnalyze(); }catch(e){ aiErr='AI nepavyko: '+(e&&e.message||e)+(aiCfg().prov==='ollama'?' (ar Ollama paleista ir leidžia šią svetainę?)':''); }
    aiBusy=false; if(S.tab==='rastai') viewRastai(); };
  const use=$('#aiUse'); if(use) use.onclick=()=>{ p.k=Math.min(8,Math.max(2,+aiResult.spalvu_skaicius||2)); const msg=patConvert(); if(msg) aiErr=msg; viewRastai(); };
}

render();
</script>

<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{})); }
</script>
</body>
</html>
