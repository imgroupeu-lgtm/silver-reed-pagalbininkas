}
function stSkinLive(){ const w=$('#st-f-skin'); if(w&&typeof recYarnWarn==='function'&&stUI.draft) w.innerHTML=recYarnWarn(stUI.draft); }
function stBind(gk,plan){
  const ctx0=()=>stCtx();
  const V=$('#view'), rer=()=>{ save(); viewStash(); };
  V.querySelectorAll('input[data-f],select[data-f]').forEach(el=>el.addEventListener('input',()=>{ const d=stUI.draft, k=el.dataset.f;
    if(k==='name'||k==='color'||k==='fiber'||k==='spin') d[k]=el.value; else if(k==='strands') d.strands=+el.value||1;
    else if(k.startsWith('g.')){ d.gauge=d.gauge||{}; d.gauge[k.slice(2)]=stNum(el.value); } else d[k]=stNum(el.value); }));
  V.querySelectorAll('select[data-f]').forEach(el=>el.addEventListener('change',()=>{ const k=el.dataset.f; if(k==='strands') stUI.draft.strands=+el.value||1; else stUI.draft[k]=el.value; stSkinLive(); }));
  const mi=$('#st-f-micron'); if(mi) mi.addEventListener('change',stSkinLive);
  const ph=$('#st-photo'); if(ph) ph.onchange=()=>{ const f=ph.files&&ph.files[0]; if(!f) return;
    stThumb(f, r=>{ if(!r){ stUI.msg='Nuotraukos nepavyko nuskaityti.'; viewStash(); return; } stUI.draft.photo=r.url; if(r.avg) stUI.draft.color=r.avg; stUI.msg=''; viewStash(); }); };
  const im=$('#st-ph'); if(im) im.onclick=ev=>{ const c=stSample(im,ev); if(c){ stUI.draft.color=c; const ci=$('#st-f-color'); if(ci) ci.value=c; } };
  V.querySelectorAll('[data-sel]').forEach(el=>el.onchange=()=>{ stUI.sel[el.dataset.sel]=el.checked; stUI.palArm=false; viewStash(); });
  V.querySelectorAll('[data-pp]').forEach(el=>el.onchange=()=>{ if(el.value==='') delete plan.pieces[el.dataset.pp]; else plan.pieces[el.dataset.pp]=el.value; rer(); });
  V.querySelectorAll('[data-pl]').forEach(el=>el.onchange=()=>{ plan[el.dataset.pl]=el.value; rer(); });
  const rs=$('#st-res'); if(rs) rs.onchange=()=>{ S.stashOpt.reserve=stNum(rs.value); rer(); };
  const sc=$('#st-scope'); if(sc) sc.onchange=()=>{ S.stashOpt.scope=sc.value; stUI.sTouched=true; rer(); };
  const seq=()=>{ const sc0=S.stashOpt.scope, k=(sc0==='*'||GARMENTS[gk].pieces.some(x=>x.id===sc0))?sc0:'*'; return plan.stripes[k]||(plan.stripes[k]=[]); };
  V.querySelectorAll('[data-sy]').forEach(el=>el.onchange=()=>{ seq()[+el.dataset.sy].y=el.value; rer(); });
  V.querySelectorAll('[data-sr]').forEach(el=>el.onchange=()=>{ seq()[+el.dataset.sr].rows=Math.max(1,Math.round(stNum(el.value))||1); rer(); });
  const osel=$('#st-oscope'); if(osel) osel.onchange=()=>{ S.stashOpt.oscope=osel.value; stUI.oTouched=true; rer(); };
  const ombO=create=>{ const k0=S.stashOpt.oscope, k=(k0==='*'||GARMENTS[gk].pieces.some(x=>x.id===k0))?k0:'*';
    if(!plan.ombre[k]&&create) plan.ombre[k]={yarns:[],method:'fade',zoneCm:8,unit:2,stages:''}; return plan.ombre[k]; };
  V.querySelectorAll('[data-oy]').forEach(el=>el.onchange=()=>{ ombO(true).yarns[+el.dataset.oy]=el.value; rer(); });
  V.querySelectorAll('[data-om]').forEach(el=>el.onchange=()=>{ const o=ombO(true), k=el.dataset.om; if(k==='method'||k==='stages') o[k]=el.value; else o[k]=Math.max(k==='unit'?1:0, stNum(el.value)); rer(); });
  const cw=$('#st-cw-on'); if(cw) cw.onchange=()=>{ plan.cw.on=cw.checked; if(cw.checked&&!plan.cw.pieces.length){ const pp=(S.pat&&S.pat.piece)||''; const ok=GARMENTS[gk].pieces.find(x=>x.id===pp)||GARMENTS[gk].pieces[0]; plan.cw.pieces=[ok.id]; } rer(); };
  V.querySelectorAll('[data-cwp]').forEach(el=>el.onchange=()=>{ const id=el.dataset.cwp; plan.cw.pieces=plan.cw.pieces.filter(x=>x!==id); if(el.checked) plan.cw.pieces.push(id); rer(); });
  V.querySelectorAll('[data-cwm]').forEach(el=>el.onchange=()=>{ if(el.value) plan.cw.map[el.dataset.cwm]=el.value; else delete plan.cw.map[el.dataset.cwm]; rer(); });
  V.querySelectorAll('[data-cws]').forEach(el=>el.onchange=()=>{ plan.cw[el.dataset.cws]=stNum(el.value); rer(); });
  V.querySelectorAll('[data-act]').forEach(b=>b.onclick=ev=>{ const a=b.dataset.act; stUI.msg='';
    if(a==='yadd'){ stUI.draft={id:'', name:'', color:'#b8a07a', haveG:0, haveM:0, m100:0, strands:1, gauge:{}, photo:''}; stUI.delArm=null; viewStash(); const f=$('#stForm'); if(f&&f.scrollIntoView) f.scrollIntoView({block:'start'}); return; }
    if(a==='yedit'){ const y=S.stash.find(x=>x.id===b.dataset.id); if(!y) return; stUI.draft=clone(y); if(!stUI.draft.gauge) stUI.draft.gauge={}; stUI.delArm=null; viewStash(); const f=$('#stForm'); if(f&&f.scrollIntoView) f.scrollIntoView({block:'start'}); return; }
    if(a==='yswl'){ if(typeof swLibShowYarn==='function') swLibShowYarn(b.dataset.id); return; }
    if(a==='ycancel'){ stUI.draft=null; stUI.delArm=null; viewStash(); return; }
    if(a==='phdel'){ stUI.draft.photo=''; viewStash(); return; }
    if(a==='pcol'){ stUI.draft.color=b.dataset.hex.toLowerCase(); if(!stUI.draft.name&&b.dataset.name) stUI.draft.name=b.dataset.name; viewStash(); return; }
    if(a==='ysave'){ const d=stUI.draft; const y=stNormYarn(Object.assign({}, d, {id:d.id||undefined, name:(d.name||'').trim()||'Siūlai'}));
      const i=S.stash.findIndex(x=>x.id===y.id); if(i>=0) S.stash[i]=y; else S.stash.push(y);
      if(!stTrySave()){ if(y.photo){ y.photo=''; stTrySave(); stUI.msg='Naršyklės atmintyje neužteko vietos nuotraukai – siūlai išsaugoti be nuotraukos.'; } else stUI.msg='Nepavyko išsaugoti naršyklės atmintyje.'; }
      stUI.draft=null; viewStash(); return; }
    if(a==='ydel'){ const id=stUI.draft.id; if(stUI.delArm!==id){ stUI.delArm=id; viewStash(); return; }
      S.stash=S.stash.filter(x=>x.id!==id); Object.values(S.stashPlan).forEach(p=>{ if(p.main===id) p.main=ST_MAIN; if(p.rib===id) p.rib=''; if(p.pieces) Object.keys(p.pieces).forEach(k=>{ if(p.pieces[k]===id) delete p.pieces[k]; });
        if(p.stripes) Object.keys(p.stripes).forEach(k=>p.stripes[k]=p.stripes[k].filter(e=>e.y!==id)); if(p.cw&&p.cw.map) Object.keys(p.cw.map).forEach(k=>{ if(p.cw.map[k]===id) delete p.cw.map[k]; });
        if(p.ombre) Object.keys(p.ombre).forEach(k=>{ p.ombre[k].yarns=p.ombre[k].yarns.filter(x=>x!==id); if(!p.ombre[k].yarns.length) delete p.ombre[k]; }); });
      delete stUI.sel[id]; stUI.draft=null; stUI.delArm=null; rer(); return; }
    if(a==='mode'){ S.stashOpt.hand=b.dataset.v==='h'; rer(); return; }
    if(a==='sadd'){ const s=seq(), used=s.map(e=>e.y), nxt=([ST_MAIN,...S.stash.map(y=>y.id)]).find(id=>!used.includes(id))||ST_MAIN; s.push({y:s.length?nxt:(plan.main||ST_MAIN), rows:s.length?s[s.length-1].rows:10}); rer(); return; }
    if(a==='sdel'){ seq().splice(+b.dataset.i,1); rer(); return; }
    if(a==='oadd'){ const o=ombO(true), pool=[...S.stash.map(y=>y.id), ST_MAIN], nx=()=>pool.find(id=>!o.yarns.includes(id))||pool[0];
      if(!o.yarns.length) o.yarns.push(plan.main&&ctx0().byId[plan.main]?plan.main:nx()); o.yarns.push(nx()); rer(); return; }
    if(a==='odel'){ const o=ombO(false); if(o){ o.yarns.splice(+b.dataset.i,1); if(!o.yarns.length) delete plan.ombre[S.stashOpt.oscope]; } rer(); return; }
    if(a==='oclr'){ delete plan.ombre[S.stashOpt.oscope]; rer(); return; }
    if(a==='sclr'){ delete plan.stripes[S.stashOpt.scope]; rer(); return; }

  const f=t=>t>216/24389?Math.cbrt(t):(24389/27*t+16)/116; x=f(x);y=f(y);z=f(z); return [116*y-16,500*(x-y),200*(y-z)]; }

  const h=(b,a)=>{ if(a===0&&b===0) return 0; let x=Math.atan2(b,a)/rad; return x<0?x+360:x; };

// dalys: kiekvienam siūlui – kokią gaminio dalį jis padengia (share ≤ f = turiu / reikėtų viso gaminio)
function recShares(f, kind){ const n=f.length;

const recSeg=(attr,opts,cur)=>`<div class="seg" role="group">${opts.map(([v,t])=>`<button type="button" ${attr}="${esc(v)}" aria-pressed="${cur===v}">${esc(t)}</button>`).join('')}</div>`;

function recBindSkin(root, after){ (root||document).querySelectorAll('[data-rskin]').forEach(b=>b.onclick=()=>{ S.skin=b.dataset.rskin; save(); if(after) after(); else render(); }); }
function recSrcLine(keys){ const k=[...new Set(keys||[])]; return k.length?`<small class="note"> – ${k.map(x=>REC_SRC[x]&&REC_SRC[x].u?`<a href="${REC_SRC[x].u}" target="_blank" rel="noopener">${esc(REC_SRC_SHORT[x])}</a>`:esc(REC_SRC_SHORT[x]||x)).join('; ')}</small>`:''; }
function recSwatch(Y){ return Y.photo?`<img src="${Y.photo}" alt="" title="${esc(Y.name)}">`:`<span style="background:${esc(Y.color)}" title="${esc(Y.name)}"></span>`; }
function recCards(R){
  if(R.prof.need) return '';
  if(!R.list.length) return `<p class="note">${R.info.ok.length?'Iš turimų siūlų tinkamo gaminio nerasta: siūlų per mažai arba jie netinka vienas prie kito (storis, spalvos). Pridėkite daugiau siūlų arba patikslinkite kiekius.':'Kad galėtume skaičiuoti, siūlams reikia kiekio (g arba m su metražu) ir mėginio svorio (arba kitų to paties metražo siūlų pasverto mėginio).'}</p>`;
  return `<div class="rec-cards">${R.list.map((s,i)=>{ const G=GARMENTS[s.gk], who=(WHO.find(x=>x[0]===s.who)||WHO[0])[1];
    const bad=s.risks.includes('bad'), mid=s.risks.includes('mid');
    return `<article class="rec-card" data-reccard="${i}"><h3>${i+1}. ${esc(G.name)} · ${esc(who)} ${esc(s.size[1])}</h3>
     <div class="rec-sw">${s.used.map(u=>recSwatch(u.y.Y)).join('')}</div>
     <div class="row" style="gap:6px">${recBadge('ok', REC_KIND[s.kind])}${s.used.length>1?recBadge(s.harm.sc>=0.85?'ok':'mid', s.harm.name):''}${bad?recBadge('bad','Gali dygti'):mid?recBadge('mid','Odai – atsargiai'):''}${s.seas.includes('bad')?recBadge('bad','Ne sezonui'):''}${s.cfit&&s.cfit.every(x=>x==='ok')?recBadge('ok','Tinka jūsų spalvų tipui'):''}</div>
     <div class="rec-y">${s.used.map((u,j)=>`<i style="background:${esc(u.y.Y.color)}"></i><span><b>${esc(u.y.Y.name)}</b>${s.used.length>1?` (${j===0?'pagrindiniai':'akcentas'} ${fmt(u.share*100,0)} %)`:''}: reikia ≈ ${fmt(u.g,0)} g, turite ${fmt(u.y.have,0)} g – liks ${fmt(u.left,0)} g${u.y.est?' <small class="note">(įvertinta)</small>':''}</span>`).join('')}</div>
     ${s.kind==='cw'?`<small class="note">Tempams pridėta +${fmt(REC_CW_EXTRA*100,0)} % (programos prielaida – tiksliau numegzti mėginį su raštu).</small>`:''}
     <div class="row"><button type="button" class="btn primary" data-recgo="${i}">Kurti projektą</button></div></article>`; }).join('')}</div>`; }

  const whoSel=P.set&&P.who.length?P.who:prof.who, likeSel=P.likes;

  return `<div class="out" id="recAsk"><b>Kam dažniausiai mezgate?</b><div class="rec-chk" style="margin:6px 0 10px">${WHO.map(w=>`<label><input type="checkbox" data-rwho="${w[0]}" ${whoSel.includes(w[0])?'checked':''}> ${esc(w[1])}</label>`).join('')}</div>
    <b>Ką mėgstate megzti?</b> <small class="note">(nebūtina – tuščia = visi gaminiai)</small><div class="rec-chk" style="margin:6px 0 10px">${gks.map(g=>`<label><input type="checkbox" data-rlike="${g}" ${likeSel.includes(g)?'checked':''}> ${esc(GARMENTS[g].name)}</label>`).join('')}</div>
    <div class="row"><button type="button" class="btn primary" data-ract="psave">Išsaugoti</button>${prof.need?'':'<button type="button" class="btn" data-ract="pcancel">Atšaukti</button>'}${P.set?'<button type="button" class="btn" data-ract="preset">Pagal mano projektus</button>':''}</div></div>`; }

      <td>${recBadge(a.lvl, 'Oda: '+REC_LVL[a.lvl][0].toLowerCase())}<br><small>${esc(a.why)}${esc(recCite(a.src))}</small></td>
      <td>${recBadge(b.lvl, 'Sezonas: '+REC_LVL[b.lvl][0].toLowerCase())}<br><small>${esc(b.why)}${esc(recCite(b.src))}</small></td></tr>`; }).join('');

  const prj=S.cur&&S.cur.gk===S.garment?S.cur:null;
  $('#view').innerHTML=`<div class="recv">
   ${recUI.msg?`<div class="warn" style="margin-bottom:10px">${esc(recUI.msg)}</div>`:''}
   <section class="panel"><h2>🌿 Patarimai: siūlai ir raštai</h2>

    <h3>Odos tipas</h3>${recSkinSeg()}
    ${prj?`<label class="f" for="rec-pskin" style="margin-top:10px;max-width:360px">Šiam projektui (${esc(G.name)})<span class="in"><select id="rec-pskin"><option value="">Kaip visur (${esc(recSkinName(S.skin).toLowerCase())})</option>${REC_SKINS.map(([v,t])=>`<option value="${v}" ${prj.skin===v?'selected':''}>${esc(t)}</option>`).join('')}</select></span></label>`:''}
    <h3>Sezonas</h3>${recSeg('data-rseason', REC_SEASONS, season)}
    <p class="note">Gaminys: <b>${esc(G.name)}</b>${prj?` · ${esc(prj.who||'')} ${esc(prj.size||'')}`:''} · oda: <b>${esc(recSkinName(skin).toLowerCase())}</b>.</p>
   </section>
   ${typeof viewStash==='function'?recWhatHtml():''}
   <div class="st-two" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px;margin-top:12px;align-items:start">
   <section class="panel"><h2>Rekomenduojami pluoštai</h2>
    <ul class="rec-list">${FL.good.map(it=>li('ok',fib(it),[...it.a.src,...it.b.src])).join('')||'<li class="note">—</li>'}</ul>
    ${FL.cond.length?`<h3>Su sąlyga</h3><ul class="rec-list">${FL.cond.map(it=>li('mid',fib(it),[...it.a.src,...it.b.src])).join('')}</ul>`:''}
    ${FL.avoid.length?`<h3>Venkite</h3><ul class="rec-list">${FL.avoid.map(it=>li('bad',fib(it),[...it.a.src,...it.b.src])).join('')}</ul>`:''}
   </section>
   <section class="panel"><h2>Jei siūlai dygsta – ką daryti</h2>

   </section></div>
   <section class="panel" style="margin-top:12px"><h2>Raštų tipai: ${esc((REC_SEASONS.find(s=>s[0]===season)||[])[1]||'')}</h2>
    <div class="rec-techs">${T.good.map(x=>techBtn(x,true)).join('')}${T.avoid.map(x=>techBtn(x,false)).join('')}</div>
    ${T.model?`<p class="note" style="margin-top:10px"><b>Modelis:</b> ${esc(T.model[0])}${recSrcLine(T.model[1])}</p>`:''}
   </section>
   <section class="panel" style="margin-top:12px"><h2>Mano siūlų patikra</h2>
    ${S.stash&&S.stash.length?`<table class="ins rec-tab"><thead><tr><th>Siūlai</th><th>Oda</th><th>Sezonas</th></tr></thead><tbody>${stRows}</tbody></table>`:'<p class="note">„Mano siūluose“ dar nėra siūlų.</p>'}
    <div class="row" style="margin-top:8px"><button type="button" class="btn" data-ract="stash">🧺 Mano siūlai</button></div>

     <li class="note">Nerasta: vieno avių vilnos storio skaičiaus, „baby alpaca“ storio, akrilo verpalų storio, alpakos ir moheo šiltumo matavimų; spalvoto rašto tempų siūlų sąnaudos (+${fmt(REC_CW_EXTRA*100,0)} % – programos prielaida).</li></ul></section>

  recBind();

function recBind(){ const V=$('#view'), rer=()=>{ save(); viewPatarimai(); };
  recBindSkin(V, rer);
  V.querySelectorAll('[data-rseason]').forEach(b=>b.onclick=()=>{ S.season=b.dataset.rseason; rer(); });
  const ps=$('#rec-pskin'); if(ps) ps.onchange=()=>{ if(S.cur){ S.cur.skin=ps.value; const pr=(S.projects||[]).find(p=>p.id===S.cur.project); if(pr&&pr.cur) pr.cur.skin=ps.value; } rer(); };
  V.querySelectorAll('[data-rtech]').forEach(b=>b.onclick=()=>{ const k=b.dataset.rtech; if(!TECHS[k]) return; const p=typeof patState==='function'?patState():S.pat;
    const dirty=p&&p.tech!==k&&/[1-9]/.test(p.cells||'');
    if(dirty&&recUI.techArm!==k){ recUI.techArm=k; viewPatarimai(); return; }
    recUI.techArm=''; if(p&&p.tech!==k){ p.tech=k; p.cells='0'.repeat(p.W*p.H); p.paint=1; if(k==='spalvos'&&(!p.colors||p.colors.length<2)) p.colors=['#f4efe6','#1d5c78']; }
    S.tab='rastai'; save(); render(); });
  V.querySelectorAll('[data-recgo]').forEach(b=>b.onclick=()=>{ const R=recSuggest(); recStart(R.list[+b.dataset.recgo]); });
  V.querySelectorAll('[data-ract]').forEach(b=>b.onclick=()=>{ const a=b.dataset.ract, P=S.recProfile;
    if(a==='stash'){ S.tab='stash'; save(); render(); return; }
    if(a==='ask'){ recUI.ask=true; viewPatarimai(); return; }
    if(a==='pcancel'){ recUI.ask=false; viewPatarimai(); return; }
    if(a==='preset'){ P.set=false; P.who=[]; P.likes=[]; recUI.ask=false; rer(); return; }
    if(a==='psave'){ const who=[...V.querySelectorAll('[data-rwho]')].filter(x=>x.checked).map(x=>x.dataset.rwho), likes=[...V.querySelectorAll('[data-rlike]')].filter(x=>x.checked).map(x=>x.dataset.rlike);
      if(!who.length){ recUI.msg='Pažymėkite bent vieną – kam mezgate.'; viewPatarimai(); recUI.msg=''; return; }
      P.who=who; P.likes=likes.filter(g=>who.some(w=>(CFG_GARMENTS[w]||[]).includes(g))); P.set=true; recUI.ask=false; rer(); const e=$('#recWhat'); if(e&&e.scrollIntoView) e.scrollIntoView({block:'start'}); return; }
  });
  V.querySelectorAll('[data-rwho]').forEach(x=>x.onchange=()=>{ /* perpiešti gaminių sąrašą pagal pažymėtus */ const who=[...V.querySelectorAll('[data-rwho]')].filter(y=>y.checked).map(y=>y.dataset.rwho);
    const likes=[...V.querySelectorAll('[data-rlike]')].filter(y=>y.checked).map(y=>y.dataset.rlike); const keep={who:S.recProfile.who, likes:S.recProfile.likes, set:S.recProfile.set};
    S.recProfile.who=who; S.recProfile.likes=likes; S.recProfile.set=true; recUI.ask=true; viewPatarimai(); Object.assign(S.recProfile, keep); });
}

/* ================= NAUJO PROJEKTO VEDLYS =================
   S.wiz          – vedlio būsena (išlieka perkrovus): žingsnis, mašina, siūlai, mėginys, kam/ką, modelis, raštas, pavadinimas.
   S.wizDismissed – naudotojas pasirinko „Praleisti“ (vedlys nebeatsidaro savaime).
   S.activeProject – aktyvaus projekto id (S.projects). Projektas = {id,name,garment,machine,mode,params,gauge,hand,cur,wiz:true}.
   Kuriant projektą parametrai sudaromi taip pat kaip „2. Modelis“ mygtuku „Pritaikyti“ (buildFromCfg). */
const WZ_STEPS=['Mašina','Siūlai ir mėginys','Kam ir ką','Modelis','Raštas','Santrauka'];
// mėginio žymės pagal instrukciją (kaip „1. Mėginys“): tarp žymių akių / tarp kontrastinių eilučių eilių
const WZ_SW={SK280:{half:35, mark:21, sts:40, rows:60, edge:20, mid:30}, SK155:{half:15, mark:11, sts:20, rows:30, edge:10, mid:15}};
// Mėginio būdas: instrukcijos (machSwatch) arba bendras (generic:true), jei recepto nerasta.
function wzSw(mode){ if(WZ_SW[mode]) return WZ_SW[mode]; if(!wzIsMach(mode)) return null;
  return (typeof machSwatch==='function'&&machSwatch(mode)) || (typeof machSwatchGeneric==='function'?machSwatchGeneric(mode):null); }
function wzIsMach(id){ return !!id && Object.prototype.propertyIsEnumerable.call(MACHINES,id); }
const WZ_OWN={ body:['chest','waist','hips','cross','armhole','backWaist','arm','upper','wrist'], kelnes:['waist','hips','inseam','rise'], sijonas:['waist','hips'],
  poncas:['chest'], salikas:[], skara:[], head:['head'], hand:['hand','handLen'], foot:['foot','footLen'] };

function wzFresh(){ return {step:1, max:1, mode:'', ribber:true, needle:'4 mm', ysrc:'', yid:'',
  ny:{name:'', m100:0, skeinG:0, haveG:0}, fiber:'', spin:'', cone:'ne', micron:0,
  gm:'direct', sts:0, rows:0, mkW:0, mkH:0, swG:0, swW:0, swH:0, tension:'', example:false, swId:'',
  who:'moteris', garment:'megztinis', size:'M', fit:'klasik', own:clone((S.cfg&&S.cfg.own)||{}), ownOpen:false,
  shShape:'stula', shA:0, shB:0, arm:'isiuta', shoulder:'japon', neckShape:'apvali', collar:'juosta', btnN:2, overlap:3, hm:'plokscia', sock:'virsus', thumb:'pleistas',
  pat:'plain', lib:'', libExt:false, name:'', nameAuto:true, err:''}; }
function wzState(){
  let w=S.wiz; if(!w||typeof w!=='object') w=S.wiz=wzFresh();
  const f=wzFresh(); Object.keys(f).forEach(k=>{ if(w[k]==null) w[k]=f[k]; });
  if(!w.own||typeof w.own!=='object') w.own={};
  if(!w.ny||typeof w.ny!=='object') w.ny=f.ny;
  w.step=Math.min(6,Math.max(1,parseInt(w.step,10)||1)); w.max=Math.max(w.step,Math.min(6,parseInt(w.max,10)||1));
  if(!(w.mode==='hand'||w.mode===''||wzIsMach(w.mode))) w.mode='';
  if(!w.mode){ w.step=1; w.max=1; }
  wzFix(w); return w;
}
const wzNum=v=>{ const x=parseFloat(String(v==null?'':v).replace(',','.')); return isFinite(x)&&x>0?x:0; };
const wzR1=x=>Math.round(x*10)/10;
const wzStash=()=>Array.isArray(S.stash)?S.stash.filter(y=>y&&typeof y==='object'):[];
function wzCfg(w){
  const c=Object.assign(defaultCfg(), {who:w.who, garment:w.garment, fit:w.fit, ease:(FITS.find(f=>f[0]===w.fit)||FITS[2])[2],
    arm:w.arm, shoulder:w.shoulder, neckShape:w.neckShape, collar:w.collar, btnN:wzNum(w.btnN)||0, overlap:wzNum(w.overlap)||0, own:{}, shawlShape:SHAWL_SHAPES[w.shShape]?w.shShape:'stula', shawlA:wzNum(w.shA), shawlB:wzNum(w.shB)});
  Object.keys(w.own||{}).forEach(k=>{ const v=wzNum(w.own[k]); if(v) c.own[k]=v; });
  if(S.cfg&&S.cfg.glove&&typeof S.cfg.glove==='object') c.glove=clone(S.cfg.glove);
  const kind=ACC_KIND[w.garment]; c.asize={}; if(kind) c.asize[kind]=w.size; else c.size=w.size;
  return c;
}
function wzFix(w){
  if(!WHO.some(x=>x[0]===w.who)) w.who='moteris';
  if(!CFG_GARMENTS[w.who].includes(w.garment)) w.garment='megztinis';
  const kind=ACC_KIND[w.garment];
  const sizes=cfgSizes(Object.assign(defaultCfg(),{who:w.who, garment:w.garment}), w.garment);
  if(!sizes.some(s=>s[0]===w.size)) w.size = kind ? sizes[Math.min(1,sizes.length-1)][0] : sizes[Math.min(2,sizes.length-1)][0];
  if(!FITS.some(f=>f[0]===w.fit)) w.fit='klasik';
  if(!ARMTYPES.some(a=>a[0]===w.arm) || (CFG_NOSLEEVE.includes(w.garment)&&isRaglan(w.arm))) w.arm='isiuta';
  if(!SHOULDERS.some(a=>a[0]===w.shoulder)) w.shoulder='japon';
  if(!NECKS.some(a=>a[0]===w.neckShape)) w.neckShape='apvali';
  if(!COLLARS.some(a=>a[0]===w.collar)) w.collar='juosta';
  if(wzIsMach(w.mode)&&!MACHINES[w.mode].ribber) w.ribber=false;
  if(w.ysrc==='stash' && !wzStash().some(y=>y.id===w.yid)){ w.ysrc=''; w.yid=''; }
  if(w.mode==='hand' && w.gm==='measure') w.gm='direct';
  return w;
}
const wzMach=w=> w.mode==='hand' ? HK_M : w.mode;
function wzYarn(w){

function wzCreate(w){

    const gv=w.example?null:{sts:g.sts, rows:g.rows, ribRows:g.ribRows, swG:g.swG||0, swW:hand?(g.swG?g.swW:0):(g.swG?swatchSize(g,w.mode).w:0), swH:hand?(g.swG?g.swH:0):(g.swG?swatchSize(g,w.mode).h:0)};

      else libApply(pp, w.lib); }catch(e){} }
  if(w.pat==='plain' && S.mPat && typeof S.mPat==='object') S.mPat.on=false;

  S.garment=gk; S.piece=GARMENTS[gk].pieces[0].id; S.mPiece=gk+'/'+S.piece; S.mStep=0; S.mRC=0;
  S.projects.push({id, name:String(w.name).trim(), garment:gk, machine:S.machine, mode:hand?'hand':'machine', params:clone(S.params[gk]), gauge:clone(S.gauges[S.machine]),
    hand:hand?clone(S.hand):null, cur:clone(S.cur), yarnId:yid, wiz:true, date:new Date().toISOString()});

/* ---- eilės → intervalai (adatų vienetais) kiekvienai eilei ---- */
function psRows(R){
  const sim=R&&R.sim; if(!sim||!sim.parts) return null;
  const by={}; let maxY=0;
  sim.parts.forEach(pt=>(pt.rows||[]).forEach(w=>{ if(w.yr==null||!(w.R>w.L)||!isFinite(w.L)||!isFinite(w.R)) return;
    (by[w.yr]=by[w.yr]||[]).push([w.L,w.R]); if(w.yr>maxY) maxY=w.yr; }));
  if(!maxY) return null;
  const cov=[]; for(let j=1;j<=maxY;j++) cov[j]=psMerge(by[j]||[]);
  // tarpinės eilės be įrašų (neturėtų būti) – imame žemiau esančią
  for(let j=1;j<=maxY;j++) if(!cov[j].length&&j>1) cov[j]=cov[j-1].map(a=>a.slice());
  let minL=Infinity,maxR=-Infinity; cov.forEach(c=>c&&c.forEach(([a,b])=>{ minL=Math.min(minL,a); maxR=Math.max(maxR,b); }));
  const rib=(sim.ribRows>0&&sim.castOn)?{rows:sim.ribRows, L:sim.castOn.L, R:sim.castOn.R}:null;
  if(rib){ minL=Math.min(minL,rib.L); maxR=Math.max(maxR,rib.R); }
  return {cov, maxY, minL, maxR, rib, castOn:sim.castOn?sim.castOn.n:null, N:sim.N};
}
function psMerge(iv){ iv=iv.slice().sort((a,b)=>a[0]-b[0]); const out=[]; iv.forEach(([a,b])=>{ const l=out[out.length-1]; if(l&&a<=l[1]) l[1]=Math.max(l[1],b); else out.push([a,b]); }); return out; }
// aibių simetrinis skirtumas (horizontalios kraštinės tarp dviejų eilių)
function psXor(A,B){ const pts=[]; A.forEach(([a,b])=>{pts.push(a,b);}); B.forEach(([a,b])=>{pts.push(a,b);}); const xs=[...new Set(pts)].sort((a,b)=>a-b);
  const inn=(S,x)=>S.some(([a,b])=>x>=a&&x<b); const out=[];
  for(let i=0;i<xs.length-1;i++){ const m=(xs[i]+xs[i+1])/2; if(inn(A,m)!==inn(B,m)){ const l=out[out.length-1]; if(l&&l[1]===xs[i]) l[1]=xs[i+1]; else out.push([xs[i],xs[i+1]]); } }
  return out; }
// kontūras: SVG kelias (laipteliai pagal eiles), X(adata)→mm, Y(eilė)→mm
function psOutline(rw, X, Y){
  const d=[]; const {cov,maxY}=rw; const E=[];
  // vertikalios kraštinės: sujungiamos iš eilės einančios toje pačioje x
  const open={};
  for(let j=1;j<=maxY+1;j++){ const xs=new Set(); (cov[j]||[]).forEach(([a,b])=>{ xs.add(a); xs.add(b); });
    Object.keys(open).forEach(k=>{ const x=+k; if(!xs.has(x)){ d.push(`M${psN(X(x))} ${psN(Y(open[k]))}V${psN(Y(j-1))}`); delete open[k]; } });
    xs.forEach(x=>{ if(open[x]==null) open[x]=j-1; }); }
  for(let j=0;j<=maxY;j++){ psXor(cov[j]||[], cov[j+1]||[]).forEach(([a,b])=>d.push(`M${psN(X(a))} ${psN(Y(j))}H${psN(X(b))}`)); }
  return d.join('');
}

/* ---- maketas: lapų skaičius ---- */
function psLayout(Wmm, Hmm, paperId){
  const P=PS_PAPERS[paperId]||PS_PAPERS.A4;
  const aw=P.w-2*PS_MARGIN, ah=P.h-2*PS_MARGIN-PS_HEAD;
  const cols=Math.max(1, Math.ceil((Wmm-PS_OVL)/(aw-PS_OVL))), rows=Math.max(1, Math.ceil((Hmm-PS_OVL)/(ah-PS_OVL)));
  return {P, aw, ah, cols, rows, tiles:cols*rows, stepX:aw-PS_OVL, stepY:ah-PS_OVL};
}

/* ---- duomenys: detalė (ir, jei gradiruota Sava forma, visi dydžiai) ---- */
function psCollect(gk, pid, all){
  const g=S.gauges[S.machine]; const out={g, shapes:[], gk, pid};
  const pc=pieceDef(gk,pid); out.pc=pc;
  const R=computePiece(gk,pid); const rw=psRows(R); if(!rw||R.special) return null;
  out.main={R, rw}; out.H=R.geom&&R.geom.H;
  const p=S.params[gk]&&S.params[gk][pc.param||pc.id];
  if(all && pc.kind==='custom' && p && typeof ffGradeOn==='function' && ffGradeOn(p)){
    const n=p.grade.n;
    for(let k=0;k<n;k++){ try{ const P2=clone(S.params); const q=P2[gk][pc.param||pc.id]; ffGradeApply(q,k);
      const Rk=computePiece(gk,pid,{params:P2}); const r=psRows(Rk); if(r) out.shapes.push({name:ffGradeName(p,k), rw:r, active:k===p.grade.active}); }catch(e){} }
  }
  return out;
}
function psInfo(D){

}

/* ---- piešinys globaliomis mm koordinatėmis ---- */
function psArt(D, sc){
  const g=D.g, spc=g.sts/10, rpc=g.rows/10, ribRpc=(g.ribRows||g.rows)/10, k=sc.k;
  const list=D.shapes.length?D.shapes:[{name:'', rw:D.main.rw, active:true}];
  let minL=Infinity,maxR=-Infinity,maxY=0,ribCm=0;
  list.forEach(s=>{ minL=Math.min(minL,s.rw.minL); maxR=Math.max(maxR,s.rw.maxR); maxY=Math.max(maxY,s.rw.maxY); });
  const act=list.find(s=>s.active)||list[0];
  if(act.rw.rib) ribCm=act.rw.rib.rows/ribRpc;
  const mm=cm=>cm*10/k;                     // detalės cm → popieriaus mm
  const xCm0=minL/spc, xCm1=maxR/spc, hCm=maxY/rpc;
  const gx0=Math.floor(xCm0)-1, gx1=Math.ceil(xCm1)+1, gy0=-Math.ceil(ribCm)-1, gy1=Math.ceil(hCm)+1;
  const left=PS_PAD+PS_RULER, top=PS_PAD+8;
  const ox=left-mm(gx0), oy=top+mm(gy1);     // cm (0,0) vieta mm
  const W=ox+mm(gx1)+PS_PAD+PS_RULER, H=oy-mm(gy0)+PS_PAD+6;
  const Xn=n=>ox+mm(n/spc), Yr=j=>oy-mm(j/rpc), Xc=c=>ox+mm(c), Yc=c=>oy-mm(c);
  const o=[];
  // tinklelis kas 1 cm (detalės), ryškesnis kas 5 cm
  for(let c=gx0;c<=gx1;c++){ const f=c%5===0; o.push(`<line x1="${psN(Xc(c))}" y1="${psN(Yc(gy1))}" x2="${psN(Xc(c))}" y2="${psN(Yc(gy0))}" stroke="${f?'#8aa1a8':'#cfd9dc'}" stroke-width="${f?0.25:0.12}"/>`); }
  for(let c=gy0;c<=gy1;c++){ const f=c%5===0; o.push(`<line x1="${psN(Xc(gx0))}" y1="${psN(Yc(c))}" x2="${psN(Xc(gx1))}" y2="${psN(Yc(c))}" stroke="${f?'#8aa1a8':'#cfd9dc'}" stroke-width="${f?0.25:0.12}"/>`); }
  const fs=k>=4?2.2:2.8;
  for(let c=Math.ceil(gx0/5)*5;c<=gx1;c+=5) o.push(`<text x="${psN(Xc(c))}" y="${psN(Yc(gy0)+fs+1)}" font-size="${fs}" text-anchor="middle" fill="#4a5a60">${Math.abs(c)}</text>`);
  for(let c=Math.ceil(gy0/5)*5;c<=gy1;c+=5) o.push(`<text x="${psN(Xc(gx1)+1.2)}" y="${psN(Yc(c)+fs/3)}" font-size="${fs}" fill="#4a5a60">${c} cm</text>`);
  // juosta
  if(act.rw.rib&&ribCm>0){ const r=act.rw.rib, x0=Xn(r.L), x1=Xn(r.R), y0=Yc(0), y1=Yc(-ribCm);
    o.push(`<defs><pattern id="psHatch" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="3" stroke="#9fb3b9" stroke-width="0.4"/></pattern></defs>`);
    o.push(`<rect x="${psN(x0)}" y="${psN(y0)}" width="${psN(x1-x0)}" height="${psN(y1-y0)}" fill="url(#psHatch)" stroke="#1b2428" stroke-width="0.3" stroke-dasharray="1.5 1"/>`);
    o.push(`<text x="${psN((x0+x1)/2)}" y="${psN((y0+y1)/2+1)}" font-size="${fs}" text-anchor="middle" fill="#1b2428">Apačios juosta ${act.rw.rib.rows} eil.</text>`); }
  // kontūrai (keli dydžiai – įdėti vienas į kitą)
  const dash=['','2 1','0.6 0.8','3 1 0.6 1','4 1.5'];
  list.forEach((s,i)=>{ const strong=s.active||list.length===1;
    o.push(`<path d="${psOutline(s.rw, Xn, Yr)}" fill="none" stroke="${strong?'#000':'#2a5c6e'}" stroke-width="${strong?0.5:0.3}" stroke-dasharray="${strong?'':dash[i%dash.length]}" stroke-linecap="square" data-ps-outline="${i}"/>`);
    if(list.length>1){ const top=s.rw.cov[s.rw.maxY]||[]; const xr=top.length?top[top.length-1][1]:s.rw.maxR;
      o.push(`<text x="${psN(Xn(xr)+0.8)}" y="${psN(Yr(s.rw.maxY)-0.6)}" font-size="${fs}" fill="${strong?'#000':'#2a5c6e'}" font-weight="${strong?700:400}">${psEsc(s.name)}</text>`); } });
  // vidurio linija
  o.push(`<line x1="${psN(Xc(0))}" y1="${psN(Yc(gy1))}" x2="${psN(Xc(0))}" y2="${psN(Yc(gy0))}" stroke="#b4486c" stroke-width="0.3" stroke-dasharray="3 1.5" data-ps-centre="1"/>`);
  o.push(`<text x="${psN(Xc(0)+0.8)}" y="${psN(Yc(gy1)+fs+0.5)}" font-size="${fs}" fill="#b4486c">vidurys (0)</text>`);
  // pradžios linija (0 eil.)
  o.push(`<line x1="${psN(Xc(gx0))}" y1="${psN(Yc(0))}" x2="${psN(Xc(gx1))}" y2="${psN(Yc(0))}" stroke="#b4486c" stroke-width="0.35"/>`);
  // eilių žymos kas 10 eilių (abiejose pusėse)
  const xl=Xc(gx0), xr2=Xc(gx1);
  for(let j=10;j<=maxY;j+=10){ const y=Yr(j), big=j%50===0;
    o.push(`<line x1="${psN(xl-(big?4:2.5))}" y1="${psN(y)}" x2="${psN(xl)}" y2="${psN(y)}" stroke="#1b2428" stroke-width="${big?0.35:0.2}" data-ps-row="${j}"/>`);
    o.push(`<line x1="${psN(xr2)}" y1="${psN(y)}" x2="${psN(xr2+(big?4:2.5))}" y2="${psN(y)}" stroke="#1b2428" stroke-width="${big?0.35:0.2}"/>`);
    if(mm(10/rpc)>=fs*1.1||big) o.push(`<text x="${psN(xl-4.6)}" y="${psN(y+fs/3)}" font-size="${fs*0.9}" text-anchor="end" fill="#1b2428">${j}</text>`); }
  o.push(`<text x="${psN(xl-1)}" y="${psN(Yc(gy1)-1.5)}" font-size="${fs}" text-anchor="end" fill="#1b2428">eil.</text>`);
  // mastelio juosta: 10 cm detalėje
  const bx=Xc(gx0), by=Yc(gy0)+fs+4.5;
  o.push(`<g data-ps-barg="1"><line x1="${psN(bx)}" y1="${psN(by)}" x2="${psN(bx+mm(10))}" y2="${psN(by)}" stroke="#000" stroke-width="0.5" data-ps-bar="${psN(mm(10))}"/><line x1="${psN(bx)}" y1="${psN(by-1.2)}" x2="${psN(bx)}" y2="${psN(by+1.2)}" stroke="#000" stroke-width="0.3"/><line x1="${psN(bx+mm(10))}" y1="${psN(by-1.2)}" x2="${psN(bx+mm(10))}" y2="${psN(by+1.2)}" stroke="#000" stroke-width="0.3"/><text x="${psN(bx+mm(10)+1.5)}" y="${psN(by+1)}" font-size="${fs}" fill="#000">10 cm gaminyje${k>1?` = ${psF(10/k,1)} cm lape`:''}</text></g>`);
  return {svg:o.join(''), W, H, Wcm:(maxR-minL)/spc, Hcm:hCm+ribCm, list};
}
function psTileMarks(L, W, H){
  const o=[];
  // persidengimo juostos ribos ir sulygiavimo kryželiai globaliose koordinatėse – vienodoje vietoje abiejuose lapuose
  for(let c=1;c<L.cols;c++){ const x0=c*L.stepX, x1=x0+PS_OVL, xm=x0+PS_OVL/2;
    o.push(`<line x1="${psN(x0)}" y1="0" x2="${psN(x0)}" y2="${psN(H)}" stroke="#7d6a6d" stroke-width="0.2" stroke-dasharray="1 1.5"/><line x1="${psN(x1)}" y1="0" x2="${psN(x1)}" y2="${psN(H)}" stroke="#7d6a6d" stroke-width="0.2" stroke-dasharray="1 1.5"/>`);
    for(let y=20;y<H;y+=45) o.push(psCross(xm,y)); }
  for(let r=1;r<L.rows;r++){ const y0=r*L.stepY, y1=y0+PS_OVL, ym=y0+PS_OVL/2;
    o.push(`<line x1="0" y1="${psN(y0)}" x2="${psN(W)}" y2="${psN(y0)}" stroke="#7d6a6d" stroke-width="0.2" stroke-dasharray="1 1.5"/><line x1="0" y1="${psN(y1)}" x2="${psN(W)}" y2="${psN(y1)}" stroke="#7d6a6d" stroke-width="0.2" stroke-dasharray="1 1.5"/>`);
    for(let x=20;x<W;x+=45) o.push(psCross(x,ym)); }
  return o.join('');
}
function psCross(x,y){ return `<g stroke="#000" stroke-width="0.25" data-ps-cross="1"><line x1="${psN(x-3)}" y1="${psN(y)}" x2="${psN(x+3)}" y2="${psN(y)}"/><line x1="${psN(x)}" y1="${psN(y-3)}" x2="${psN(x)}" y2="${psN(y+3)}"/><circle cx="${psN(x)}" cy="${psN(y)}" r="1.4" fill="none"/></g>`; }
const psCol=c=>{ let s='', n=c; do{ s=String.fromCharCode(65+n%26)+s; n=Math.floor(n/26)-1; }while(n>=0); return s; };

function psBuild(D, scId, paperId){

  const marks=psTileMarks(L, Math.max(A.W, L.cols*L.stepX+PS_OVL), Math.max(A.H, L.rows*L.stepY+PS_OVL));
  const total=L.tiles+1;

  let n=1;

    </section>`; }
  return {html, L, A, total, sc};
}

/* ================= SKAITMENINIS KNIT RADAR (radaras) =================
   Kaip Silver Reed „Knit Radar“ / Brother „KnitLeader“: detalės brėžinys tikromis proporcijomis (mėginio ak./eil.),
   numegzta dalis užpildyta, dabartinė eilė – ryški linija. Eilės imamos iš simulate() → sim.parts[].rows {rc,L,R,yr}.
   Būsena: S.radar = {on, hand, hPiece, debounce, sound, vib, flash, car, keyPlus, keyMinus, defKeys, learn, pos:{raktas:indeksas}}
   Mašinos režime pozicija sinchronizuojama su mezgimo režimo RC skaitikliu (S.mRC) ir dalimi (S.mPart: 0 – iki iškirptės, 1 – dešinė, 2 – kairė).
   Eilių sąrašas linijinis: visų dalių eilės iš eilės (dešinė pusė, tada kairė – RC grįžta į iškirptės pradžią, kaip instrukcijoje).
   Įrašas list[i] = eilė, kurią dabar mezgate: rc – skaitiklio rodmuo prieš eilę; L/R – adatos po šios eilės veiksmų. */
const RAD_PLUS_CODES=['ArrowRight','ArrowDown','PageDown','Space','Enter','NumpadEnter'], RAD_PLUS_KEYS=['ArrowRight','ArrowDown','PageDown',' ','Spacebar','Enter'];
const RAD_MINUS_CODES=['ArrowLeft','ArrowUp','PageUp'], RAD_MINUS_KEYS=['ArrowLeft','ArrowUp','PageUp'];
const RAD_DEF={on:false, hand:false, hPiece:'', debounce:400, sound:true, vib:true, flash:true, car:true, keyPlus:'', keyMinus:'', defKeys:true, learn:null};
let radCache={key:'', D:null}, radCur=null, radLastTap=0, radAC=null, radWake=null, radWakeMsg='', radMsg='';

function radSt(){
  let r=S.radar; if(!r||typeof r!=='object') r=S.radar={};
  Object.keys(RAD_DEF).forEach(k=>{ if(r[k]===undefined) r[k]=RAD_DEF[k]; });
  if(!r.pos||typeof r.pos!=='object') r.pos={};
  const d=+r.debounce; r.debounce=isFinite(d)&&d>=0?Math.min(3000,Math.round(d)):400;
  if(r.learn!=='plus'&&r.learn!=='minus') r.learn=null;
  return r; }

/* ---------- duomenys ---------- */
const radSideShort=s=>s==='D'?'dešinėje':s==='K'?'kairėje':'abiejuose kraštuose';
function radActShort(e, hand, T){
  switch(e.type){
    case 'bind': return `uždaryti ${e.n} ak.`;
    case 'dec': return 'sumažinti 1 ak.';

    case 'cast': return `užmesti ${e.n} ak.`;
    case 'hold': return hand ? `palikti ${e.n} ak. nenumegztas (trumposios eilės)` : `${e.n} adat. į ${T.hold||'HP'}`;
  } return ''; }
function radActLong(e, hand, m){
  if(hand && e.type==='hold') return `${cap1(sideText(e))}: palikite ${e.n} ak. nenumegztas ir apsukite darbą (trumposios eilės).`;
  return `${cap1(sideText(e))}: ${actText(e,m)}.`; }
function radHandTxt(t){ return String(t).replace(/\s*ant adatų [KD]\d+–[KD]\d+/g,'').replace(/\s*\([KD]\d+–[KD]\d+\)/g,'').replace(/\.\./g,'.'); }

// siūlų spalva kiekvienai eilei (1..N) iš „Mano siūlai“ plano: ombrė arba juostelės (seka kartojama)
function radColorFn(gk, pid, sim){

// rašto (S.pat) eilė pagal RC – ta pati logika kaip patRowBox(); su „Vieta detalėje“ (patPlaceAt) – vienas motyvas tik pasirinktoje detalėje,

function radData(gk, pid, hand){

function radBuild(gk, pid, hand){

  const P=sim.parts.length; let pi=0;
  sim.sections.forEach(sec=>{
    const t=sec.title;
    if(t==='Iš viso') return;

    if(t==='Kaklo iškirptė'||t==='Dešinė pusė') pi=Math.min(1,P-1);
    if(t==='Kairė pusė') pi=Math.min(2,P-1);
    if(first[pi]>last[pi]) return;
    let seen=false, anchor=null;
    sec.items.forEach(it=>{
      if(it.type){ seen=true; anchor=null; const e=at(pi,it.rc)||list[last[pi]];
        e.ev.push({k:'shape', alert:true, type:it.type, side:it.side, t:radActLong(it,hand,m), s:`${radSideShort(it.side)} ${radActShort(it,hand,T)}`, tech:hand?'':techText(it.type,m)}); return; }
      if(!it.note) return;

        if(e){ e.ev.push({k:'note', alert:true, t:cap1(txt), s:radShortNote(txt)}); anchor=e; } else { (ends[pi]=ends[pi]||[]).push(cap1(txt)); anchor=null; } return; }

      if(!seen){ list[first[pi]].ev.push({k:pi>0&&first[pi]>0?'part':'note', alert:first[pi]>0, t:tx(it.note), s:radShortNote(tx(it.note))}); }

  const col=radColorFn(gk,pid,sim);

    if(!prev) { if(i===0) e.ev.push({k:'info', alert:false, t:`Siūlai: ${e.col.name}`, s:`siūlai: ${e.col.name}`, color:e.col.color}); }
    else if(prev.key!==e.col.key) e.ev.push({k:'color', alert:true, t:`Keiskite siūlus: ${e.col.name}`, s:`siūlai → ${e.col.name}`, color:e.col.color}); });
  // raštas
  const pf=hand?null:radPatFn(gk,pid), PL=pf&&pf.place;

    if(PL&&row) e.patN=[PL.nx0,PL.nx1];

    if(!row) return;
    if(PL&&e.rc===PL.row0) e.ev.push({k:'pat', alert:true, t:`Motyvas prasideda: rašto eilė 1 iš ${pf.p.H}, ${radNeedles(PL)}; RC ${PL.row0}–${PL.row1}`, s:`motyvas: ${radNeedles(PL)}`});
    else if(!PL&&e.rc-(pf.start-1)===1) e.ev.push({k:'pat', alert:true, t:`Raštas prasideda: rašto eilė 1 iš ${pf.p.H}`, s:'raštas prasideda'});
    else if(pf.rows){ const pr=pf.at(e.rc-1); if(pr){ const a=pf.rows[row-1], b=pf.rows[pr-1];
      if(a.A!==b.A||a.B!==b.B){ const nm=`A – spalva ${a.A+1}${a.B!=null?`, B – spalva ${a.B+1}`:''}`; e.ev.push({k:'color', alert:true, t:`Rašto spalvos keičiasi (rašto eilė ${row}): ${nm}`, s:`rašto spalvos: ${nm}`, color:pf.p.colors[a.A]}); } } } });
  let minL=0, maxR=0, maxY=0; sim.parts.forEach(p=>{ minL=Math.min(minL,p.sL); maxR=Math.max(maxR,p.sR); p.rows.forEach(r=>{ minL=Math.min(minL,r.L); maxR=Math.max(maxR,r.R); if(r.yr!=null) maxY=Math.max(maxY,r.yr); }); });
  return {special:false, R, sim, list, first, last, intro, ends, hand, m, T, col:!!col, pat:!!pf, patPlace:PL||null, minL, maxR, maxY, ribCm:(R.geom&&R.geom.ribCm)||0, ribRows:sim.ribRows||0, gk, pid}; }
function radShortNote(t){ t=String(t); const k=t.search(/[.;]\s(?=[A-ZĄČĘĖĮŠŲŪŽ])/); const s=k>0&&k<90?t.slice(0,k):t; return s.length>90?s.slice(0,88)+'…':s; }

/* ---------- pozicija ---------- */
function radKeyOf(gk,pid,hand){ return (hand?'h:':'m:')+gk+'/'+pid; }
function radPieces(hand){
  const st=radSt();
  if(!GARMENTS[S.garment]){ S.garment='megztinis'; }
  const G=GARMENTS[S.garment];
  if(hand){ if(!G.pieces.find(p=>p.id===st.hPiece)) st.hPiece=G.pieces.find(p=>p.id===S.piece)?S.piece:G.pieces[0].id; return [S.garment, st.hPiece]; }

  if(!opts.includes(S.mPiece)){ S.mPiece=S.garment+'/'+(G.pieces.find(p=>p.id===S.piece)?S.piece:G.pieces[0].id); S.mStep=0; S.mRC=0; S.mPart=null; }

// indeksas list'e; mašinos režime suderinamas su S.mRC / S.mPart
function radIndex(D, key, hand){

  if(!hand){ const rc=S.mRC||0, part=S.mPart;
    const okAt=j=> j<n ? D.list[j].rc===rc : rc>=D.list[n-1].rc+1;
    if(!okAt(i)){
      let j=-1; if(part!=null) j=D.list.findIndex(e=>e.rc===rc&&e.pi===part);
      if(j<0) j=D.list.findIndex(e=>e.rc===rc);
      if(j<0) j = rc>D.list[n-1].rc ? n : Math.max(0,D.list.findIndex(e=>e.rc>rc));

  st.pos[key]=i; return i; }

  if(!hand){ const e=D.list[i]; S.mRC = e ? e.rc : D.list[n-1].rc+1; S.mPart = e ? e.pi : D.list[n-1].pi; S.mStepSync=true;

/* ---------- garsas, vibracija, blyksnis, ekrano budrumas ---------- */
function radBeep(){ const st=radSt(); if(!st.sound) return;
  try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return; if(!radAC) radAC=new AC(); if(radAC.state==='suspended'&&radAC.resume) radAC.resume();
    const t=radAC.currentTime, o=radAC.createOscillator(), g=radAC.createGain(); o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
    o.connect(g); g.connect(radAC.destination); o.start(t); o.stop(t+0.2); }catch(e){} }
function radAlert(){ const st=radSt();
  try{ if(st.vib&&navigator.vibrate) navigator.vibrate([90,60,90]); }catch(e){}
  radBeep();
  if(st.flash){ const el=document.getElementById('radar'); if(el){ el.classList.remove('radflash'); void el.offsetWidth; el.classList.add('radflash'); setTimeout(()=>{ try{ el.classList.remove('radflash'); }catch(e){} },800); } }

let radWakePend=false;
async function radWakeOn(){

  try{ if(!('wakeLock' in navigator)||!navigator.wakeLock||typeof navigator.wakeLock.request!=='function'){ radWakeMsg='Ši naršyklė nepalaiko ekrano budrumo (Wake Lock) – ekranas gali užgesti. Nustatymuose prailginkite ekrano užgesimo laiką.'; radWakeNote(); return false; }
    if(radWake&&!radWake.released) return true;
    radWake=await navigator.wakeLock.request('screen'); radWakeMsg='';
    try{ radWake.addEventListener('release',()=>{ radWake=null; radWakeNote(); }); }catch(e){}
    radWakeNote(); return true;
  }catch(e){ radWake=null; radWakeMsg='Ekrano budrumo įjungti nepavyko – ekranas gali užgesti.'; radWakeNote(); return false; } finally{ radWakePend=false; } }

function radWakeNote(){ const n=document.getElementById('radWakeNote'); if(!n) return; n.textContent = radWakeMsg || (radWake ? 'Ekranas neužges, kol atidarytas radaras.' : ''); n.className='note'+(radWakeMsg?' radwarn':''); }
function radActive(){ return typeof S!=='undefined'&&S&&S.tab==='masina'&&S.radar&&S.radar.on&&!!document.getElementById('radar'); }
try{ setInterval(()=>{ if(radWake&&!radActive()) radWakeOff(); }, 4000); }catch(e){}
try{ document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&radActive()&&!radWake) radWakeOn(); }); }catch(e){}

/* ---------- pedalas / klaviatūra ---------- */
function radKeyDir(e){ const st=radSt(), code=e.code||'', key=e.key||'';
  if(st.keyPlus&&(code===st.keyPlus||(!code&&key===st.keyPlus))) return 1;
  if(st.keyMinus&&(code===st.keyMinus||(!code&&key===st.keyMinus))) return -1;
  if(st.defKeys===false) return 0;
  if(RAD_PLUS_CODES.includes(code)||RAD_PLUS_KEYS.includes(key)) return 1;
  if(RAD_MINUS_CODES.includes(code)||RAD_MINUS_KEYS.includes(key)) return -1;
  return 0; }
function radKeyName(c){ return ({ArrowRight:'→',ArrowLeft:'←',ArrowUp:'↑',ArrowDown:'↓',PageDown:'PageDown',PageUp:'PageUp',Space:'tarpas',Enter:'Enter',NumpadEnter:'Enter'})[c]||c; }
function radKey(e){
  if(!radActive()) return;
  const st=radSt();
  if(st.learn){ if(['Shift','Control','Alt','Meta','CapsLock','Tab','Escape'].includes(e.key)){ if(e.key==='Escape'){ st.learn=null; radMsg='Mokymas atšauktas.'; save(); viewRadar(); } return; }
    e.preventDefault(); e.stopPropagation(); const code=e.code||e.key; const which=st.learn;
    if(which==='plus') st.keyPlus=code; else st.keyMinus=code; st.learn=null; radMsg=`Išmokta: ${which==='plus'?'+1':'−1'} = ${radKeyName(code)}`; save(); viewRadar(); return; }

  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const d=radKeyDir(e); if(!d) return;
  e.preventDefault(); e.stopPropagation(); if(e.repeat) return;
  try{ if(document.activeElement&&document.activeElement.blur&&document.activeElement!==document.body) document.activeElement.blur(); }catch(x){}
  radStep(d); }
try{ document.addEventListener('keydown', radKey, true); }catch(e){}

/* ---------- veiksmai ---------- */
function radOpen(hand){ const st=radSt(); st.on=true; st.hand=!!hand; st.learn=null; radMsg='';
  if(hand){ st.hPiece=S.piece; } S.tab='masina'; save(); render(); radWakeOn(); }
function radClose(){ const st=radSt(); const hand=st.hand; st.on=false; st.learn=null; radWakeOff(); save();
  if(hand){ S.tab='rankinis'; render(); } else viewMasina(); }
function radStep(d){
  if(!radCur||!radCur.D||radCur.D.special) return;
  const {D,key,hand}=radCur, n=D.list.length, i0=radSt().pos[key]||0;
  const i=radSetIndex(D,key,hand,i0+d); save(); viewRadar();
  if(d>0 && i!==i0 && i<n && D.list[i].ev.some(x=>x.alert)) radAlert();
  else if(d>0 && i===n && i!==i0) radAlert(); }

/* ---------- brėžinys ---------- */
function radSvg(D, i){
  const sim=D.sim, spc=sim.spc, rpc=sim.rpc, n=D.list.length, cur=D.list[i]||null;
  const x0=D.minL/spc, x1=D.maxR/spc, top=D.maxY/rpc, bot=-(D.ribCm||0);
  const w=Math.max(1,x1-x0), h=Math.max(1,top-bot), pad=Math.max(w,h)*0.03;
  const f=v=>Math.round(v*100)/100;
  const poly=(p,upto)=>{ const rows=p.rows.filter(r=>r.yr!=null&&(upto==null||r.rc<=upto));
    const L=[[p.sL/spc,p.fromY]].concat(rows.map(r=>[r.L/spc, r.yr/rpc])), Rr=[[p.sR/spc,p.fromY]].concat(rows.map(r=>[r.R/spc, r.yr/rpc]));
    return L.concat(Rr.reverse()).map(([x,y])=>f(x)+','+f(-y)).join(' '); };
  let out='', fill='';
  sim.parts.forEach((p,pi)=>{ out+=`<polygon points="${poly(p)}" class="radol"/>`;
    if(!cur || pi<cur.pi) fill+=`<polygon points="${poly(p)}" class="radfill"/>`;
    else if(pi===cur.pi && cur.rc>p.fromRc) fill+=`<polygon points="${poly(p,cur.rc)}" class="radfill"/>`; });
  const rib = D.ribCm>0 ? `<rect x="${f(sim.castOn.L/spc)}" y="0" width="${f(sim.castOn.n/spc)}" height="${f(D.ribCm)}" class="radrib"/>` : '';
  let line='';
  if(cur){ let yr=cur.yr; if(yr==null){ for(let j=i;j>=0;j--){ if(D.list[j].yr!=null){ yr=D.list[j].yr; break; } } } yr=yr||1;
    const y=-(yr-0.5)/rpc;
    line=`<line x1="${f(x0-pad)}" x2="${f(x1+pad)}" y1="${f(y)}" y2="${f(y)}" class="radguide"/><line x1="${f(cur.L/spc)}" x2="${f(cur.R/spc)}" y1="${f(y)}" y2="${f(y)}" class="radline"/>`; }
  const vb=`${f(x0-pad)} ${f(-top-pad)} ${f(w+2*pad)} ${f(h+2*pad)}`;
  return `<svg viewBox="${vb}" role="img" aria-label="Detalės brėžinys: numegzta ${i} iš ${n} eilių" preserveAspectRatio="xMidYMid meet">
    <line x1="0" x2="0" y1="${f(-top-pad)}" y2="${f(-bot+pad)}" class="radmid"/>${rib}${fill}${out}${line}</svg>`; }

`; document.head.appendChild(s); }

function radRowTxt(D,e){ return D.hand ? `${Math.max(0,e.R-e.L)} ak.` : needleSpan(e.L,e.R).replace('–',' – '); }
function radCounterTxt(D,e){ return D.hand ? `Eilė ${e.rc+1}` : `RC ${pad(e.rc)}`; }
function radCarTxt(D,e){ if(D.hand) return (e.rc+1)%2 ? 'veidinė pusė' : 'išvirkščia pusė';
  const start=S.carriage==='K'?'K':'D', c=(e.rc%2===0)?start:(start==='D'?'K':'D'); return c==='D'?'D → K':'K → D'; }
function radNextEv(D, i, pred){ for(let j=i;j<D.list.length;j++){ const ev=D.list[j].ev.filter(pred); if(ev.length) return {j, d:j-i, ev}; } return null; }

function viewRadar(){
  radCss(); const st=radSt(), hand=!!st.hand;
  const [gk,pid]=radPieces(hand), G=GARMENTS[gk], key=radKeyOf(gk,pid,hand);
  const D=radData(gk,pid,hand);
  const pieceSel=`<label class="f" for="radPiece" style="min-width:180px;flex:1">Detalė (${esc(G.name)})<span class="in"><select id="radPiece">${G.pieces.map(p=>`<option value="${esc(p.id)}" ${pid===p.id?'selected':''}>${esc(p.name)}${p.count>1?' ×'+p.count:''}</option>`).join('')}</select></span></label>`;
  const head=`<div class="radtop"><h2>📡 Radaras · ${esc(hand?'rankinis mezgimas':(MACHINES[S.machine]||{}).name||'')}</h2><div class="row"><button class="btn" id="radFull">⛶ Visas ekranas</button><button class="btn" id="radClose">✕ Uždaryti</button></div></div>
    <div class="row" style="margin-bottom:8px">${pieceSel}</div>`;
  if(D.special){ radCur={D,key,hand};
    $('#view').innerHTML=`<div class="radar" id="radar">${head}<div class="radbox">Šiai detalei radaras netaikomas – ji neformuojama eilėmis${D.err?` (${esc(D.err)})`:''}. Naudokite mezgimo žingsnius.</div><p class="note" id="radWakeNote"></p></div>`;
    radBind(D,key,hand,0); radWakeNote(); return; }
  const i=radIndex(D,key,hand), n=D.list.length, e=D.list[i]||null, done=!e;
  radCur={D,key,hand};
  if(!hand){ if(!S.mPat||typeof S.mPat!=='object') S.mPat={on:false,start:1,rc:0}; S.mPat.rc=S.mRC; }
  const evHtml=x=>`${x.color?`<span class="raddot" style="background:${esc(x.color)}"></span>`:''}${esc(x.t)}`;
  const nowEv=e?e.ev:[];
  const nowBox = nowEv.length ? `<div class="radbox radnow" id="radNow" role="status"><small>Šioje eilėje</small>${nowEv.map(x=>`<div>${evHtml(x)}${x.tech?`<small>${esc(x.tech)}</small>`:''}</div>`).join('')}</div>` : '';
  const nx = e ? radNextEv(D, i+(nowEv.some(x=>x.k==='shape'||x.k==='note'||x.k==='part'||x.k==='end')?1:0), x=>x.k==='shape'||x.k==='note'||x.k==='part'||x.k==='end') : null;
  const nc = e ? radNextEv(D, i+(nowEv.some(x=>x.k==='color'||x.k==='pat')?1:0), x=>x.k==='color'||x.k==='pat') : null;
  const when=r=>r.d===0?'šioje eilėje':`po ${r.d} eil.`;
  const where=r=>{ const t=D.list[r.j]; return D.hand?`eilė ${t.rc+1}`:`RC ${pad(t.rc)}`; };
  const nextBox = e ? `<div class="radbox" id="radNextEv" data-in="${nx?nx.d:''}" data-j="${nx?nx.j:''}">${nx?`${when(nx)}: ${esc(nx.ev.map(x=>x.s).join('; '))}<small>${where(nx)}</small>`:'Formavimo veiksmų toliau nėra.'}</div>` : '';
  const colBox = e && (D.col||D.pat) ? `<div class="radbox" id="radNextCol" data-in="${nc?nc.d:''}">${e.col?`<span class="raddot" style="background:${esc(e.col.color)}"></span>${esc(e.col.name)}<small>dabartiniai siūlai</small>`:''}${nc?`<div style="margin-top:4px">${when(nc)}: ${nc.ev[0].color?`<span class="raddot" style="background:${esc(nc.ev[0].color)}"></span>`:''}${esc(nc.ev.map(x=>x.s).join('; '))}<small>${where(nc)}</small></div>`:'<small>Siūlų keitimų toliau nėra.</small>'}${D.patPlace?radPlaceLine(D,e):''}</div>` : '';
  const T=D.T, legend = hand ? '' : (T.out ? `Adatų padėtys (${esc((MACHINES[S.machine]||{}).name||'')}): ${T.out} – nemezga · ${T.work} – mezga · ${T.upper} – viršutinė · ${T.hold} – laikymas` : 'Adatų padėčių pavadinimų nerasta – žr. mašinos instrukciją.');
  const big = e ? `<div class="radbig"><div class="radrc" id="radRC">${radCounterTxt(D,e)}</div>${st.car?`<div class="radcar" id="radCar" title="${D.hand?'Mezgama pusė':'Karietėlės kryptis'}">${D.hand?'':'Karietėlė '}${radCarTxt(D,e)}</div>`:''}</div>
      <div class="radneedle" id="radNeedle">${radRowTxt(D,e)}</div>
      <div class="radsub">${D.hand?`eilė ${e.rc+1} iš ${D.list.length?D.list[n-1].rc+1:0}`:`${Math.max(0,e.R-e.L)} adat. darbe · eilė ${i+1} iš ${n}`}${D.sim.parts.length>1?` · ${['iki iškirptės','dešinė pusė','kairė pusė'][e.pi]||''}`:''}</div>`
    : `<div class="radbig"><div class="radrc" id="radRC">${D.hand?`Eilė ${D.list[n-1].rc+1}`:`RC ${pad(D.list[n-1].rc+1)}`}</div></div><div class="radneedle" id="radNeedle">Detalė baigta ✓</div>`;
  const doneBox = done ? `<div class="radbox radnow" id="radNow">${(D.ends[D.list[n-1].pi]||['Visos eilės numegztos.']).map(t=>`<div>${esc(t)}</div>`).join('')}</div>` : '';
  const upto=Math.min(n,i+8);
  const listHtml = `<ol class="radlist" id="radList" aria-label="Artimiausios eilės">${D.list.slice(i,upto).map((r,k)=>`<li class="${k===0?'cur':''}${r.ev.length?' ev':''}" data-j="${i+k}"><span class="rn">${D.hand?r.rc+1:pad(r.rc)}</span><span>${esc(radRowTxt(D,r))}</span><span>${r.col&&(k===0||r.ev.some(x=>x.k==='color'))?`<span class="raddot" style="background:${esc(r.col.color)}"></span>`:''}${r.ev.length?`<b>${esc(r.ev.map(x=>x.s).join('; '))}</b>`:'<span class="note">—</span>'}</span></li>`).join('')}${upto<n?`<li class="note"><span></span><span></span><span>… dar ${n-upto} eil.</span></li>`:''}</ol>`;
  const patBox = (!hand && typeof patRowBox==='function') ? patRowBox() : '';
  const introBox = i===0 && D.intro.length ? `<details class="out" open><summary><b>Prieš pradedant</b></summary><ul style="margin:6px 0 0;padding-left:18px">${D.intro.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></details>` : '';
  const kp=st.keyPlus?radKeyName(st.keyPlus):'', km=st.keyMinus?radKeyName(st.keyMinus):'';
  const settings=`<details class="radset" id="radSet" ${S.open&&S.open['rad/set']?'open':''}><summary><b>Nustatymai: pedalas, garsas, apsauga nuo dvigubo paspaudimo</b></summary>
    <div class="fields" style="margin-top:8px">
      <label class="ck"><input type="checkbox" id="radSound" ${st.sound?'checked':''}> Pyptelėjimas</label>
      <label class="ck"><input type="checkbox" id="radVib" ${st.vib?'checked':''}> Vibracija</label>
      <label class="ck"><input type="checkbox" id="radFlash" ${st.flash?'checked':''}> Ekrano blyksnis</label>
      <label class="ck"><input type="checkbox" id="radCarOn" ${st.car?'checked':''}> ${hand?'Rodyti eilės pusę':'Rodyti karietėlės kryptį'}</label>
      <label class="f" for="radDeb">Ignoruoti paspaudimus, dažnesnius nei<span class="in"><input id="radDeb" type="number" inputmode="numeric" min="0" max="3000" step="50" value="${st.debounce}"><span class="u">ms</span></span></label>
    </div>
    <p class="note" style="margin:8px 0 4px">Bluetooth pedalas (AirTurn, PageFlip ir kt.) jungiasi kaip klaviatūra. Numatytai: → ↓ PageDown, tarpas, Enter – kita eilė; ← ↑ PageUp – atgal. AirTurn BT-200: 2 režimas (rodyklės), 3 (PageUp/PageDown) arba 5 (tarpas/Enter). Daugiau – skirtuke „Pagalba“.</p>
    <div class="row"><button class="btn" id="radLearnP">${st.learn==='plus'?'Paspauskite pedalą…':'Išmokyti pedalą: +1'}</button><button class="btn" id="radLearnM">${st.learn==='minus'?'Paspauskite pedalą…':'Išmokyti pedalą: −1'}</button>${st.keyPlus||st.keyMinus?'<button class="btn" id="radKeyReset">Grąžinti numatytuosius</button>':''}</div>
    <p class="note" id="radKeys" style="margin:6px 0 0">${kp||km?`Išmokta: +1 = <b>${esc(kp||'—')}</b>, −1 = <b>${esc(km||'—')}</b>. `:''}${esc(radMsg)}</p>
    <label class="ck" style="margin-top:6px"><input type="checkbox" id="radDefKeys" ${st.defKeys!==false?'checked':''}> Naudoti ir numatytuosius klavišus</label>
  </details>`;
  $('#view').innerHTML=`<div class="radar" id="radar" data-i="${i}" data-n="${n}">
    ${head}
    <div class="radgrid">
      <div class="radleft"><div class="radsvg" id="radSvg">${radSvg(D,i)}</div>${legend?`<p class="note" id="radLegend" style="margin:6px 0 0">${esc(legend)}</p>`:''}</div>
      <div class="radright" style="display:flex;flex-direction:column;gap:10px">
        ${big}${doneBox}${nowBox}${nextBox}${colBox}
        <div class="radbtns"><button class="radback" id="radPrev" aria-label="Atgal viena eile">−1</button><button class="radtap" id="radNext" ${done?'disabled':''}>Kita eilė ▶<small>bakstelėkite · pedalas · → / PageDown / tarpas</small></button></div>
        ${introBox}
        ${listHtml}
        ${patBox}
        <div class="row"><button class="btn" id="radPrint">🖨 Spausdinti eilių juostą</button>${!hand&&D.list.length?'':''}</div>
        <p class="note" id="radWakeNote"></p>
        ${settings}
      </div>
    </div></div>`;
  radBind(D,key,hand,i); radWakeNote(); if(!radWake&&!radWakeMsg) radWakeOn();
  if(typeof bindPatRow==='function' && !hand) bindPatRow();
}
function radBind(D,key,hand,i){
  const st=radSt();
  const on=(id,ev,fn)=>{ const el=document.getElementById(id); if(el) el[ev]=fn; };
  on('radClose','onclick',()=>radClose());
  on('radFull','onclick',()=>{ try{ const el=document.documentElement; if(document.fullscreenElement){ document.exitFullscreen(); } else if(el.requestFullscreen){ const p=el.requestFullscreen(); if(p&&p.catch) p.catch(()=>{}); } }catch(e){} });
  on('radPiece','onchange',ev=>{ const v=ev.target.value; const G=GARMENTS[S.garment];
    if(hand){ st.hPiece=v; }
    else { S.mRCs=S.mRCs&&typeof S.mRCs==='object'?S.mRCs:{}; S.mRCs[S.mPiece]=S.mRC; S.mPiece=S.garment+'/'+v; S.mStep=0; S.mStepSync=true;
      const D2=radData(S.garment,v,false); const j=st.pos[radKeyOf(S.garment,v,false)];
      if(!D2.special && j>=0 && j<=D2.list.length){ const e2=D2.list[j]; S.mRC=e2?e2.rc:D2.list[D2.list.length-1].rc+1; S.mPart=e2?e2.pi:null; }
      else { S.mRC=S.mRCs[S.mPiece]||0; S.mPart=null; } }
    if(G.pieces.some(p=>p.id===v)) S.piece=v; save(); viewRadar(); });
  if(D.special) return;
  const tap=dir=>ev=>{ if(ev&&ev.detail===0) return; const now=Date.now(); if(now-radLastTap<st.debounce) return; radLastTap=now; radStep(dir); };
  on('radNext','onclick',tap(1)); on('radPrev','onclick',tap(-1));
  document.querySelectorAll('#radList li[data-j]').forEach(li=>li.onclick=()=>{ const j=+li.dataset.j; if(j===i) return; radSetIndex(D,key,hand,j); save(); viewRadar(); });
  on('radPrint','onclick',()=>radPrintStrip());
  const ck=(id,k)=>on(id,'onchange',ev=>{ st[k]=ev.target.checked; save(); viewRadar(); });
  ck('radSound','sound'); ck('radVib','vib'); ck('radFlash','flash'); ck('radCarOn','car'); ck('radDefKeys','defKeys');
  on('radDeb','onchange',ev=>{ const v=parseInt(ev.target.value,10); st.debounce=isFinite(v)&&v>=0?Math.min(3000,v):400; save(); viewRadar(); });
  on('radLearnP','onclick',ev=>{ ev.stopPropagation(); st.learn=st.learn==='plus'?null:'plus'; radMsg=st.learn?'Paspauskite pedalo mygtuką „+1“ (Esc – atšaukti).':''; save(); viewRadar(); });
  on('radLearnM','onclick',ev=>{ ev.stopPropagation(); st.learn=st.learn==='minus'?null:'minus'; radMsg=st.learn?'Paspauskite pedalo mygtuką „−1“ (Esc – atšaukti).':''; save(); viewRadar(); });
  on('radKeyReset','onclick',()=>{ st.keyPlus=''; st.keyMinus=''; st.defKeys=true; radMsg='Grąžinti numatytieji klavišai.'; save(); viewRadar(); });
  const sd=document.getElementById('radSet'); if(sd) sd.addEventListener('toggle',()=>{ S.open=S.open||{}; S.open['rad/set']=sd.open; save(); });
  const cur=document.querySelector('#radList li.cur'); if(cur&&cur.parentNode) cur.parentNode.scrollTop=0;
}

/* ---------- eilių juosta spausdinimui ---------- */
function radStripHtml(D){
  const G=GARMENTS[D.gk], pc=pieceDef(D.gk,D.pid), g=D.hand?hkG():S.gauges[S.machine];
  const rows=D.list.map((e,i)=>{ const sp=D.hand?null:needleSpan(e.L,e.R).split('–');
    const a=e.ev.filter(x=>x.k!=='info').map(x=>x.s).join('; ');
    const col=e.col?`<span class="sq" style="background:${esc(e.col.color)}"></span>${esc(e.col.name)}`:'';
    return `<div class="rs${a?' ev':''}"><span class="rn">${D.hand?e.rc+1:pad(e.rc)}</span>${D.hand?`<span>${Math.max(0,e.R-e.L)} ak.</span><span></span>`:`<span>${esc(sp[0]||'')}</span><span>${esc(sp[1]||'')}</span>`}<span>${col}${e.pat?` r.${e.pat}${e.patN?` ${needleSpan(e.patN[0],e.patN[1]+1)}`:''}`:''}</span>${a?`<span class="a">${esc(a)}</span>`:''}</div>`; }).join('');
  const last=D.list[D.list.length-1], ends=(D.ends[last.pi]||[]).map(t=>`<div class="rs ev"><span class="a">${esc(t)}</span></div>`).join('');
  return `<h1>${esc(G.name)} · ${esc(pc.name)} – eilių juosta</h1>
    <div class="rsh">${esc(D.hand?'Rankinis mezgimas':(MACHINES[S.machine]||{}).full||'')} · mėginys ${fmt(g.sts)} ak. × ${fmt(g.rows)} eil. / 10 cm · ${D.list.length} eil.${D.hand?'':` · stulpeliai: RC, kairė adata, dešinė adata, siūlai`}${D.intro.length?'<br>'+D.intro.map(esc).join(' '):''}</div>
    ${rows}${ends}`; }
function radPrintStrip(){
  const c=radCur; if(!c||!c.D||c.D.special) return;
  radCss(); let box=document.getElementById('radStrip'); if(!box){ box=document.createElement('div'); box.id='radStrip'; document.body.appendChild(box); }
  box.innerHTML=radStripHtml(c.D); if(typeof i18nApply==='function'){ try{ i18nApply(box); }catch(e){} }
  document.body.classList.add('radprint');
  const done=()=>{ document.body.classList.remove('radprint'); window.removeEventListener('afterprint',done); };
  window.addEventListener('afterprint',done);
  try{ window.print(); }catch(e){ done(); } }

/* ================= MAKETAS: schematinis gaminio vaizdas pagal tikrą geometriją, mėginį ir raštą =================
   1 dalis (veikia be interneto): detalių kontūrai iš simulate() eilių (akis → x pagal ak./10 cm, eilė → y pagal eil./10 cm),
     raštas kartojamas tikru masteliu (vienas langelis = viena akis), centruotas ties adata 0, nuo „Raštų“ pradžios eilės.
     Spalvos: nuotrauka (k-means Lab erdvėje), „Mano siūlai“ arba rašto paletė. Rodinys: visas gaminys arba detalės atskirai.
   2 dalis (PARUOŠTA, BET IŠJUNGTA): MOCK_AI – tikroviško vaizdo užklausa per būsimą tarpinį serverį (POST {prompt,image} → {imageUrl|b64}).
     Jokių tinklo užklausų, kol MOCK_AI.enabled=false. Savininko sprendimas: laikoma rezerve, kol bus veikiantis AI sprendimas.
   S.mock = {src:'pattern'|'photo'|'stash', view:'all'|'parts', zoom, map:{slot:index|yarnId}, photo:[{hex,share}], k:0|2..6}
   Nuotrauka laikoma tik atmintyje (MK.img) – į localStorage rašomos tik išgautos spalvos. */

/* ---------- AI (išjungta) ---------- */
const MOCK_AI={enabled:false, provider:null, endpoint:null}; // įjungsime, kai bus nuspręsta dėl AI teikėjo ir tarpinio serverio
const MK_CNAMES=[['white','#f7f6f2'],['cream','#efe6cf'],['beige','#d8c3a0'],['camel','#b88a55'],['brown','#6b4426'],['dark brown','#3d2817'],['black','#141414'],['charcoal grey','#3b3d40'],['grey','#8a8c8f'],['light grey','#c9cacc'],
  ['red','#c0262d'],['burgundy','#6e1626'],['pink','#e89ab0'],['dusty rose','#c68a8f'],['coral','#ee7a5f'],['orange','#e5792b'],['mustard yellow','#cfa12a'],['yellow','#f1d548'],['olive green','#6f7232'],['moss green','#55703a'],
  ['green','#2f8a45'],['forest green','#1f4a2e'],['mint','#a8dcc2'],['teal','#1f7a7a'],['light blue','#9cc4e4'],['blue','#2c5fa8'],['navy blue','#1b2a4e'],['lavender','#b7a6d6'],['purple','#5e3a86'],['plum','#5a2a4a']];
function mkColourName(hex){ try{ const l=pRgb2lab(...pHex2rgb(hex)); let best='', bd=Infinity; MK_CNAMES.forEach(([n,h])=>{ const d=pD(l,pRgb2lab(...pHex2rgb(h))); if(d<bd){ bd=d; best=n; } }); return best; }catch(e){ return ''; } }
function mkT(x){ return typeof scT==='function'?scT(x):x; }
function mockAiData(){

  ['#scCam','#scGal'].forEach(s=>{ const i=box.querySelector(s); i.onchange=()=>{ scFile(i.files&&i.files[0]); i.value=''; }; });
  box.querySelector('#scPhDel').onclick=()=>{ SC.photo=null; SC.photoUrl=''; scUpdate(); };
  box.querySelector('#scTitle').oninput=e=>{ SC.title=e.target.value; scUpdate(); };
  box.querySelector('#scSub').oninput=e=>{ SC.sub=e.target.value; scUpdate(); };
  box.querySelectorAll('[data-scfmt]').forEach(b=>b.onclick=()=>{ SC.fmt=b.dataset.scfmt; scUpdate(); });
  const pc=box.querySelector('#scPat'); if(pc) pc.onchange=()=>{ SC.usePat=pc.checked; scUpdate(); };
  const sh=box.querySelector('#scShare');
  if(navigator.share && typeof File!=='undefined'){ sh.hidden=false; sh.onclick=async()=>{ const msg=box.querySelector('#scMsg');
    try{ const blob=await (await fetch(SC.lastUrl||scDataUrl({src:SC.src}))).blob(); const file=new File([blob],'garna.png',{type:'image/png'});
      if(navigator.canShare && !navigator.canShare({files:[file]})){ msg.textContent='Šis naršyklė negali dalintis paveikslėliu – atsisiųskite PNG.'; return; }
      await navigator.share({files:[file], title:SC.title||scData(SC.src).title, text:'Numegzta su '+APP_NAME}); }
    catch(e){ if(e&&e.name!=='AbortError') msg.textContent='Nepavyko pasidalinti – atsisiųskite PNG ir įkelkite rankiniu būdu.'; } }; }
  document.addEventListener('keydown',scKey,true);
  scUpdateNow(); try{ box.querySelector('#scX').focus({preventScroll:true}); }catch(e){}
}
function scBtn(id,src){ const b=document.createElement('button'); b.type='button'; b.className='btn noprint scopen'; b.id=id; b.textContent='📸 Kortelė dalinimuisi'; b.onclick=()=>scOpen(src); return b; }
function scInject(){
  // Detalės (rezultatai)
  const pdf=document.getElementById('pdfBtn'); if(pdf&&!document.getElementById('scOpenD')&&pdf.closest('#results')) pdf.after(scBtn('scOpenD','garment'));
  // Raštai (kai yra schema)
  const png=document.getElementById('pPng'); if(png&&!document.getElementById('scOpenR')&&document.getElementById('pChart')&&scPatOk()) png.after(scBtn('scOpenR','pattern'));
  // Rankinis mezgimas
  const hk=document.getElementById('hkPrint'); if(hk&&!document.getElementById('scOpenH')) hk.after(scBtn('scOpenH','hand'));
}

@media (max-width:680px){.scgrid{grid-template-columns:minmax(0,1fr)}.scwrap{padding:8px}.scdlg{padding:12px}}
@media print{.scwrap,.scopen{display:none!important}}`; document.head.appendChild(st); }
  let busy=false;
  const start=()=>{ const app=document.getElementById('app'); if(!app||typeof MutationObserver==='undefined') return;
    new MutationObserver(muts=>{ if(busy) return; if(muts.every(m=>[...m.addedNodes].every(n=>n.nodeType===1&&n.classList&&n.classList.contains('scopen')))) return;
      busy=true; try{ scInject(); }catch(e){} finally{ busy=false; } }).observe(app,{childList:true,subtree:true});
    try{ scInject(); }catch(e){} };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else setTimeout(start,0);
})();

};
const TIP_ORDER=['jap','hp','rib','transfer','bindm','pickm','seamm','wastem','kitch','three','pickh','wt','german','ssk','heel','magic','wasteh','block','mattress'];
function tipCtx(){ return (typeof S!=='undefined'&&S&&S.tab==='rankinis')?'h':'m'; }
function tipsFor(text, ctx){ const out=[]; if(!text) return out; ctx=ctx||tipCtx();
  for(const id of TIP_ORDER){ const t=GARNA_TIPS[id]; if(!t) continue; if(t.ctx!=='a'&&t.ctx!==ctx) continue; t.re.lastIndex=0; if(t.re.test(text)) out.push(id); if(out.length>=3) break; }
  return out; }
let tipPop=null, tipLastBtn=null;
function tipClose(){ if(tipPop){ tipPop.remove(); tipPop=null; } document.removeEventListener('keydown',tipKey,true); document.removeEventListener('pointerdown',tipOutside,true);

function tipKey(e){ if(e.key==='Escape'){ e.preventDefault(); tipClose(); } }
function tipOutside(e){ if(tipPop && !tipPop.contains(e.target) && !(e.target.closest&&e.target.closest('.tipbtn'))) tipClose(); }
function tipEsc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]); }
function tipOpen(btn, ids){
  const same=tipLastBtn===btn; tipClose(); if(same) return;
  const d=document.createElement('div'); d.className='tippop'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','false'); d.setAttribute('aria-label','Patarimas');
  d.innerHTML=`<button class="tipx" type="button" aria-label="Uždaryti">×</button>`+ids.map(id=>{ const t=GARNA_TIPS[id];
    return `<div class="tipitem"><h3>${tipEsc(t.t)}</h3><p>${tipEsc(t.x)}</p>${t.svg||''}${t.video?`<a class="btn tipvid" href="${tipEsc(t.video)}" target="_blank" rel="noopener">▶ Vaizdo įrašas</a>`:''}</div>`; }).join('');
  document.body.appendChild(d); tipPop=d; tipLastBtn=btn; btn.setAttribute('aria-expanded','true');
  d.querySelector('.tipx').onclick=()=>tipClose();
  // padėtis: šalia mygtuko, bet visada ekrane
  const vw=document.documentElement.clientWidth||window.innerWidth, vh=window.innerHeight, r=btn.getBoundingClientRect();
  const w=Math.min(380, vw-24); d.style.width=w+'px';
  const left=Math.max(12, Math.min(vw-w-12, r.left+r.width/2-w/2)); d.style.left=left+'px';
  const h=d.offsetHeight; let top=r.bottom+8; if(top+h>vh-12) top=Math.max(12, r.top-8-h); if(top+h>vh-12) top=Math.max(12, vh-12-h);
  d.style.top=top+'px';
  setTimeout(()=>{ document.addEventListener('keydown',tipKey,true); document.addEventListener('pointerdown',tipOutside,true); },0);
  try{ d.querySelector('.tipx').focus({preventScroll:true}); }catch(e){}
  if(typeof i18nApply==='function') try{ i18nApply(d); }catch(e){}
}
function tipBtn(ids){ const b=document.createElement('button'); b.type='button'; b.className='tipbtn noprint'; b.textContent='ⓘ';
  b.setAttribute('aria-label','Patarimas: '+GARNA_TIPS[ids[0]].t); b.title=GARNA_TIPS[ids[0]].t; b.setAttribute('aria-haspopup','dialog'); b.setAttribute('aria-expanded','false'); b.dataset.tips=ids.join(',');
  b.addEventListener('click',e=>{ e.preventDefault(); e.stopPropagation(); tipOpen(b, ids); });
  return b; }
function tipsScan(root){
  root=root||document.getElementById('app'); if(!root) return 0; let n=0; const ctx=tipCtx();
  const add=(el,ids)=>{ el.appendChild(document.createTextNode(' ')); el.appendChild(tipBtn(ids)); n++; };
  // lentelėse – ⓘ tik pirmoje kiekvieno patarimo tipo eilutėje (vienai lentelei / detalei)
  root.querySelectorAll('table.ins').forEach(tb=>{
    const seen=new Set(); tb.querySelectorAll('.tipbtn').forEach(b=>String(b.dataset.tips||'').split(',').forEach(id=>seen.add(id)));
    tb.querySelectorAll('tbody tr:not(.sec)').forEach(tr=>{ const el=tr.children[1]; if(!el||el.dataset.tipdone) return; el.dataset.tipdone='1';
      const ids=tipsFor(el.textContent, ctx).filter(id=>!seen.has(id)); if(!ids.length) return;
      ids.forEach(id=>seen.add(id)); add(el,ids); }); });
  // Mezgimo dabartinio žingsnio kortelė – visi tinkami patarimai
  root.querySelectorAll('.mcard .act').forEach(el=>{ if(el.dataset.tipdone) return; el.dataset.tipdone='1';
    const ids=tipsFor(el.textContent, ctx); if(ids.length) add(el,ids); });
  return n; }
(function tipsInit(){
  if(typeof document==='undefined') return;
  if(!document.getElementById('tipCss')){ const st=document.createElement('style'); st.id='tipCss'; st.textContent=`
.tipbtn{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;margin-left:2px;padding:0 4px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--accent);font:700 .95rem/1 var(--f-body,system-ui);cursor:pointer;vertical-align:middle}

.tippop h3{margin:0 28px 6px 0;font:700 1rem var(--f-display,system-ui);color:var(--accent)}

.tippop .tipx:hover{background:var(--sunk)}
.tippop .tipvid{display:inline-block;margin-top:4px;text-decoration:none}
@media print{.tipbtn,.tippop{display:none!important}}`; document.head.appendChild(st); }
  let busy=false;
  const run=()=>{ if(busy) return; busy=true; try{ tipsScan(); }catch(e){} finally{ busy=false; } };
  const start=()=>{ const app=document.getElementById('app'); if(!app||typeof MutationObserver==='undefined') return;
    new MutationObserver(muts=>{ if(muts.every(m=>[...m.addedNodes].every(n=>n.nodeType===1&&n.classList&&n.classList.contains('tipbtn')||n.nodeType===3&&n.nodeValue===' '))) return; if(tipPop && !document.body.contains(tipLastBtn)) tipClose(); run(); }).observe(app,{childList:true,subtree:true});
    run(); };
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',start); else setTimeout(start,0);

/* ================= KALBOS (LT / EN / NO) =================
   Tekstas verčiamas jau nupieštame puslapyje: skaičiai pakeičiami „#“, randamas vertimas žodyne,
   skaičiai grąžinami ta pačia tvarka. Žodynai: I18N_EN, I18N_NB (failai i18n_en.js, i18n_nb.js). */
const LANG_ALL=[['lt','LT','Lietuvių'],['en','EN','English'],['nb','NO','Norsk'],['sv','SV','Svenska'],['da','DA','Dansk'],['fi','FI','Suomi'],['lv','LV','Latviešu'],['et','ET','Eesti'],['de','DE','Deutsch'],['pl','PL','Polski'],['ru','RU','Русский']];
// Lengvasis (diegimo) režimas: žodynai neįterpti, build.py --lite įrašo I18N_AVAIL (kalbų kodai) ir I18N_VER;
// žodynas kraunamas pagal poreikį iš i18n/<kalba>.js (window.I18N_XX). Spalvų programoje ir app.html žodynai įterpti.
const I18N_LAZY=(typeof I18N_AVAIL!=='undefined')?I18N_AVAIL:null;
const I18N={ en: (typeof I18N_EN!=='undefined'?I18N_EN:(I18N_LAZY?null:{})), nb: (typeof I18N_NB!=='undefined'?I18N_NB:(I18N_LAZY?null:{})),
  sv:(typeof I18N_SV!=='undefined'?I18N_SV:null), da:(typeof I18N_DA!=='undefined'?I18N_DA:null), fi:(typeof I18N_FI!=='undefined'?I18N_FI:null), lv:(typeof I18N_LV!=='undefined'?I18N_LV:null), et:(typeof I18N_ET!=='undefined'?I18N_ET:null),
  de:(typeof I18N_DE!=='undefined'?I18N_DE:null), pl:(typeof I18N_PL!=='undefined'?I18N_PL:null), ru:(typeof I18N_RU!=='undefined'?I18N_RU:null) };
const LANGS=LANG_ALL.filter(([k])=>k==='lt'||I18N[k]||(I18N_LAZY&&I18N_LAZY.includes(k)));
const NUM_RE=/\d+(?:[.,]\d+)?/g;
const I18N_MISS=new Set();
function i18nKey(s){ return s.replace(/\s+/g,' ').trim().replace(NUM_RE,'#'); }
// Vertimas: (1) visas tekstas kaip raktas; (2) jei nerasta – tekstas skaidomas skyrybos ženklais
// („; “, „: “, „, “, „ · “, „ – “) ir verčiama kiekviena dalis atskirai (programos generuojamiems sąrašams).
// Spalvų kodai (#0595dc) apsaugomi, kad jų skaitmenys nebūtų laikomi skaičiais.
const I18N_HEX=/#[0-9a-fA-F]{3,8}\b/g;
const I18N_LET=/[A-Za-zĄČĘĖĮŠŲŪŽąčęėįšųūžЀ-ӿ]/;
function i18nOne(core, D, lang, record){
  const conv=n=> (lang==='en') ? n.replace(',','.') : n.replace('.',',');
  const hex=[]; const c2=core.replace(I18N_HEX, m=>{ hex.push(m); return '{hex}'; });
  let nums=c2.match(NUM_RE)||[], key=c2.replace(NUM_RE,'#'), t=D[key];
  if(t==null && hex.length){ nums=core.match(NUM_RE)||[]; const k2=core.replace(NUM_RE,'#'); t=D[k2]; if(t!=null){ hex.length=0; } }
  if(t==null){ if(record) I18N_MISS.add(key); return null; }
  let i=0, h=0;
  t=t.replace(/#/g,()=> i<nums.length ? conv(nums[i++]) : '#').replace(/\{hex\}/g,()=> h<hex.length ? hex[h++] : '');
  return t;
}
const I18N_SPLIT=/(\s*;\s+|:\s+|,\s+|\s+·\s+|\s+–\s+|\s+—\s+|\s*\(\s*|\s*\)\s*)/;
function i18nSeg(core, D, lang, rec){
  const parts=core.split(I18N_SPLIT); if(parts.length<3) return null;
  let ok=true; const out=parts.map((p,idx)=>{
    if(idx%2===1) return p;                      // skyrikliai
    const q=p.trim(); if(!q || !I18N_LET.test(q) || q.length<=2 || !/[a-ząčęėįšųūžа-я]{2}/.test(q)) return p; // be raidžių / trumpi žymenys
    const t=i18nOne(q, D, lang, rec); if(t==null){ ok=false; return p; } return p.replace(q,t);
  });
  return ok ? out.join('') : null;
}
function i18nTr(s, lang){
  lang=lang||S.lang; if(!lang||lang==='lt') return s;
  const D=I18N[lang]; if(!D) return s;
  const core=s.replace(/\s+/g,' ').trim(); if(!core || !I18N_LET.test(core.replace(I18N_HEX,''))) return s;
  let t=i18nOne(core, D, lang, false);
  if(t==null){ const gen=/\d/.test(core.replace(I18N_HEX,'')); t=i18nSeg(core, D, lang, gen); if(t==null){ if(!gen || core.split(I18N_SPLIT).length<3) I18N_MISS.add(core.replace(I18N_HEX,'{hex}').replace(NUM_RE,'#')); return s; } }
  const lead=s.match(/^\s*/)[0], tail=s.match(/\s*$/)[0];
  return lead+t+tail;
}
function i18nApply(root){
  if(!S.lang||S.lang==='lt'||!root) return;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>{ const p=n.parentNode; if(!p) return NodeFilter.FILTER_REJECT; const tg=p.nodeName; return (tg==='SCRIPT'||tg==='STYLE'||tg==='TEXTAREA')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT; }});
  const list=[]; while(w.nextNode()) list.push(w.currentNode);
  list.forEach(n=>{ if(n.__tr===n.nodeValue) return; const v=i18nTr(n.nodeValue); if(v!==n.nodeValue){ n.nodeValue=v; } n.__tr=n.nodeValue; });
  const els=root.querySelectorAll ? root.querySelectorAll('[placeholder],[title],[aria-label]') : [];
  els.forEach(el=>['placeholder','title','aria-label'].forEach(a=>{ const v=el.getAttribute(a); if(v){ const t=i18nTr(v); if(t!==v) el.setAttribute(a,t); } }));
}
let i18nObs=null, i18nBusy=false;
function i18nStart(){
  const app=document.getElementById('app'); if(!app || typeof MutationObserver==='undefined') return;
  if(i18nObs) i18nObs.disconnect();
  i18nObs=new MutationObserver(()=>{ if(i18nBusy) return; i18nBusy=true; try{ i18nApply(app); const pa=document.getElementById('printAll'); if(pa) i18nApply(pa); } finally{ i18nBusy=false; } });
  i18nObs.observe(app,{childList:true,subtree:true});
  const pa=document.body; if(pa) i18nObs.observe(pa,{childList:true});
  i18nApply(app);
  try{ document.documentElement.lang = S.lang||'lt'; }catch(e){}
}
function langPicker(){ if(LANGS.length>3) return `<label class="langsel noprint"><span aria-hidden="true">🌐</span><select id="langSel" aria-label="Kalba / Language">${LANGS.map(([k,l,n])=>`<option value="${k}" ${(S.lang||'lt')===k?'selected':''}>${l} · ${n}</option>`).join('')}</select></label>`;
  return `<div class="seg langs noprint" role="group" aria-label="Kalba">${LANGS.map(([k,l])=>`<button data-lang="${k}" aria-pressed="${(S.lang||'lt')===k}">${l}</button>`).join('')}</div>`; }
function i18nSave(){ save(); }
function bindLang(){ document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>i18nSet(b.dataset.lang));
  const ls=document.getElementById('langSel'); if(ls) ls.onchange=()=>i18nSet(ls.value); }
/* ---- kalbos žodyno krovimas pagal poreikį (tik lengvajame režime) ---- */
const I18N_PENDING={}; let i18nWant=null;
function i18nReady(k){ return !k||k==='lt'||!!I18N[k]; }
function i18nLoad(k){
  if(i18nReady(k)) return Promise.resolve(true);
  if(!I18N_LAZY||!I18N_LAZY.includes(k)) return Promise.resolve(false);
  if(I18N_PENDING[k]) return I18N_PENDING[k];
  return I18N_PENDING[k]=new Promise(res=>{
    const sc=document.createElement('script'), G='I18N_'+k.toUpperCase();
    const end=ok=>{ delete I18N_PENDING[k]; try{ sc.remove(); }catch(e){} res(ok); };
    sc.src='i18n/'+k+'.js'+(typeof I18N_VER!=='undefined'?'?v='+I18N_VER:''); sc.async=true;
    sc.onload=()=>{ const D=window[G]; if(D&&typeof D==='object'){ I18N[k]=D; end(true); } else end(false); };
    sc.onerror=()=>end(false);
    document.head.appendChild(sc);
  });
}
function i18nMsg(kind,k){
  let el=document.getElementById('i18nMsg');
  if(!kind){ if(el) el.remove(); return; }
  if(!el){ el=document.createElement('div'); el.id='i18nMsg'; el.className='noprint'; el.setAttribute('role','status'); el.setAttribute('aria-live','polite');
    el.style.cssText='position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;max-width:calc(100% - 32px);box-sizing:border-box;padding:8px 12px;border-radius:10px;background:#1b2428;color:#fff;font:600 14px/1.35 system-ui,sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;flex-wrap:wrap';
    document.body.appendChild(el); }
  const nm=(LANG_ALL.find(x=>x[0]===k)||[k,k,k])[2];
  clearTimeout(el.__t);
  if(kind==='load'){ el.dataset.state='load'; el.innerHTML=`<span>⏳ Kraunama kalba… / Loading language… (${nm})</span>`; }
  else { el.dataset.state='fail'; el.innerHTML=`<span>⚠ Nepavyko įkelti kalbos / Could not load language (${nm})</span><button type="button" id="i18nRetry" style="font:inherit;padding:3px 10px;border-radius:8px;border:1px solid #fff;background:transparent;color:#fff;cursor:pointer">Bandyti dar kartą / Retry</button><button type="button" id="i18nClose" aria-label="Uždaryti / Close" style="font:inherit;padding:3px 8px;border:0;background:transparent;color:#fff;cursor:pointer">✕</button>`;
    el.querySelector('#i18nRetry').onclick=()=>i18nSet(k); el.querySelector('#i18nClose').onclick=()=>i18nMsg();
    el.__t=setTimeout(()=>{ if(el.dataset.state==='fail') i18nMsg(); },10000); }
}
function i18nSet(k){
  if(i18nReady(k)){ i18nWant=null; i18nMsg(); S.lang=k; i18nSave(); render(); try{ document.documentElement.lang=k||'lt'; }catch(e){} return; }
  i18nWant=k; i18nMsg('load',k);
  i18nLoad(k).then(ok=>{ if(i18nWant!==k) return; i18nWant=null;
    if(ok){ i18nMsg(); S.lang=k; i18nSave(); render(); try{ document.documentElement.lang=k; }catch(e){} }
    else { render(); i18nMsg('fail',k); } });
}
// Paleidimas lengvajame režime: jei išsaugota kalba dar neįkelta – pirmiausia ją įkeliame (iki 3 s), tada piešiame.
function i18nBoot(){
  const k=S.lang;
  if(i18nReady(k)){ render(); i18nStart(); return; }
  let drawn=false; i18nWant=k; S.lang='lt';
  const draw=()=>{ if(drawn) return; drawn=true; render(); i18nStart(); };
  const tm=setTimeout(()=>{ draw(); if(i18nWant===k) i18nMsg('load',k); },3000);
  i18nLoad(k).then(ok=>{ clearTimeout(tm); if(i18nWant!==k){ draw(); return; } i18nWant=null;
    if(ok){ i18nMsg(); S.lang=k; if(drawn) render(); draw(); try{ document.documentElement.lang=k; }catch(e){} }
    else { draw(); i18nMsg('fail',k); } });
}

i18nBoot();
