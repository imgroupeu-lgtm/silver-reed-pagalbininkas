<style>
/* Išdėstymas: darbo pultas — kairėje parametrai, dešinėje schema ir eilutės; telefone viena kolona */

}

  --cut:#e58a70; --hold:#b4a0e8; --add:#79c99a; --warn:#e7b25a; --warn-bg:#33291a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12181b; --surface:#1a2226; --sunk:#151c1f; --ink:#e3e9ea; --muted:#9aa8ad; --line:#2f3a3f;

  --cut:#e58a70; --hold:#b4a0e8; --add:#79c99a; --warn:#e7b25a; --warn-bg:#33291a; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.appswitch:hover,.appswitch:focus-visible{background:var(--accent);color:#fff}
.appswitch .dots{display:inline-flex}.appswitch .dots i{width:14px;height:14px;border-radius:50%;margin-left:-4px;border:2px solid #fff}.appswitch .dots i:first-child{margin-left:0}

.mach{display:flex;flex-direction:column;gap:14px}

.mcard .rcbig{font:600 3.2rem var(--f-mono);line-height:1;font-variant-numeric:tabular-nums}
.mcard .act{font-size:1.35rem;font-weight:600}

.mnav{display:flex;gap:10px}
.mnav .btn{flex:1;padding:16px;font-size:1.05rem}
.mlist{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}

.leg{display:flex;flex-wrap:wrap;gap:10px;font-size:.78rem;color:var(--muted);margin-top:6px}
details.grp{border-top:1px solid var(--line);padding:6px 0}
details.grp summary{cursor:pointer;font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:8px 0;list-style:none;display:flex;justify-content:space-between}
details.grp summary::after{content:'+';font-size:1rem}
details.grp[open] summary::after{content:'–'}
details.grp summary::-webkit-details-marker{display:none}

.picker{display:flex;flex-direction:column;gap:10px;margin-bottom:0}
.pickrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pickrow .lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;min-width:64px}
.pickrow .pieces{margin:0}
ol.steps,ul.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:.92rem}
#view{display:flex;flex-direction:column;gap:14px}
/* telefonas */
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.schema{max-width:320px;margin:0 auto}
@media (max-width:640px){
  body{font-size:16px}
  .brand h1{font-size:1.25rem}
  header.top .seg{width:100%}
  .appswitch{width:100%;justify-content:center}
  header.top .seg button{flex:1}
  nav.tabs{flex-wrap:wrap;overflow:visible;gap:2px 4px}
  nav.tabs button{padding:9px 9px;font-size:.88rem}
  .btn{padding:12px 14px;font-size:.95rem;min-height:44px}
  .row .btn{flex:1 1 auto}
  .seg button{padding:10px 12px;min-height:40px}
  .pieces button{padding:9px 13px}
  label.f input,label.f select{font-size:16px;padding:10px 9px}
  .panel{padding:14px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  table.ins thead{display:none}
  table.ins tr{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
  table.ins td{border:0;padding:0}
  table.ins tr.sec{display:block;padding:0}
  table.ins tr.sec td{display:block;padding:8px 6px;border-radius:6px}
  table.ins tr.nt td:first-child{display:none}
  table.ins tr.nt{grid-template-columns:1fr}
  table.ins td.rc{grid-row:span 2}
  table.ins td.sp{grid-column:2}
  .mcard .rcbig{font-size:2.6rem}
  .mnav{position:sticky;bottom:env(safe-area-inset-bottom,0px);background:var(--bg);padding:8px 0}

}
@media print{header.top,nav.tabs,.noprint{display:none!important}.grid{grid-template-columns:1fr}.panel{border:0;padding:0}body{background:#fff;color:#000}}
@media (prefers-reduced-motion:no-preference){.btn,.seg button{transition:background .15s,border-color .15s}}

<div class="wrap" id="app"></div>

<script>
/*CORE*/
const MACHINES = {
  SK280:{id:'SK280', name:'SK280', full:'Silver Reed SK280', needles:200, pitch:4.5, kind:'standartinis 4,5 mm', ribber:true, card:24},
  SK155:{id:'SK155', name:'SK155', full:'Silver Reed SK155', needles:110, pitch:9, kind:'stambus 9 mm', ribber:false, card:12}
};
const SHOULDERS = [
  ['japon','Japoniškas petys (trumposios eilės)'],
  ['paprastas','Paprastas petys (laiptuotas uždarymas)'],
  ['tiesus','Tiesus petys (be nuolydžio)']
];
const ARMTYPES = [['isiuta','Įsiūta rankovė'],['reglanasA','Anatominis reglanas'],['reglanas','Standartinis reglanas'],['nuleista','Nuleistas petys']];
const isRaglan = a=> a==='reglanas' || a==='reglanasA';
// Anatominis reglanas: po uždarymo – statesnė dalis (aukštis cur), toliau – švelnesnė tiesi dalis iki kaklo.
// rem – kiek nuimama statesnėje dalyje; 0 = automatiškai, kad ji būtų 1,5 karto statesnė.
function ragLine(x0, xTop, D, cur, rem){
  cur=Math.min(Math.max(0.1,cur), D*0.9); const S=x0-xTop;
  if(!(rem>0)) rem = 1.5*S*cur/((D-cur)+1.5*cur);
  rem=Math.min(rem, S);
  return t=>{ if(t<=cur) return x0 - rem*(t/cur); return lerp(x0-rem, xTop, (t-cur)/(D-cur)); };
}
const NECKS = [['apvali','Apvali'],['V','V formos']];
const COLLARS = [['juosta','Juosta aplink kaklą',2.5],['pusgolfis','Pusgolfis (pusiau aukštas kaklas)',8],['golfas','Golfas (aukštas kaklas)',18]];

function srnd(x){ return x<0 ? -Math.floor(-x+0.5) : Math.floor(x+0.5); }
function lerp(a,b,t){ return a+(b-a)*t; }
function clamp01(t){ return Math.min(1,Math.max(0,t)); }
// Ketvirčio apskritimo kreivė: prasideda horizontaliai (uždarymas), baigiasi vertikaliai.
function jcurve(t){ t=clamp01(t); return Math.sqrt(1-(1-t)*(1-t)); }
// Rankovės viršaus vidurys ir viršūnė: lėtas vidurys, staigėjanti viršūnė (varpo forma).
function bell(t){ t=clamp01(t); return 0.55*t + 0.45*Math.pow(t,4); }
function curveLen(fx,y0,y1,n){ n=n||400; if(!(y1>y0)) return 0; let len=0,px=fx(y0),py=y0; for(let i=1;i<=n;i++){ const y=y0+(y1-y0)*i/n, x=fx(y); len+=Math.hypot(x-px,y-py); px=x; py=y; } return len; }

/* ---------- Liemens pagrindas (nugara/priekis) ---------- */
function bodyBase(b, garment){
  const dress = garment==='suknele' || b.hemToWaist>0;
  const h2w = dress ? Math.max(0,b.hemToWaist) : 0;
  const w2u = Math.max(0.1,b.waistToUnderarm);
  const Hu = h2w + w2u;
  const arm = b.armType||'isiuta';
  const rag = isRaglan(arm), anat = arm==='reglanasA', drop = arm==='nuleista';
  const flat = rag || b.method==='tiesus';
  const slope = flat ? 0 : Math.max(0,b.slope);
  const ss = Hu + Math.max(0.1,b.armDepth);
  const H = ss + slope;
  const bust = b.bustW/2;
  const side = y=>{
    if(dress && y<=h2w && h2w>0) return lerp(b.hemW/2, b.waistW/2, y/h2w);
    if(y<=Hu){ const from = dress ? b.waistW/2 : b.hemW/2; return lerp(from, bust, (y-h2w)/w2u); }
    if(anat) return ragLine(bust-b.armRemove, b.neckW/2, b.armDepth, b.armCurve, b.ragCurveRem)(y-Hu);
    if(rag) return lerp(bust-b.armRemove, b.neckW/2, (y-Hu)/b.armDepth);
    if(!drop && b.armRemove>0 && b.armCurve>0) return bust - b.armRemove*jcurve((y-Hu)/b.armCurve);
    if(!drop && b.armRemove>0) return bust - b.armRemove;
    return bust;
  };
  return {H, Hu, ss, slope, side, arm, rag, drop, flat, bust};
}
function neckShapeFn(shape, H, nd){
  const y0=H-nd;
  if(shape==='V') return y=> y<y0 ? 0 : clamp01((y-y0)/nd);
  return y=> y<y0 ? 0 : jcurve((y-y0)/nd);
}
function baseWarnings(b){
  const w=[];
  if(!isRaglan(b.armType) && b.bustW/2 - (b.armType==='nuleista'?0:b.armRemove) - b.neckW/2 <= 0) w.push('Pečiui nelieka pločio: sumažinkite iškirptės plotį arba iškarpos nuėmimą.');
  if(b.armType==='isiuta' && b.armCurve>b.armDepth) w.push('Iškarpos kreivė aukštesnė už iškarpos gylį.');
  if(isRaglan(b.armType) && b.bustW/2-b.armRemove <= b.neckW/2) w.push('Reglanui: plotis ties pažastimi turi būti didesnis už iškirptę.');
  return w;
}
// Nugara arba megztinio/suknelės priekis (simetriška detalė, iškirptė per vidurį)
function bodyGeom(b, front, garment){
  const B=bodyBase(b, garment);
  const w=baseWarnings(b);
  const nd = Math.max(0, front ? front.neckD : b.neckD);
  const shape = front ? front.neckShape : 'apvali';
  const sh = neckShapeFn(shape, B.H, nd);
  const neckHalf = (b.neckW>0 && nd>0) ? (y=> (b.neckW/2)*sh(y)) : null;
  if(nd>B.H) w.push('Iškirptės gylis didesnis už visą detalę.');
  const g = { H:B.H, L:y=>-B.side(y), R:y=>B.side(y), neckHalf, ss: B.flat?null:B.ss, Hu:B.Hu, armTop:B.ss,
    ribCm:b.ribCm, finish: B.rag?'neck':'shoulder', method: B.rag?'paprastas':b.method, warnings:w, base:B };
  g.neckLen = neckHalf ? 2*curveLen(neckHalf, B.H-nd, B.H) : b.neckW;
  if(front && front.dartCm>0 && front.dartDepth>0){
    g.dart={y: B.Hu - Math.max(0,front.dartPos), extraCm:front.dartCm, depthCm:Math.min(front.dartDepth, B.bust), sides:['L','R']};
    if(front.dartPos>B.Hu) w.push('Įsiuvė per žemai – mažinkite atstumą nuo pažasties.');
  }
  return g;
}
// Kardigano priekis. side 'L' – iškirptė dešinėje (šonas kairėje), 'R' – veidrodinis.
function cfrontGeom(b, f, side, garment){
  const B=bodyBase(b, garment);
  const w=baseWarnings(b);
  const bw=(f.bandW||0) - 2*Math.max(0,f.overlap||0);  // užlaida (švarkas) – priekis išsikiša už vidurio linijos
  const nd=Math.max(0,f.neckD);
  const sh=neckShapeFn(f.neckShape, B.H, nd);
  const red = Math.max(0, b.neckW/2 - bw/2);
  const Lf = y=> -B.side(y);
  const Rf = y=> -bw/2 - red*sh(y);
  let L = Lf, R = Rf;
  let sides=['L'], top={L:R(B.H)};
  if(side==='R'){ const L0=L, R0=R; L=y=>-R0(y); R=y=>-L0(y); sides=['R']; top={R:R(B.H)}; }
  if(bw>0 && b.neckW/2 < bw/2) w.push('Sagų juosta platesnė už iškirptę.');
  const g={ H:B.H, L, R, neckHalf:null, ss:B.flat?null:B.ss, Hu:B.Hu, armTop:B.ss, shoulderSides:sides, shoulderTop:top,
    ribCm:b.ribCm, finish:B.rag?'neck':'shoulder', method:B.rag?'paprastas':b.method, warnings:w, base:B };
  g.neckLen = curveLen(y=>red*sh(y), B.H-nd, B.H);
  g.edgeLen = (b.ribCm||0) + (B.H-nd);
  if(f.dartCm>0 && f.dartDepth>0) g.dart={y:B.Hu-Math.max(0,f.dartPos), extraCm:f.dartCm, depthCm:Math.min(f.dartDepth, B.bust-bw/2), sides:[side==='R'?'R':'L']};
  return g;
}
function sleeveGeom(p, b){
  const w=[];
  const arm=b.armType||'isiuta';
  const L1=Math.max(0.1,p.length);
  const up=p.upperW/2;
  let H, half, capH=0, top;
  const taper = y=> lerp(p.cuffW/2, up, y/L1);
  if(arm==='nuleista'){
    H=L1; top=up; half=y=>taper(Math.min(y,L1));
  } else if(isRaglan(arm)){
    capH=Math.max(0.1,b.armDepth); H=L1+capH; top=p.capTop/2;
    if(arm==='reglanasA'){
      const line=ragLine(up-b.armRemove, top, capH, b.armCurve, 0);
      half=y=> y<=L1 ? taper(y) : line(y-L1);
    } else half=y=> y<=L1 ? taper(y) : lerp(up-b.armRemove, top, (y-L1)/capH);
    if(top>up-b.armRemove) w.push('Rankovės viršus platesnis už rankovę po pažastimi.');
  } else {
    const rem=b.armRemove, cur=b.armCurve;
    capH=Math.max(0,p.capH); H=L1+capH; top=p.capTop/2;
    const mid=up-rem, span=Math.max(0,capH-cur);
    half=y=>{
      if(y<=L1) return taper(y);
      if(cur>0 && y<L1+cur) return up - rem*jcurve((y-L1)/cur);
      if(span<=0) return top;
      return mid - (mid-top)*bell((y-L1-cur)/span);
    };
    if(capH<cur) w.push('Rankovės viršus žemesnis už pažasties kreivę.');
    if(top>mid) w.push('Viršaus plotis per didelis.');
  }
  return { H, L:y=>-half(y), R:y=>half(y), neckHalf:null, ss:null, L1, capH, top, half, arm,
    ribCm:p.ribCm, finish: isRaglan(arm)?'neck':'bind', method:'paprastas', warnings:w };
}
function trouserGeom(p, back){
  const w=[];
  const ins=Math.max(1,p.inseam), kh=Math.min(Math.max(0.1,p.kneeH),ins-0.1);
  const rise=Math.max(1,p.rise);
  const H = ins + rise;
  const width = y=> y<=kh ? lerp(p.hemW,p.kneeW,y/kh) : lerp(p.kneeW,p.crotchW,(y-kh)/(ins-kh));
  const xin = -p.crotchW/2 + p.ext;
  const L = y=>{
    if(y<=ins) return -width(y)/2;
    if(p.curveH>0) return -p.crotchW/2 + p.ext*jcurve((y-ins)/p.curveH);
    return xin;
  };
  const hipH=Math.min(Math.max(0.1,p.hipH),rise-0.1);
  const R = y=>{
    if(y<=ins) return width(y)/2;
    if(y<=ins+hipH) return lerp(p.crotchW/2, xin+p.hipW, (y-ins)/hipH);
    return lerp(xin+p.hipW, xin+p.waistW, (y-ins-hipH)/(rise-hipH));
  };
  if(p.ext>=p.crotchW) w.push('Tarpkojo išsikišimas didesnis už plotį ties tarpkoju.');
  if(p.curveH>rise) w.push('Tarpkojo kreivė aukštesnė už sėdynės aukštį.');
  if(p.hipH>=rise) w.push('Klubų aukštis turi būti mažesnis už sėdynės aukštį.');
  const g={ H, L, R, neckHalf:null, ss:null, ribCm:p.ribCm, finish:'bind', method:'paprastas', warnings:w, waistband:p.waistband };
  if(back && p.raise>0) g.wedge={side:'R', extraCm:p.raise};
  return g;
}

function needleSpan(L,R){
  if(R<=L) return '—';
  const a = L<0 ? 'K'+(-L) : 'D'+(L+1);
  const b = R>0 ? 'D'+R : 'K'+(-R+1);
  return a+'–'+b;
}
function pad(n){ return String(n).padStart(3,'0'); }
function shortRowGroups(sts, pairs){
  if(!(sts>0)||!(pairs>0)) return [];
  const g=[]; let given=0;
  for(let i=1;i<=pairs;i++){ const t=Math.round(sts*i/pairs); g.push(t-given); given=t; }
  return g;
}

function simulate(geom, g, o){
  const spc=g.sts/10, rpc=g.rows/10;
  const shift = -Math.round((srnd(geom.L(0)*spc)+srnd(geom.R(0)*spc))/2);
  const stx=x=>srnd(x*spc)+shift;
  const base=Math.max(2, srnd(geom.H*rpc));
  const startSide=o.carriage==='K'?'K':'D';
  const cs=rc=> (rc%2===0) ? startSide : (startSide==='D'?'K':'D');
  const opp=s=> s==='D'?'K':'D';
  const method=geom.method||'paprastas';
  const japon = method==='japon';
  const ss=geom.ss;
  const nhTop = geom.neckHalf ? geom.neckHalf(geom.H) : 0;
  const shSides = geom.shoulderSides || ['L','R'];
  const shTop = geom.shoulderTop || {L:-nhTop, R:nhTop};
  const top = geom.H;
  // įsiuvė
  let dartRc=null, E=0, dartGroups=[], dartSides=[];
  if(geom.dart && geom.dart.extraCm>0 && geom.dart.depthCm>0){
    E = 2*Math.max(1, srnd(geom.dart.extraCm*rpc/2));
    dartRc = Math.max(2, 2*Math.floor(srnd(geom.dart.y*rpc)/2));
    dartGroups = shortRowGroups(stx(geom.dart.depthCm), E/2);
    dartSides = geom.dart.sides||['L','R'];
  }
  const N = base + E;
  const mapRow = r=> (dartRc==null || r<=dartRc) ? r : (r<=dartRc+E ? null : r-E);
  const yOf = rc=>{ let k=rc-(rc%2)+1; if(dartRc!=null && k>dartRc){ k = k<=dartRc+E ? dartRc-1 : k-E; } return Math.min(geom.H, Math.max(0,k)/rpc); };
  const effR = y=> (ss!=null && shSides.includes('R') && y>ss+1e-9) ? {x:lerp(geom.R(ss), shTop.R, (y-ss)/(top-ss)), sh:true} : {x:geom.R(y), sh:false};
  const effL = y=> (ss!=null && shSides.includes('L') && y>ss+1e-9) ? {x:lerp(geom.L(ss), shTop.L, (y-ss)/(top-ss)), sh:true} : {x:geom.L(y), sh:false};
  let minL=0,maxR=0, warnings=[...(geom.warnings||[])], narrow=false;
  const shoulders=[];
  function ev(rc, side, d, sh, span){
    let type;
    if(d>0) type = sh ? (japon?'hold':'bind') : (d>=2?'bind':'dec');
    else type = (-d===1)?'inc':'cast';
    return {rc, side, type, n:Math.abs(d), span, car:cs(rc)};
  }
  function runPart(stt, from, to, fL, fR, items, rows){
    for(let rc=from; rc<to; rc++){
      const c=cs(rc);
      if(dartRc!=null && rc>=dartRc && rc<dartRc+E){
        if(rc===dartRc){ stt.preL=stt.L; stt.preR=stt.R; items.push({note:`RC ${pad(rc)}: krūtinės įsiuvė daliniu mezgimu – ${E} eil.${dartSides.length>1?' abiejuose šonuose':''}. Russel svirteles nustatykite į I.`}); }
        const step=Math.floor((rc-dartRc)/2), hs=opp(c), key=hs==='D'?'R':'L';
        if(dartSides.includes(key) && step<dartGroups.length && dartGroups[step]>0){
          const n=dartGroups[step]; if(key==='R') stt.R-=n; else stt.L+=n;
          items.push({rc, side:hs, type:'hold', n, span:needleSpan(stt.L,stt.R), car:c, w:stt.R-stt.L});
        }
        rows.push({rc:rc+1, L:stt.L, R:stt.R, yr:null});
        if(rc===dartRc+E-1){ stt.L=stt.preL; stt.R=stt.preR; items.push({note:`RC ${pad(rc+1)}: laikomas adatas pusėje, priešingoje karietėlei, pastumkite į C padėtį ir numegzkite eilę; tą patį padarykite kitoje pusėje. Šono siūlė lieka tokio pat ilgio kaip nugaros.`}); }
        continue;
      }
      const y=yOf(rc);
      const r=fR(y); let tR=stx(r.x);
      const reqR=(r.sh && japon)?'K':'D';
      if(c===reqR && tR!==stt.R){ tR=Math.max(tR,stt.L); if(tR!==stt.R){ const d=stt.R-tR; stt.R=tR; if(r.sh&&d>0) stt.shR=(stt.shR||0)+d; items.push(Object.assign(ev(rc,'D',d,r.sh,needleSpan(stt.L,stt.R)),{w:stt.R-stt.L})); } }
      const l=fL(y); let tL=stx(l.x);
      const reqL=(l.sh && japon)?'D':'K';
      if(c===reqL && tL!==stt.L){ tL=Math.min(tL,stt.R); if(tL!==stt.L){ const d=tL-stt.L; stt.L=tL; if(l.sh&&d>0) stt.shL=(stt.shL||0)+d; items.push(Object.assign(ev(rc,'K',d,l.sh,needleSpan(stt.L,stt.R)),{w:stt.R-stt.L})); } }
      minL=Math.min(minL,stt.L); maxR=Math.max(maxR,stt.R);
      if(stt.R-stt.L<=0 && rc<to-1 && !(r.sh||l.sh) && geom.finish!=='neck') narrow=true;
      rows.push({rc:rc+1, L:stt.L, R:stt.R, yr:mapRow(rc+1)});
    }
  }
  const sections=[];
  const st0={L:stx(geom.L(0)), R:stx(geom.R(0))};
  const castOn={L:st0.L, R:st0.R, n:st0.R-st0.L};
  minL=st0.L; maxR=st0.R;
  const ribRpc=(g.ribRows||g.rows)/10;
  const ribRows = geom.ribCm>0 ? Math.max(1,srnd(geom.ribCm*ribRpc)) : 0;
  const start=[];
  start.push({note:`Užmeskite ${castOn.n} ak. ant adatų ${needleSpan(castOn.L,castOn.R)}.`});
  if(ribRows) start.push({note: o.ribber ? `Juosta: ${geom.ribCm} cm = ${ribRows} eil. su antra adatų lova. Tada perkelkite akis į pagrindinę lovą.` : `Juosta: ${geom.ribCm} cm = ${ribRows} eil. (pvz. dvigubas sulenktas kraštas).`});
  start.push({note:`Nustatykite eilių skaitiklį RC 000, karietėlė ${startSide==='D'?'dešinėje':'kairėje'}.`});
  sections.push({title:'Pradžia', items:start});
  let rc0=null;
  if(geom.neckHalf){ for(let rc=0; rc<N; rc+=2){ if(srnd(geom.neckHalf(yOf(rc))*spc)>=1){ rc0=rc; break; } } }
  const parts=[];
  const mainItems=[], mainRows=[];
  runPart(st0, 0, rc0==null?N:rc0, effL, effR, mainItems, mainRows);
  parts.push({rows:mainRows, sL:castOn.L, sR:castOn.R, fromRc:0, fromY:0});
  sections.push({title: rc0==null ? 'Mezgimas' : 'Iki kaklo iškirptės', items:mainItems});
  function shoulderTarget(key){
    const yy = ss!=null ? ss : geom.H;
    const o = key==='R' ? geom.R(yy) : geom.L(yy);
    return Math.abs(stx(o)-stx(shTop[key]));
  }
  function finishPart(stt, label, key){
    let w=Math.max(0,stt.R-stt.L);
    if(geom.finish==='shoulder'){
      const held = key==='R' ? (stt.shR||0) : key==='L' ? (stt.shL||0) : (stt.shR||0)+(stt.shL||0);
      const target = key ? shoulderTarget(key) : held+w;
      const extra = Math.max(0, held+w-target);
      const tot = held + w - extra;
      shoulders.push(tot);
      const pre = extra>0 ? `kaklo pusėje uždarykite dar ${extra} ak.; ` : '';
      w -= extra;
      if(ss==null) return {note:`${label}: ${pre}${tot} pečio ak. uždarykite arba nuimkite ant pagalbinio siūlo pečių sujungimui.`};
      if(japon) return {note:`${label}: ${pre}pečio akys – ${tot}. Russel svirteles nustatykite į II (laikomos adatos sumegs ir grįš į B), numegzkite kelias eiles pagalbiniu siūlu ir nuimkite. Pečius sujunkite ant mašinos akis į akį (instrukcijoje – „Seaming on the Machine“).`};
      return w>0 ? {note:`${label}: ${pre}uždarykite likusias ${w} ak. (pečio akių iš viso ${tot}); uždarymo eilę megzkite 3–4 tempimo numeriais laisviau. Pečius vėliau susiūkite.`} : {note:`${label}: ${pre}petys uždarytas (${tot} ak.). Pečius vėliau susiūkite.`};
    }
    if(geom.finish==='neck') return w>0 ? {note:`${label}: likusias ${w} ak. nuimkite ant pagalbinio siūlo apykaklei arba uždarykite.`} : {note:`${label}: detalė baigta.`};
    if(geom.waistband) return {note:`${label}: likusias ${w} ak. palikite juosmens juostai (${geom.waistband} cm = ${srnd(geom.waistband*ribRpc)} eil.) arba uždarykite.`};
    return {note:`${label}: likusias ${w} ak. uždarykite – uždarymo eilę megzkite 3–4 tempimo numeriais laisviau.`};
  }
  let extraRows=0;
  if(rc0!=null){
    const h=srnd(geom.neckHalf(yOf(rc0))*spc);
    const split=[];
    split.push({note:`RC ${pad(rc0)}: vidurines ${2*h} ak. (${needleSpan(-h,h)}) nuimkite ant pagalbinio siūlo arba uždarykite.`});
    split.push({note:`Kairės pusės adatas ${needleSpan(st0.L,-h)} perkelkite į laikymo padėtį (HP) arba nuimkite ant pagalbinio siūlo. Toliau mezgate tik dešinę pusę.`});
    sections.push({title:'Kaklo iškirptė', items:split});
    const sR=st0.R, sL=st0.L; // plotis ties iškirptės pradžia
    const right={L:h, R:sR, shR:st0.shR||0}, rItems=[], rRows=[];
    runPart(right, rc0, N, y=>({x:geom.neckHalf(y), sh:false}), effR, rItems, rRows);
    rItems.push(finishPart(right,'Dešinė pusė','R'));
    sections.push({title:'Dešinė pusė', items:rItems});
    const left={L:sL, R:-h, shL:st0.shL||0}, lItems=[], lRows=[];
    lItems.push({note:`Grąžinkite kairę pusę į darbą, nustatykite RC ${pad(rc0)}, karietėlė ${cs(rc0)==='D'?'dešinėje':'kairėje'}.`});
    runPart(left, rc0, N, effL, y=>({x:-geom.neckHalf(y), sh:false}), lItems, lRows);
    lItems.push(finishPart(left,'Kairė pusė','L'));
    sections.push({title:'Kairė pusė', items:lItems});
    const fy=(mapRow(rc0)==null?dartRc:mapRow(rc0))/rpc;
    parts.push({rows:rRows, sL:h, sR, fromRc:rc0, fromY:fy});
    parts.push({rows:lRows, sL, sR:-h, fromRc:rc0, fromY:fy});
  } else {
    const last=sections[sections.length-1].items;
    if(geom.wedge && geom.wedge.extraCm>0){
      const W2=2*Math.max(1,srnd(geom.wedge.extraCm*rpc/2));
      const grp=shortRowGroups(st0.R-st0.L, W2/2+1).slice(0,W2/2);
      const wItems=[{note:`RC ${pad(N)}: nugaros pakėlimas trumposiomis eilėmis – ${W2} eil. Adatas į HP traukite šono (dešinėje) pusėje, kai karietėlė kairėje; tarpkojo pusė mezgama visą laiką.`}];
      const pre={L:st0.L,R:st0.R};
      for(let j=0;j<W2;j++){
        const rc=N+j, c=cs(rc), hs=opp(c), step=Math.floor(j/2);
        if(hs===(geom.wedge.side==='R'?'D':'K') && step<grp.length && grp[step]>0){
          const n=grp[step]; if(geom.wedge.side==='R') st0.R-=n; else st0.L+=n;
          wItems.push({rc, side:hs, type:'hold', n, span:needleSpan(st0.L,st0.R), car:c, w:st0.R-st0.L});
        }
        mainRows.push({rc:rc+1, L:st0.L, R:st0.R, yr:null});
      }
      st0.L=pre.L; st0.R=pre.R;
      wItems.push({note:`RC ${pad(N+W2)}: laikomas adatas pastumkite į C padėtį ir numegzkite 1 eil. per visas akis.`});
      extraRows=W2;
      wItems.push(finishPart(st0,'Pabaiga'));
      sections.push({title:'Nugaros pakėlimas', items:wItems});
    } else {
      last.push(finishPart(st0,'Pabaiga', geom.shoulderSides?geom.shoulderSides[0]:null));
    }
  }
  sections.push({title:'Iš viso', items:[{note:`${N+extraRows} eil. pagrindinio mezgimo${ribRows?` + ${ribRows} eil. juostos`:''}.${E?` Iš jų ${E} eil. – įsiuvė.`:''}`}]});
  let stRows=0; parts.forEach(p=>p.rows.forEach(r=>stRows+=Math.max(0,r.R-r.L)));
  const area = stRows/spc/rpc + (ribRows? castOn.n/spc*ribRows/ribRpc : 0);
  const needed = 2*Math.max(-minL, maxR);
  if(o.needles && needed>o.needles) warnings.push(`Detalei reikia ${needed} adatų, o ${o.machineName} turi ${o.needles}. Sumažinkite plotį arba rinkitės kitą mašiną.`);
  if(narrow) warnings.push('Detalė kažkur tampa per siaura. Patikrinkite matmenis.');
  return {sections, parts, castOn, N:N+extraRows, ribRows, area, needed, warnings, rc0, spc, rpc, shoulders, dartRows:E};
}

function combine(items){
  const out=[];
  for(let i=0;i<items.length;i++){
    const a=items[i], b=items[i+1];
    if(a.type && b && b.type===a.type && b.n===a.n && b.side!==a.side && b.rc===a.rc+1){ out.push({...a, side:'abi', first:a.side, rc2:b.rc, span:b.span}); i++; }
    else out.push(a);
  }
  return out;
}
function group(items){
  const out=[]; let i=0;
  while(i<items.length){
    const a=items[i];
    if(!a.type){ out.push(a); i++; continue; }
    let j=i+1, step=null;
    while(j<items.length){
      const b=items[j];
      if(!b.type||b.type!==a.type||b.n!==a.n||b.side!==a.side) break;
      const d=b.rc-items[j-1].rc;
      if(step===null) step=d; else if(d!==step) break;
      j++;
    }
    const cnt=j-i;
    if(cnt>=3){ out.push({...a, grp:{count:cnt, step, last:items[j-1].rc}, span:items[j-1].span}); i=j; }
    else { out.push(a); i++; }
  }
  return out;
}
function akys(n){ n=Math.abs(n)%100; const d=n%10; if(n>10&&n<20) return 'akių'; if(d===1) return 'akį'; if(d>=2&&d<=9) return 'akis'; return 'akių'; }
function actText(e){
  switch(e.type){
    case 'bind': return `uždarykite ${e.n} ${akys(e.n)}`;
    case 'dec': return 'sumažinkite 1 akį';
    case 'inc': return 'pridėkite 1 akį';
    case 'cast': return `užmeskite ${e.n} ${akys(e.n)}`;
    case 'hold': return `${e.n} ${e.n===1?'adatą':'adatas'} pastumkite į laikymo padėtį D`;
  }
  return '';
}

function techText(t){ return TECH[t]||''; }
function sideText(e){
  if(e.side==='abi') return e.first==='D'?'abiejuose kraštuose: pirma dešiniajame, po eilės – kairiajame':'abiejuose kraštuose: pirma kairiajame, po eilės – dešiniajame';
  return e.side==='D'?'dešiniajame krašte':'kairiajame krašte';

function spread(rows, n, even){
  const unit=even?2:1, slots=Math.floor(rows/unit);
  if(!(n>0) || slots<=0) return null;
  const k=Math.ceil(n/slots), ev=Math.ceil(n/k), nk=n-(k-1)*ev;
  const a=Math.floor(slots/ev), extra=slots%ev;
  return {k, ev, nk, nk1:ev-nk, a:a*unit, b:(a+1)*unit, nb:extra, na:ev-extra};
}

const KEY='srp-v2';

  gauges:clone(DEF_GAUGE), params:clone(DEF), edited:{}, mPiece:'megztinis/nugara', mStep:0, projects:[], delArm:null,
  calc:{cm:20, sts:50, rows:60, n:10, even:true, srSts:24, srCm:2.5}}; }

try{ const saved=JSON.parse(localStorage.getItem(KEY)||'{}'); S=Object.assign(freshState(), saved);
  // naujos versijos laukai
  Object.keys(DEF).forEach(gk=>{ S.params[gk]=S.params[gk]||clone(DEF[gk]); Object.keys(DEF[gk]).forEach(pid=>{ S.params[gk][pid]=Object.assign(clone(DEF[gk][pid]), S.params[gk][pid]||{}); }); });
  if(S.machine==='LK150') S.machine='SK155'; if(S.gauges) delete S.gauges.LK150;
  (S.projects||[]).forEach(p=>{ if(p.machine==='LK150') p.machine='SK155'; });
  Object.keys(DEF_GAUGE).forEach(m=>{ S.gauges[m]=Object.assign(clone(DEF_GAUGE[m]), S.gauges[m]||{}); });
  if(!MACHINES[S.machine]) S.machine='SK280';

}catch(e){ S=freshState(); }

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(x,d=1)=>{ const v=Math.round(x*Math.pow(10,d))/Math.pow(10,d); return (v===0?0:v).toLocaleString('lt-LT'); };
const standalone = (()=>{ try{ return window.top===window.self; }catch(e){ return false; } })();

function ctxOf(opts){ opts=opts||{}; return { params:opts.params||S.params, gauge:opts.gauge||S.gauges[S.machine], machine:MACHINES[opts.machine||S.machine], carriage:S.carriage }; }
function pieceDef(gk,pid){ return GARMENTS[gk].pieces.find(p=>p.id===pid); }
function geomFor(gk, pid, P){
  const pc=pieceDef(gk,pid);
  if(pc.kind==='body') return bodyGeom(P.nugara, null, gk);
  if(pc.kind==='front') return bodyGeom(P.nugara, P.priekis, gk);
  if(pc.kind==='cfront') return cfrontGeom(P.nugara, P.priekis, pc.side, gk);
  if(pc.kind==='sleeve') return sleeveGeom(P.rankove, P.nugara);
  if(pc.kind==='trousers') return trouserGeom(P[pid], pc.back);
  return null;
}
function neckTotals(gk,P){
  const back=bodyGeom(P.nugara,null,gk);
  let len=back.neckLen; const parts=[`nugara ${fmt(back.neckLen)} cm`];
  if(gk==='kardiganas'||gk==='svarkas'){ const f=cfrontGeom(P.nugara,P.priekis,'L',gk); len+=2*f.neckLen; parts.push(`priekiai 2 × ${fmt(f.neckLen)} cm`); }
  else { const f=bodyGeom(P.nugara,P.priekis,gk); len+=f.neckLen; parts.push(`priekis ${fmt(f.neckLen)} cm`); }
  if(isRaglan(P.nugara.armType)){ len+=2*P.rankove.capTop; parts.push(`rankovių viršai 2 × ${fmt(P.rankove.capTop)} cm`); }
  return {len, parts};
}
function ribAdvice(n, g, m){
  if(!m.ribber || !g.ribType || g.ribType==='ne') return '';
  let ok, near;
  if(g.ribType==='1x1'){ ok=(n-1)%2===0; near=n%2===0? [n-1,n+1] : [n]; }
  else { ok=(n-2)%3===0; const k=Math.round((n-2)/3); near=[3*k+2]; if(3*k+2!==n) near=[3*(k)+2, 3*(k+1)+2].filter(v=>v>0); }
  const beds = g.ribType==='1x1' ? ` 1×1 juostai: pagrindinėje lovoje ${ok?n:near[0]} adatų, antroje lovoje (ribber) – ${(ok?n:near[0])-1} adatų, kiekviena tarp pagrindinės lovos adatų.` : '';
  return (ok ? ` Juostai ${g.ribType}: ${n} ak. tinka.` : ` Juostai ${g.ribType} pagrindinėje lovoje reikia ${g.ribType==='1x1'?'2n+1':'3n+2'} ak. – artimiausia: ${near.join(' arba ')}.`) + beds;
}
function computePiece(gk, pid, opts){
  const C=ctxOf(opts), P=C.params[gk], g=C.gauge, m=C.machine;
  const pc=pieceDef(gk,pid);
  const spc=g.sts/10, ribRpc=(g.ribRows||g.rows)/10;
  if(pc.kind==='collar'){
    const c=P.apykakle, nt=neckTotals(gk,P);
    const n=srnd(nt.len*spc), r1=Math.max(1,srnd(c.height*ribRpc)), rows=c.double==='taip'?2*r1:r1;
    const nm=(COLLARS.find(x=>x[0]===c.type)||COLLARS[0])[1];
    const L=-Math.floor(n/2), R=n+L;
    const items=[
      {note:`Iškirptės kraštas ${fmt(nt.len)} cm (${nt.parts.join(', ')}).`},
      {note:`Užkabinkite ${n} ak. nuo iškirptės krašto ant adatų ${needleSpan(L,R)} (išvirkščia puse į save).${ribAdvice(n,g,m)}`},
      {note:`${nm}: ${fmt(c.height)} cm = ${r1} eil.${m.ribber?' Galima megzti su antra adatų lova.':''}`},
    ];
    if(c.double==='taip') items.push({note:`Dvigubai: megzkite ${rows} eil., sulenkite per pusę ir prisiūkite kraštą vidinėje pusėje.`});
    if(P.priekis && P.priekis.neckShape==='V') items.push({note:'V iškirptė: pažymėkite vidurio akį; kampą formuokite mažindami po 1 ak. abipus jos kas eilę arba sudurkite juostą kampu.'});
    items.push({note:'Uždarykite laisvai, kad apykaklė tamprėtų ir pralįstų galva.'});
    const warnings=[]; if(n>m.needles) warnings.push(`Apykaklei reikia ${n} adatų, ${m.name} turi ${m.needles}.`);
    return {pc, special:true, sim:{sections:[{title:nm, items}], warnings, stats:[[n,'paimti akių'],[rows,'eilių'],[fmt(nt.len)+' cm','iškirptės kraštas']]}};
  }
  if(pc.kind==='bands'){
    const f=P.priekis, fg=cfrontGeom(P.nugara,f,'L',gk), nt=neckTotals(gk,P);
    const bandRows=Math.max(1,srnd(f.bandW*ribRpc)), edgeSts=srnd(fg.edgeLen*spc);
    const n=Math.max(1,Math.round(f.btnN)), usable=fg.edgeLen-f.btnBottom-f.btnTop;
    const pos=[]; for(let i=0;i<n;i++) pos.push(n===1? f.btnBottom : f.btnBottom + usable*i/(n-1));
    const items=[
      {note:`Priekio kraštas iki iškirptės: ${fmt(fg.edgeLen)} cm. Kiekvienam priekiui paimkite ${edgeSts} ak. ir numegzkite ${bandRows} eil. (${fmt(f.bandW)} cm).${ribAdvice(edgeSts,g,m)}`},
      {note:`Sagų skylutės (${n} vnt.) ties ${Math.max(1,Math.floor(bandRows/2))}-ąja juostos eile, skaičiuojant akis nuo apačios: ${pos.map(p=>srnd(p*spc)).join(', ')}.`},
      {note:`Atstumai nuo apačios: ${pos.map(p=>fmt(p)+' cm').join(', ')}.`},
      {note:'Skylutė: akį perkelkite į gretimą adatą, tuščią adatą palikite darbo padėtyje; didesnei – dvi gretimas.'},
      {note:`Apykaklės juosta: iškirptės kraštas ${fmt(nt.len)} cm (${nt.parts.join(', ')}) → paimkite ${srnd(nt.len*spc)} ak., numegzkite ${Math.max(1,srnd(P.juostos.neckbandH*ribRpc))} eil. (${fmt(P.juostos.neckbandH)} cm).`},
      {note:'Uždarykite laisvai. Moteriškame drabužyje sagų skylutės paprastai daromos dešiniajame priekyje, vyriškame – kairiajame.'}
    ];
    const warnings=[]; if(usable<0) warnings.push('Sagų atstumai didesni už priekio kraštą.');
    return {pc, special:true, sim:{sections:[{title:'Juostos ir sagos', items}], warnings, stats:[[edgeSts,'akių juostai (1 priekis)'],[bandRows,'juostos eilių'],[n,'sagų']]}};
  }
  if(pc.kind==='lapel'){
    const f=P.priekis, a=P.atlapai, rpc=g.rows/10;
    const fg=cfrontGeom(P.nugara,f,'L',gk), back=bodyGeom(P.nugara,null,gk);
    const vSts=srnd(fg.neckLen*spc), bSts=srnd(back.neckLen*spc), total=2*vSts+bSts;
    const R=2*Math.max(1,srnd(a.collarW*rpc/2)), groups=shortRowGroups(vSts,R/2).filter(x=>x>0);
    const L=-Math.floor(total/2), Rr=total+L;
    const n=Math.max(1,Math.round(f.btnN)), top=fg.edgeLen-f.btnTop, usable=top-f.btnBottom;
    const pos=[]; for(let i=0;i<n;i++) pos.push(n===1? top : f.btnBottom + usable*i/(n-1));
    const items=[
      {note:`Apykaklės kraštas: 2 atlapai po ${fmt(fg.neckLen)} cm (nuo lūžio taško iki peties) + nugara ${fmt(back.neckLen)} cm.`},
      {note:`Užkabinkite ${total} ak. nuo kraštų ant adatų ${needleSpan(L,Rr)}: viduryje ${bSts} nugaros ak., abipus po ${vSts} atlapų ak.`},
      {note:`Atlapų adatas (abipus po ${vSts}) perkelkite į laikymo padėtį (HP) – pradžioje mezgamos tik nugaros akys.`},
      {note:`Kiekvieną eilę grąžinkite į darbą adatas priešingoje karietėlei pusėje, eilės ilgėja: ${groups.join(', ')} (iš viso ${R} eil.). Apykaklė nugaroje bus ${fmt(a.collarW)} cm pločio, ties atlapo lūžiu – siaura.`},
      {note:'Numegzkite 2 eil. per visas akis ir uždarykite laisvai. Apykaklę atverskite į išorę.'},
      {note:`Sagos (${n} vnt.) nuo apačios: ${pos.map(p=>fmt(p)+' cm').join(', ')}. Skylutės – per ${fmt(Math.max(0,f.overlap||0)/2)} cm (${srnd(Math.max(0,f.overlap||0)/2*spc)} ak.) nuo priekio krašto, užlaidos viduryje.`},
      {note:'Vyriškame švarke skylutės paprastai daromos kairiajame priekyje, moteriškame – dešiniajame.'}
    ];
    if(a.pocketN>0) items.push({note:`Kišenės (${Math.round(a.pocketN)} vnt.): užmeskite ${srnd(a.pocketW*spc)} ak., numegzkite ${srnd(a.pocketH*rpc)} eil., uždarykite ir prisiūkite ant priekių.`});
    const warnings=[]; if(total>m.needles) warnings.push(`Apykaklei reikia ${total} adatų, ${m.name} turi ${m.needles}. Megzkite dviem dalimis ir susiūkite nugaros viduryje.`);
    if((f.neckShape||'V')!=='V') warnings.push('Švarko atlapams naudokite V formos iškirptę.');
    return {pc, special:true, sim:{sections:[{title:'Apykaklė ir atlapai', items}], warnings, stats:[[total,'paimti akių'],[R,'apykaklės eilių'],[n,'sagų']]}};
  }
  const geom=geomFor(gk,pid,P);
  const sim=simulate(geom, g, {carriage:C.carriage, needles:m.needles, machineName:m.full, ribber:m.ribber});
  if(geom.ribCm>0){ const adv=ribAdvice(sim.castOn.n,g,m); if(adv) sim.sections[0].items[0].note+=adv; }
  return {pc, geom, sim};
}
function shoulderCheck(gk, opts){
  if(gk==='kelnes') return null;
  const b=computePiece(gk,'nugara',opts).sim.shoulders;
  const fid = (gk==='kardiganas'||gk==='svarkas') ? 'kairys' : 'priekis';
  const f=computePiece(gk,fid,opts).sim.shoulders;
  if(!b.length||!f.length) return null;
  return {b, f, ok: f.every(x=>b.includes(x)) && b.every(x=>f.includes(x))};
}
function armholeCheck(gk){
  const P=S.params[gk], b=bodyGeom(P.nugara,null,gk), s=sleeveGeom(P.rankove,P.nugara), arm=P.nugara.armType;
  if(isRaglan(arm)){ return {arm:'reglanas', body:curveLen(b.base.side,b.Hu,b.H), sleeve:curveLen(s.half,s.L1,s.H)}; }
  if(arm==='nuleista'){ return {arm, armLen:2*P.nugara.armDepth, cap:P.rankove.upperW, diff:P.rankove.upperW-2*P.nugara.armDepth}; }
  const armLen=2*curveLen(b.base.side,b.Hu,b.armTop);
  const cap=2*curveLen(s.half,s.L1,s.H)+P.rankove.capTop;
  return {arm, armLen, cap, diff:cap-armLen};
}
function fitCap(gk){
  const sp=S.params[gk].rankove, body=S.params[gk].nugara;
  let lo=Math.max(body.armCurve,0.5)+0.01, hi=45;
  const f=h=>{ const s=sleeveGeom(Object.assign({},sp,{capH:h}),body); return 2*curveLen(s.half,s.L1,s.H)+sp.capTop; };
  const target=armholeCheck(gk).armLen;
  if(f(lo)>target) return false;
  if(f(hi)<target) return false;
  for(let i=0;i<50;i++){ const mid=(lo+hi)/2; if(f(mid)<target) lo=mid; else hi=mid; }
  sp.capH=Math.round(hi*10)/10; return true;
}

function groupedFields(list, p, ctx, prefix, key){

function bindPrint(){ const b=$('#printBtn'); if(b) b.onclick=()=>{ try{ window.print(); }catch(e){} }; }
function cap1(t){ return t.charAt(0).toUpperCase()+t.slice(1); }
function rowHtml(e){
  if(e.note) return `<tr class="nt"><td></td><td colspan="2">${esc(e.note)}</td></tr>`;
  const car = e.car ? `<small>karietėlė ${e.car==='D'?'dešinėje':'kairėje'}</small>` : '';
  const when = e.grp ? `${pad(e.rc)} → ${pad(e.grp.last)}<small>kas ${e.grp.step} eil., ${e.grp.count} kartai</small>` : (e.rc2!=null?`${pad(e.rc)} ir ${pad(e.rc2)}${car}`:`${pad(e.rc)}${car}`);
  const what = `${e.grp?'Kiekvieną kartą ':''}${e.grp?sideText(e):cap1(sideText(e))}: ${actText(e)}.`;
  return `<tr><td class="rc">${when}</td><td><span class="tag t-${e.type}">${({bind:'uždaryti',dec:'mažinti',inc:'pridėti',cast:'užmesti',hold:'HP'})[e.type]}</span>${esc(what)}</td><td class="sp">${e.span}${e.w!=null?`<small style="display:block">${e.w} ak.</small>`:''}</td></tr>`;
}
function schemaSvg(geom, sim){
  const spc=sim.spc, rpc=sim.rpc, rib=geom.ribCm||0;
  const polys=[];
  function poly(p){
    const left=[[p.sL/spc, p.fromY]], right=[[p.sR/spc, p.fromY]];
    p.rows.forEach(r=>{ if(r.yr==null||!(r.R>r.L)) return; const y0=(r.yr-1)/rpc, y1=r.yr/rpc; left.push([r.L/spc,y0],[r.L/spc,y1]); right.push([r.R/spc,y0],[r.R/spc,y1]); });
    return left.concat(right.reverse());
  }
  sim.parts.forEach(p=>polys.push(poly(p)));
  let minX=Infinity,maxX=-Infinity; polys.forEach(pl=>pl.forEach(([x])=>{minX=Math.min(minX,x);maxX=Math.max(maxX,x);}));
  const Hc=geom.H+rib, Wc=Math.max(1,maxX-minX);
  const W=240, pd=34, s=Math.min((W-2*pd)/Wc, 380/Hc);
  const Hpx=Hc*s+2*pd;
  const X=x=>pd+(x-minX)*s+((W-2*pd)-Wc*s)/2, Y=y=>Hpx-pd-(y+rib)*s;
  const pts=pl=>pl.map(([x,y])=>`${X(x).toFixed(1)},${Y(y).toFixed(1)}`).join(' ');
  const ribRect = rib>0 ? `<rect x="${X(sim.castOn.L/spc)}" y="${Y(0)}" width="${sim.castOn.n/spc*s}" height="${rib*s}" fill="url(#hatch)" stroke="var(--accent)" stroke-width="1"/>` : '';
  const mid=(Y(geom.H)+Y(-rib))/2;
  return `<svg viewBox="0 0 ${W} ${Hpx.toFixed(0)}" role="img" aria-label="Detalės schema">
    <defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(90)"><line x1="0" y1="0" x2="0" y2="5" stroke="var(--accent)" stroke-width="1.2" opacity=".5"/></pattern></defs>
    ${ribRect}
    ${polys.map(pl=>`<polygon points="${pts(pl)}" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4" stroke-linejoin="round"/>`).join('')}
    <text x="${W/2}" y="${Hpx-10}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--f-body)">${fmt(sim.castOn.n/spc)} cm · ${sim.castOn.n} ak.</text>
    <text x="10" y="${mid}" font-size="11" fill="var(--muted)" font-family="var(--f-body)" transform="rotate(-90 10 ${mid})" text-anchor="middle">${fmt(Hc)} cm</text>
  </svg>`;
}

  const num=(k,l,u)=>`<label class="f" for="c-${k}">${l}<span class="in"><input id="c-${k}" data-k="${k}" type="number" inputmode="decimal" step="1" min="0" value="${c[k]}"><span class="u">${u}</span></span></label>`;

   <section class="panel"><h2>Centimetrai į akis ir eiles</h2>

     <div class="out"><b>${srnd(c.cm*g.sts/10)}</b> ak. pločio (${fmt(c.cm*g.sts/10,1)}) · <b>${srnd(c.cm*g.rows/10)}</b> eil. aukščio (${fmt(c.cm*g.rows/10,1)})</div>
     <div class="fields" style="margin-top:10px">${num('sts','Akys','ak.')}</div>

       <label class="f full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="c-even" ${c.even?'checked':''}> Tik kas lyginį eilių skaičių (karietėlė toje pačioje pusėje)</label></div>
     <div class="out">${sp? `${sp.ev} kartų po ${sp.k===1?'1 ak.':(sp.nk1? `${sp.k} ak. (${sp.nk} k.) ir ${sp.k-1} ak. (${sp.nk1} k.)`:sp.k+' ak.')}:<br><b>${sp.na}</b> k. kas <b>${sp.a}</b> eil.${sp.nb?` ir <b>${sp.nb}</b> k. kas <b>${sp.b}</b> eil.`:''}` : 'Įveskite eilių ir akių skaičių.'}</div>

     <div class="out">${srRows} eil. = ${pairs} ${pairs===1?'žingsnis':'žingsniai'} po 2 eil.<br>Adatų į HP kiekvieną žingsnį: <b>${groups.join(', ')||'—'}</b></div>
     <p class="note">Tinka pečiui, įsiuvei, kelnių pakėlimui. Adatas į HP traukite priešingoje karietėlei pusėje; baigę grąžinkite visas į darbą.</p>

function viewProjects(){
  const gk=S.garment;
  const list=S.projects.filter(p=>p.garment===gk);
  const pieces=GARMENTS[gk].pieces.filter(p=>!['collar','bands','lapel'].includes(p.kind));
  const rows=list.map(pr=>{
    const opts={params:Object.assign(clone(S.params), {[gk]:pr.params}), gauge:pr.gauge, machine:pr.machine};
    const cells=pieces.map(pc=>{ try{ const r=computePiece(gk,pc.id,opts); return `${r.sim.castOn.n} ak. · ${r.sim.N} eil.`; }catch(e){ return '—'; } });
    return {pr, cells};
  });
  $('#view').innerHTML=`<div class="grid">
   <section class="panel"><h2>Išsaugoti ${esc(GARMENTS[gk].name.toLowerCase())}</h2>
     <p class="note">Išsaugo dabartinius ${esc(GARMENTS[gk].name.toLowerCase())} matmenis, mašiną ir mėginį. Taip galite laikyti kelis dydžius (pvz. S, M, L) arba skirtingus modelius.</p>
     <div class="fields"><label class="f full" for="pr-name">Pavadinimas<span class="in"><input id="pr-name" type="text" placeholder="pvz. Megztinis M, vilna"></span></label></div>
     <div class="row" style="margin-top:10px"><button class="btn primary" id="prSave">Išsaugoti</button></div>
     <h3>Gaminys</h3>
     <div class="seg" role="group">${Object.entries(GARMENTS).map(([k,v])=>`<button data-g="${k}" aria-pressed="${gk===k}">${v.name}</button>`).join('')}</div>
   </section>
   <section class="panel"><h2>Dydžių palyginimas</h2>
     ${list.length? `<div class="tblwrap"><table class="ins"><thead><tr><th>Projektas</th>${pieces.map(p=>`<th>${esc(p.name)}</th>`).join('')}<th></th></tr></thead><tbody>
       ${rows.map(({pr,cells})=>`<tr><td><b>${esc(pr.name)}</b><br><span class="note">${MACHINES[pr.machine].name} · ${pr.gauge.sts}×${pr.gauge.rows}</span></td>${cells.map(c=>`<td class="sp">${c}</td>`).join('')}
         <td style="white-space:nowrap"><button class="btn" data-load="${pr.id}">Atidaryti</button> <button class="btn" data-del="${pr.id}">${S.delArm===pr.id?'Tikrai ištrinti?':'Ištrinti'}</button></td></tr>`).join('')}
       </tbody></table></div>` : '<p class="note">Šiam gaminiui dar nėra išsaugotų projektų. Įveskite matmenis skirtuke „Iškarpos“ ir išsaugokite čia.</p>'}
   </section></div>`;
  document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.garment=b.dataset.g; S.piece=GARMENTS[S.garment].pieces[0].id; save(); viewProjects();});
  $('#prSave').onclick=()=>{ const n=$('#pr-name').value.trim()||(GARMENTS[gk].name+' '+(list.length+1));
    S.projects.push({id:Date.now().toString(36), name:n, garment:gk, machine:S.machine, params:clone(S.params[gk]), gauge:clone(S.gauges[S.machine])}); save(); viewProjects(); };
  document.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>{ const pr=S.projects.find(x=>x.id===b.dataset.load); if(!pr) return;
    S.params[pr.garment]=clone(pr.params); S.machine=pr.machine; S.gauges[pr.machine]=clone(pr.gauge); S.garment=pr.garment; S.piece=GARMENTS[pr.garment].pieces[0].id;
    Object.keys(DEF[pr.garment]).forEach(k=>S.edited[pr.garment+'/'+k]=true); S.tab='iskarpos'; save(); render(); });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ const id=b.dataset.del;
    if(S.delArm===id){ S.projects=S.projects.filter(x=>x.id!==id); S.delArm=null; } else S.delArm=id; save(); viewProjects(); });
}

let wake=null;
function viewMasina(){
  const opts=[]; Object.entries(GARMENTS).forEach(([gk,G])=>G.pieces.forEach(p=>opts.push([gk+'/'+p.id, G.name+' – '+p.name])));
  if(!opts.find(o=>o[0]===S.mPiece)) S.mPiece=opts[0][0];
  const [gk,pid]=S.mPiece.split('/');
  const {sim}=computePiece(gk,pid);
  const steps=[]; sim.sections.forEach(s=>combine(s.items).forEach(e=>steps.push({...e, sec:s.title})));
  if(S.mStep>=steps.length) S.mStep=0;
  const cur=steps[S.mStep];
  const card = cur.note ? `<div class="meta">${esc(cur.sec)}</div><div class="act">${esc(cur.note)}</div>`
    : `<div class="meta">${esc(cur.sec)} · karietėlė ${cur.car==='D'?'dešinėje':'kairėje'}${cur.type==='hold'?' (adatas traukite priešingoje pusėje)':''}</div>
       <div class="rcbig">RC ${pad(cur.rc)}${cur.rc2!=null?` / ${pad(cur.rc2)}`:''}</div>
       <div class="act">${esc(cap1(sideText(cur)))}: ${esc(actText(cur))}.</div><div class="meta">Po to dirba adatos ${cur.span}${cur.w!=null?` (${cur.w} ak.)`:''}</div><div class="meta" style="font-size:.85rem">${esc(techText(cur.type))}</div>`;
  $('#view').innerHTML=`<div class="mach">
    <div class="row">
      <label class="f" for="m-p" style="min-width:240px;flex:1">Detalė<span class="in"><select id="m-p">${opts.map(([v,t])=>`<option value="${v}" ${S.mPiece===v?'selected':''}>${t}</option>`).join('')}</select></span></label>
      <button class="btn" id="wk">${wake?'Ekranas neužges':'Neleisti ekranui užgesti'}</button>
    </div>
    <div class="mcard" aria-live="polite">${card}<div class="meta">Žingsnis ${S.mStep+1} iš ${steps.length}</div></div>
    <div class="mnav"><button class="btn" id="mPrev">◀ Atgal</button><button class="btn primary" id="mNext">Atlikta ▶</button></div>
    <div class="mlist">${steps.map((e,i)=>`<div data-i="${i}" class="${i===S.mStep?'cur':(i<S.mStep?'done':'')}">${e.note?esc(e.note):`RC ${pad(e.rc)} · ${esc(cap1(sideText(e)))}: ${esc(actText(e))}`}</div>`).join('')}</div>
  </div>`;
  $('#m-p').onchange=e=>{S.mPiece=e.target.value; S.mStep=0; save(); viewMasina();};
  $('#mPrev').onclick=()=>{S.mStep=Math.max(0,S.mStep-1); save(); viewMasina();};
  $('#mNext').onclick=()=>{S.mStep=Math.min(steps.length-1,S.mStep+1); save(); viewMasina();};
  document.querySelectorAll('.mlist [data-i]').forEach(d=>d.onclick=()=>{S.mStep=+d.dataset.i; save(); viewMasina();});
  const cd=document.querySelector('.mlist .cur'); if(cd && cd.scrollIntoView) cd.scrollIntoView({block:'nearest'});
  $('#wk').onclick=async()=>{ try{ if(!wake){ wake=await navigator.wakeLock.request('screen'); wake.addEventListener('release',()=>{wake=null;}); } else { await wake.release(); wake=null; } }catch(e){ wake=null; } viewMasina(); };
}

const WHO = [['moteris','Moteris','moteris'],['vyras','Vyras','vyras'],['mergaite','Mergaitė','vaikas'],['berniukas','Berniukas','vaikas']];
// CYC prigludimo kategorijos (laisvumas krūtinei). Imamas intervalo vidurys; „labai laisvas“ – 15+ cm, imama 17,5.
const FITS = [['labai','Labai prigludęs (−5…−10 cm)',-7.5],['priglud','Prigludęs (0 cm)',0],['klasik','Klasikinis (+5…+10 cm)',7.5],['laisvas','Laisvas (+10…+15 cm)',12.5],['oversize','Labai laisvas (15+ cm)',17.5]];
const CFG_GARMENTS = { moteris:['megztinis','kardiganas','suknele','svarkas','kelnes'], vyras:['megztinis','kardiganas','svarkas','kelnes'], mergaite:['megztinis','kardiganas','suknele','kelnes'], berniukas:['megztinis','kardiganas','kelnes'] };
const mid = v=> Array.isArray(v) ? (v[0]+v[1])/2 : v;
const r1 = x=> Math.round(x*10)/10;
function defaultCfg(){ return {who:'moteris', size:'M', fit:'klasik', ease:7.5, garment:'megztinis', arm:'isiuta', shoulder:'japon',
  neckShape:'apvali', collar:'juosta', neckFront:7, neckBack:2, below:15, dressBelow:55, rib:5, neckW:0, cuffW:0,
  breakDepth:28, overlap:3, btnN:2, collarW:7, jacketExtra:8, inseam:0, rise:0, legHem:0}; }

// Iš konfigūracijos ir dydžio sukuria gaminio parametrus. Grąžina {params, body, notes}.
function buildFromCfg(cfg, sizeName){
  const who=WHO.find(w=>w[0]===cfg.who)||WHO[0], T=CYC[who[2]], kid=who[2]==='vaikas', man=who[2]==='vyras';
  let i=T.sizes.indexOf(sizeName); if(i<0) i=Math.min(2,T.sizes.length-1);
  const body={chest:mid(T.chest[i]), cross:mid(T.cross[i]), armhole:mid(T.armhole[i]), backWaist:mid(T.backWaist[i]),
    arm:mid(T.arm[i]), upper:mid(T.upper[i]), waist:mid(T.waist[i]), hips:mid(T.hips[i])};
  const gk = CFG_GARMENTS[cfg.who].includes(cfg.garment) ? cfg.garment : 'megztinis';
  const ease=cfg.ease, f=(body.chest+ease)/body.chest;
  const rib=Math.max(0,cfg.rib);
  const bustW=r1((body.chest+ease)/2);
  const neckW = cfg.neckW>0 ? cfg.neckW : r1(body.cross/3);
  const armRemove = cfg.arm==='nuleista' ? 0 : r1(Math.max(1, bustW - body.cross)/2);
  const below = man ? 0 : Math.max(0,cfg.below);
  const toUnder = body.backWaist - body.armhole + below;
  if(gk==='kelnes') return buildTrousers(cfg, body, i, T, kid, man, ease);
  const P = clone(DEF[gk]);
  Object.assign(P.nugara, { armType:cfg.arm, method:cfg.shoulder, bustW, hemW:bustW, waistW:bustW, hemToWaist:0,
    waistToUnderarm:r1(Math.max(5,toUnder-rib)), ribCm:rib, armRemove, armCurve:r1(Math.min(body.armhole*0.35, Math.max(2,armRemove*2))), ragCurveRem:0,
    armDepth:r1(body.armhole), slope: kid?1.5:2.5, neckW, neckD:cfg.neckBack });
  if(gk==='suknele'){
    Object.assign(P.nugara, { hemW:r1((body.hips+ease)/2), waistW:r1((body.waist+ease)/2), hemToWaist:r1(Math.max(5,cfg.dressBelow-rib)),
      waistToUnderarm:r1(Math.max(3, body.backWaist-body.armhole)) });
  }
  if(gk==='svarkas'){
    // švarkas: be juostų, ilgesnis, atlapai iki lūžio taško
    const hipsW=r1((Math.max(body.hips,body.chest)+ease)/2);
    if(man){
      Object.assign(P.nugara,{ ribCm:0, hemW:hipsW, waistW:bustW, hemToWaist:0, waistToUnderarm:r1(Math.max(5,toUnder+cfg.jacketExtra)) });
    } else {
      Object.assign(P.nugara,{ ribCm:0, hemW:hipsW, waistW:r1((body.waist+ease)/2), hemToWaist:r1(Math.max(5,cfg.below+cfg.jacketExtra)), waistToUnderarm:r1(Math.max(3,body.backWaist-body.armhole)) });
    }
    Object.assign(P.priekis,{ neckShape:'V', neckD:cfg.breakDepth, overlap:cfg.overlap, btnN:cfg.btnN, bandW:0 });
    P.atlapai.collarW=cfg.collarW;
  } else Object.assign(P.priekis, { neckShape:cfg.neckShape, neckD:cfg.neckFront });
  if(gk==='kardiganas') Object.assign(P.priekis, { bandW: kid?2.5:3, btnN: kid?5:6 });
  const upperW=r1(body.upper*f);
  const sRib = gk==='svarkas' ? 0 : rib;
  Object.assign(P.rankove, { upperW, cuffW: cfg.cuffW>0?cfg.cuffW:r1(upperW*(gk==='svarkas'?0.75:0.6)), length:r1(Math.max(5,body.arm-sRib)), ribCm:sRib, capTop: kid?5:8 });
  if(P.apykakle){ const c=COLLARS.find(x=>x[0]===cfg.collar)||COLLARS[0]; Object.assign(P.apykakle,{type:c[0], height: kid? r1(c[2]*0.7) : c[2]}); }
  if(P.juostos) P.juostos.neckbandH = kid?2:3;
  // rankovės viršų suderiname su iškarpa
  if(cfg.arm==='isiuta'){ const h=fitCapP(P); if(h) P.rankove.capH=h; }
  const notes=[];
  if(man) notes.push('Vyrų lentelėje „Back Waist Length“ reikšmės (pvz. S – 58,5–61 cm) atitinka ilgį iki klubų, todėl papildomas ilgis žemiau liemens nepridedamas.');
  return {gk, params:P, body, sizeIndex:i, sizeName:T.sizes[i], table:T.table, ease, notes};
}
// Kelnės: plotis iš CYC juosmens ir klubų + laisvumas; ilgius įveda naudotojas.
// Prielaidos (pažymėtos programoje): priekis 47 %, nugara 53 % pusės klubų apimties; tarpkojo išsikišimas priekyje 4 %, nugaroje 8 % klubų apimties.
function buildTrousers(cfg, body, i, T, kid, man, ease){
  const P=clone(DEF.kelnes);
  const inseam = cfg.inseam>0 ? cfg.inseam : (kid?r1(30+i*6):(man?80:76));
  const rise = cfg.rise>0 ? cfg.rise : (kid?r1(16+i*1.2):(man?28:26));
  const half=(body.hips+ease)/2, wHalf=(body.waist+ease)/2;
  const rib=Math.max(0,cfg.rib);
  const parts={priekis:{share:0.47, ext:0.04*body.hips, raise:0}, nugara:{share:0.53, ext:0.08*body.hips, raise: kid?2:3}};
  for(const k of ['priekis','nugara']){
    const s=parts[k], hipW=r1(half*s.share), ext=r1(s.ext), crotchW=r1(hipW+ext);
    const hemW = cfg.legHem>0 ? r1(cfg.legHem/2) : r1(crotchW*0.6);
    Object.assign(P[k],{ hipW, waistW:r1(wHalf*s.share), ext, crotchW, curveH:r1(rise*0.35), hipH:r1(rise*0.5), rise:r1(rise),
      inseam:r1(Math.max(10,inseam-rib)), kneeH:r1(Math.max(5,(inseam-rib)*0.45)), kneeW:r1((hemW+crotchW)/2), hemW, ribCm:rib, waistband:kid?3:4, raise:s.raise });
  }
  const notes=['Kelnėms CYC lentelėse nėra kojos ilgio ir sėdynės aukščio – įveskite savo išmatuotus (pavyzdinės reikšmės pažymėtos).',
    'Prielaidos: priekinė klešnė – 47 %, galinė – 53 % pusės klubų apimties; tarpkojo išsikišimas priekyje 4 %, nugaroje 8 % klubų; kelias – 45 % kojos ilgio; apačia – 60 % pločio ties tarpkoju, jei neįrašėte savo.'];
  return {gk:'kelnes', params:P, body, sizeIndex:i, sizeName:T.sizes[i], table:T.table, ease, notes, trousers:{inseam, rise, given: cfg.inseam>0 && cfg.rise>0}};
}
function fitCapP(P){
  const sp=P.rankove, body=P.nugara;
  const b=bodyGeom(body,null,'megztinis'); const target=2*curveLen(b.base.side,b.Hu,b.armTop);
  const f=h=>{ const s=sleeveGeom(Object.assign({},sp,{capH:h}),body); return 2*curveLen(s.half,s.L1,s.H)+sp.capTop; };
  let lo=Math.max(body.armCurve,0.5)+0.01, hi=45;
  if(f(lo)>target || f(hi)<target) return null;
  for(let k=0;k<50;k++){ const m=(lo+hi)/2; if(f(m)<target) lo=m; else hi=m; }
  return Math.round(hi*10)/10;
}

const PSYM=['','×','●','○','▲','◆','+','/','■','◇'];
function patFresh(){ return {mode:'kartote', W:24, H:24, autoH:true, k:2, usePal:false, max2:true, cells:'0'.repeat(24*24),
  colors:['#f4efe6','#1d5c78'], paint:1, sym:true, crop:[0,0,100,100], holesB:true, mirror:false, cardRows:0,
  piece:'', startRow:1, bandRows:0}; }
function patState(){
  let p=S.pat; if(!p||typeof p!=='object') p=S.pat=patFresh();
  const f=patFresh(); Object.keys(f).forEach(k=>{ if(p[k]==null) p[k]=f[k]; });
  if(typeof p.cells!=='string'||p.cells.length!==p.W*p.H) p.cells='0'.repeat(p.W*p.H);
  if(!Array.isArray(p.colors)||!p.colors.length) p.colors=f.colors.slice();
  return p;
}
let patImg=null, patImgUrl='';
/* --- spalvų matematika (sRGB → CIELAB, D65) --- */
const pS2l=c=>{c/=255; return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);};
function pRgb2lab(r,g,b){ const R=pS2l(r),G=pS2l(g),B=pS2l(b);
  let x=(0.4124564*R+0.3575761*G+0.1804375*B)/0.95047, y=(0.2126729*R+0.7151522*G+0.0721750*B), z=(0.0193339*R+0.1191920*G+0.9503041*B)/1.08883;
  const f=t=>t>216/24389?Math.cbrt(t):(24389/27*t+16)/116; x=f(x);y=f(y);z=f(z); return [116*y-16,500*(x-y),200*(y-z)]; }
function pHex2rgb(h){ h=String(h).replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16)||0; return [n>>16&255,n>>8&255,n&255]; }

const pD=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;
function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function pKmeans(pts,k){ const rnd=mulberry(7); const C=[pts[Math.floor(rnd()*pts.length)].lab.slice()];
  while(C.length<k){ const d=pts.map(p=>Math.min(...C.map(c=>pD(p.lab,c)))); const s=d.reduce((a,b)=>a+b,0); if(s===0) break; let r=rnd()*s,i=0; for(;i<d.length-1&&r>d[i];i++) r-=d[i]; C.push(pts[i].lab.slice()); }
  for(let it=0;it<15;it++){ const acc=C.map(()=>[0,0,0,0,0,0,0]);
    pts.forEach(p=>{ let bi=0,bd=Infinity; C.forEach((c,j)=>{ const d=pD(p.lab,c); if(d<bd){bd=d;bi=j;} }); p.k=bi; const a=acc[bi]; a[0]+=p.lab[0];a[1]+=p.lab[1];a[2]+=p.lab[2];a[3]+=p.rgb[0];a[4]+=p.rgb[1];a[5]+=p.rgb[2];a[6]++; });
    acc.forEach((a,j)=>{ if(a[6]) { C[j]=[a[0]/a[6],a[1]/a[6],a[2]/a[6]]; C[j].rgb=[a[3]/a[6],a[4]/a[6],a[5]/a[6]]; C[j].n=a[6]; } }); }
  return C; }
function yarnPalette(){ try{ const s=JSON.parse(localStorage.getItem('srp-spalvos')||'{}'); return Array.isArray(s.palette)?s.palette.filter(c=>c&&c.hex):[]; }catch(e){ return []; } }

/* --- nuotrauka → tinklelis --- */
function patHeightAuto(p){ const g=S.gauges[S.machine]; if(!patImg) return p.H;
  const c=p.crop, w=patImg.width*(c[2]-c[0])/100, h=patImg.height*(c[3]-c[1])/100;
  return Math.max(1,Math.min(400,Math.round(p.W*(h/w)*(g.rows/g.sts)))); }
function patConvert(){
  const p=patState(); if(!patImg) return 'Pirmiausia įkelkite nuotrauką.';
  const W=p.W, H=p.autoH?patHeightAuto(p):p.H; const sc=4, cw=W*sc, ch=H*sc;
  const cv=document.createElement('canvas'); cv.width=cw; cv.height=ch; const ctx=cv.getContext('2d'); if(!ctx) return 'Naršyklė nepalaiko piešimo.';
  const c=p.crop, sx=patImg.width*c[0]/100, sy=patImg.height*c[1]/100, sw=patImg.width*(c[2]-c[0])/100, sh=patImg.height*(c[3]-c[1])/100;
  if(sw<2||sh<2) return 'Per mažas apkarpymas.';
  ctx.imageSmoothingQuality='high'; ctx.drawImage(patImg,sx,sy,sw,sh,0,0,cw,ch);
  const d=ctx.getImageData(0,0,cw,ch).data, all=[];
  for(let o=0;o<d.length;o+=4){ const rgb=[d[o],d[o+1],d[o+2]]; all.push({rgb, lab:pRgb2lab(...rgb)}); }
  // apmokome grupes ant atrankos, tada kiekvienam langeliui imame dažniausią jo taškų spalvą (ne vidurkį – kad spalvos nesusimaišytų)
  const step=Math.max(1,Math.floor(all.length/20000)), train=all.filter((_,i)=>i%step===0);
  const nearest=(lab,C)=>{ let bi=0,bd=Infinity; for(let j=0;j<C.length;j++){ const dd=pD(lab,C[j]); if(dd<bd){bd=dd;bi=j;} } return bi; };
  let C=pKmeans(train,p.k); const lab2k=all.map(pt=>nearest(pt.lab,C));
  const acc=C.map(()=>[0,0,0,0]); all.forEach((pt,i)=>{ const a=acc[lab2k[i]]; a[0]+=pt.rgb[0];a[1]+=pt.rgb[1];a[2]+=pt.rgb[2];a[3]++; });
  const cellK=new Array(W*H);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const cnt=new Array(C.length).fill(0); for(let j=0;j<sc;j++) for(let i=0;i<sc;i++) cnt[lab2k[(y*sc+j)*cw+x*sc+i]]++; let bi=0; cnt.forEach((v,q)=>{ if(v>cnt[bi]) bi=q; }); cellK[y*W+x]=bi; }
  const used=C.map(()=>0); cellK.forEach(k=>used[k]++);
  let order=C.map((c,j)=>j).filter(j=>used[j]>0).sort((a,b)=>used[b]-used[a]);
  let colors, names=null; const re=[];
  const yp=yarnPalette();
  if(p.usePal && yp.length>=2){ const labs=yp.map(c=>c.lab||pRgb2lab(...pHex2rgb(c.hex))); const yi=order.map(j=>nearest(C[j],labs)); const uniq=[...new Set(yi)];
    order.forEach((j,n)=>re[j]=uniq.indexOf(yi[n])); colors=uniq.map(i=>yp[i].hex); names=uniq.map(i=>yp[i].name||yp[i].hex); }
  else { order.forEach((j,n)=>re[j]=n); colors=order.map(j=>{ const a=acc[j]; return a[3]?pHex(a[0]/a[3],a[1]/a[3],a[2]/a[3]):'#888888'; }); }
  p.colorNames=names;
  const cells=new Array(W*H);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) cells[(H-1-y)*W+x]=re[cellK[y*W+x]]; // eilė 0 – apačia
  p.W=W; p.H=H; p.colors=colors; p.cells=cells.map(v=>String.fromCharCode(48+v)).join('');
  if(p.max2) patLimit2(p);

}
function patGet(p,x,y){ return p.cells.charCodeAt(y*p.W+x)-48; }
function patLimit2(p){ const labs=p.colors.map(h=>pRgb2lab(...pHex2rgb(h))); const a=p.cells.split('');
  for(let y=0;y<p.H;y++){ const cnt={}; for(let x=0;x<p.W;x++){ const v=a[y*p.W+x]; cnt[v]=(cnt[v]||0)+1; }
    const keep=Object.keys(cnt).sort((u,v)=>cnt[v]-cnt[u]).slice(0,2).map(c=>c.charCodeAt(0)-48);
    for(let x=0;x<p.W;x++){ const v=a[y*p.W+x].charCodeAt(0)-48; if(keep.includes(v)) continue; let bi=keep[0],bd=Infinity; keep.forEach(q=>{const dd=pD(labs[v],labs[q]); if(dd<bd){bd=dd;bi=q;}}); a[y*p.W+x]=String.fromCharCode(48+bi); } }
  p.cells=a.join(''); }
function patResize(p,W,H){ const old=p, cells=[]; for(let y=0;y<H;y++) for(let x=0;x<W;x++) cells.push(x<old.W&&y<old.H?old.cells[y*old.W+x]:'0'); p.W=W; p.H=H; p.cells=cells.join(''); }

/* --- analizė --- */
function patRows(p){ const out=[]; for(let y=0;y<p.H;y++){ const cnt={}; for(let x=0;x<p.W;x++){ const v=patGet(p,x,y); cnt[v]=(cnt[v]||0)+1; }
  const cs=Object.keys(cnt).map(Number).sort((a,b)=>cnt[b]-cnt[a]); out.push({cs, A:cs[0], B:cs.length>1?cs[1]:null}); } return out; }
function patFloats(p){ // ilgiausias tempas: kiek akių iš eilės spalva nemezgama (kartotė kartojasi ratu)
  let best={n:0,row:0}; const cyc=p.mode==='kartote';
  for(let y=0;y<p.H;y++){ const cs=new Set(); for(let x=0;x<p.W;x++) cs.add(patGet(p,x,y)); if(cs.size<2) continue;
    cs.forEach(c=>{ const L=cyc?p.W*2:p.W; let run=0; for(let i=0;i<L;i++){ const x=i%p.W; if(patGet(p,x,y)!==c){ run++; if(run>best.n && run<=p.W) best={n:run,row:y+1}; } else run=0; } }); }
  return best; }
function cardWidth(){ return MACHINES[S.machine].card; }
function divisors(n){ const r=[]; for(let i=1;i<=n;i++) if(n%i===0) r.push(i); return r; }

/* --- piešimas --- */
function cellSize(p, box){ const g=S.gauges[S.machine]; const avail=Math.max(200,(box&&box.clientWidth||600)-44); const cw=Math.max(5,Math.min(26,Math.floor(avail/p.W))); return {cw, ch:Math.max(3,cw*g.sts/g.rows)}; }
function drawChart(cv,p,opt){
  const ctx=cv.getContext&&cv.getContext('2d'); if(!ctx) return;
  const {cw,ch}=opt.size, mL=6, mB=22, mR=34, W=p.W, H=p.H;
  cv.width=Math.ceil(mL+W*cw+mR); cv.height=Math.ceil(H*ch+mB+6);
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const v=patGet(p,x,y), X=mL+x*cw, Y=6+(H-1-y)*ch;
    ctx.fillStyle=p.colors[v]||'#ccc'; ctx.fillRect(X,Y,cw,ch);
    if(p.sym && v>0 && cw>=9){ const rgb=pHex2rgb(p.colors[v]); const L=pRgb2lab(...rgb)[0]; ctx.fillStyle=L>55?'#000':'#fff'; ctx.font=`${Math.floor(Math.min(cw,ch)*0.8)}px sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(PSYM[v]||String(v),X+cw/2,Y+ch/2+1); } }
  ctx.strokeStyle='rgba(0,0,0,.22)'; ctx.lineWidth=1; ctx.beginPath();
  if(cw>=6){ for(let x=0;x<=W;x++){ const X=Math.round(mL+x*cw)+.5; ctx.moveTo(X,6); ctx.lineTo(X,6+H*ch); } }
  if(ch>=4){ for(let y=0;y<=H;y++){ const Y=Math.round(6+y*ch)+.5; ctx.moveTo(mL,Y); ctx.lineTo(mL+W*cw,Y); } }
  ctx.stroke(); ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.beginPath();
  for(let x=0;x<=W;x+=10){ const X=Math.round(mL+(W-x)*cw)+.5; ctx.moveTo(X,6); ctx.lineTo(X,6+H*ch); }
  for(let y=0;y<=H;y+=10){ const Y=Math.round(6+(H-y)*ch)+.5; ctx.moveTo(mL,Y); ctx.lineTo(mL+W*cw,Y); }
  ctx.stroke(); ctx.strokeRect(mL+.5,6.5,W*cw,H*ch);
  ctx.fillStyle='#333'; ctx.font='11px sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  const stepR=ch>=10?5:10; for(let y=1;y<=H;y++) if(y===1||y%stepR===0) ctx.fillText(String(y),mL+W*cw+4,6+(H-y)*ch+ch/2);
  ctx.textAlign='center'; ctx.textBaseline='top'; const stepC=cw>=12?5:10;
  for(let x=1;x<=W;x++) if(x===1||x%stepC===0) ctx.fillText(String(x),mL+(W-x)*cw+cw/2,6+H*ch+5);
  opt.geom={mL,top:6,cw,ch};
}
function drawCard(cv,p,rowsInfo){
  const ctx=cv.getContext&&cv.getContext('2d'); if(!ctx) return null;
  const CW=cardWidth(), reps=CW/p.W, Hc=cardLen(p), s=Math.max(8,Math.min(16,Math.floor(((cv.parentNode&&cv.parentNode.clientWidth)||420)-50)/CW));
  const mL=26, mT=8; cv.width=mL+CW*s+30; cv.height=mT+Hc*s+10;
  ctx.fillStyle='#fffdf6'; ctx.fillRect(0,0,cv.width,cv.height); ctx.strokeStyle='#bba'; ctx.strokeRect(mL-6.5,mT-4.5,CW*s+12,Hc*s+8);
  let holes=0;
  for(let r=0;r<Hc;r++){ const y=r%p.H, info=rowsInfo[y];
    for(let c=0;c<CW;c++){ let x=c%p.W; if(p.mirror) x=p.W-1-x; const v=patGet(p,x,y); const hit=info.B==null?false:(p.holesB? v!==info.A : v===info.A);
      const X=mL+c*s+s/2, Y=mT+(Hc-1-r)*s+s/2; ctx.beginPath(); ctx.arc(X,Y,s*0.32,0,7);
      if(hit){ ctx.fillStyle='#222'; ctx.fill(); holes++; } else { ctx.strokeStyle='#d8d2c0'; ctx.stroke(); } }
    if(r===0||(r+1)%5===0){ ctx.fillStyle='#555'; ctx.font='10px sans-serif'; ctx.textAlign='right'; ctx.textBaseline='middle'; ctx.fillText(String(r+1),mL-9,mT+(Hc-1-r)*s+s/2); } }
  return {holes, Hc, reps};
}
function cardLen(p){ if(p.cardRows>0) return p.cardRows; return p.H*Math.max(1,Math.ceil(40/p.H)); }
function drawOnPiece(cv,p){
  const ctx=cv.getContext&&cv.getContext('2d'); if(!ctx) return null;
  const gk=S.garment, pcs=GARMENTS[gk].pieces.filter(x=>['body','front','cfront','sleeve','trousers'].includes(x.kind));
  const pid=pcs.find(x=>x.id===p.piece)?p.piece:pcs[0].id; let r; try{ r=computePiece(gk,pid); }catch(e){ return null; }
  const sim=r.sim, rows=[]; let minL=Infinity,maxR=-Infinity,maxY=0;
  sim.parts.forEach(pt=>pt.rows.forEach(w=>{ if(w.yr==null||!(w.R>w.L)) return; rows.push(w); minL=Math.min(minL,w.L); maxR=Math.max(maxR,w.R); maxY=Math.max(maxY,w.yr); }));
  if(!rows.length) return null;
  const g=S.gauges[S.machine], Wn=maxR-minL, avail=Math.max(220,((cv.parentNode&&cv.parentNode.clientWidth)||420)-10);
  let sx=avail/Wn, sy=sx*g.sts/g.rows; const maxH=520; if(maxY*sy>maxH){ sy=maxH/maxY; sx=sy*g.rows/g.sts; }
  cv.width=Math.ceil(Wn*sx)+2; cv.height=Math.ceil(maxY*sy)+2; ctx.clearRect(0,0,cv.width,cv.height);
  const off=Math.floor(p.W/2), y0=Math.max(1,p.startRow), y1=p.bandRows>0?y0+p.bandRows-1:Infinity;
  rows.forEach(w=>{ const Y=cv.height-1-w.yr*sy;
    for(let n=w.L;n<w.R;n++){ let col;
      if(w.yr>=y0 && w.yr<=y1){ const xx=((n+off)%p.W+p.W)%p.W, yy=(w.yr-y0)%p.H; col=p.colors[patGet(p,xx,yy)]; } else col=p.colors[0];
      ctx.fillStyle=col; ctx.fillRect(1+(n-minL)*sx,Y,Math.ceil(sx),Math.ceil(sy)); } });
  return {pid, name:pieceDef(gk,pid).name, castOn:sim.castOn.n, maxW:Wn, rows:maxY, reps:Wn/p.W, pcs};
}

  } else {
    const r=await fetch(c.host.replace(/\/$/,'')+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model,stream:false,format:'json',messages:[{role:'user',content:prompt,images:[b64]}]})});

}
