    const st=hkStart(n, p.cuffCm, true, {markers:'Rato pradžia – užpakalyje (kulno viduryje); akis padalinkite po lygiai ant 4 kojinių virbalų arba naudokite apskritą virbalą (magic loop).', small:true});
    secs.push({title:'Juosta ir aulas', items:[...st.items, {a:1, b:legR, sub:'ratai', text:`Aulas: megzkite ${hkRat(legR)} (${fmt(p.legCm)} cm).`, sts:n}]});
    secs.push({title:'Kulno sienelė', items:[
      {a:null, text:`Kulnui naudokite ${h} ak. (pusę akių, užpakalinėje pusėje); kitos ${h} – viršutinė pėdos dalis, palikite laukti.`},
      {a:1, b:F, sub:'eil.', text:`Megzkite pirmyn ir atgal ${F} eil. kulno raštu: veidinė eilė – *1 nukelkite, 1 veid.*; išvirkščia – 1 nukelkite, likusios išvirkščios. Prielaida: sienelė ≈ kvadratas – eilių tiek pat, kiek sienelės akių (nukeltos akys tankina eiles).`, sts:h}]});
    secs.push({title:'Kulno pasukimas (olandiškas / kvadratinis kulnas)', items:[
      {a:null, text:`Kulno akis padalinkite į 3 dalis: ${s} + ${mid} + ${s}.`},
      {a:1, sub:'veid.', text:`Nukelkite 1, numegzkite ${s+mid-2} ak., ssk (paskutinė vidurio akis su pirma šono), apsukite.`, sts:h-1},
      {a:2, sub:'išv.', text:`Nukelkite 1, ${mid-2} išv., 2 kartu išv. (su pirma kito šono akimi), apsukite.`, sts:h-2},
      {a:3, b:2*s, sub:'eil.', text:`Kartokite: veidinėje – nukelkite 1, ${mid-2} veid., ssk, apsukite; išvirkščioje – nukelkite 1, ${mid-2} išv., 2 kartu išv., apsukite – kol šonų akys baigsis (iš viso ${2*s} eil.).`, sts:mid}]});
    secs.push({title:'Pleištai ir pėda', items:[
      {a:1, sub:'ratas', text:`Numegzkite ${mid} kulno ak., paimkite ${pk} ak. iš sienelės krašto (1 iš kiekvienos nukeltos kraštinės akies + 1 kampe), numegzkite ${h} viršaus ak., paimkite ${pk2} ak. iš kito sienelės krašto, numegzkite ${Math.floor(mid/2)} ak. – čia nauja rato pradžia (padų vidurys).`, sts:mid+pk+pk2+h},
      {a:2, b:1+2*gus, sub:'kas 2 r.', text:`Pleištų mažinimas kas 2-ą ratą: padų pusėje iki 3 ak. prieš viršaus dalį – 2 kartu, 1 veid.; viršaus ${h} ak.; 1 veid., ssk, iki galo. Tarp mažinimo ratų – ratas be mažinimų. Iš viso ${hkKart(gus)}, kol vėl bus ${n} ak.`, sts:n},
      {a:2+2*gus, b:footR, sub:'ratai', text:`Megzkite tiesiai, kol pėda nuo kulno galo bus ${fmt(p.footLen-p.toeCm)} cm (≈ ${footR} ratų nuo pleištų paėmimo – prielaida). Matavimas svarbesnis už ratų skaičių.`, sts:n}]});
    secs.push(hkToeDec(n, pl, left, toeRows, true));
    stats=[[st.items[0].sts,'užmesti akių'],[h,'kulno akių'],[legR+F+2*s+footR+toeRows,'eilių / ratų (≈)']];
  } else if(m==='pirstai'){
    tech.add(H.shoulder==='vokiskos'?'gsr':'wt');
    const inc=pl; // atvirkščiai: pirma kiekviename rate, paskui kas 2-ą
    secs.push({title:'Pirštai', items:[
      {a:null, text:`Užmeskite ${left} ak. „Judy“ (magic cast-on) būdu – po ${left/2} ak. ant dviejų virbalų (viršus ir padas). Tai ir bus pirštų galas.`, sts:left},
      {a:1, b:toeRows, sub:'ratai', text:`Didinimo ratas: viršaus ir pado dalyse – 1 veid., M1, megzkite iki 1 ak. prieš galą, M1, 1 veid. (+4 ak.). ${inc.sparse?`Kas ${inc.step}-ą ratą – ${hkKart(inc.x)}`:[inc.y?`${hkKart(inc.y)} kiekviename rate`:'',inc.x?`${hkKart(inc.x)} kas 2-ą ratą`:''].filter(Boolean).join(', paskui ')}, kol bus ${n} ak.`, sts:n}]});
    tech.add('inc');
    const fr=Math.max(1,srnd(Math.max(1,p.footLen-heelDepth)*g.rpc)-toeRows);
    secs.push({title:'Pėda', items:[{a:toeRows+1, b:toeRows+fr, sub:'ratai', text:`Megzkite tiesiai, kol pėda nuo pirštų galo bus ${fmt(p.footLen-heelDepth)} cm (pėdos ilgis − kulno gylis ≈ ${fmt(heelDepth)} cm; ≈ ${fr} ratų).`, sts:n}]});
    secs.push({title:'Kulnas trumposiomis eilėmis', items:hkShortHeel(h, s, mid, wt, true)});
    secs.push({title:'Aulas ir juosta', items:[
      {a:1, b:legR, sub:'ratai', text:`Aulas: megzkite ${hkRat(legR)} (${fmt(p.legCm)} cm).`, sts:n},
      {a:legR+1, b:legR+ribR, sub:'ratai', text:`Juosta ${hkRibName()}: ${ribR} ratų (${fmt(p.cuffCm)} cm).`, sts:n},
      {a:null, text:'Uždarykite labai tampriai (pvz., „Jeny’s surprisingly stretchy“ būdu), kad praeitų kulnas.'}]});
    stats=[[left,'užmesti akių (pirštai)'],[n,'akių pėdai'],[h,'kulno akių']];
  } else {
    tech.add(H.shoulder==='vokiskos'?'gsr':'wt');
    const n2=n+2, ribF=ribR%2?ribR+1:ribR;
    const fr=Math.max(1,srnd(Math.max(1,p.footLen-p.toeCm)*g.rpc)-2*s);
    secs.push({title:'Juosta ir aulas', items:[
      {a:null, text:`Užmeskite ${n2} ak. (${n} + 2 kraštinės siūlei – prielaida: siūlė „čiužinio“ dygsniu suvalgo po 1 ak. kiekviename krašte).`, sts:n2},
      ...(ribF?[{a:null, text:`Juosta ${hkRibName()}: ${ribF} eil. (${fmt(p.cuffCm)} cm).`, sts:n2}]:[]),
      {a:1, b:legR%2?legR+1:legR, sub:'eil.', text:`Aulas: ${legR%2?legR+1:legR} eil. lygiu mezginiu (${fmt(p.legCm)} cm). Siūlė bus kojinės šone.`, sts:n2}]});
    secs.push({title:'Kulnas trumposiomis eilėmis', items:[{a:null, text:`Darbui palikite tik paskutines ${h+1} ak. (pusę akių su kraštine) – kitos ${h+1} laukia ant virbalo.`}, ...hkShortHeel(h+1, s, h+1-2*s, wt, false)]});
    secs.push({title:'Pėda', items:[{a:1, b:fr, sub:'eil.', text:`Per visas ${n2} ak. megzkite ${fr} eil., kol pėda nuo kulno galo bus ${fmt(p.footLen-p.toeCm)} cm.`, sts:n2}]});
    secs.push({title:'Pirštai trumposiomis eilėmis', items:[{a:null, text:`Pirštus formuokite taip pat kaip kulną, per tas pačias ${h+1} ak.`}, ...hkShortHeel(h+1, s, h+1-2*s, wt, false).slice(0,2),
      {a:null, text:`Pirštų galą sujunkite akis į akį (Kitchener): pusę akių ant vieno virbalo, pusę – ant kito, sulenkus per vidurį. Tada susiūkite šoninę siūlę nuo pirštų iki viršaus „čiužinio“ dygsniu.`}]});
    stats=[[n2,'užmesti akių'],[h+1,'kulno akių'],[legR+fr+8*s,'eilių (≈)']];
  }
  secs.push({title:'Prielaidos', items:[{a:null, text:rule}]});
  const nm=(HK_OPT.sock.find(o=>o[0]===m)||HK_OPT.sock[0])[1];
  return {title:'Kojinė: '+nm.toLowerCase(), secs, stats, warns, round:m!=='plokscia', chartN:n};
}
function hkShortHeel(h, s, mid, wt, round){
  return [
    {a:1, b:2*s, sub:'eil.', text:`1-a dalis: per ${h} ak. megzkite pirmyn ir atgal; kiekvieną eilę baikite 1 ak. anksčiau nei ankstesnę ir padarykite ${wt} – kol abiejuose kraštuose bus po ${s} apsuktų akių, o viduryje ${mid} (${2*s} eil.).`, sts:mid},
    {a:2*s+1, b:4*s, sub:'eil.', text:`2-a dalis: kiekvieną eilę megzkite 1 ak. toliau – apsuktą akį numegzkite kartu su apvyniojimu (dviguba akis – kaip viena), apsukite – kol vėl dirbs visos ${h} ak. (${2*s} eil.).`, sts:h},
    ...(round?[{a:null, text:'Tęskite ratu per visas akis. Kulno kampuose paimkite po 1 ak. ir kitame rate jas numegzkite kartu su kaimynine – neliks skylučių (patarimas).'}]:[])];
}
function hkToeDec(n, pl, left, toeRows, round){
  return {title:'Pirštai (pleištinis galas)', items:[
    {a:null, text:`Pažymėkite šonus: viršus ${n/2} ak., padas ${n/2} ak.`},
    {a:1, b:toeRows, sub:'ratai', text:`Mažinimo ratas: abiejose dalyse *1 veid., ssk, megzkite iki 3 ak. prieš galą, 2 kartu, 1 veid.* (−4 ak.). ${cap1(hkPlanText(pl,round,'mažinkite'))}.`, sts:left},
    {a:null, text:`Liks ${left} ak.: po ${left/2} ant dviejų virbalų – sujunkite akis į akį (Kitchener).`}]};
}
function hkRectRound(gk, pid, tech){
  const p=S.params[gk][pid]||{}, g=hkG(); if(!(p.type==='kaklaskare'||p.type==='juosta')) return null;
  const n=srnd(Math.max(10,p.len)*g.spc), rr=Math.max(1,srnd(Math.max(0.5,p.w)*g.rpc));
  const st=hkStart(n, p.ribCm||0, true, {markers:'Rato pradžioje – žymeklis.'});
  tech.add('bo');
  return {title:(p.type==='kaklaskare'?'Kaklaskarė':'Galvos juosta')+' apvaliai', secs:[{title:'Pradžia', items:st.items},{title:'Mezgimas', items:[
    {a:1, b:rr, sub:'ratai', text:`Megzkite ${hkRat(rr)} (${fmt(p.w)} cm).${p.ribCm>0?` Tada ${srnd(p.ribCm*g.rrpc)} ratų juosta.`:''}`, sts:n},
    {a:null, text:'Laisvai uždarykite. Žiedo apimtis = nurodytas ilgis.'}]}], stats:[[st.items[0].sts,'užmesti akių'],[rr,'ratų']], warns:[], round:true, chartN:n};
}
function hkPalmExtra(gk, R, tech){
  const p=S.params[gk].plastaka, g=hkG(); if(!p || !R.pc.palm) return [];
  const t=Math.max(2,srnd(p.thumbCirc/2*g.spc)), r=Math.max(1,srnd(p.wristToThumb*g.rpc)), from=Math.max(1,srnd(g.spc));
  return [{r, a:r, sub:hkSub(r,{}), text:`Nykščio anga: ${from+1}–${from+t} ak. nuo dešinio krašto (veidinėje pusėje) numegzkite kontrastiniu pagalbiniu siūlu, grąžinkite ant kairiojo virbalo ir numegzkite pagrindiniu. Vėliau siūlą ištraukite ir įmegzkite nykštį. Kairei pirštinei – veidrodiškai.`}];
}

/* ---------- specialios detalės (paimamos nuo kraštų) ---------- */
function hkSpecial(gk, pc, tech){
  const g=hkG(), P=S.params[gk], H=hkState(), round=H.method==='apvaliai';
  const W=x=>srnd(x*g.spc), RR=x=>Math.max(1,srnd(x*g.rrpc)), RW=x=>Math.max(1,srnd(x*g.rpc));
  tech.add('pu'); tech.add('bo');
  const mk=(title, items, stats, warns)=>({title, secs:[{title, items}], stats, warns:warns||[], round:false});
  if(pc.kind==='collar'){
    const c=P.apykakle, nt=neckTotals(gk,P), n0=W(nt.len), r1=RR(c.height), rows=c.double==='taip'?2*r1:r1;
    const rf=hkRibFix(n0, round), nm=(COLLARS.find(x=>x[0]===c.type)||COLLARS[0])[1], V=P.priekis&&P.priekis.neckShape==='V';
    const items=[{a:null, text:`Iškirptės kraštas ${fmt(nt.len)} cm (${nt.parts.join(', ')}).`},
      round ? {a:null, text:`Susiūkite abu pečius. Apskritu virbalu (40 cm, ${H.ribNeedle}) veidinėje pusėje paimkite ${rf.n} ak. aplink iškirptę, pradėdami ties kairiu pečiu. Rato pradžioje – žymeklis.`, sts:rf.n}
            : {a:null, text:`Susiūkite vieną petį (kairįjį). Veidinėje pusėje paimkite ${rf.n} ak. nuo iškirptės krašto.`, sts:rf.n},
      {a:1, b:rows, sub:round?'ratai':'eil.', text:`${nm}: juosta ${hkRibName()} – ${rows} ${round?'ratų':'eil.'} (${fmt(c.height)} cm${c.double==='taip'?', dvigubai':''}).`, sts:rf.n}];
    if(V){ tech.add('cdd'); items.push({a:null, text:`V iškirptė: pažymėkite vidurinę priekio akį; kiekviename ${round?'rate':'veidinės pusės eilėje'} ties ja darykite centrinį dvigubą mažinimą (2 ak. nukelkite kartu kaip veidines, 1 veid., nukeltas užmeskite ant jos) – −2 ak.`}); }
    if(c.double==='taip') items.push({a:null, text:`Dvigubai: sulenkite juostą per pusę į vidų ir akis laisvai prisiūkite prie paėmimo eilės.`});
    else items.push({a:null, text:'Uždarykite laisvai juostos raštu, kad pralįstų galva.'});
    if(!round) items.push({a:null, text:'Susiūkite antrą petį kartu su apykaklės galais.'});
    return mk(nm, items, [[rf.n,'paimti akių'],[rows,round?'ratų':'eilių'],[fmt(nt.len)+' cm','iškirptės kraštas']]);
  }
  if(pc.kind==='bands'){
    const f=P.priekis, fg=cfrontGeom(P.nugara,f,'L',gk), nt=neckTotals(gk,P);
    const rows=RR(f.bandW), e=W(fg.edgeLen), n=Math.max(1,Math.round(f.btnN)), usable=fg.edgeLen-f.btnBottom-f.btnTop;
    const pos=[]; for(let i=0;i<n;i++) pos.push(n===1?f.btnBottom:f.btnBottom+usable*i/(n-1));
    const items=[{a:null, text:`Priekio kraštas iki iškirptės: ${fmt(fg.edgeLen)} cm. Kiekvienam priekiui veidinėje pusėje paimkite ${e} ak. (≈ ${fmt(g.sts/g.rows*4,1)} ak. iš 4 eilių) ir numegzkite ${rows} eil. juosta ${hkRibName()} (${fmt(f.bandW)} cm).`, sts:e},
      ...(f.btnN>0?[{a:Math.max(1,Math.floor(rows/2)), sub:'eilė', text:`Sagų skylutės (${n} vnt.) ${Math.max(1,Math.floor(rows/2))}-oje juostos eilėje, ties akimis nuo apačios: ${pos.map(x=>Math.max(1,W(x))).join(', ')} (${pos.map(x=>fmt(x)+' cm').join(', ')}). Skylutė: užmetimas, 2 kartu; didesnei – 2 ak. uždarykite, kitoje eilėje virš jų užmeskite 2 ak.`}]:[{a:null, text:'Be sagų – juosta be skylučių.'}]),
      {a:null, text:`Apykaklės juosta: nuo iškirptės krašto (${fmt(nt.len)} cm: ${nt.parts.join(', ')}) paimkite ${W(nt.len)} ak., numegzkite ${RR(P.juostos.neckbandH)} eil. (${fmt(P.juostos.neckbandH)} cm).`, sts:W(nt.len)},
      {a:null, text:'Uždarykite laisvai juostos raštu. Moteriškame drabužyje skylutės paprastai dešiniajame priekyje, vyriškame – kairiajame.'}];
    return mk(f.btnN>0?'Juostos ir sagos':'Juostos', items, [[e,'akių juostai (1 priekis)'],[rows,'juostos eilių'],[f.btnN>0?n:0,'sagų']], usable<0&&f.btnN>0?['Sagų atstumai didesni už priekio kraštą.']:[]);
  }
  if(pc.kind==='lapel'){
    const f=P.priekis, a=P.atlapai, fg=cfrontGeom(P.nugara,f,'L',gk), back=bodyGeom(P.nugara,null,gk);
    const v=W(fg.neckLen), b=W(back.neckLen), tot=2*v+b, R=2*Math.max(1,srnd(a.collarW*g.rpc/2)), grp=shortRowGroups(v,R/2).filter(x=>x>0);
    tech.add(H.shoulder==='vokiskos'?'gsr':'wt');
    const items=[{a:null, text:`Apykaklės kraštas: 2 atlapai po ${fmt(fg.neckLen)} cm + nugara ${fmt(back.neckLen)} cm. Susiuvę pečius, paimkite ${tot} ak.: ${v} (atlapas) + ${b} (nugara) + ${v} (atlapas).`, sts:tot},
      {a:1, b:R, sub:'trumposios eil.', text:`Trumposios eilės nuo nugaros: pirma eilė – per ${b} nugaros ak.${grp[0]?` ir dar ${grp[0]}`:''}, apsukite (${H.shoulder==='vokiskos'?'vokiška trumpoji eilė':'w&t'}); toliau kiekvienoje eilėje paimkite vis daugiau atlapo akių: ${grp.join(', ')} (iš viso ${R} eil.). Nugaroje apykaklė bus ${fmt(a.collarW)} cm, ties lūžiu – siaura.`},
      {a:R+1, b:R+2, sub:'eil.', text:'Numegzkite 2 eil. per visas akis ir laisvai uždarykite. Apykaklę atverskite.'}];
    const n=Math.max(1,Math.round(f.btnN)), top=fg.edgeLen-f.btnTop, us=top-f.btnBottom, pos=[]; for(let i=0;i<n;i++) pos.push(n===1?top:f.btnBottom+us*i/(n-1));
    if(f.btnN>0) items.push({a:null, text:`Sagos (${n} vnt.) nuo apačios: ${pos.map(x=>fmt(x)+' cm').join(', ')}. Skylutes megzkite priekyje ${fmt(Math.max(0,f.overlap||0)/2)} cm (${W(Math.max(0,f.overlap||0)/2)} ak.) nuo krašto.`});
    if(a.pocketN>0) items.push({a:null, text:`Kišenės (${Math.round(a.pocketN)} vnt.): užmeskite ${W(a.pocketW)} ak., numegzkite ${RW(a.pocketH)} eil., uždarykite ir prisiūkite.`});
    return mk('Apykaklė ir atlapai', items, [[tot,'paimti akių'],[R,'apykaklės eilių']]);
  }
  if(pc.kind==='armband'){
    const ab=P.rankiai, b=bodyGeom(P.nugara,null,gk), len=2*curveLen(b.base.side,b.Hu,b.armTop), n0=W(len), r1=RR(ab.height), rows=ab.double==='taip'?2*r1:r1, rf=hkRibFix(n0,round);
    return mk('Rankų angų juostos (2 vnt.)', [{a:null, text:`Rankos angos kraštas ≈ ${fmt(len)} cm (nugara + priekis).`},
      round?{a:null, text:`Susiuvę pečius ir šonus, apskritu virbalu (40 cm) arba kojinių virbalais paimkite ${rf.n} ak. aplink rankos angą, pradėdami pažastyje.`, sts:rf.n}
           :{a:null, text:`Susiuvę pečius (šonai dar nesiūti), veidinėje pusėje paimkite ${rf.n} ak. nuo angos krašto.`, sts:rf.n},
      {a:1, b:rows, sub:round?'ratai':'eil.', text:`Juosta ${hkRibName()}: ${rows} ${round?'ratų':'eil.'} (${fmt(ab.height)} cm${ab.double==='taip'?', dvigubai – sulenkite':''}), laisvai uždarykite.${round?'':' Susiūkite šonus kartu su juostų galais.'}`, sts:rf.n}], [[rf.n,'paimti akių'],[rows,round?'ratų':'eilių']]);
  }
  if(pc.kind==='pcollar'){
    const c=P.apykakle, d=P.dalis, len=Math.max(10,d.w*2*0.55), rf=hkRibFix(W(len),true), r1=RR(c.height), rows=c.double==='taip'?2*r1:r1;
    return mk('Apykaklė', [{a:null, text:'Pončo surinkimas: kiekvieno stačiakampio vieno ilgojo krašto galą prisiūkite prie kito stačiakampio trumpojo krašto (raidė L) – abu kartus vienodai.'},
      {a:null, text:`Kaklo anga ≈ ${fmt(len)} cm (prielaida: ~55 % dvigubo stačiakampio pločio – pamatuokite).`},
      {a:null, text:`Apskritu virbalu paimkite ${rf.n} ak. aplink angą ir megzkite ${hkRat(rows)} juosta ${hkRibName()} (${fmt(c.height)} cm). Laisvai uždarykite.`, sts:rf.n}], [[rf.n,'paimti akių'],[rows,'ratų']]);
  }
  if(pc.kind==='hood'){
    const h=P.gobtuvas, nt=neckTotals(gk,P), n=W(nt.len), rows=RW(h.height), rb=srnd(h.ribCm*g.rrpc), fe=W(2*h.height);
    tech.add('3n');
    return mk('Gobtuvas', [{a:null, text:`Iškirptės kraštas ${fmt(nt.len)} cm (${nt.parts.join(', ')}).`},
      {a:null, text:`Susiuvę pečius, veidinėje pusėje paimkite ${n} ak. nuo iškirptės krašto (be apykaklės).${n%2?' Akių nelyginis skaičius – vidurinė akis bus ties sulenkimu.':''}`, sts:n},
      {a:1, b:rows, sub:'eil.', text:`Megzkite plokščiai ${rows} eil. (${fmt(h.height)} cm).`, sts:n},
      {a:null, text:`Akis padalinkite per pusę, sulenkite gobtuvą veidinėmis pusėmis į vidų ir viršų sujunkite trimis virbalais.${rb?` Priekio kraštui paimkite ≈${fe} ak. ir numegzkite ${rb} eil. juosta (${fmt(h.ribCm)} cm), laisvai uždarykite.`:''}`}], [[n,'paimti akių'],[rows,'eilių']]);
  }
  if(pc.kind==='fingers'){
    const p=P.plastaka, names=['Smilius','Didysis','Bevardis','Mažylis'], items=[];
    [0,1,2,3].forEach(i=>{ const c=p['fC'+(i+1)], L=p['fL'+(i+1)]; const n=Math.max(4,W(c+0.5)), r=Math.max(2,RW(L));
      items.push({a:null, text:`${names[i]}: užmeskite ${n} ak., numegzkite ${r} eil. (${fmt(L)} cm), *2 kartu*, siūlą perverkite per akis ir sutraukite. Susiūkite šoną.`, sts:n}); });
    const tn=Math.max(4,W(p.thumbCirc+0.5)), tr=Math.max(2,RW(p.thumbLen));
    items.push({a:null, text:`Nykštys: užmeskite ${tn} ak., numegzkite ${tr} eil. (${fmt(p.thumbLen)} cm), sutraukite, susiūkite ir įsiūkite į delno angą.`, sts:tn});
    items.push({a:null, text:'Pirštus įsiūkite į viršutinį kraštą eilės tvarka: smilius, didysis, bevardis, mažylis. Apvaliai megzti pirštai patogesni – pasirinkite „Apvaliai“.'});
    return mk('Pirštai (vienai pirštinei)', items, [[5,'detalės']]);
  }
  return null;
}

/* ---------- pagrindinis skaičiavimas ---------- */
function hkBuild(gk, pid){
  const H=hkState(), round=H.method==='apvaliai', G=GARMENTS[gk], pc=pieceDef(gk,pid), tech=new Set();
  let res=null, note='';
  const pullover = G.pieces.some(p=>p.kind==='body') && G.pieces.some(p=>p.kind==='front');
  if(pc.kind==='sock') res=hkSock(gk,tech);
  else if(pc.kind==='hat') res=hkHat(gk,tech);
  else if(round && ['mitten','thumb'].includes(pc.kind)) res=hkMittenRound(gk,tech);
  else if(round && ['glovehand','fingers'].includes(pc.kind)) res=hkGloveRound(gk,tech);
  else if(round && pullover && (pc.kind==='body'||pc.kind==='front')){ res=hkBodyRound(gk,tech); if(!res) note='Iškirptė prasideda žemiau pažastų – liemuo aprašytas plokščiai.'; }
  else if(round && pc.kind==='sleeve') res=hkSleeveRound(gk,pid,tech);
  else if(round && pc.kind==='skirt'){ res=hkSkirtRound(gk,tech); if(!res) note='Priekis ir nugara skiriasi – sijonas aprašytas plokščiai.'; }
  else if(round && pc.kind==='rect') res=hkRectRound(gk,pid,tech);
  if(!res) res=hkSpecial(gk,pc,tech);
  if(!res){
    const R=hkCompute(gk,pid);
    if(R.special){ res={title:pc.name, secs:[{title:pc.name, items:[{a:null, text:'Šiai detalei rankinio mezgimo aprašymo nėra.'}]}], stats:[], warns:[], round:false}; }
    else {
      const extra = (pc.kind==='mitten'||pc.kind==='glovehand') ? hkPalmExtra(gk,R,tech) : [];
      const fl=hkFlat(R, gk, {extraMain:extra}, tech);
      const g=hkG();
      if(pc.kind==='rect'){ const p=S.params[gk][pc.param||pid]||{}; if(p.ribCm>0) fl.secs[fl.secs.length-1].items.splice(-1,0,{a:null, text:`Kitame gale – tokia pati juosta: ${srnd(p.ribCm*g.rrpc)} eil.`});
        if(p.type==='kaklaskare') fl.secs.push({title:'Surinkimas', items:[{a:null, text:'Kaklaskarė: galus susiūkite arba sujunkite akis į akį (pradžią užmeskite pagalbiniu siūlu) – gausis žiedas.'}]});
        if(gk==='poncas') fl.secs.push({title:'Surinkimas', items:[{a:null, text:'Numegzkite 2 vienodus stačiakampius. Surinkimas – detalėje „Apykaklė“.'}]}); }
      if(round && !note) note = ['cfront','body','front'].includes(pc.kind) ? 'Gaminys su atviru priekiu – detalės megzamos plokščiai.' : 'Šią detalę megzkite plokščiai – apvaliai ji neformuojama.';
      res={title:pc.name+(pc.count>1?' ×'+pc.count:''), secs:fl.secs, stats:[[R.sim.castOn.n,'užmesti akių'],[R.sim.N,'eilių (be juostos, su trumposiomis)'],[fmt(R.geom.H+(R.geom.ribCm||0))+' cm','aukštis']], warns:R.sim.warnings, round:false, chartN:R.sim.castOn.n};
    }
  }
  res.note=note; res.tech=tech;
  // eilių suvestinė niekada nemažesnė už didžiausią tekste minimą eilės numerį
  let maxRow=0; res.secs.forEach(sc=>sc.items.forEach(it=>{ [it.a,it.b].forEach(v=>{ if(typeof v==='number'&&isFinite(v)) maxRow=Math.max(maxRow,v); }); }));
  res.stats=res.stats||[]; const si=res.stats.findIndex(([v,l])=>/eilių|ratų/.test(l) && !/iki/.test(l));
  if(si>=0){ const v=res.stats[si][0]; if(typeof v==='number' && v<maxRow) res.stats[si]=[maxRow, res.stats[si][1].replace(' (≈)','')+(/\(≈\)/.test(res.stats[si][1])?' (≈)':'')]; }
  else if(maxRow>0) res.stats.push([maxRow,'paskutinė eilė / ratas']);
  res.maxRow=maxRow;
  return res;
}

function hkNum(k, label, u, hint){ const H=hkState(); return `<label class="f" for="hk-${k}">${label}<span class="in"><input id="hk-${k}" data-hk="${k}" type="number" inputmode="decimal" step="0.5" min="1" value="${esc(H[k])}"><span class="u">${u}</span></span>${hint?`<span class="hint">${hint}</span>`:''}</label>`; }
function hkTxt(k, label, hint){ const H=hkState(); return `<label class="f" for="hk-${k}">${label}<span class="in"><input id="hk-${k}" data-hk="${k}" type="text" value="${esc(H[k])}"></span>${hint?`<span class="hint">${hint}</span>`:''}</label>`; }
function hkRowHtml(it){
  if(it.a==null) return `<tr class="nt"><td></td><td colspan="2">${esc(it.text)}</td></tr>`;

function hkChartHtml(res){
  const p=S.pat; if(!p||typeof p!=='object'||typeof p.cells!=='string'||!(p.W>0)||!(p.H>0)) return '';
  const TX=typeof isTX==='function' && isTX(p);
  if(!TX && !/[1-9]/.test(p.cells)) return '';
  const n=res.chartN||0, reps=n&&p.W ? Math.floor(n/p.W) : 0, rem=n&&p.W ? n%p.W : 0;
  const round=!!res.round;
  const notes=[round?'Apvaliai: kiekvieną ratą skaitykite iš dešinės į kairę, schemą – iš apačios į viršų (1-asis ratas apačioje).'
                    :'Plokščiai: veidinės (nelyginės) eilės skaitomos iš dešinės į kairę, išvirkščios (lyginės) – iš kairės į dešinę. Schema – iš apačios į viršų.'];
  if(n) notes.push(`Kartotė ${p.W} ak. × ${p.H} eil. Detalėje ${n} ak. = ${reps} kartotės${rem?` + ${rem} ak. (likutį padalinkite po lygiai abiem kraštams arba pakoreguokite akių skaičių)`:''}.${round&&rem?' Apvaliai patogiausia, kai rato akių skaičius dalijasi iš kartotės pločio.':''}`);
  if(!TX){ try{ const fl=patFloats(p); if(fl.n>5) notes.push(`Ilgiausias tempas – ${fl.n} ak. (${fl.row}-oje eilėje). Ilgesnius nei 5–7 ak. tempus kas 3–5 ak. prisukite (užfiksuokite) už darbo esančiu siūlu.`); }catch(e){}
    notes.push('Spalvotas raštas: abu siūlus laikykite rankose, nesukite; tempus palikite laisvus, kad audinys netrauktų.'); }
  else if(p.tech==='patiesinimas') notes.push('Patiesinimas rankomis: ∪ – akį nukelkite su užmetimu (siūlas priekyje), kitoje eilėje sumegzkite ją kartu su užmetimu.');
  else if(p.tech==='praleidimas') notes.push('Praleista akis: — – akį nukelkite nemegztą, siūlas darbo išvirkščioje pusėje.');
  else if(p.tech==='azuras') notes.push('Ažūras rankomis: ◁ – užmetimas ir šalia 2 kartu pasukant į kairę (ssk); ▷ – užmetimas ir 2 kartu (k2tog). Akių skaičius išlieka.');
  return `<section class="panel" style="margin-top:14px"><h2>Raštas rankiniam mezgimui</h2>
    <div style="overflow-x:auto;max-width:100%"><canvas id="hkChart" style="max-width:100%;height:auto;display:block"></canvas></div>

}

/* ================= MANO SIŪLAI (likučių planuoklis) =================
   S.stash      – turimi siūlai [{id,name,color,haveG,haveM,m100,strands,gauge:{sts,rows,ribRows,swG,swW,swH}|null,photo}]
   S.stashPlan  – planas kiekvienam gaminiui {main, rib, pieces:{pid:yarnId|'_none'}, stripes:{'*'|pid:[{y,rows}]}, cw:{on,pieces,map,swG,swW,swH}}
   S.stashPlan[gk].ombre – {'*'|pid:{yarns:[id…], method:'fade'|'marl'|'helix', zoneCm, unit, stages:'cm cm …'}}
   S.stashOpt   – {hand, reserve, scope, oscope}
   Kiekviena detalė skaičiuojama SU JOS SIŪLŲ MĖGINIU (computePiece opts.gauge) – centimetrai nesikeičia, keičiasi akys ir eilės. */
const STASH_TAB=['stash','Mano siūlai'];
const ST_MAIN='_main', ST_NONE='_none', ST_RIBKINDS=['collar','bands','armband','pcollar'];
const ST_PAL_KEY='srp-spalvos';
const ST_OM={fade:'Perėjimas dryželiais (fade)', marl:'Dvi gijos kartu (marled)', helix:'Pakaitomis po 1 eil. (spiralė)'};
let stUI={edit:null, draft:null, delArm:null, palArm:false, sel:{}, msg:''};

/* ---------- būsena ---------- */
const stNum=(v,min)=>{ const x=parseFloat(String(v==null?'':v).replace(',','.')); return isFinite(x)&&x>=(min||0)?x:0; };
const stHexOk=h=>/^#[0-9a-f]{6}$/i.test(String(h||''));
function stNormYarn(y){
  y.id=String(y.id||('y'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)));
  y.name=String(y.name||'Siūlai'); if(!stHexOk(y.color)) y.color='#b8a07a';
  ['haveG','haveM','m100'].forEach(k=>y[k]=stNum(y[k]));
  y.strands=Math.max(1,Math.min(6,Math.round(stNum(y.strands))||1));
  if(y.gauge&&typeof y.gauge==='object'){ const g=y.gauge; ['sts','rows','ribRows','swG','swW','swH'].forEach(k=>g[k]=stNum(g[k])); if(!(g.sts>0&&g.rows>0)) y.gauge=null; } else y.gauge=null;
  if(typeof y.photo!=='string'||!y.photo.startsWith('data:image/')) y.photo='';
  return y;
}
function stState(){
  if(!Array.isArray(S.stash)) S.stash=[];
  S.stash=S.stash.filter(y=>y&&typeof y==='object').map(stNormYarn);
  if(!S.stashPlan||typeof S.stashPlan!=='object') S.stashPlan={};
  if(!S.stashOpt||typeof S.stashOpt!=='object') S.stashOpt={};
  const o=S.stashOpt; o.hand=!!o.hand && typeof hkState==='function';
  if(!(o.reserve>=0)) o.reserve=null; if(typeof o.scope!=='string') o.scope='*'; if(typeof o.oscope!=='string') o.oscope='*';
  return o;
}
function stPlan(gk){
  let p=S.stashPlan[gk]; if(!p||typeof p!=='object') p=S.stashPlan[gk]={};
  if(typeof p.main!=='string') p.main=ST_MAIN; if(typeof p.rib!=='string') p.rib='';
  if(!p.pieces||typeof p.pieces!=='object') p.pieces={};
  if(!p.stripes||typeof p.stripes!=='object') p.stripes={};
  Object.keys(p.stripes).forEach(k=>{ if(!Array.isArray(p.stripes[k])) delete p.stripes[k]; else p.stripes[k]=p.stripes[k].filter(e=>e&&typeof e==='object').map(e=>({y:String(e.y||''), rows:Math.max(0,Math.round(stNum(e.rows)))})); });
  if(!p.ombre||typeof p.ombre!=='object') p.ombre={};
  Object.keys(p.ombre).forEach(k=>{ const o=p.ombre[k]; if(!o||typeof o!=='object'||!Array.isArray(o.yarns)){ delete p.ombre[k]; return; }

  // 4. juostelės
  Object.keys(plan.stripes).forEach(sc=>{ const seq=plan.stripes[sc]; if(!seq.some(e=>e.y===yid&&e.rows>0)) return; const where=sc==='*'?'visame gaminyje':`detalėje „${esc((GARMENTS[gk].pieces.find(p=>p.id===sc)||{name:sc}).name)}“`;
    seq.forEach((e,i)=>{ if(e.y===yid||!ctx.byId[e.y]||!(e.rows>0)) return;
      for(let r=e.rows+1;r<=Math.max(e.rows*8,e.rows+40);r++){ const p2=clone(plan); p2.stripes[sc][i].rows=r; const r2=stEval(gk,ctx,p2);
        if(ok(r2,[yid,e.y])){ out.push(`Juostelės ${where}: ${nm(ctx.byId[e.y])} juostelę (${i+1}) praplatinkite iki ${r} eil. vietoj ${e.rows} – ${nm(Y)} liks ${q(stLeft(r2,yid))}.`); break; } } });
    seq.forEach((e,i)=>{ if(e.y!==yid||!(e.rows>1)) return;
      for(let r=e.rows-1;r>=1;r--){ const p2=clone(plan); p2.stripes[sc][i].rows=r; const r2=stEval(gk,ctx,p2);
        if(ok(r2,seq.map(x=>x.y).filter(id=>ctx.byId[id]))){ out.push(`Juostelės ${where}: ${nm(Y)} juostelę (${i+1}) susiaurinkite iki ${r} eil. vietoj ${e.rows}.`); break; } } }); });
  // 5. ombrė: perėjimo zonos aukštis
  Object.keys(plan.ombre||{}).forEach(sc=>{ const o=plan.ombre[sc]; if(o.method==='marl'||!o.yarns.includes(yid)) return; const ids=o.yarns.filter(id=>ctx.byId[id]); if(ids.length<2) return;
    const where=sc==='*'?'visame gaminyje':`detalėje „${esc((GARMENTS[gk].pieces.find(p=>p.id===sc)||{name:sc}).name)}“`; let best=null, bl=null;
    for(let z=1;z<=40;z++){ if(z===o.zoneCm) continue; const p2=clone(plan); p2.ombre[sc].zoneCm=z; const r2=stEval(gk,ctx,p2); if(ok(r2,ids)&&(best==null||Math.abs(z-o.zoneCm)<Math.abs(best-o.zoneCm))){ best=z; bl=stLeft(r2,yid); } }
    if(best!=null) out.push(`Ombrė ${where}: ${nm(Y)} užteks, jei perėjimo zona bus ${best} cm (dabar ${fmt(o.zoneCm)} cm) – liks ${q(bl)}.`);
    const p3=clone(plan); p3.ombre[sc].yarns=o.yarns.slice().reverse(); const r3=stEval(gk,ctx,p3);
    if(ok(r3,ids)) out.push(`Ombrė ${where}: apverskite eiliškumą (${p3.ombre[sc].yarns.map(id=>nm(ctx.byId[id]||{name:id})).join(' → ')}) – ${nm(Y)} liks ${q(stLeft(r3,yid))}.`); });
  const mm=n.bal.u==='g'&&Y.m100>0?` (${fmt(D*Y.m100/100,0)} m)`:'';
  out.push(`Arba dokupkite ${nm(Y)}: ≈ ${q(D)}${mm}.`);
  return out;
}

/* ---------- spalvų programa ---------- */
function stPalette(){ try{ const o=JSON.parse(localStorage.getItem(ST_PAL_KEY)||'{}'); return Array.isArray(o.palette)?o.palette.filter(c=>c&&stHexOk(c.hex)):[]; }catch(e){ return []; } }
function stRgb(h){ const n=parseInt(String(h).slice(1),16)||0; return [n>>16&255,n>>8&255,n&255]; }
function stLab(r,g,b){ const s=c=>{c/=255; return c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);}; const R=s(r),G=s(g),B=s(b);
  let x=(0.4124564*R+0.3575761*G+0.1804375*B)/0.95047, y=(0.2126729*R+0.7151522*G+0.0721750*B), z=(0.0193339*R+0.1191920*G+0.9503041*B)/1.08883;
  const f=t=>t>216/24389?Math.cbrt(t):(24389/27*t+16)/116; x=f(x);y=f(y);z=f(z); return [116*y-16,500*(x-y),200*(y-z)]; }
function stHex(r,g,b){ return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function stSpalvosUrl(){ return (typeof standalone==='undefined'||standalone)?'spalvos/':'https://imgroupeu-lgtm.github.io/silver-reed-pagalbininkas/spalvos/'; }
function stExportPalette(list){
  let o={}; try{ o=JSON.parse(localStorage.getItem(ST_PAL_KEY)||'{}'); if(!o||typeof o!=='object'||Array.isArray(o)) o={}; }catch(e){ o={}; }
  o.palette=list.map(y=>{ const rgb=stRgb(y.color); return {hex:y.color.toLowerCase(), rgb, lab:stLab(...rgb), name:y.name}; });
  o.base=0; o.tab='siulai';
  try{ localStorage.setItem(ST_PAL_KEY, JSON.stringify(o)); return true; }catch(e){ return false; }
}
function stImportPalette(){ const pal=stPalette(); let n=0;
  pal.forEach((c,i)=>{ const hex=c.hex.toLowerCase(), name=String(c.name||'').trim()||('Spalva '+hex);
    if(S.stash.some(y=>y.color.toLowerCase()===hex&&y.name===name)) return;
    S.stash.push(stNormYarn({name, color:hex, gauge:null})); n++; });
  return {n, total:pal.length}; }

/* ---------- nuotrauka ---------- */
function stThumb(file, cb){
  const rd=new FileReader(); rd.onerror=()=>cb(null);
  rd.onload=()=>{ const im=new Image(); im.onerror=()=>cb(null);
    im.onload=()=>{ const sc=Math.min(1,240/Math.max(im.width,im.height)), w=Math.max(1,Math.round(im.width*sc)), h=Math.max(1,Math.round(im.height*sc));
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const cx=cv.getContext('2d'); cx.drawImage(im,0,0,w,h);
      let url=''; try{ url=cv.toDataURL('image/jpeg',0.7); }catch(e){}
      cb(url?{url, avg:stAvg(cx,w/2,h/2,Math.max(3,Math.round(Math.min(w,h)*0.15)),w,h)}:null); };
    im.src=rd.result; };
  rd.readAsDataURL(file); }
function stAvg(cx,x,y,r,w,h){ const x0=Math.max(0,Math.round(x-r)), y0=Math.max(0,Math.round(y-r)), x1=Math.min(w,Math.round(x+r)+1), y1=Math.min(h,Math.round(y+r)+1);
  const d=cx.getImageData(x0,y0,Math.max(1,x1-x0),Math.max(1,y1-y0)).data; let R=0,G=0,B=0,n=0;
  for(let i=0;i<d.length;i+=4){ R+=d[i];G+=d[i+1];B+=d[i+2];n++; } return n?stHex(R/n,G/n,B/n):null; }
function stSample(img, ev){
  const r=img.getBoundingClientRect(), w=img.naturalWidth, h=img.naturalHeight; if(!w||!h||!r.width) return null;
  const x=(ev.clientX-r.left)/r.width*w, y=(ev.clientY-r.top)/r.height*h;
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const cx=cv.getContext('2d'); cx.drawImage(img,0,0);
  try{ return stAvg(cx,x,y,3,w,h); }catch(e){ return null; } }

   <div class="row">${om.yarns.length<6?`<button class="btn" data-act="oadd">+ Siūlai</button>`:''}${om.yarns.length?`<button class="btn" data-act="oclr">Be ombrė</button>`:''}</div>
   ${om.yarns.length?`<div class="st-fields3" style="margin-top:10px">
    <label class="f">Būdas<span class="in"><select data-om="method">${Object.entries(ST_OM).map(([v,t])=>`<option value="${v}" ${om.method===v?'selected':''}>${t}</option>`).join('')}</select></span></label>
    ${om.method==='marl'?`<label class="f">Pakopų aukščiai<span class="in"><input data-om="stages" type="text" inputmode="decimal" value="${esc(om.stages)}" placeholder="tuščia – po lygiai"><span class="u">cm</span></span><span class="hint">${2*Math.max(2,om.yarns.length)-1} skaičiai: ${(()=>{ const L=ST_LET.slice(0,Math.max(2,om.yarns.length)).split(''); const a=[]; L.forEach((c,i)=>{ a.push(c+c); if(i<L.length-1) a.push(c+L[i+1]); }); return a.join(', '); })()}</span></label>`
     :`${omNum('zoneCm','Perėjimo zona','cm',om.zoneCm,'Kiekvienam perėjimui')}${om.method==='fade'?omNum('unit','Dryželio aukštis','eil.',om.unit,'Mašinoje – lyginis'):''}`}
   </div>`:''}
   <p class="note">${om.method==='marl'?'Megzkite 2 gijomis kartu ir keiskite po vieną giją: AA → AB → BB → BC… Pakopoje AB kiekvienų siūlų gija eina per visą eilę (metrai – visas ilgis, gramai – pusė mezginio). Mėginys – 2 gijomis.':om.method==='helix'?'Perėjimo zonoje eilės keičiasi pakaitomis po 1 (apvaliai – spiralė be laiptelio). Mašinoje 1 eilės dryželiams siūlas lieka kitoje pusėje – patogiau „Perėjimas dryželiais“ po 2 eil.':'Perėjimo zonoje dryželių santykis keičiasi: A A A B → A A B B → A B B B. Tarp perėjimų – vientisos kiekvienų siūlų zonos.'} Eilės skaičiuojamos nuo pirmos eilės po juostos, pagal detalės siūlų mėginį.</p>
   ${omPieces.map(p=>{ const L=p.omb.ys.map((y,i)=>ST_LET[i]); return `<details class="out" ${omPieces.length===1?'open':''}><summary><b>${esc(p.pc.name)}</b> – ${p.omb.N} eil. (${fmt(p.g.rows)} eil./10 cm)</summary>
     <div class="note" style="margin:6px 0">${p.omb.ys.map((y,i)=>`<span class="st-dot" style="background:${y.color}"></span>${L[i]} = ${esc(y.id===ST_MAIN?'pagrindiniai':y.name)}`).join(' · ')}</div>
     <ol style="margin:0;padding-left:18px;font-size:.88rem">${p.omb.sch.segs.map(sg=>`<li>${esc(stSegTxt(sg,L))} <small class="note">(${fmt((sg.b-sg.a+1)/(p.g.rows/10))} cm)</small></li>`).join('')}</ol></details>`; }).join('')}
  </section>`;
  // raštas
  const cwHtml=pat?`<section class="panel"><h2>Spalvotas raštas</h2>
   <label class="note" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="st-cw-on" ${plan.cw.on?'checked':''}> Megzti raštą iš skirtuko „Raštai“ (${pat.p.W}×${pat.p.H}${pat.p.bandRows>0?`, juosta ${pat.p.bandRows} eil.`:', visa detalė'})</label>
   ${plan.cw.on?`<h3>Detalės su raštu</h3><div class="st-chk">${res.pieces.filter(p=>p.R&&!p.R.special).map(p=>`<label><input type="checkbox" data-cwp="${p.pc.id}" ${plan.cw.pieces.includes(p.pc.id)?'checked':''}> ${esc(p.pc.name)}</label>`).join('')}</div>
   <h3>Rašto spalvos → siūlai</h3><div class="fields">${pat.idx.map(ci=>`<label class="f"><span><span class="st-dot" style="background:${esc(pat.p.colors[ci]||'#ccc')}"></span>Spalva ${ci+1} · ${fmt(pat.cnt[ci]/pat.tot*100,0)} %</span><span class="in"><select data-cwm="${ci}">${stYarnOpts(ctx,plan.cw.map[ci]||'',[['',ci===pat.idx[0]?'Detalės siūlai':'— nepriskirta —']])}</select></span></label>`).join('')}</div>
   <h3>Mėginys su raštu (tiksliausia)</h3><div class="fields">${[['swG','Svoris','g'],['swW','Plotis','cm'],['swH','Aukštis','cm']].map(([k,l,u])=>`<label class="f">${l}<span class="in"><input data-cws="${k}" type="number" inputmode="decimal" min="0" step="any" value="${plan.cw[k]>0?plan.cw[k]:''}"><span class="u">${u}</span></span></label>`).join('')}</div>
   <div class="warn" style="margin-top:8px">Apytiksliai: siūlai dalijami pagal langelių dalį. Tempai (ilgi siūlai išvirkščioje) sunaudoja daugiau – ${plan.cw.swG>0&&plan.cw.swW>0&&plan.cw.swH>0?'naudojamas jūsų rašto mėginio svoris, tad bendras kiekis tikslesnis; dalis tarp spalvų – vis tiek pagal langelius.':'tiksliausia numegzti mėginį su raštu, pasverti ir įvesti jo svorį ir matmenis.'}</div>`:''}
  </section>`:'';
  // rezultatas
  const rows=Object.values(res.need).sort((a,b)=>(a.Y.id===ST_MAIN?-1:0)-(b.Y.id===ST_MAIN?-1:0));
  let anyMiss=false;
  const resRows=rows.map(n=>{ const Y=n.Y, b=n.bal, h=stHave(Y);
    const need=[n.grams!=null?fmt(n.grams,0)+' g':'', n.meters!=null?fmt(n.meters,0)+' m':''].filter(Boolean).join(' · ');
    const strand=Y.strands>1&&n.meters!=null?`<br><small class="note">${Y.strands} gijos: po ${fmt(n.meters/Y.strands,0)} m kiekvienos</small>`:'';
    const have=[h.g!=null&&Y.haveG>0?fmt(Y.haveG,0)+' g':'', Y.haveM>0?fmt(Y.haveM,0)+' m':''].filter(Boolean).join(' · ')||'—';
    let left='—'; if(b){ if(b.left<0) anyMiss=true; left=b.left<0?`<span class="bad">trūksta ${fmt(-b.left,0)} ${b.u}</span>`:`<span class="good">liks ${fmt(b.left,0)} ${b.u}</span>`; }
    else if(Y.id===ST_MAIN) left='<small class="note">turimo kiekio nėra – pridėkite šiuos siūlus į sąrašą</small>';
    else if(n.grams==null&&n.meters==null) left='<small class="note">trūksta mėginio svorio</small>';
    else if(!(Y.haveG>0||Y.haveM>0)) left='<small class="note">įveskite, kiek turite</small>';
    else if(Y.haveM>0&&!(Y.haveG>0)&&n.meters==null) left='<small class="note">reikia metražo (m/100 g)</small>';
    const parts=n.parts.slice().sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>`${esc(x[0])} ${fmt(x[1],0)} cm²`).join('; ');
    return `<tr><td class="st-name"><b><span class="st-dot" style="background:${Y.color}"></span>${esc(Y.id===ST_MAIN?'Pagrindiniai siūlai':Y.name)}</b><br><small class="note">${fmt(n.area,0)} cm² · ${esc([...n.how].join(', '))}${n.parts.length?' · '+parts:''}</small></td>
     <td class="num" data-l="Reikia">${need||'<span class="note">trūksta mėginio svorio</span>'}${strand}</td><td class="num" data-l="Turiu">${have}</td><td data-l="Liks / trūksta">${left}</td></tr>`; }).join('');
  const sugg=rows.filter(n=>n.bal&&n.bal.left<0).map(n=>`<div class="out"><b>Trūksta „${esc(n.Y.name)}“ – ką galima daryti:</b><ul class="st-sugg">${stSuggest(gk,ctx,plan,res,n.Y.id).map(s=>`<li>${s}</li>`).join('')}</ul></div>`).join('');
  const totA=rows.reduce((s,n)=>s+n.area,0), allG=rows.every(n=>n.grams!=null), totG=rows.reduce((s,n)=>s+(n.grams||0),0);
  const pal=stPalette(), selN=S.stash.filter(y=>stUI.sel[y.id]).length;

  $('#view').innerHTML=`<div class="stv">
  ${stUI.msg?`<div class="warn" style="margin-bottom:10px">${esc(stUI.msg)}</div>`:''}
  <section class="panel"><h2>Mano siūlai</h2>
   ${S.stash.length?`<div class="st-yarns">${S.stash.map(y=>stYarnCard(y,ctx)).join('')}</div>`:'<p class="note">Sąrašas tuščias. Pridėkite likučius: kiek turite (g arba m), metražą iš etiketės ir, jei galite, mėginį – tada programa apskaičiuos, ar užteks.</p>'}
   <div class="row" style="margin-top:10px"><button class="btn primary" data-act="yadd">+ Pridėti siūlus</button>
    ${pal.length?`<button class="btn" data-act="palimp">Įkelti iš spalvų programos (${pal.length})</button>`:''}
    ${S.stash.length?(stUI.palArm?`<button class="btn primary" data-act="palgo">Pakeisti spalvų programos paletę šiais siūlais (${selN||S.stash.length})? Taip</button><button class="btn" data-act="palno">Atšaukti</button>`:`<button class="btn" data-act="palexp">Derinti spalvas${selN?` (${selN})`:''}</button>`):''}</div>
   ${S.stash.length?'<p class="note">„Derinti spalvas“ perkelia pažymėtus (arba visus) siūlus į spalvų programos paletę.</p>':''}
  </section>
  ${stUI.draft?stForm():''}
  <section class="panel" style="margin-top:12px"><h2>${esc(G.name)}: siūlai detalėms</h2>
    ${typeof hkState==='function'?`<div class="pieces" role="group" aria-label="Mezgimo būdas"><button data-act="mode" data-v="m" aria-pressed="${!ctx.hand}">Mašina ${esc(MACHINES[S.machine].name)}</button><button data-act="mode" data-v="h" aria-pressed="${ctx.hand}">Rankomis</button></div>`:''}
    <div class="st-fields3">
     <label class="f" for="st-main">Pagrindiniai siūlai<span class="in"><select id="st-main" data-pl="main">${stYarnOpts(ctx,plan.main)}</select></span></label>
     <label class="f" for="st-rib">Juostos, apykaklė, rankogaliai<span class="in"><select id="st-rib" data-pl="rib">${stYarnOpts(ctx,plan.rib,[['','Tie patys kaip detalės']])}</select></span></label>
     <label class="f" for="st-res">Atsarga<span class="in"><input id="st-res" type="number" inputmode="decimal" min="0" step="1" value="${ctx.reserve}"><span class="u">%</span></span></label>
    </div>
    <p class="note" style="max-width:70ch">Pagrindinis mėginys: ${fmt(ctx.main.gauge.sts)} ak. × ${fmt(ctx.main.gauge.rows)} eil. / 10 cm (${ctx.hand?'skirtukas „Rankinis mezgimas“':'skirtukas „1. Mėginys“'}). Kiekviena detalė perskaičiuojama su jos siūlų mėginiu – centimetrai tie patys, akių ir eilių skaičiai keičiasi.</p>
    <table class="ins st-tab"><thead><tr><th>Detalė</th><th>Siūlai</th><th>Užmesti</th><th>Eilės</th></tr></thead><tbody>${pieceRows}</tbody></table>
  </section>
  <div class="st-two" style="margin-top:12px">${stripeHtml}${ombHtml}${cwHtml}</div>
  <section class="panel" style="margin-top:12px"><h2>Ar užteks siūlų?</h2>
   <div class="stats"><div class="stat"><b>${fmt(totA/10000,2)} m²</b><span>mezginio</span></div><div class="stat"><b>${allG&&rows.length?fmt(totG,0)+' g':'—'}</b><span>iš viso su ${fmt(ctx.reserve,0)} % atsarga</span></div></div>
   ${res.warns.map(w=>`<div class="warn" style="margin-bottom:8px">${esc(w)}</div>`).join('')}
   ${rows.some(n=>n.est)?'<p class="note">Kai kurių siūlų gramai įvertinti pagal kitų to paties metražo siūlų mėginį (perskaičiuota pagal akių tankį ir gijų skaičių).</p>':''}
   <table class="ins st-tab"><thead><tr><th>Siūlai</th><th>Reikia</th><th>Turiu</th><th>Liks / trūksta</th></tr></thead><tbody>${resRows||'<tr><td>—</td></tr>'}</tbody></table>
   ${anyMiss?sugg:''}
   <p class="note" style="margin-top:8px">Plotas – iš kiekvienos detalės eilių su jos siūlų mėginiu. Juostų dalis = užmestų akių plotis × juostos aukštis. Juostelės dalijamos pagal eilių dalį, raštas – pagal langelių dalį (apytiksliai).</p>
  </section></div>`;
  stBind(gk,plan);
}
function stBind(gk,plan){
  const ctx0=()=>stCtx();
  const V=$('#view'), rer=()=>{ save(); viewStash(); };
  V.querySelectorAll('input[data-f],select[data-f]').forEach(el=>el.addEventListener('input',()=>{ const d=stUI.draft, k=el.dataset.f;
    if(k==='name'||k==='color') d[k]=el.value; else if(k==='strands') d.strands=+el.value||1;
    else if(k.startsWith('g.')){ d.gauge=d.gauge||{}; d.gauge[k.slice(2)]=stNum(el.value); } else d[k]=stNum(el.value); }));
  V.querySelectorAll('select[data-f]').forEach(el=>el.addEventListener('change',()=>{ stUI.draft.strands=+el.value||1; }));
  const ph=$('#st-photo'); if(ph) ph.onchange=()=>{ const f=ph.files&&ph.files[0]; if(!f) return;
    stThumb(f, r=>{ if(!r){ stUI.msg='Nuotraukos nepavyko nuskaityti.'; viewStash(); return; } stUI.draft.photo=r.url; if(r.avg) stUI.draft.color=r.avg; stUI.msg=''; viewStash(); }); };
  const im=$('#st-ph'); if(im) im.onclick=ev=>{ const c=stSample(im,ev); if(c){ stUI.draft.color=c; const ci=$('#st-f-color'); if(ci) ci.value=c; } };
  V.querySelectorAll('[data-sel]').forEach(el=>el.onchange=()=>{ stUI.sel[el.dataset.sel]=el.checked; stUI.palArm=false; viewStash(); });
  V.querySelectorAll('[data-pp]').forEach(el=>el.onchange=()=>{ if(el.value==='') delete plan.pieces[el.dataset.pp]; else plan.pieces[el.dataset.pp]=el.value; rer(); });
  V.querySelectorAll('[data-pl]').forEach(el=>el.onchange=()=>{ plan[el.dataset.pl]=el.value; rer(); });
  const rs=$('#st-res'); if(rs) rs.onchange=()=>{ S.stashOpt.reserve=stNum(rs.value); rer(); };
  const sc=$('#st-scope'); if(sc) sc.onchange=()=>{ S.stashOpt.scope=sc.value; stUI.sTouched=true; rer(); };
  const seq=()=>{ const sc0=S.stashOpt.scope, k=(sc0==='*'||GARMENTS[gk].pieces.some(x=>x.id===sc0))?sc0:'*'; return plan.stripes[k]||(plan.stripes[k]=[]); };
  V.querySelectorAll('[data-sy]').forEach(el=>el.onchange=()=>{ seq()[+el.dataset.sy].y=el.value; rer(); });
  V.querySelectorAll('[data-sr]').forEach(el=>el.onchange=()=>{ seq()[+el.dataset.sr].rows=Math.max(1,Math.round(stNum(el.value))||1); rer(); });
  const osel=$('#st-oscope'); if(osel) osel.onchange=()=>{ S.stashOpt.oscope=osel.value; stUI.oTouched=true; rer(); };
  const ombO=create=>{ const k0=S.stashOpt.oscope, k=(k0==='*'||GARMENTS[gk].pieces.some(x=>x.id===k0))?k0:'*';
    if(!plan.ombre[k]&&create) plan.ombre[k]={yarns:[],method:'fade',zoneCm:8,unit:2,stages:''}; return plan.ombre[k]; };
  V.querySelectorAll('[data-oy]').forEach(el=>el.onchange=()=>{ ombO(true).yarns[+el.dataset.oy]=el.value; rer(); });
  V.querySelectorAll('[data-om]').forEach(el=>el.onchange=()=>{ const o=ombO(true), k=el.dataset.om; if(k==='method'||k==='stages') o[k]=el.value; else o[k]=Math.max(k==='unit'?1:0, stNum(el.value)); rer(); });
  const cw=$('#st-cw-on'); if(cw) cw.onchange=()=>{ plan.cw.on=cw.checked; if(cw.checked&&!plan.cw.pieces.length){ const pp=(S.pat&&S.pat.piece)||''; const ok=GARMENTS[gk].pieces.find(x=>x.id===pp)||GARMENTS[gk].pieces[0]; plan.cw.pieces=[ok.id]; } rer(); };
  V.querySelectorAll('[data-cwp]').forEach(el=>el.onchange=()=>{ const id=el.dataset.cwp; plan.cw.pieces=plan.cw.pieces.filter(x=>x!==id); if(el.checked) plan.cw.pieces.push(id); rer(); });
  V.querySelectorAll('[data-cwm]').forEach(el=>el.onchange=()=>{ if(el.value) plan.cw.map[el.dataset.cwm]=el.value; else delete plan.cw.map[el.dataset.cwm]; rer(); });
  V.querySelectorAll('[data-cws]').forEach(el=>el.onchange=()=>{ plan.cw[el.dataset.cws]=stNum(el.value); rer(); });
  V.querySelectorAll('[data-act]').forEach(b=>b.onclick=ev=>{ const a=b.dataset.act; stUI.msg='';
    if(a==='yadd'){ stUI.draft={id:'', name:'', color:'#b8a07a', haveG:0, haveM:0, m100:0, strands:1, gauge:{}, photo:''}; stUI.delArm=null; viewStash(); const f=$('#stForm'); if(f&&f.scrollIntoView) f.scrollIntoView({block:'start'}); return; }
    if(a==='yedit'){ const y=S.stash.find(x=>x.id===b.dataset.id); if(!y) return; stUI.draft=clone(y); if(!stUI.draft.gauge) stUI.draft.gauge={}; stUI.delArm=null; viewStash(); const f=$('#stForm'); if(f&&f.scrollIntoView) f.scrollIntoView({block:'start'}); return; }
    if(a==='ycancel'){ stUI.draft=null; stUI.delArm=null; viewStash(); return; }
    if(a==='phdel'){ stUI.draft.photo=''; viewStash(); return; }
    if(a==='pcol'){ stUI.draft.color=b.dataset.hex.toLowerCase(); if(!stUI.draft.name&&b.dataset.name) stUI.draft.name=b.dataset.name; viewStash(); return; }
    if(a==='ysave'){ const d=stUI.draft; const y=stNormYarn(Object.assign({}, d, {id:d.id||undefined, name:(d.name||'').trim()||'Siūlai'}));
      const i=S.stash.findIndex(x=>x.id===y.id); if(i>=0) S.stash[i]=y; else S.stash.push(y);
      if(!stTrySave()){ if(y.photo){ y.photo=''; stTrySave(); stUI.msg='Naršyklės atmintyje neužteko vietos nuotraukai – siūlai išsaugoti be nuotraukos.'; } else stUI.msg='Nepavyko išsaugoti naršyklės atmintyje.'; }
      stUI.draft=null; viewStash(); return; }
    if(a==='ydel'){ const id=stUI.draft.id; if(stUI.delArm!==id){ stUI.delArm=id; viewStash(); return; }
      S.stash=S.stash.filter(x=>x.id!==id); Object.values(S.stashPlan).forEach(p=>{ if(p.main===id) p.main=ST_MAIN; if(p.rib===id) p.rib=''; if(p.pieces) Object.keys(p.pieces).forEach(k=>{ if(p.pieces[k]===id) delete p.pieces[k]; });
        if(p.stripes) Object.keys(p.stripes).forEach(k=>p.stripes[k]=p.stripes[k].filter(e=>e.y!==id)); if(p.cw&&p.cw.map) Object.keys(p.cw.map).forEach(k=>{ if(p.cw.map[k]===id) delete p.cw.map[k]; });
        if(p.ombre) Object.keys(p.ombre).forEach(k=>{ p.ombre[k].yarns=p.ombre[k].yarns.filter(x=>x!==id); if(!p.ombre[k].yarns.length) delete p.ombre[k]; }); });
      delete stUI.sel[id]; stUI.draft=null; stUI.delArm=null; rer(); return; }
    if(a==='mode'){ S.stashOpt.hand=b.dataset.v==='h'; rer(); return; }
    if(a==='sadd'){ const s=seq(), used=s.map(e=>e.y), nxt=([ST_MAIN,...S.stash.map(y=>y.id)]).find(id=>!used.includes(id))||ST_MAIN; s.push({y:s.length?nxt:(plan.main||ST_MAIN), rows:s.length?s[s.length-1].rows:10}); rer(); return; }
    if(a==='sdel'){ seq().splice(+b.dataset.i,1); rer(); return; }
    if(a==='oadd'){ const o=ombO(true), pool=[...S.stash.map(y=>y.id), ST_MAIN], nx=()=>pool.find(id=>!o.yarns.includes(id))||pool[0];
      if(!o.yarns.length) o.yarns.push(plan.main&&ctx0().byId[plan.main]?plan.main:nx()); o.yarns.push(nx()); rer(); return; }
    if(a==='odel'){ const o=ombO(false); if(o){ o.yarns.splice(+b.dataset.i,1); if(!o.yarns.length) delete plan.ombre[S.stashOpt.oscope]; } rer(); return; }
    if(a==='oclr'){ delete plan.ombre[S.stashOpt.oscope]; rer(); return; }
    if(a==='sclr'){ delete plan.stripes[S.stashOpt.scope]; rer(); return; }
    if(a==='palimp'){ const r=stImportPalette(); stUI.msg=r.n?`Įkelta ${r.n} spalv${r.n===1?'a':'os'} iš spalvų programos – papildykite kiekius ir mėginius.`:'Visos paletės spalvos jau yra sąraše.'; rer(); return; }
    if(a==='palexp'){ stUI.palArm=true; viewStash(); return; }
    if(a==='palno'){ stUI.palArm=false; viewStash(); return; }
    if(a==='palgo'){ const list=S.stash.filter(y=>stUI.sel[y.id]); stUI.palArm=false;
      if(!stExportPalette(list.length?list:S.stash)){ stUI.msg='Nepavyko įrašyti spalvų programos paletės.'; viewStash(); return; }
      save(); const u=stSpalvosUrl(); if(u==='spalvos/') location.href=u; else { try{ window.open(u,'_blank','noopener'); }catch(e){} stUI.msg='Paletė įrašyta. Spalvų programa atidaryta naujame lange.'; viewStash(); } return; }
  });
}

  pat:'plain', lib:'', libExt:false, name:'', nameAuto:true, err:''}; }
function wzState(){
  let w=S.wiz; if(!w||typeof w!=='object') w=S.wiz=wzFresh();
  const f=wzFresh(); Object.keys(f).forEach(k=>{ if(w[k]==null) w[k]=f[k]; });

  w.step=Math.min(6,Math.max(1,parseInt(w.step,10)||1)); w.max=Math.max(w.step,Math.min(6,parseInt(w.max,10)||1));

const wzNum=v=>{ const x=parseFloat(String(v==null?'':v).replace(',','.')); return isFinite(x)&&x>0?x:0; };
const wzR1=x=>Math.round(x*10)/10;
const wzStash=()=>Array.isArray(S.stash)?S.stash.filter(y=>y&&typeof y==='object'):[];
function wzCfg(w){
  const c=Object.assign(defaultCfg(), {who:w.who, garment:w.garment, fit:w.fit, ease:(FITS.find(f=>f[0]===w.fit)||FITS[2])[2],
    arm:w.arm, shoulder:w.shoulder, neckShape:w.neckShape, collar:w.collar, btnN:wzNum(w.btnN)||0, overlap:wzNum(w.overlap)||0, own:{}});
  Object.keys(w.own||{}).forEach(k=>{ const v=wzNum(w.own[k]); if(v) c.own[k]=v; });
  if(S.cfg&&S.cfg.glove&&typeof S.cfg.glove==='object') c.glove=clone(S.cfg.glove);
  const kind=ACC_KIND[w.garment]; c.asize={}; if(kind) c.asize[kind]=w.size; else c.size=w.size;
  return c;
}
function wzFix(w){
  if(!WHO.some(x=>x[0]===w.who)) w.who='moteris';
  if(!CFG_GARMENTS[w.who].includes(w.garment)) w.garment='megztinis';
  const kind=ACC_KIND[w.garment];
  const sizes=cfgSizes(Object.assign(defaultCfg(),{who:w.who, garment:w.garment}), w.garment);
  if(!sizes.some(s=>s[0]===w.size)) w.size = kind ? sizes[Math.min(1,sizes.length-1)][0] : sizes[Math.min(2,sizes.length-1)][0];
  if(!FITS.some(f=>f[0]===w.fit)) w.fit='klasik';
  if(!ARMTYPES.some(a=>a[0]===w.arm) || (CFG_NOSLEEVE.includes(w.garment)&&isRaglan(w.arm))) w.arm='isiuta';
  if(!SHOULDERS.some(a=>a[0]===w.shoulder)) w.shoulder='japon';

function wzGv(w){

}
function wzGaugeObj(w){
  const y=wzYarn(w), v=wzGv(w), swG=w.example?0:wzNum(w.swG);
  if(w.mode==='hand') return {name:y.name, ribType:'ne', sts:v.sts||HK_DEF.sts, rows:v.rows||HK_DEF.rows, ribRows:v.ribRows||v.rows||HK_DEF.ribRows,

function wzSizeLabel(w){ const s=cfgSizes(Object.assign(defaultCfg(),{who:w.who, garment:w.garment}), w.garment).find(x=>x[0]===w.size); return s?s[1]:String(w.size); }

function wzCompute(w){
  const B=wzBuild(w), g=wzGaugeObj(w), mach=wzMach(w), params=Object.assign({}, S.params, {[B.gk]:B.params}), opts={params, gauge:g, machine:mach};

    try{ yarn=garmentYarn(B.gk, opts); }catch(e){ yarn=null; } }

function wzCreate(w){

    if(w.ysrc==='new'){ const Y=stNormYarn({name:y.name, color:'#b8a07a', haveG:wzNum(w.ny.haveG), haveM:0, m100:y.m100, strands:1, gauge:gv?clone(gv):null, photo:''});
      Object.assign(Y,{fiber:w.fiber, spin:w.spin, cone:w.cone, skeinG:y.skeinG}); S.stash.push(Y); yid=Y.id; }

  if(w.pat==='lib' && w.lib && typeof libApply==='function'){ try{ libApply(patState(), w.lib); }catch(e){} }
  if(w.pat==='plain' && S.mPat && typeof S.mPat==='object') S.mPat.on=false;
  const id='p'+Date.now().toString(36);
  const fit=wzFitLabel(w);
  S.cur={gk, who:wzWho(w), size:wzSizeLabel(w), fit, yarn:y.name, exampleGauge:!!w.example, mode:hand?'hand':w.mode, pat:w.pat, project:id};
  S.garment=gk; S.piece=GARMENTS[gk].pieces[0].id; S.mPiece=gk+'/'+S.piece; S.mStep=0; S.mRC=0;
  S.projects.push({id, name:String(w.name).trim(), garment:gk, machine:S.machine, mode:hand?'hand':'machine', params:clone(S.params[gk]), gauge:clone(S.gauges[S.machine]),
    hand:hand?clone(S.hand):null, cur:clone(S.cur), yarnId:yid, wiz:true, date:new Date().toISOString()});
  S.activeProject=id; S.wiz=null;
  S.tab=hand?'rankinis':'iskarpos'; save(); render();
  try{ window.scrollTo(0,0); }catch(e){}
}

/* ---------- projektų juosta (antraštėje) ---------- */
function wzActive(){ const pr=(S.projects||[]).find(p=>p.id===S.activeProject); if(!pr) return null;
  if(S.garment!==pr.garment) return null;
  if(S.cur && S.cur.project!==pr.id) return null;
  return pr; }
// dabartinius aktyvaus projekto matmenis ir mėginį įrašome į jo kopiją (kad perjungiant nieko neprarastumėte)
function wzSnapshotActive(){ const pr=wzActive(); if(!pr) return;
  pr.params=clone(S.params[pr.garment]);
  if(pr.mode==='hand'&&S.hand) pr.hand=clone(S.hand); else { pr.machine=S.machine; pr.gauge=clone(S.gauges[S.machine]); }
  if(S.cur) pr.cur=clone(S.cur); }
function wzLoad(pr){ if(!pr) return;
  if(pr.id!==S.activeProject) wzSnapshotActive();
  if(!GARMENTS[pr.garment]) return;
  S.params[pr.garment]=clone(pr.params);
  if(MACHINES[pr.machine]) S.machine=pr.machine;
  if(pr.gauge) S.gauges[S.machine]=Object.assign(clone(DEF_GAUGE[S.machine]), clone(pr.gauge));
  if(pr.mode==='hand'&&pr.hand){ S.hand=Object.assign(S.hand||{}, clone(pr.hand)); }
  if(pr.mode&&S.stashOpt&&typeof S.stashOpt==='object') S.stashOpt.hand=pr.mode==='hand';
  S.garment=pr.garment; S.piece=GARMENTS[pr.garment].pieces[0].id;
  Object.keys(DEF[pr.garment]).forEach(k=>S.edited[pr.garment+'/'+k]=true);
  S.cur=pr.cur?clone(pr.cur):null; if(S.cur) S.cur.project=pr.id;
  S.activeProject=pr.id;
  const keep=['rastai','stash','skaiciuokles','pagalba','konfig','masina'];
  if(pr.mode==='hand') S.tab = keep.includes(S.tab)&&S.tab!=='masina' ? S.tab : 'rankinis';
  else if(!keep.includes(S.tab)) S.tab='iskarpos';
  save(); render(); }
function wzProjBar(base){
  const list=S.projects||[], pr=wzActive();
  const exTag=pr&&pr.cur&&pr.cur.exampleGauge?' <span class="ex">pavyzdinis mėginys</span>':'';
  const label = pr ? `Projektas: <b>${esc(pr.name)}</b>${exTag}` : (S.tab==='pradzia' ? (list.length?'Projektai:':'') : base);
  const sel = list.length ? `<select id="pbSel" class="pb-sel" aria-label="Perjungti projektą">${pr?'':'<option value="">— atidaryti projektą —</option>'}${list.map(p=>`<option value="${esc(p.id)}" ${pr&&pr.id===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>` : '';
  const stripes = pr&&pr.cur&&pr.cur.pat==='stripes'&&typeof viewStash==='function'&&S.tab!=='stash' ? '<button type="button" class="btn pb-btn" id="pbStripes">Dryžiai → Mano siūlai</button>' : '';
  return `${label?`<span class="pb-name">${label}</span>`:''}${sel}${stripes}${S.tab==='pradzia'&&!pr?'':'<button type="button" class="btn pb-btn" id="pbNew">＋ Naujas</button>'}`;
}
function wzBindBar(){
  const s=document.getElementById('pbSel'); if(s) s.onchange=()=>{ const pr=(S.projects||[]).find(p=>p.id===s.value); if(pr) wzLoad(pr); };
  const n=document.getElementById('pbNew'); if(n) n.onclick=()=>{ S.tab='pradzia'; save(); render(); };
  const st=document.getElementById('pbStripes'); if(st) st.onclick=()=>{ S.tab='stash'; save(); render(); };
}
// pirmas paleidimas: vedlys atsidaro savaime
try{ if(!S.wizDismissed && !S.cur && !Object.keys(S.edited||{}).length) S.tab='pradzia'; }catch(e){}

/* ================= KALBOS (LT / EN / NO) =================
   Tekstas verčiamas jau nupieštame puslapyje: skaičiai pakeičiami „#“, randamas vertimas žodyne,
   skaičiai grąžinami ta pačia tvarka. Žodynai: I18N_EN, I18N_NB (failai i18n_en.js, i18n_nb.js). */
const LANGS=[['lt','LT'],['en','EN'],['nb','NO']];
const I18N={ en: (typeof I18N_EN!=='undefined'?I18N_EN:{}), nb: (typeof I18N_NB!=='undefined'?I18N_NB:{}) };
const NUM_RE=/\d+(?:[.,]\d+)?/g;
const I18N_MISS=new Set();
function i18nKey(s){ return s.replace(/\s+/g,' ').trim().replace(NUM_RE,'#'); }
function i18nTr(s, lang){
  lang=lang||S.lang; if(!lang||lang==='lt') return s;
  const D=I18N[lang]; if(!D) return s;
  const core=s.replace(/\s+/g,' ').trim(); if(!core || !/[A-Za-zĄČĘĖĮŠŲŪŽąčęėįšųūž]/.test(core)) return s;
  const nums=core.match(NUM_RE)||[]; const key=core.replace(NUM_RE,'#');
  let t=D[key];
  if(t==null){ I18N_MISS.add(key); return s; }
  let i=0; const conv=n=> (lang==='en') ? n.replace(',','.') : n.replace('.',',');
  t=t.replace(/#/g,()=> i<nums.length ? conv(nums[i++]) : '#');
  const lead=s.match(/^\s*/)[0], tail=s.match(/\s*$/)[0];
  return lead+t+tail;
}
function i18nApply(root){
  if(!S.lang||S.lang==='lt'||!root) return;
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode:n=>{ const p=n.parentNode; if(!p) return NodeFilter.FILTER_REJECT; const tg=p.nodeName; return (tg==='SCRIPT'||tg==='STYLE'||tg==='TEXTAREA')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT; }});
  const list=[]; while(w.nextNode()) list.push(w.currentNode);
  list.forEach(n=>{ if(n.__tr===n.nodeValue) return; const v=i18nTr(n.nodeValue); if(v!==n.nodeValue){ n.nodeValue=v; } n.__tr=n.nodeValue; });
  const els=root.querySelectorAll ? root.querySelectorAll('[placeholder],[title],[aria-label]') : [];
  els.forEach(el=>['placeholder','title','aria-label'].forEach(a=>{ const v=el.getAttribute(a); if(v){ const t=i18nTr(v); if(t!==v) el.setAttribute(a,t); } }));
}
let i18nObs=null, i18nBusy=false;
function i18nStart(){
  const app=document.getElementById('app'); if(!app || typeof MutationObserver==='undefined') return;
  if(i18nObs) i18nObs.disconnect();
  i18nObs=new MutationObserver(()=>{ if(i18nBusy) return; i18nBusy=true; try{ i18nApply(app); const pa=document.getElementById('printAll'); if(pa) i18nApply(pa); } finally{ i18nBusy=false; } });
  i18nObs.observe(app,{childList:true,subtree:true});
  const pa=document.body; if(pa) i18nObs.observe(pa,{childList:true});
  i18nApply(app);
  try{ document.documentElement.lang = S.lang==='nb'?'nb':(S.lang||'lt'); }catch(e){}
}
function langPicker(){ return `<div class="seg langs noprint" role="group" aria-label="Kalba">${LANGS.map(([k,l])=>`<button data-lang="${k}" aria-pressed="${(S.lang||'lt')===k}">${l}</button>`).join('')}</div>`; }
function bindLang(){ document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ S.lang=b.dataset.lang; save(); render(); }); }

render();
if(typeof i18nStart==="function") i18nStart();
</script>

if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{})); }
